dsl_version: "yaiwes.dag/v1"
contrato: "Claude notas/PLAN-DSL-DAG-00-CONTRATO.yaml"

# Cada nodo hereda automaticamente:
#   gobernanza: SHERIFF -> EJECUTOR -> VALIDADOR -> VERIFICADOR ->
