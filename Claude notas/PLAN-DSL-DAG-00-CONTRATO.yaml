# =====================================================================
# PLAN DSL DAG - PARTE 0: CONTRATO DE EJECUCION
# Version 1.1 | 2026-09-23 | base Claude Opus 5 + sincronizacion quirurgica
# Ejecutor: runtime/fleet autorizado por el DAG. Ningun modelo es autoridad de PASS.
# Los nodos estan en: Claude notas/PLAN-DSL-DAG-01-NODOS.yaml
# =====================================================================
dsl_version: "yaiwes.dag/v1"
engine: "wordflow_loop"
repo: "maxbry123-commits/agentes"
branch: "main"

canonical_files:
  contrato: "Claude notas/PLAN-DSL-DAG-00-CONTRATO.yaml"
  nodos: "Claude notas/PLAN-DSL-DAG-01-NODOS.yaml"
  arquitectura: "Claude notas/PLAN-MAESTRO-4-OBJETIVOS.md"
  mirror_legacy: "Claude notas/PLAN-DSL-DAG-4-OBJETIVOS.yaml"

read_order:
  - "AGENTS.md"
  - "Claude notas/PLAN-DSL-DAG-00-CONTRATO.yaml"
  - "Claude notas/PLAN-DSL-DAG-01-NODOS.yaml"
  - "Claude notas/PLAN-MAESTRO-4-OBJETIVOS.md"

precedence:
  executable_contract: "PLAN-DSL-DAG-00-CONTRATO.yaml"
  executable_nodes: "PLAN-DSL-DAG-01-NODOS.yaml"
  architecture_and_intent: "PLAN-MAESTRO-4-OBJETIVOS.md"
  legacy_duplicate: "NO EJECUTAR; solo redirect/index"

# ---------------------------------------------------------------------
