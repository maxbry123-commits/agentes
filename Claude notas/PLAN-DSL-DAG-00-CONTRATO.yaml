    L412_L430:   "3 skills frontend confirmados fisicamente"
    L445:        "jerarquia: Yaiwes -> NCT -> Wordflow -> Seals"
    L448_L467:   "8 items + Artify en el osquestador + auditoria 4 pasadas"
    L475:        "integrar minimax + kimi k + 4 agentes glimmer -> seals determinista"
