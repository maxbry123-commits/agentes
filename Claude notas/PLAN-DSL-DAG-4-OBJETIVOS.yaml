# =====================================================================
dag_objetivo_3:
  nombre: "Terminar el agente Seals Team YAIWES"
  ya_cerrados: "P0-01..P0-15, P0-17, P1-18..P1-23, P1-25, P1-26, P1-29"
  firma_podada: "SealsExecutor.execute(NodeInput) -> ToolReceipt -> Evidence[] -> NodeResult"
  pierde: "su cola propia, su watchdog propio, su decision de PASS"
  nodos:

    - id: N-3.1
      titulo: "Cablear los 17 mecanismos MiniMax + Kimi + Meta"
      fuente_director: L475
      detalle: "Claude notas/PLAN-ANEXO-B-SEALS-MECANISMOS.md"
      orden_de_extraccion:
        1: "muse_glimmer: ToolRegistry + parser ATEM (completa P0-16)"
        2: "kimi_researcher -> research_real.py (tapa P1-18, el peor gap)"
        3: "meta_muse_code_sdk: idempotencia + cola + checkpoint (P0-11, P0-12, P1-27)"
        4: "cua_mcp: sandbox (P1-28)"
        5: "metacua: capa visual (P1-23, P1-24)"
        6: "minimax_coding_plan_mcp: planner"
        7: "minimax_code_plugins -> Enchufe Universal"
        8: "kimi_agent_rs: partes deterministas criticas"
        9: "minimax_mcp -> servidor MCP contexto compartido"
      acceptance:
        - "test por mecanismo: falla ANTES de cablear, pasa DESPUES"
        - "prohibido declarar integrado porque la carpeta exista"
      depends_on: [N-1.1, N-2.4]

    - id: N-3.2
      titulo: "Gaps restantes de Seals"
      gaps:
        P1-24: "MetaCua/CUA-MCP: LEER implementacion real antes de declarar nada"
        P1-27: "crash/resume con CrazyWallAdapter.checkpoint"
        P1-28: "sandbox/rollback del instalador"
        P0-16: "completar ToolRegistry Glimmer"
        P2-31: "handoff drift: dice 229 componentes, real 248"
        P1-30: "tests de crash/recovery y wrong-source-commit"
        P2-32: "requirements con lock/pinning"
      depends_on: [N-3.1]

    - id: N-3.3
      titulo: "GRUPO 1 - 7 requisitos nativos"
      fuente_director: L530_L546
      requisitos:
        1: "saber donde va cada cosa en el kernel, evitar 2 cerebros"
        2: "radiografia de la raiz: donde va cada archivo y POR QUE"
        3: "como convertir un skill en schema: criterios + modelos"
        4: "usar UNICAMENTE el Enchufe Universal Fables para cablear"
        5: "como podar, que podar, como decapitar el wordflow"
        6: "partes criticas: solo Claude; otros preparan, Claude revisa"
        7: "descargar con los motores: URL + nombre -> estudio de ubicacion"
      acceptance: ["los 7 con la plantilla Glimmer de 7 secciones"]
      depends_on: [N-3.2]

    - id: N-3.4
      titulo: "GRUPO 2 - pool de agentes"
      fuente_director: L549_L554
      funciones:
        1: "codigo PURO - no integran"
        2: "bajo consenso deciden donde va un lote de codigo ya creado"
        3: "auditoria X-Ray carpeta por carpeta con la plantilla Meta EXACTA"
      depends_on: [N-3.3]

    - id: N-3.5
      titulo: "Regression suite completa"
      simulaciones:
        SIM-01: "verificar_existencia(inexistente) -> GAP, nunca PASS"
        SIM-02: "evaluar_componente sin key -> AUTH_ERROR, nunca PASS"
        SIM-03: "directorio preexistente incorrecto -> INTEGRITY FAILURE"
        SIM-04: "watchdog wall_status=PENDING_STEP1 -> DETECT+CLAIM+ENQUEUE+EXECUTE"
      suite_ampliada: [IDEMPOTENT_REPLAY, IDEMPOTENCY_CONFLICT, TASK_CONTRACT_INVALID,
        CLAIM_COLLISION, LEASE_EXPIRED, WORKER_CRASH, CRASH_RESUME, WRONG_BASE_SHA,
        WRONG_SOURCE_COMMIT, SHERIFF_DENY, TOOL_TIMEOUT, TOOL_ERROR_OBSERVATION,
        STUCK_DETECTION, NO_NEW_EVIDENCE, ACCEPTANCE_FAIL, PASS_WITHOUT_EVIDENCE,
        BACKEND_TEST_FAIL, FRONTEND_BUILD_FAIL, BROWSER_FAIL, VISUAL_FAIL,
        SCREENSHOT_MISSING, DOUBLE_WRITER_COLLISION, ROLLBACK_AFTER_FAILURE]
      depends_on: [N-3.4]

    - id: N-3.6
      titulo: "Prueba real con 3 agentes"
      fuente_director: L563
      protocolo:
        - "3 agentes iguales, 1 componente dificil a cada uno"
        - "probar, corregir, perfeccionar"
        - "repetir con el pool del Grupo B usando codigo de Mythos"
        - "verificar que descargan el codigo y escriben el resultado completo"
      regla: "esto ocurre ANTES de continuar con el Comand Center"
      depends_on: [N-3.5]

    - id: N-3.7
      titulo: "Requisito 50 mundos + adapter Router Universal"
      requisito:
        - "cada wordflow = mundo independiente, sin compartir archivos"
        - "Readme memoria.md + Handoff + Crazy Wall + System prompt propios"
        - "mismo code_sha256, distinto worker_id/task/workspace"
        - "Cerebras = SOLO PRUEBAS; produccion via Router Inteligente Universal"
      accion: "adapter en router_modelos.py y consultor_experto.py"
      depends_on: [N-3.6]

    - id: N-3.8
      titulo: "Cierre SEALS WORKER VERIFIED"
      formula: [DAG_REAL, TASK_CONTRACT_REAL, CLAIM_LEASE, WRITE_SCOPE,
        STRUCTURED_ACTIONS, SHERIFF, IDEMPOTENCY, DURABLE_QUEUE_RECOVERY,
        OBJECTIVE_ACCEPTANCE, OBJECTIVE_ORACLE, REAL_TESTS, EVIDENCE_SHA256,
        WATCHDOG_REENQUEUE, CRASH_RESUME, BACKEND_ROUTING, FRONTEND_ROUTING,
        BROWSER_SCREENSHOT_LOOP, REGRESSION_TESTS, COMPLETION_AUDIT,
        INDEPENDENT_REFUTATION]
      regla: "si un item no cierra -> GAP explicito. NUNCA cierre fingido."
      depends_on: [N-3.7]

# =====================================================================
# DAG OBJETIVO 4 - ORQUESTADOR COMAND CENTER
# =====================================================================
dag_objetivo_4:
  nombre: "Hacer el orquestador Comand Center"
  arquitectura_aprobada: >
    Opcion 1 = capa de control. Opcion 2 = motor de ejecucion durable.
    Omniroute/Orca gobiernan keys, mirrors y visibilidad.
    Dagu/DBOS aporta la durabilidad que hoy falta.
    Solo se escriben de cero los adapters + el kernel Python.
    CERO componentes nuevos por descargar.
  orquesta: "WORDFLOW (el kernel central), NO Seals"
  nodos:

    - id: N-4.1
      titulo: "Extraer mecanismos de Orca (ya descargado completo)"
      fuente_director: L278, L437, L443
      mecanismos:
        - "worktree git aislado por agente (coincide con isolation.py existente)"
        - "rotacion / hot-swap de cuentas y API keys con usage tracking"
        - "CLI programable como contrato de automatizacion externa"
      destino: "funciones Python en isolation.py y router_modelos.py YA EXISTENTES"
      prohibido: "app Electron, carpeta nueva de componente"
      regla: "el Director nunca opera Orca directamente - backend invisible"
      acceptance: ["test de rotacion de keys + aislamiento de 2 workers sin colision"]
      depends_on: [N-1.2]

    - id: N-4.2
      titulo: "Artify / Archify en el orquestador"
      fuente_director: L378, L448_L467
      confirmado: "Artify == Archify skills (SI, confirmado por el Director)"
      funcion: "actualizar el progreso de todos los trabajos de wordflow de forma simplificada"
      combinacion: "Artify + Orca = backend del orquestador"
      depends_on: [N-4.1]

    - id: N-4.3
      titulo: "Motor de ejecucion durable"
      accion: "VERIFICAR PRIMERO que hay en el repo antes de asumir nada"
      candidatos_ya_en_repo: [Dagster, Temporal, Prefect, APScheduler, Celery]
      referencia: "TASK-GAPS/N21-DAGU-PASO1-XRAY.md"
      si_no_hay: "FLAG al Director; no se descarga sin su OK (regla: cero componentes nuevos)"
      depends_on: []

    - id: N-4.4
      titulo: "Router de 50+ keys en paralelo"
      fuente_director: L287
      accion: "router que llama al Router Universal y manda senal al Comand Center + mirrors"
      regla: "los agentes internos pueden y deben usar api keys EN PARALELO"
      depends_on: [N-4.1, N-3.7]

    - id: N-4.5
      titulo: "Servidor MCP de contexto compartido"
      base: "minimax_mcp + minimax_mcp_js (codigo real ya descargado)"
      recursos:
        crazy_wall_state: "lectura"
        mission_context: "lectura/escritura controlada"
        enchufe_universal_tools: "herramientas"
      regla_de_seguridad: "MCP comparte CONTEXTO, nunca AUTORIDAD. El Kernel decide PASS."
      depends_on: [N-3.1]

    - id: N-4.6
      titulo: "Sistema de preguntas previas SIEMPRE activo"
      lugares: [UI_interface, UI_backend, Input_Shark]
      referencia: "DISENO-preguntas-siempre-activo-input-shark.md"
      depends_on: [N-4.2]

    - id: N-4.7
      titulo: "Ciclo end-to-end del Comand Center"
      acceptance:
        - "goal -> DAG -> worker -> evidencia -> completion audit"
        - "sobrevive a un crash del worker sin duplicar side effect"
      depends_on: [N-4.3, N-4.4, N-4.5, N-4.6]

