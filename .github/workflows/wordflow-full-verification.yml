name: Wordflow Full Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'extensions/wordflow/**'
      - 'extensions/wordflow_kernel/**'
      - 'PIPELINE/**'
      - '.github/workflows/wordflow-full-verification.yml'
      - 'tools/wordflow_verification.py'

permissions:
  contents: write

jobs:
  full-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run ten-probe diagnostic harness
        id: probes
        continue-on-error: true
        run: python tools/wordflow_verification.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordflow-verification-evidence-${{ github.sha }}
          path: verification-output/
          if-no-files-found: error

      - name: Publish exact CI diagnosis to PIPELINE
        if: always()
        run: |
          cp verification-output/CI_LAST_RESULT.md PIPELINE/CI_LAST_RESULT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PIPELINE/CI_LAST_RESULT.md
          if git diff --cached --quiet; then
            echo 'CI diagnosis unchanged'
          else
            git commit -m 'ci: record exact Wordflow probe diagnosis [skip ci]'
            git push
          fi

      - name: Final verdict
        if: always()
        run: |
          if [ "${{ steps.probes.outcome }}" != "success" ]; then
            echo 'WORDFLOW_VERIFICATION=FAIL'
            exit 1
          fi
          echo 'WORDFLOW_VERIFICATION=PASS'
