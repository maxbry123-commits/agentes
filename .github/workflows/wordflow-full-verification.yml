name: Wordflow Full Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'extensions/wordflow/**'
      - 'extensions/wordflow_kernel/**'
      - 'PIPELINE/**'
      - '.github/workflows/wordflow-full-verification.yml'

jobs:
  full-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Syntax compile
        run: python -m compileall -q extensions
      - name: Wordflow tests
        run: |
          if [ -d extensions/wordflow/tests ]; then python -m pytest -q extensions/wordflow/tests; else echo 'No Wordflow tests directory'; fi
      - name: Kernel tests
        run: |
          if [ -d extensions/wordflow_kernel/tests ]; then python -m pytest -q extensions/wordflow_kernel/tests; else echo 'No kernel tests directory'; fi
      - name: Full repository tests
        run: |
          if [ -d tests ]; then python -m pytest -q tests; else echo 'No top-level tests directory'; fi
      - name: Verification manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('extensions/wordflow/engine/code_path_runner.py'),
              Path('extensions/wordflow/standards/gap_registry.py'),
              Path('extensions/wordflow/standards/executor_gates.py'),
              Path('PIPELINE/LOOP_GAPS_BLOCK_05_2026-08-21.md'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing verification targets: ' + ', '.join(missing))
          print('VERIFICATION_MANIFEST=PASS')
          PY
