name: Actions Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Runner sanity
        run: |
          set -euo pipefail
          echo "ACTIONS_PREFLIGHT_OK"
          echo "runner=$RUNNER_NAME"
          echo "workspace=$GITHUB_WORKSPACE"
          pwd
          test -d "$GITHUB_WORKSPACE"
          test -w "$GITHUB_WORKSPACE"
