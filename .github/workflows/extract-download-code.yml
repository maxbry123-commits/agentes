name: Extract Download Code + X-Ray Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-download-code-main
  cancel-in-progress: false

env:
  ROOT: Download code/archivos
  MANIFEST: Download code/archivos/RESEARCH_DOWNLOAD_MANIFEST.jsonl

jobs:
  extract-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate manifest and ZIP inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$MANIFEST"
          test -d "$ROOT"
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path("Download code/archivos")
          manifest = root / "RESEARCH_DOWNLOAD_MANIFEST.jsonl"
          rows = [json.loads(x) for x in manifest.read_text().splitlines() if x.strip()]
          assert len(rows) == 20, f"expected 20 repos, got {len(rows)}"
          for r in rows:
              slug = r["slug"]
              parts = int(r["parts"])
              zips = sorted(root.glob(f"{slug}_*.zip"))
              expected = [root / f"{slug}_{i:04d}.zip" for i in range(1, parts + 1)]
              if zips != expected:
                  got = [p.name for p in zips]
                  exp = [p.name for p in expected]
                  raise SystemExit(f"ZIP inventory mismatch for {slug}: expected {exp}, got {got}")
          print("PASS: manifest contains 20 repos and every expected ZIP part exists")
          PY

      - name: Extract all parts into one folder per repository
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, hashlib, pathlib, shutil, subprocess, tempfile
          root = pathlib.Path("Download code/archivos")
          rows = [json.loads(x) for x in (root / "RESEARCH_DOWNLOAD_MANIFEST.jsonl").read_text().splitlines() if x.strip()]
          for r in rows:
              slug = r["slug"]
              parts = int(r["parts"])
              dest = root / slug
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir(parents=True)
              print(f"=== {slug}: {parts} parts -> {dest} ===")
              with tempfile.TemporaryDirectory(prefix=f"xray-{slug}-") as td:
                  td = pathlib.Path(td)
                  for i in range(1, parts + 1):
                      z = root / f"{slug}_{i:04d}.zip"
                      print(f"TEST {z.name}")
                      subprocess.run(["unzip", "-tq", str(z)], check=True)
                      partdir = td / f"part-{i:04d}"
                      partdir.mkdir()
                      subprocess.run(["unzip", "-q", str(z), "-d", str(partdir)], check=True)
                      for src in sorted(partdir.rglob("*")):
                          rel = src.relative_to(partdir)
                          out = dest / rel
                          if src.is_dir():
                              out.mkdir(parents=True, exist_ok=True)
                              continue
                          if out.exists():
                              if src.is_symlink() and out.is_symlink() and src.readlink() == out.readlink():
                                  continue
                              if src.is_file() and out.is_file():
                                  a = hashlib.sha256(src.read_bytes()).hexdigest()
                                  b = hashlib.sha256(out.read_bytes()).hexdigest()
                                  if a != b:
                                      raise SystemExit(f"FAIL: conflicting duplicate path {slug}/{rel}")
                                  continue
                              raise SystemExit(f"FAIL: file/type collision {slug}/{rel}")
                          out.parent.mkdir(parents=True, exist_ok=True)
                          if src.is_symlink():
                              out.symlink_to(src.readlink())
                          else:
                              shutil.copy2(src, out)
              count = sum(1 for p in dest.rglob("*") if p.is_file() or p.is_symlink())
              if count == 0:
                  raise SystemExit(f"FAIL: empty extraction for {slug}")
              print(f"PASS: {slug}: {count} files")
          PY

      - name: Audit every reconstructed repository against source commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf xray-audit
          mkdir -p xray-audit/sources xray-audit/results

          python3 - <<'PY'
          import json, pathlib, subprocess, sys, hashlib, shutil
          root = pathlib.Path("Download code/archivos")
          audit = pathlib.Path("xray-audit")
          rows = [json.loads(x) for x in (root / "RESEARCH_DOWNLOAD_MANIFEST.jsonl").read_text().splitlines() if x.strip()]

          def sha256(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(b)
              return h.hexdigest()

          global_fail = False
          for r in rows:
              slug, url, commit = r["slug"], r["source"], r["source_commit"]
              extracted = root / slug
              source = audit / "sources" / slug
              result = audit / "results" / f"{slug}.txt"
              source.parent.mkdir(parents=True, exist_ok=True)
              print(f"=== X-RAY {slug} @ {commit} ===")

              subprocess.run(["git", "clone", "--filter=blob:none", "--no-checkout", url, str(source)], check=True)
              subprocess.run(["git", "checkout", "--detach", commit], cwd=source, check=True)

              # Use Git's tracked tree as the authoritative source inventory.
              tracked = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", commit], cwd=source, text=True).splitlines()
              tracked = sorted(p for p in tracked if p)

              # Normalize an archive that contains one common wrapper directory.
              actual_root = extracted
              top = [p for p in extracted.iterdir()]
              if len(top) == 1 and top[0].is_dir() and top[0].name not in {".git"}:
                  candidate = top[0]
                  candidate_files = sorted(str(p.relative_to(candidate)) for p in candidate.rglob("*") if p.is_file() or p.is_symlink())
                  direct_files = sorted(str(p.relative_to(extracted)) for p in extracted.rglob("*") if p.is_file() or p.is_symlink())
                  if candidate_files and len(candidate_files) == len(direct_files) - 0:
                      actual_root = candidate

              actual = sorted(str(p.relative_to(actual_root)) for p in actual_root.rglob("*") if p.is_file() or p.is_symlink() and not p.name == ".DS_Store")
              actual = [p for p in actual if not p.startswith(".git/")]

              missing = sorted(set(tracked) - set(actual))
              extra = sorted(set(actual) - set(tracked))
              changed = []

              for rel in sorted(set(tracked) & set(actual)):
                  sf = source / rel
                  ef = actual_root / rel
                  if sf.is_symlink() or ef.is_symlink():
                      s = "SYMLINK:" + str(sf.readlink()) if sf.is_symlink() else "FILE"
                      e = "SYMLINK:" + str(ef.readlink()) if ef.is_symlink() else "FILE"
                      if s != e:
                          changed.append((rel, s, e))
                  elif sf.is_file() and ef.is_file():
                      a, b = sha256(sf), sha256(ef)
                      if a != b:
                          changed.append((rel, a, b))
                  else:
                      changed.append((rel, "TYPE", "TYPE"))

              status = "PASS" if not missing and not extra and not changed else "FAIL"
              global_fail |= status != "PASS"
              with result.open("w") as f:
                  f.write(f"repository={slug}\nsource={url}\nsource_commit={commit}\nstatus={status}\n")
                  f.write(f"tracked_files={len(tracked)}\nextracted_files={len(actual)}\nmissing={len(missing)}\nextra={len(extra)}\nchanged={len(changed)}\n")
                  if missing:
                      f.write("[MISSING]\n" + "\n".join(missing) + "\n")
                  if extra:
                      f.write("[EXTRA]\n" + "\n".join(extra) + "\n")
                  if changed:
                      f.write("[CHANGED]\n" + "\n".join(f"{x[0]}|{x[1]}|{x[2]}" for x in changed) + "\n")
              print(f"{status}: {slug} tracked={len(tracked)} extracted={len(actual)} missing={len(missing)} extra={len(extra)} changed={len(changed)}")

          summary = audit / "X-RAY-SUMMARY.txt"
          results = sorted(audit.glob("results/*.txt"))
          passed = sum("status=PASS" in p.read_text() for p in results)
          failed = len(results) - passed
          summary.write_text(f"repositories={len(results)}\npassed={passed}\nfailed={failed}\n")
          if global_fail or len(results) != 20:
              print("X-RAY GLOBAL: FAIL")
              sys.exit(1)
          print("X-RAY GLOBAL: PASS (20/20)")
          PY

      - name: Upload X-Ray evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forensic-xray-report
          path: xray-audit/
          if-no-files-found: error
          archive: true

      - name: Commit reconstructed repositories and manifests
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Download code/archivos'
          if git diff --cached --quiet; then
            echo 'No hay cambios que guardar.'
            exit 0
          fi
          git commit -m 'reconstruct and verify downloaded repositories'
          git push origin HEAD:main
