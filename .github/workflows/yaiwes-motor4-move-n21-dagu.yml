name: YAIWES SOL1 N27 pgvector STEP2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-motor4-move-n21-dagu.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol1-n27-pgvector-step2
  cancel-in-progress: false

jobs:
  motor4_move_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      SOURCE: 'Core kernel Yaiwes/pgvector'
      TARGET: 'Agente Yaiwes principal/tools-models-memory-knowledge/memory-microservices/pgvector'
      MOTOR: '➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py'
      STATE: '/tmp/yaiwes-n27-motor4-state.json'
    steps:
      - name: Checkout N27 STEP2 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-motor4-move-n21-dagu.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py
            /Core kernel Yaiwes/pgvector/
            /Agente Yaiwes principal/tools-models-memory-knowledge/memory-microservices/pgvector/

      - name: Claim N27 STEP2 from fresh Crazy Wall
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x['id']==27)
          if n.get('component')!='pgvector' or n.get('current_step')!=2 or n.get('owner') is not None or n.get('lock')!='FREE':
              raise SystemExit(f"N27_NOT_FREE_STEP2:{n.get('component')}:{n.get('current_step')}:{n.get('owner')}:{n.get('lock')}")
          now=datetime.now(timezone.utc).isoformat(); n['owner']='SOL'; n['lock']='CLAIMED'; n['status']='GAP'
          n.setdefault('checkpoint',{})['before']=now+' SOL integración 1 user-extended loop: N27 STEP2 claim; canonical Motor4 only; no manual move/LFS'
          ev=n.setdefault('evidence',[]); item='step2:worker:SOL integración 1:user_scope_extension';
          if item not in ev: ev.append(item)
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 1','event':'CLAIM_STEP2_USER_SCOPE_EXTENSION'})
          n['next_action']='STEP_2_MOVE_WITH_CANONICAL_MOTOR'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 1 claim N27 STEP2'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1

      - name: Verify immutable canonical Motor4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$MOTOR")" = '9a21facfe11327cf60a2afca8f415ad52f0ecbe5'
          test -d "$SOURCE"; test -n "$(find "$SOURCE" -type f -print -quit)"
          echo MOTOR4_CANONICAL_SHA=PASS

      - name: Execute canonical Motor4 N27
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$STATE"
          SOURCE_DIR="$SOURCE" DEST_DIR="$TARGET" STATE_FILE="$STATE" BATCH_SIZE=100 COLLISION_POLICY=fail MAX_BATCHES=0 python3 "$MOTOR" | tee /tmp/n27-motor4-result.json
          python3 - <<'PY'
          import json
          r=json.loads(open('/tmp/n27-motor4-result.json',encoding='utf-8').read().splitlines()[-1])
          assert r['verdict']=='VERIFIED_CLOSED' and r['failed']==0 and r['pending']==0 and r['source_files_remaining']==0, r
          print('N27_MOTOR4_RESULT=PASS total=%s batches=%s' % (r['total'],r['batches_total']))
          PY

      - name: Publish N27 Motor4 MOVE to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "$SOURCE" "$TARGET"; git diff --cached --check
          test -n "$(git diff --cached --name-only -- "$TARGET" | head -1)"
          git commit -m 'move(yaiwes): Motor4 N27 pgvector to memory-microservices'
          echo "MOVE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; git reset --hard HEAD
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; git reset --hard HEAD; sleep $((attempt * 2))
          done
          test "$ok" -eq 1

      - name: Read-back N27 origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git ls-tree -r --name-only origin/main -- "$SOURCE")"
          test -n "$(git ls-tree -r --name-only origin/main -- "$TARGET")"
          test -n "$(git ls-tree -r --name-only origin/main -- "$TARGET/README.md")"
          echo N27_STEP2_READBACK=PASS

      - name: Checkpoint STEP2 PASS and release N27
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x['id']==27)
          if n.get('owner')!='SOL' or n.get('lock')!='CLAIMED' or n.get('current_step')!=2: raise SystemExit(f"N27_CLAIM_LOST:{n.get('owner')}:{n.get('lock')}:{n.get('current_step')}")
          now=datetime.now(timezone.utc).isoformat(); run=os.environ.get('GITHUB_RUN_ID',''); commit=os.environ.get('MOVE_COMMIT','')
          n['status']='PASS'; n['current_step']=3; n.setdefault('checkpoint',{})['after']=now+' STEP2 PASS: immutable canonical Motor4 moved pgvector to memory-microservices; source absent + target README origin/main read-back PASS'
          ev=n.setdefault('evidence',[])
          for item in ['step2:motor4_blob:9a21facfe11327cf60a2afca8f415ad52f0ecbe5','step2:run:'+run,'step2:move_commit:'+commit,'step2:motor4:VERIFIED_CLOSED','step2:readback:source_absent+target_populated+README_PASS']:
              if item not in ev: ev.append(item)
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 1','event':'STEP2_PASS_RELEASE','run':int(run),'commit':commit})
          n['owner']=None; n['lock']='FREE'; n['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 1 N27 STEP2 PASS release'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1
          echo N27_STEP2_VERIFIED_CLOSED
