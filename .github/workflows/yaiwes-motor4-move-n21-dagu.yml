name: YAIWES SOL1 N23 PostgreSQL STEP3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-motor4-move-n21-dagu.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol1-n23-postgresql-step3
  cancel-in-progress: false

jobs:
  wire_microtest_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      TARGET: 'Agente Yaiwes principal/state-events-durability/run-state-store/postgresql'
      ADAPTER: 'Agente Yaiwes principal/state-events-durability/run-state-store/postgresql/yaiwes/postgresql_adapter.py'
      FICHA: 'Agente Yaiwes principal/state-events-durability/run-state-store/postgresql/yaiwes/ficha.postgresql.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/state-events-durability/run-state-store/postgresql/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
      PG_PREFIX: '/tmp/yaiwes-pg'
    steps:
      - name: Checkout N23 STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-motor4-move-n21-dagu.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py
            /Agente Yaiwes principal/state-events-durability/run-state-store/postgresql/

      - name: Claim N23 STEP3 from fresh Crazy Wall
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x['id']==23)
          if n.get('component')!='PostgreSQL' or n.get('current_step')!=3 or n.get('owner') is not None or n.get('lock')!='FREE':
              raise SystemExit(f"N23_NOT_FREE_STEP3:{n.get('component')}:{n.get('current_step')}:{n.get('owner')}:{n.get('lock')}")
          now=datetime.now(timezone.utc).isoformat(); n['owner']='SOL'; n['lock']='CLAIMED'; n['status']='PASS'
          n.setdefault('checkpoint',{})['before']=now+' SOL integración 1 N23 STEP3: STEP2 Motor4/read-back PASS; wire FABLES and run real PostgreSQL initdb/server/query microtest only'
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 1','event':'CLAIM_STEP3_USER_SCOPE_EXTENSION'})
          n['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 1 claim N23 STEP3'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1

      - name: Materialize PostgreSQL FABLES adapter and ficha
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, textwrap
          from pathlib import Path
          adapter=Path(os.environ['ADAPTER']); ficha=Path(os.environ['FICHA']); adapter.parent.mkdir(parents=True,exist_ok=True)
          source=r'''"""YAIWES PostgreSQL adapter: initialize, start and query the PostgreSQL built from the moved source."""
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from typing import Any

          PLUGIN_ID = "yaiwes.durability.postgresql"

          def descriptor() -> dict[str, str]:
              return {"plugin_id": PLUGIN_ID, "role": "run_state_store", "microtest": "real_server_query_20_plus_21"}

          def run_microtest(prefix: str | Path) -> dict[str, Any]:
              prefix=Path(prefix).resolve(); bindir=prefix / "bin"
              for name in ("initdb","pg_ctl","psql","postgres"):
                  if not (bindir/name).is_file(): raise RuntimeError(f"POSTGRES_BINARY_MISSING:{name}")
              with tempfile.TemporaryDirectory(prefix="yaiwes-pg-") as td_s:
                  td=Path(td_s); data=td/"data"; sock=td/"sock"; sock.mkdir(); log=td/"postgres.log"; port="55439"
                  env=os.environ.copy(); env["LC_ALL"]="C"
                  init=subprocess.run([str(bindir/"initdb"),"--no-locale","-E","UTF8","-A","trust","-U","postgres","-D",str(data)],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=90)
                  if init.returncode != 0: raise RuntimeError("INITDB_FAILED:"+init.stdout[-6000:])
                  started=False
                  try:
                      start=subprocess.run([str(bindir/"pg_ctl"),"-D",str(data),"-l",str(log),"-o",f"-F -k {sock} -p {port}","-w","start"],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=90)
                      if start.returncode != 0: raise RuntimeError("PG_START_FAILED:"+start.stdout[-6000:]+"\n"+(log.read_text(errors='replace')[-6000:] if log.exists() else ''))
                      started=True
                      q=subprocess.run([str(bindir/"psql"),"-h",str(sock),"-p",port,"-U","postgres","-d","postgres","-Atqc","SELECT 20+21;"],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=60)
                      value=q.stdout.strip()
                      if q.returncode != 0 or value!="41": raise RuntimeError(f"PSQL_QUERY_FAILED:{q.returncode}:{value}:{q.stdout[-6000:]}")
                      return {"status":"PASS","capability":"real_server_query","query":"SELECT 20+21","value":41,"initdb":0,"server_started":True}
                  finally:
                      if started:
                          subprocess.run([str(bindir/"pg_ctl"),"-D",str(data),"-m","fast","-w","stop"],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=60)

          if __name__ == "__main__":
              result=run_microtest(sys.argv[1]); print("YAIWES_POSTGRESQL_RESULT="+json.dumps(result,separators=(",",":")))
          '''
          source=textwrap.dedent(source); compile(source,str(adapter),'exec'); adapter.write_text(source,encoding='utf-8')
          digest='sha256:'+hashlib.sha256(source.encode()).hexdigest()
          manifest={
            "artifact_id":"yaiwes.durability.postgresql","version":"1.0.0","estado":"active","contract_hash":digest,
            "tribunal_case_id":"YAIWES-N23-POSTGRESQL-STEP3",
            "contrato":{"rol":"service","consume":{"datatype":{"family":"json","type":"object","version":1}},"expone":{"datatype":{"family":"json","type":"object","version":1}}},
            "ejecucion":{"kind":"db","transport":"stdio","runtime_type":"compute","entry_point":os.environ['ADAPTER']+":run_microtest","idempotente":True},
            "seguridad":{"sandbox":"process","limites":{"timeout_ms":300000,"deadline_ms":300000}},
            "firma":{"gpg_key_id":"YAIWES-N23"},"categoria":"pipeline","etapa":"P",
            "perfiles":{"n0":{"habilitada":True,"iteraciones":1,"simulaciones":0,"criticas":0,"muestras_k":1}},
            "repeticion":{"max":1,"condicion":"nunca"},"repite_en":[],
            "activacion":{"eventos":["kernel.v2.plugin.enchufed"],"wake_words":[],"condicion":""},
            "presupuesto":{"n0":{"max_tokens":1,"max_ms":300000,"max_costo_usd":0.0}},
            "telemetria":{"metricas":["tiempo","errores","health"],"span_otel":True},
            "evidencia":{"produce":["L2_build","L3_runtime","L4_feature"],"destino":str(adapter.parent)+"/"},
            "failover":{"sustituible_por":[],"compensacion":"fail_closed"},
            "salud":{"metodo":"exec","heartbeat_interval_s":30}}
          ficha.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('POSTGRESQL_ADAPTER_COMPILE=PASS'); print('POSTGRESQL_ADAPTER_SHA256='+digest)
          PY

      - name: Verify FABLES and build moved PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          command -v bison >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y bison flex; }
          rm -rf "$PG_PREFIX"
          cd "$TARGET"
          ./configure --prefix="$PG_PREFIX" --without-readline --without-zlib --without-icu > /tmp/n23-configure.log
          make -s -j2
          make -s install
          test -x "$PG_PREFIX/bin/postgres"
          test -x "$PG_PREFIX/bin/initdb"
          test -x "$PG_PREFIX/bin/psql"
          echo POSTGRESQL_BUILD_INSTALL=PASS

      - name: FABLES Enchufe plus real PostgreSQL server query microtest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root=Path.cwd(); adapter=root/os.environ['ADAPTER']; ficha=root/os.environ['FICHA']; bus_path=root/os.environ['BUS']
          source=adapter.read_text(encoding='utf-8'); manifest=json.loads(ficha.read_text(encoding='utf-8')); actual='sha256:'+hashlib.sha256(source.encode()).hexdigest(); assert actual==manifest['contract_hash']
          sys.path.insert(0,str(bus_path.parent)); import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus(); bus.add_tribunal_approval(manifest['tribunal_case_id'])
          candidate=bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']]); conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest,candidate,conventions,registered_by='SOL integración 1')
          assert reg.status==bus_mod.PluginStatus.ACTIVE and reg.plugin_id=='yaiwes.durability.postgresql'
          bus.health.heartbeat(reg.plugin_id); assert bus.check_plugin_health(reg.plugin_id)
          proc=subprocess.run([sys.executable,str(adapter),os.environ['PG_PREFIX']],cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=240)
          print(proc.stdout,end=''); assert proc.returncode==0, proc.stdout
          marker='YAIWES_POSTGRESQL_RESULT='; payload=next((x[len(marker):] for x in proc.stdout.splitlines() if x.startswith(marker)),None); assert payload
          result=json.loads(payload); assert result['status']=='PASS' and result['value']==41 and result['server_started'] is True, result
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result}); bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'real_server_query','verified':True,'value':41})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]; assert 'L2_build' in levels and 'L3_runtime' in levels and 'L4_feature' in levels, levels
          ev={'node':23,'worker':'SOL integración 1','status':'PASS','route':'UniversalPluginBus/FABLES -> PostgreSQL adapter -> moved PostgreSQL build -> initdb -> postgres server -> psql SELECT 20+21','plugin_id':reg.plugin_id,'microtest':'real_server_query_20_plus_21','result':result,'evidence_levels':levels,'run':int(os.environ['GITHUB_RUN_ID']),'runner_commit':os.environ['GITHUB_SHA'],'adapter_sha256':actual,'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f','canonical_ficha_code_blob':'a72508027cc2458553ef6a2255a9aa33d9a77a21','prune':'NOT_NEEDED'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('POSTGRESQL_REAL_SERVER_QUERY=PASS value=41'); print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY

      - name: Persist N23 STEP3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE"; git diff --cached --check
          git commit -m 'wire(yaiwes): PostgreSQL N23 real server STEP3 PASS'
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git reset --hard HEAD
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; git reset --hard HEAD; sleep $((attempt * 2))
          done
          test "$ok" -eq 1

      - name: Read-back N23 STEP3 from origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git ls-tree -r --name-only origin/main -- 'Core kernel Yaiwes/PostgreSQL')"
          test -n "$(git ls-tree -r --name-only origin/main -- "$TARGET")"
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.durability.postgresql'
          git show "origin/main:$EVIDENCE" | grep -Fq 'real_server_query_20_plus_21'
          git show "origin/main:$EVIDENCE" | grep -Fq '"value": 41'
          git show "origin/main:$EVIDENCE" | grep -Fq 'L4_feature'
          echo N23_STEP3_READBACK=PASS

      - name: Checkpoint N23 STEP3 PASS release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x['id']==23)
          if n.get('owner')!='SOL' or n.get('lock')!='CLAIMED' or n.get('current_step')!=3: raise SystemExit(f"N23_CLAIM_LOST:{n.get('owner')}:{n.get('lock')}:{n.get('current_step')}")
          now=datetime.now(timezone.utc).isoformat(); run=os.environ.get('GITHUB_RUN_ID',''); commit=os.environ.get('EVIDENCE_COMMIT',''); sha=hashlib.sha256(open(os.environ['ADAPTER'],encoding='utf-8').read().encode()).hexdigest()
          n['status']='PASS'; n.setdefault('checkpoint',{})['after']=now+' STEP3 PASS: FABLES ACTIVE; PostgreSQL built from moved source; initdb + real server + psql SELECT 20+21 returned 41; L2+L3+L4; prune NOT_NEEDED; origin/main read-back PASS'
          ev=n.setdefault('evidence',[])
          for item in ['step3:run:'+run,'step3:evidence_commit:'+commit,'step3:adapter_sha256:'+sha,'step3:route:FABLES->PostgreSQL adapter->moved source build->initdb->server->psql','step3:microtest:PASS SELECT 20+21=41','step3:evidence:L2_build+L3_runtime+L4_feature','step3:prune:NOT_NEEDED','step3:readback:source_absent+adapter+ficha+evidence PASS']:
              if item not in ev: ev.append(item)
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 1','event':'STEP3_PASS_RELEASE','run':int(run),'commit':commit})
          n['owner']=None; n['lock']='FREE'; n['next_action']='COMPLETE'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 1 N23 STEP3 PASS release'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1
          echo N23_VERIFIED_CLOSED
