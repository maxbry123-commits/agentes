name: YAIWES SOL1 N26 gVisor STEP3 RETRY3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-motor4-move-n21-dagu.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol1-n26-gvisor-step3
  cancel-in-progress: false

jobs:
  wire_microtest_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      TARGET: 'Agente Yaiwes principal/execution-orchestration/container-pod-isolation/gvisor'
      ADAPTER: 'Agente Yaiwes principal/execution-orchestration/container-pod-isolation/gvisor/yaiwes/gvisor_adapter.py'
      FICHA: 'Agente Yaiwes principal/execution-orchestration/container-pod-isolation/gvisor/yaiwes/ficha.gvisor.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/execution-orchestration/container-pod-isolation/gvisor/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
      BUILD_ROOT: '/tmp/yaiwes-gvisor-build'
      RUNSC_BIN: '/tmp/yaiwes-gvisor-bin/runsc'
    steps:
      - name: Checkout N26 STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-motor4-move-n21-dagu.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py
            /Agente Yaiwes principal/execution-orchestration/container-pod-isolation/gvisor/

      - name: Resume N26 STEP3 claim and record exact parser GAP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x['id']==26)
          if n.get('component')!='gVisor' or n.get('current_step')!=3 or n.get('owner')!='SOL' or n.get('lock')!='CLAIMED':
              raise SystemExit(f"N26_CLAIM_NOT_RESUMABLE:{n.get('component')}:{n.get('current_step')}:{n.get('owner')}:{n.get('lock')}")
          now=datetime.now(timezone.utc).isoformat(); n['status']='GAP'
          n.setdefault('checkpoint',{})['after']='STEP3 GAP run 34564949176: canonical runsc build PASS; real gVisor ptrace network-none sandbox executed and emitted 41, but adapter merged Docker pull stderr with stdout and rejected the otherwise-correct feature result. StrategyDelta: keep identical test and separate stdout/stderr; no gVisor source changes.'
          ev=n.setdefault('evidence',[])
          for item in ['step3:build_run:34564949176:PASS','step3:runtime_run:34564949176:real_runsc_emitted_41','step3:gap_run:34564949176','step3:gap_exact:adapter_merged_docker_pull_stderr_with_sandbox_stdout','step3:strategy_delta:separate_stdout_stderr_same_real_runsc_test']:
              if item not in ev: ev.append(item)
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 1','event':'STEP3_GAP_OUTPUT_PARSER_STRATEGY_DELTA','run':34564949176})
          n['next_action']='STEP3_RETRY_SAME_REAL_RUNSC_TEST_SEPARATE_STDOUT_STDERR'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"
            git commit -m 'crazy-wall: N26 record runtime output parser GAP'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1

      - name: Materialize gVisor FABLES adapter and ficha
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, textwrap
          from pathlib import Path
          adapter=Path(os.environ['ADAPTER']); ficha=Path(os.environ['FICHA']); adapter.parent.mkdir(parents=True,exist_ok=True)
          source=r'''# YAIWES gVisor adapter: execute a real runsc ptrace sandbox in CI.
          import json
          import subprocess
          import sys
          from pathlib import Path
          from typing import Any
          PLUGIN_ID = "yaiwes.isolation.gvisor"
          def descriptor() -> dict[str, str]:
              return {"plugin_id": PLUGIN_ID, "role": "container_pod_isolation", "microtest": "runsc_do_privileged_ci_ptrace"}
          def run_microtest(runsc_binary: str | Path) -> dict[str, Any]:
              binary=Path(runsc_binary).resolve()
              if not binary.is_file(): raise RuntimeError(f"RUNSC_BINARY_MISSING:{binary}")
              host_dir=str(binary.parent)
              cmd=[
                  "docker","run","--rm","--privileged","--pid=host",
                  "--security-opt","seccomp=unconfined","--security-opt","apparmor=unconfined",
                  "-v",host_dir+":/gvisor:ro",
                  "ubuntu:24.04",
                  "/gvisor/runsc",
                  "--root=/tmp/yaiwes-runsc-state",
                  "--platform=ptrace",
                  "--network=none",
                  "--ignore-cgroups=true",
                  "--directfs=false",
                  "--host-settings=ignore",
                  "--sidecar-usage-policy=LEGACY_DEPRECATED_SLOW_EMBEDDED_FALLBACK",
                  "do","--quiet","/bin/sh","-c","printf 41",
              ]
              proc=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=240)
              stdout=proc.stdout
              stderr=proc.stderr
              if proc.returncode != 0:
                  raise RuntimeError(f"RUNSC_DO_FAILED:{proc.returncode}:stdout={stdout[-4000:]}:stderr={stderr[-8000:]}")
              value=stdout.strip()
              if value != "41":
                  raise RuntimeError(f"RUNSC_SANDBOX_OUTPUT_BAD:{value!r}:stderr={stderr[-8000:]}")
              return {"status":"PASS","capability":"runsc_do_privileged_ci_ptrace","value":41,"returncode":proc.returncode,"network":"none","platform":"ptrace","rootless":False,"ci_outer_container_privileged":True}
          if __name__ == "__main__":
              result=run_microtest(sys.argv[1]); print("YAIWES_GVISOR_RESULT="+json.dumps(result,separators=(",",":")))
          '''
          source=textwrap.dedent(source); compile(source,str(adapter),'exec'); adapter.write_text(source,encoding='utf-8'); digest='sha256:'+hashlib.sha256(source.encode()).hexdigest()
          manifest={"artifact_id":"yaiwes.isolation.gvisor","version":"1.0.0","estado":"active","contract_hash":digest,"tribunal_case_id":"YAIWES-N26-GVISOR-STEP3","contrato":{"rol":"service","consume":{"datatype":{"family":"json","type":"object","version":1}},"expone":{"datatype":{"family":"json","type":"object","version":1}}},"ejecucion":{"kind":"code","transport":"stdio","runtime_type":"compute","entry_point":os.environ['ADAPTER']+":run_microtest","idempotente":True},"seguridad":{"sandbox":"process","limites":{"timeout_ms":600000,"deadline_ms":600000}},"firma":{"gpg_key_id":"YAIWES-N26"},"categoria":"pipeline","etapa":"P","perfiles":{"n0":{"habilitada":True,"iteraciones":1,"simulaciones":0,"criticas":0,"muestras_k":1}},"repeticion":{"max":1,"condicion":"nunca"},"repite_en":[],"activacion":{"eventos":["kernel.v2.plugin.enchufed"],"wake_words":[],"condicion":""},"presupuesto":{"n0":{"max_tokens":1,"max_ms":600000,"max_costo_usd":0.0}},"telemetria":{"metricas":["tiempo","errores","health"],"span_otel":True},"evidencia":{"produce":["L2_build","L3_runtime","L4_feature"],"destino":str(adapter.parent)+"/"},"failover":{"sustituible_por":[],"compensacion":"fail_closed"},"salud":{"metodo":"exec","heartbeat_interval_s":30}}
          ficha.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print('GVISOR_ADAPTER_COMPILE=PASS'); print('GVISOR_ADAPTER_SHA256='+digest)
          PY

      - name: Verify FABLES and build moved runsc from no-space workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          docker version >/dev/null
          rm -rf "$BUILD_ROOT" /tmp/yaiwes-gvisor-bin
          mkdir -p "$BUILD_ROOT" /tmp/yaiwes-gvisor-bin
          cp -a "$TARGET"/. "$BUILD_ROOT"/
          test "$(git hash-object "$TARGET/runsc/cmd/do.go")" = "$(git hash-object "$BUILD_ROOT/runsc/cmd/do.go")"
          cd "$BUILD_ROOT"
          make copy TARGETS=//runsc DESTINATION=/tmp/yaiwes-gvisor-bin
          test -x "$RUNSC_BIN"
          "$RUNSC_BIN" --version
          docker pull ubuntu:24.04 >/dev/null
          echo GVISOR_RUNSC_BUILD=PASS

      - name: FABLES Enchufe plus real runsc sandbox microtest in CI container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root=Path.cwd(); adapter=root/os.environ['ADAPTER']; ficha=root/os.environ['FICHA']; bus_path=root/os.environ['BUS']
          source=adapter.read_text(encoding='utf-8'); manifest=json.loads(ficha.read_text(encoding='utf-8')); actual='sha256:'+hashlib.sha256(source.encode()).hexdigest(); assert actual==manifest['contract_hash']
          sys.path.insert(0,str(bus_path.parent)); import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus(); bus.add_tribunal_approval(manifest['tribunal_case_id']); candidate=bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']]); conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest,candidate,conventions,registered_by='SOL integración 1'); assert reg.status==bus_mod.PluginStatus.ACTIVE and reg.plugin_id=='yaiwes.isolation.gvisor'; bus.health.heartbeat(reg.plugin_id); assert bus.check_plugin_health(reg.plugin_id)
          proc=subprocess.run([sys.executable,str(adapter),os.environ['RUNSC_BIN']],cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300); print(proc.stdout,end='')
          if proc.returncode != 0: raise RuntimeError(f'GVISOR_ADAPTER_RUN_FAILED:{proc.returncode}')
          marker='YAIWES_GVISOR_RESULT='; payload=next((x[len(marker):] for x in proc.stdout.splitlines() if x.startswith(marker)),None); assert payload
          result=json.loads(payload); assert result['status']=='PASS' and result['value']==41 and result['rootless'] is False and result['platform']=='ptrace' and result['ci_outer_container_privileged'] is True, result
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result}); bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'runsc_do_privileged_ci_ptrace','verified':True,'value':41}); levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]; assert 'L2_build' in levels and 'L3_runtime' in levels and 'L4_feature' in levels, levels
          ev={'node':26,'worker':'SOL integración 1','status':'PASS','route':'UniversalPluginBus/FABLES -> gVisor adapter -> identical moved tree -> canonical Makefile/Bazel -> runsc -> ephemeral privileged CI container -> ptrace network-none gVisor sandbox -> /bin/sh printf 41','plugin_id':reg.plugin_id,'microtest':'runsc_do_privileged_ci_ptrace','result':result,'evidence_levels':levels,'run':int(os.environ['GITHUB_RUN_ID']),'runner_commit':os.environ['GITHUB_SHA'],'adapter_sha256':actual,'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f','canonical_ficha_code_blob':'a72508027cc2458553ef6a2255a9aa33d9a77a21','prune':'NOT_NEEDED','build_strategy':'identical_no_space_ephemeral_workspace','ci_runtime_strategy':'privileged_outer_container_only_for_host_policy'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print('GVISOR_REAL_RUNSC_SANDBOX=PASS value=41'); print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY

      - name: Persist N26 STEP3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE"; git diff --cached --check; git commit -m 'wire(yaiwes): gVisor N26 real runsc sandbox STEP3 PASS'
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"; git reset --hard HEAD
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; git reset --hard HEAD; sleep $((attempt * 2))
          done
          test "$ok" -eq 1

      - name: Read-back N26 STEP3 origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git ls-tree -r --name-only origin/main -- 'Core kernel Yaiwes/gVisor')"
          test -n "$(git ls-tree -r --name-only origin/main -- "$TARGET")"
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.isolation.gvisor'
          git show "origin/main:$EVIDENCE" | grep -Fq 'runsc_do_privileged_ci_ptrace'
          git show "origin/main:$EVIDENCE" | grep -Fq '"value": 41'
          git show "origin/main:$EVIDENCE" | grep -Fq 'L4_feature'
          echo N26_STEP3_READBACK=PASS

      - name: Checkpoint N26 STEP3 PASS release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x['id']==26)
          if n.get('owner')!='SOL' or n.get('lock')!='CLAIMED' or n.get('current_step')!=3: raise SystemExit(f"N26_CLAIM_LOST:{n.get('owner')}:{n.get('lock')}:{n.get('current_step')}")
          now=datetime.now(timezone.utc).isoformat(); run=os.environ.get('GITHUB_RUN_ID',''); commit=os.environ.get('EVIDENCE_COMMIT',''); sha=hashlib.sha256(open(os.environ['ADAPTER'],encoding='utf-8').read().encode()).hexdigest()
          n['status']='PASS'; n.setdefault('checkpoint',{})['after']=now+' STEP3 PASS: FABLES ACTIVE; identical moved gVisor tree built in no-space ephemeral workspace with canonical Makefile/Bazel; real runsc ptrace network-none sandbox executed /bin/sh printf 41 inside privileged ephemeral CI outer container because GitHub host blocks rootless self-reexec; stdout/stderr separated; L2+L3+L4; prune NOT_NEEDED; origin/main read-back PASS'
          ev=n.setdefault('evidence',[])
          for item in ['step3:run:'+run,'step3:evidence_commit:'+commit,'step3:adapter_sha256:'+sha,'step3:build_strategy:identical_no-space_ephemeral_workspace+canonical_Makefile_Bazel','step3:route:FABLES->gVisor adapter->runsc->ephemeral privileged CI container->ptrace network-none sandbox','step3:microtest:PASS runsc do sandbox output=41','step3:evidence:L2_build+L3_runtime+L4_feature','step3:prune:NOT_NEEDED','step3:readback:source_absent+adapter+ficha+evidence PASS']:
              if item not in ev: ev.append(item)
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 1','event':'STEP3_PASS_RELEASE','run':int(run),'commit':commit})
          n['owner']=None; n['lock']='FREE'; n['next_action']='COMPLETE'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 1 N26 STEP3 PASS release'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1
          echo N26_VERIFIED_CLOSED
