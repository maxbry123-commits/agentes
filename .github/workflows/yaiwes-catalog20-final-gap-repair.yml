name: YAIWES Kernel Catalog20 Final GAP Repair

on:
  push:
    paths:
      - '.github/workflows/yaiwes-catalog20-final-gap-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaiwes-kernel-catalog20-final-gap-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOTOR1: Motores/➡️📂 Motor de extracción zip/motor_1_extract_only.py
      DEST_ROOT: Core kernel Yaiwes
      STATE_FILE: Core kernel Yaiwes/Crack wall bitácora stated JSON/CATALOG20-FINAL-REPAIR-STATE-20260913.json
    steps:
      - name: Checkout immutable Motor1 and Crazy Wall
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-catalog20-final-gap-repair.yml
            /Motores/➡️📂 Motor de extracción zip/motor_1_extract_only.py
            /Core kernel Yaiwes/Crack wall bitácora stated JSON/

      - name: Verify Motor1 immutable blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$MOTOR1")" = 'a52d5dc0e6ff26f75d753b848dcc1a40c5dd4500'
          git lfs version
          echo MOTOR1_LOCK=PASS

      - name: Repair seven final GAP components
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, shutil, stat, subprocess, sys, tempfile, time, zipfile

          ROOT=pathlib.Path.cwd(); MOTOR1=ROOT/os.environ['MOTOR1']; DEST_ROOT=os.environ['DEST_ROOT'].strip('/'); TOKEN=os.environ['GITHUB_TOKEN']
          ITEMS=[
            ('04-networkx','networkx/networkx','NetworkX'),
            ('05-airflow','apache/airflow','Apache-Airflow'),
            ('06-dagster','dagster-io/dagster','Dagster'),
            ('07-litellm','BerriAI/litellm','LiteLLM'),
            ('09-tensorzero','tensorzero/tensorzero','TensorZero'),
            ('10-ray','ray-project/ray','Ray'),
            ('15-autogen','microsoft/autogen','AutoGen-Core'),
          ]
          LFS_PREFIX=b'version https://git-lfs.github.com/spec/v1\n'
          state={'schema':'yaiwes.kernel.catalog20.final-repair/v1','motor1_blob':'a52d5dc0e6ff26f75d753b848dcc1a40c5dd4500','items':{}}

          def run(argv,cwd=None,env=None,check=True,binary=False):
              p=subprocess.run(argv,cwd=cwd,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=not binary)
              if check and p.returncode:
                  out=p.stdout if isinstance(p.stdout,str) else p.stdout.decode('utf-8','replace')
                  raise RuntimeError(f'COMMAND_FAILED:{argv[0]}:{p.returncode}:{out[-5000:]}')
              return p.stdout
          def sha256(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          def tree_hash(d):
              h=hashlib.sha256(); files=0; total=0
              for p in sorted((x for x in d.rglob('*') if x.is_file()),key=lambda x:x.relative_to(d).as_posix()):
                  rel=p.relative_to(d).as_posix(); dg=sha256(p); sz=p.stat().st_size
                  h.update(rel.encode()+b'\0'+dg.encode()+b'\0'+str(sz).encode()+b'\n'); files+=1; total+=sz
              return {'files':files,'bytes':total,'sha256':h.hexdigest()}
          def no_lfs(d):
              run(['git','config','filter.lfs.clean','cat'],d); run(['git','config','filter.lfs.smudge','cat'],d)
              run(['git','config','--unset-all','filter.lfs.process'],d,check=False); run(['git','config','filter.lfs.required','false'],d)
          def auth_env():
              e=dict(os.environ); raw=base64.b64encode(f'x-access-token:{TOKEN}'.encode()).decode()
              e.update({'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':f'AUTHORIZATION: basic {raw}','GIT_TERMINAL_PROMPT':'0'})
              return e
          def clone(work,repo):
              d=work/'source'; d.mkdir(); run(['git','init','-q'],d); run(['git','remote','add','origin',f'https://github.com/{repo}.git'],d)
              run(['git','fetch','--depth=1','origin','HEAD'],d); run(['git','checkout','-q','--detach','FETCH_HEAD'],d)
              return d,run(['git','rev-parse','HEAD'],d).strip()
          def strengthen_lfs(src):
              run(['git','lfs','install','--local'],src,check=False); run(['git','lfs','fetch','origin','HEAD'],src,check=False); run(['git','lfs','checkout'],src,check=False)
              pointers=[]
              for p in src.rglob('*'):
                  if p.is_file() and not p.is_symlink() and p.stat().st_size<=1024:
                      b=p.read_bytes()
                      if b.startswith(LFS_PREFIX): pointers.append(p.relative_to(src).as_posix())
              if pointers:
                  run(['git','lfs','fetch','--all','origin'],src,check=False); run(['git','lfs','checkout'],src,check=False)
              return pointers
          def materialize(src,out,repo):
              out.mkdir(); normalizations=[]; unresolved_lfs=[]
              raw=run(['git','ls-files','-s','-z'],src,binary=True)
              entries=[]
              for rec in raw.split(b'\0'):
                  if not rec: continue
                  meta,pathb=rec.split(b'\t',1); mode,oid,_stage=meta.decode().split(); path=pathb.decode('utf-8','surrogateescape'); entries.append((mode,oid,path))
              for mode,oid,path in entries:
                  dst=out/path; dst.parent.mkdir(parents=True,exist_ok=True); sp=src/path
                  if mode=='120000':
                      target=run(['git','cat-file','-p',oid],src,binary=True).decode('utf-8','surrogateescape').strip()
                      resolved=(sp.parent/target)
                      if resolved.exists() and resolved.is_file():
                          shutil.copy2(resolved,dst); normalizations.append({'path':path,'from':'symlink','target':target,'action':'dereference_file'})
                      else:
                          dst.write_text('YAIWES_NORMALIZED_BROKEN_SYMLINK_TARGET='+target+'\n'); normalizations.append({'path':path,'from':'symlink','target':target,'action':'materialize_target_marker'})
                      continue
                  if not sp.exists() or not sp.is_file(): continue
                  b=sp.read_bytes()
                  if b.startswith(LFS_PREFIX):
                      unresolved_lfs.append(path)
                      # Preserve exact Git source pointer for non-runtime documentation assets; never hide this normalization.
                      dst.write_bytes(b); normalizations.append({'path':path,'from':'git-lfs-pointer','action':'preserve_source_pointer_after_fetch_attempt'})
                  else:
                      shutil.copy2(sp,dst)
              if not any(out.rglob('*')): raise RuntimeError('EMPTY_NORMALIZED_TREE')
              return normalizations,unresolved_lfs
          def make_zip(src,zp):
              with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
                  for p in sorted((x for x in src.rglob('*') if x.is_file()),key=lambda x:x.relative_to(src).as_posix()): z.write(p,p.relative_to(src).as_posix())
              with zipfile.ZipFile(zp) as z:
                  bad=z.testzip()
                  if bad: raise RuntimeError('ZIP_CRC_FAIL:'+bad)
          def sparse_clone(work,slug,name):
              d=work/name; d.mkdir(); env=auth_env(); rel=f'{DEST_ROOT}/{slug}'
              run(['git','init','-q'],d); no_lfs(d); run(['git','remote','add','origin','https://github.com/maxbry123-commits/agentes.git'],d)
              run(['git','sparse-checkout','init','--no-cone'],d); (d/'.git/info/sparse-checkout').write_text('/'+rel+'/\n')
              run(['git','fetch','--depth=1','--filter=blob:none','origin','main'],d,env=env); run(['git','checkout','-q','-B','main','FETCH_HEAD'],d)
              return d,rel,env
          def publish(work,slug,extracted,manifest):
              d,rel,env=sparse_clone(work,slug,'dest'); target=d/rel; target.mkdir(parents=True,exist_ok=True)
              code=target/'code'
              if code.exists(): shutil.rmtree(code)
              shutil.copytree(extracted,code)
              (target/'DOWNLOAD_EXTRACT_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              no_lfs(d); run(['git','config','user.name','yaiwes-final-repair'],d); run(['git','config','user.email','yaiwes-final-repair@users.noreply.github.com'],d)
              run(['git','add','--sparse','--',rel],d)
              if not run(['git','diff','--cached','--quiet'],d,check=False).strip() if False else False: pass
              p=subprocess.run(['git','diff','--cached','--quiet'],cwd=d)
              if p.returncode!=0: run(['git','commit','-m',f'build(final-repair): normalize and verify {slug}'],d)
              pushed=False
              for attempt in range(1,7):
                  run(['git','fetch','origin','main'],d,env=env); rb=run(['git','rebase','origin/main'],d,env=env,check=False)
                  if 'CONFLICT' in rb:
                      run(['git','rebase','--abort'],d,check=False); raise RuntimeError('NON_FAST_FORWARD_CONFLICT')
                  out=run(['git','push','origin','HEAD:main'],d,env=env,check=False)
                  if 'rejected' not in out.lower() and 'error:' not in out.lower(): pushed=True; break
                  time.sleep(attempt*3)
              if not pushed: raise RuntimeError('PUSH_RETRIES_EXHAUSTED')
              commit=run(['git','rev-parse','HEAD'],d).strip()
              rb,rel2,env2=sparse_clone(work,slug,'readback'); actual=tree_hash(rb/rel2/'code'); remote=json.loads((rb/rel2/'DOWNLOAD_EXTRACT_MANIFEST.json').read_text())
              if actual!=remote['extracted_tree']: raise RuntimeError('FINAL_READBACK_TREE_HASH_GAP:'+json.dumps({'actual':actual,'expected':remote['extracted_tree']}))
              return {'verdict':'PUBLISHED_AND_DEEP_READBACK_VERIFIED','commit':commit,'readback_tree':actual}

          for iid,repo,slug in ITEMS:
              row={'source_repo':repo,'slug':slug,'status':'RUNNING'}; state['items'][iid]=row
              try:
                  with tempfile.TemporaryDirectory(prefix='yaiwes-final-gap-') as td:
                      work=pathlib.Path(td); src,commit=clone(work,repo)
                      lfs_before=strengthen_lfs(src) if slug=='AutoGen-Core' else []
                      norm=work/'normalized'; normalizations,unresolved=materialize(src,norm,repo); source_tree=tree_hash(norm)
                      archive=work/(slug+'.zip'); make_zip(norm,archive); extracted=work/'extracted'; motor_state=work/'motor1-state.json'
                      env=dict(os.environ); env.update({'ARCHIVE_INPUT':str(archive),'DEST_DIR':str(extracted),'STATE_FILE':str(motor_state),'BATCH_SIZE':'100','MAX_BATCHES':'0'})
                      out=run([sys.executable,str(MOTOR1)],env=env); payload=json.loads(out.splitlines()[-1])
                      if payload.get('verdict')!='VERIFIED_CLOSED': raise RuntimeError('MOTOR1_NOT_CLOSED:'+out[-3000:])
                      ext_tree=tree_hash(extracted)
                      if ext_tree!=source_tree: raise RuntimeError('NORMALIZED_EXTRACTED_TREE_MISMATCH')
                      manifest={'schema':'yaiwes.kernel.catalog20.final-repair-manifest/v1','source_repo':repo,'source_commit':commit,'slug':slug,'motor1_blob':'a52d5dc0e6ff26f75d753b848dcc1a40c5dd4500','archive_sha256':sha256(archive),'archive_bytes':archive.stat().st_size,'normalizations':normalizations,'lfs_fetch_attempted':slug=='AutoGen-Core','unresolved_lfs_source_pointers':unresolved,'extraction_verified':True,'source_tree':source_tree,'extracted_tree':ext_tree}
                      pub=publish(work,slug,extracted,manifest)
                      row.update({'status':'VERIFIED_CLOSED','source_commit':commit,'normalizations':normalizations,'unresolved_lfs_source_pointers':unresolved,'tree':ext_tree,'publish':pub})
              except Exception as e:
                  row.update({'status':'FAILED','error':str(e)})
              print(json.dumps({'item':iid,**row},ensure_ascii=False))

          sf=ROOT/os.environ['STATE_FILE']; sf.parent.mkdir(parents=True,exist_ok=True); sf.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          failed=[k for k,v in state['items'].items() if v.get('status')!='VERIFIED_CLOSED']
          print(json.dumps({'final_repair_total':len(ITEMS),'closed':len(ITEMS)-len(failed),'failed':failed},ensure_ascii=False))
          if failed: raise SystemExit(2)
          PY

      - name: Persist final repair state in Crazy Wall
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$STATE_FILE"
          cp "$STATE_FILE" /tmp/catalog20-final-repair-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$STATE_FILE")"
          cp /tmp/catalog20-final-repair-state.json "$STATE_FILE"
          git add --sparse -- "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m 'watchdog(yaiwes): persist catalog20 final repair state'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              sleep $((attempt*3))
            done
          fi

      - name: Final read-back gate 20 of 20
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          slugs=['Temporal','LangGraph','Prefect','NetworkX','Apache-Airflow','Dagster','LiteLLM','RouteLLM','TensorZero','Ray','Dask-Distributed','AgentScope','CAMEL','AutoGen-Core','Gymnasium','PettingZoo','Mesa','Graphiti','Letta']
          failures=[]
          for slug in slugs:
              path=f'Core kernel Yaiwes/{slug}/DOWNLOAD_EXTRACT_MANIFEST.json'
              p=subprocess.run(['git','show',f'origin/main:{path}'],text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode: failures.append(slug+':manifest_missing'); continue
              try: d=json.loads(p.stdout)
              except Exception: failures.append(slug+':manifest_invalid'); continue
              if d.get('extraction_verified') is not True: failures.append(slug+':extraction_not_verified')
          p=subprocess.run(['git','show','origin/main:Core kernel Yaiwes/Celery/SOURCE_COMMIT.txt'],text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          if p.returncode or not p.stdout.strip(): failures.append('Celery:source_commit_missing')
          print('CATALOG20_FAILURES='+json.dumps(failures))
          if failures: raise SystemExit(1)
          print('CATALOG20_DOWNLOAD_EXTRACT=VERIFIED_CLOSED_20_OF_20')
          PY
