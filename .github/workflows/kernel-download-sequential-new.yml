# Nuevo workflow: copia quirurgica del skill research-download-chain.
name: Research Download Chain FINAL
run-name: Kernel principal sequential • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kernel-download-sequential-new.yml']
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_LFS_SKIP_PUSH: "1"
  GIT_LFS_SKIP_DOWNLOAD: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: research-download-chain-final
  cancel-in-progress: true
jobs:
  relocate-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            scripts
            Agente core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl
            Documentos proyectos Yaiwes
            Desplegar
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Reubicar componentes ya descargados
        shell: bash
        run: |
          set -euo pipefail
          DEST='Agente core kernel Yaiwes principal'
          mkdir -p "$DEST"
          move_parts() {
            src="$1"; prefix="$2"
            [ -d "$src" ] || return 0
            shopt -s nullglob
            parts=("$src"/"$prefix"_*.zip)
            for f in "${parts[@]}"; do
              name=$(basename "$f")
              [ -e "$DEST/$name" ] || git mv "$f" "$DEST/$name"
            done
          }
          move_parts 'Download code/archivos' Haystack
          move_parts 'Download code Yaiwes' autogen
          move_parts 'Download code Yaiwes' crewAI
          move_parts 'Download code/archivos' LangGraph
          move_parts 'Download code Yaiwes' Temporal
          move_parts 'Download code/archivos' Prefect
          move_parts 'Download code Yaiwes' dspy
          move_parts 'Download code Yaiwes' gVisor
          move_parts 'Download code Yaiwes' Dagster
          move_parts 'Download code Yaiwes' Kestra
          move_parts 'Download code/archivos' Argo-Workflows
          move_parts 'Download code/archivos' Hatchet
          move_parts 'Download code/archivos' Dagu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'move: existing kernel components to principal destination'
            git pull --rebase origin main
            git push --no-verify origin HEAD:main
          fi
  batch-01:
    needs: relocate-existing
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            scripts
            Agente core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl
            Documentos proyectos Yaiwes
            Desplegar
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Ejecutar lote 01
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          GIT_LFS_SKIP_PUSH: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config --global filter.lfs.smudge ''
          git config --global filter.lfs.clean ''
          git config --global filter.lfs.process ''
          git config --global filter.lfs.required false
          git config --global core.compression 0
          python3 scripts/research_download_kernel_batch_01.py 'Agente core kernel Yaiwes principal' '_work/kernel-batch-01'
