  organize-yaiwes:
    needs: batch-07
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            scripts
            Agente core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl
            Documentos proyectos Yaiwes
            Desplegar
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Organizar documentos y code restantes
        shell: bash
        run: |
          set -euo pipefail
          DOC_ROOT='Documentos proyectos Yaiwes'
          OLD="$DOC_ROOT/documentos proyecto Yaiwes 1"
          DOC="$DOC_ROOT/Documentos proyectos Yaiwes 1"
          CODE='Download code Yaiwes'
          mkdir -p "$DOC_ROOT" "$CODE"
          if [ -d "$OLD" ] && [ ! -e "$DOC" ]; then
            git mv "$OLD" "$DOC"
          else
            mkdir -p "$DOC"
            if [ -d "$OLD" ]; then
              shopt -s dotglob nullglob
              for f in "$OLD"/*; do [ -e "$DOC/$(basename "$f")" ] || git mv "$f" "$DOC/"; done
            fi
          fi
          if [ -d Desplegar ]; then
            while IFS= read -r -d '' f; do
              rel="${f#Desplegar/}"
              case "$f" in
                *.md|*.markdown|*.txt|*.html|*.json|*.yml|*.yaml)
                  mkdir -p "$DOC/$(dirname "$rel")"; [ -e "$DOC/$rel" ] || git mv "$f" "$DOC/$rel" ;;
                *)
                  mkdir -p "$CODE/$(dirname "$rel")"; [ -e "$CODE/$rel" ] || git mv "$f" "$CODE/$rel" ;;
              esac
            done < <(find Desplegar -type f -print0)
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'move: organize Yaiwes documents and code'
            git pull --rebase origin main
            git push --no-verify origin HEAD:main
          fi
