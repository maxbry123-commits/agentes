name: YAIWES Second Five Integrate Verify

on:
  push:
    paths:
      - '.github/workflows/yaiwes-second-five-integrate-verify.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-second-five-integrate
  cancel-in-progress: false

jobs:
  integrate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/scripts/yaiwes_integrate_second_five.py
            .github/workflows/yaiwes-second-five-integrate-verify.yml
            Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows
            Core kernel Yaiwes/Componentes recuperados A/Azure-Durable-Functions
            Core kernel Yaiwes/Componentes recuperados A/BAML
            Core kernel Yaiwes/Componentes recuperados A/Burr
            Core kernel Yaiwes/Componentes recuperados A/Caddy
            Core kernel Yaiwes/Crack wall bitácora stated JSON
            Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus
            Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
            Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
            Agente Yaiwes principal/definition-registry/domain-specific-contracts
            Agente Yaiwes principal/execution-orchestration/state-machine-executor
            Agente Yaiwes principal/mesh-routing-collaboration
            Readme arquitectura Yaiwes/README.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare MOVE in working tree
        run: python .github/scripts/yaiwes_integrate_second_five.py prepare

      - name: Runtime probe Argo Workflows
        working-directory: Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
        run: go test ./workflow/validate -run '^$'

      - name: Runtime probe Azure Durable Functions
        working-directory: Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
        run: dotnet build src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj -f net10.0

      - name: Runtime probe BAML
        run: |
          cargo metadata --manifest-path 'Agente Yaiwes principal/definition-registry/domain-specific-contracts/baml/engine/Cargo.toml' --no-deps --format-version 1 >/tmp/baml-metadata.json
          cargo check --manifest-path 'Agente Yaiwes principal/definition-registry/domain-specific-contracts/baml/engine/Cargo.toml' -p baml-runtime --locked

      - name: Runtime probe Burr
        run: |
          python -m pip install -q -e 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/burr'
          python -c "from burr.core import State, GraphBuilder; s=State({'x':1}); assert s['x']==1; assert GraphBuilder() is not None; print('BURR_RUNTIME_OK')"

      - name: Runtime probe Caddy
        working-directory: Agente Yaiwes principal/mesh-routing-collaboration/caddy-gateway
        run: go test . -run '^$'

      - name: Mount all five through canonical UniversalPluginBus ten times
        run: |
          python -m pip install -q pytest
          for i in $(seq 1 10); do
            echo "SECOND_FIVE_PLUGIN_BUS_PASS_${i}/10"
            python -m pytest -q 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/verification/test_yaiwes_second_five_mounts.py'
          done

      - name: Persist verified state and architecture delta
        run: python .github/scripts/yaiwes_integrate_second_five.py persist

      - name: Commit verified integration
        run: |
          git config user.name 'YAIWES LOOP'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(yaiwes): MOVE and verify components 6-10 via universal bus'
          git push origin HEAD:main
