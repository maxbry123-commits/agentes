name: acquire-codex-v21
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire Codex v2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/acquire_agent.py \
            --id Codex \
            --repo https://github.com/openai/codex \
            --ref rust-v0.147.0 \
            --commit be6e8eac029b183056b7e4402879f15d2c85f61b

      - name: Publish staging binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGING=agents/Codex/distribution/staging
          TAG=agent-Codex-rust-v0.147.0
          if [ -d "$STAGING" ] && ls "$STAGING"/* >/dev/null 2>&1; then
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
            gh release create "$TAG" \
              --title "Codex distribution rust-v0.147.0" \
              --notes "Deterministic snapshot openai/codex@rust-v0.147.0 (be6e8eac). Large binaries as release assets." \
              $STAGING/*
            python3 - <<'PY'
import json
from pathlib import Path
tag = "agent-Codex-rust-v0.147.0"
for pin in Path("agents/Codex/distribution/official").glob("*.PIN.json"):
    data = json.loads(pin.read_text())
    name = data["name"]
    data["conserved_url"] = f"https://github.com/maxbry123-commits/agentes/releases/download/{tag}/{name}"
    data["release_tag"] = tag
    pin.write_text(json.dumps(data, indent=2) + "\n")
    print("pin", name)
PY
            rm -rf "$STAGING"
          else
            echo "No staging files"
          fi

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          rm -rf agents/Codex/distribution/staging || true
          git add agents/Codex
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "A5: Codex 100% SOURCE+DISTRIBUTION pin rust-v0.147.0 (v2.1)"
            git push
          fi
