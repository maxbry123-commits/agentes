name: YAIWES CODA Internal Transform V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/yaiwes_internal_safe_transform.py'
      - '.github/scripts/yaiwes_internal_finalize_fables.py'
      - '.github/workflows/yaiwes-coda-internal-transform-v4.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-coda-internal-transform-v4
  cancel-in-progress: false

jobs:
  transform-internal-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout CODA internal scope
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/yaiwes_internal_safe_transform.py
            /.github/scripts/yaiwes_internal_finalize_fables.py
            /.github/workflows/yaiwes-coda-internal-transform-v4.yml
            /📂coda workflow persistencias/

      - name: Audit and transform internal runtime source
        shell: bash
        run: |
          set -euo pipefail
          YAIWES_MODE=AUDIT python3 .github/scripts/yaiwes_internal_safe_transform.py
          YAIWES_MODE=TRANSFORM python3 .github/scripts/yaiwes_internal_safe_transform.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          field=Path('📂coda workflow persistencias/🏈 cancha deportiva de fútbol')
          a=json.loads((field/'YAIWES-INTERNAL-AUDIT-V1.json').read_text(encoding='utf-8'))
          t=json.loads((field/'YAIWES-INTERNAL-TRANSFORM-V1.json').read_text(encoding='utf-8'))
          assert a['components']==24 and t['components']==24
          assert t['errors']==[] and t['changed']==t['candidates']
          print('AUDIT_SOURCE_FILES=',a['source_files'])
          print('TRANSFORMED_DELTA=',t['changed'])
          PY

      - name: Verify residual zero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('t','.github/scripts/yaiwes_internal_safe_transform.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          residual=[]
          for comp in m.components():
              for p in m.sources(comp/'code'):
                  s=m.text(p)
                  if s is not None and m.has_side_effect(s): residual.append(str(p))
          print('RESIDUAL=',len(residual))
          if residual: raise SystemExit('RESIDUAL_ACTIVE_SURFACES:'+ '|'.join(residual[:20]))
          PY

      - name: Build cumulative links and Fables v4.2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/yaiwes_internal_finalize_fables.py

      - name: Test Fables 24 component runtimes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          F='📂coda workflow persistencias/Fables enchufe universal'
          PYTHONPATH="$F" python3 "$F/test_yaiwes_internal_swarm_chain_v4.py"

      - name: Verify 24 runtimes 299 cumulative links hashes READMEs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('📂coda workflow persistencias')
          field=root/'🏈 cancha deportiva de fútbol'
          comps=sorted(p for p in root.iterdir() if p.is_dir() and p.name.startswith('🏈 ') and p.name!='🏈 cancha deportiva de fútbol')
          assert len(comps)==24
          cumulative=0
          runtimes=0
          for c in comps:
              m=json.loads((c/'INTERNAL-LINK-MANIFEST.json').read_text(encoding='utf-8'))
              readme=(c/'README.md').read_text(encoding='utf-8')
              assert m['schema']=='yaiwes.internal.link-manifest/v4.2'
              assert m['version']=='YAIWES-INTERNAL-PERSISTENCE-v4.2'
              assert 'Swarm agent team Navy seals YAIWES' in readme
              assert 'YAIWES-INTERNAL-PERSISTENCE-v4.2' in readme
              runtime=c/'code'/m['component_runtime']
              assert runtime.is_file()
              runtime_links=[x for x in m['links'] if x.get('role')=='COMPONENT_PERSISTENCE_LINK']
              assert len(runtime_links)==1
              assert hashlib.sha256(runtime.read_bytes()).hexdigest()==runtime_links[0]['active_sha256']
              runtimes += 1
              n=m['active_surfaces_transformed_cumulative']
              assert m['link_count']==n+1
              cumulative += n
              for link in m['links']:
                  if link.get('role')!='TASK_PERSISTENCE_LINK': continue
                  active=c/'code'/link['path']
                  quarantine=c/'code'/link['quarantine']
                  assert active.is_file() and quarantine.is_file()
                  assert hashlib.sha256(active.read_bytes()).hexdigest()==link['active_sha256']
                  assert hashlib.sha256(quarantine.read_bytes()).hexdigest()==link['original_sha256']
          master=json.loads((field/'YAIWES-INTERNAL-SWARM-REGISTRY-V4.json').read_text(encoding='utf-8'))
          cumulative_doc=json.loads((field/'YAIWES-INTERNAL-CUMULATIVE-MANIFEST-V4.json').read_text(encoding='utf-8'))
          assert master['schema']=='yaiwes.internal.swarm-registry/v4.2'
          assert master['component_count']==24 and master['component_runtime_count']==24
          assert master['transformed_files_cumulative']==cumulative
          assert cumulative_doc['component_runtime_count']==24
          assert cumulative_doc['transformed_files_cumulative']==cumulative
          assert runtimes==24 and cumulative>=299
          print('COMPONENTS=24 RUNTIMES=24 TRANSFORMED_CUMULATIVE=',cumulative)
          PY

      - name: Persist internal transformation v4.2
        shell: bash
        run: |
          set -euo pipefail
          find '📂coda workflow persistencias' -type d -name '__pycache__' -prune -exec rm -rf {} +
          find '📂coda workflow persistencias' -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '📂coda workflow persistencias'
          if git diff --cached --quiet; then echo 'NO_CHANGES=1'; exit 0; fi
          git commit -m 'feat(coda): finalize 24 executable internal persistence runtimes v4.2'
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main --depth=1
            git rebase origin/main
          done
          exit 1

      - name: Final readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          echo "TESTED_SHA=$LOCAL"
          echo "PUBLISHED_SHA=$REMOTE"
          test "$LOCAL" = "$REMOTE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          field=Path('📂coda workflow persistencias/🏈 cancha deportiva de fútbol')
          d=json.loads((field/'YAIWES-INTERNAL-SWARM-REGISTRY-V4.json').read_text(encoding='utf-8'))
          assert d['component_count']==24
          assert d['component_runtime_count']==24
          assert d['transformed_files_cumulative']>=299
          print('READBACK_COMPONENTS=24 RUNTIMES=24 TRANSFORMED=',d['transformed_files_cumulative'])
          PY
