name: Yaiwes canonical dataset Math-Shepherd
on:
  workflow_dispatch:
  repository_dispatch: {types: [canonical-dataset-round]}
  push:
    branches: [main]
    paths: ['.github/workflows/canonical-dataset-math-shepherd.yml']
permissions: {contents: write, actions: write}
concurrency: {group: yaiwes-canonical-dataset-math-shepherd, cancel-in-progress: false}
jobs:
  run:
    uses: ./.github/workflows/_canonical-worker.yml
    with: {mode: dataset, slug: Math-Shepherd}
    permissions: {contents: write, actions: write}
