name: Research Download Chain FINAL
run-name: Research Download Chain FINAL • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-download-batch-06.yml'
      - 'scripts/research_download_kernel_batch_06.py'

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_LFS_SKIP_PUSH: "1"
  GIT_LFS_SKIP_DOWNLOAD: "1"
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: research-download-chain-final
  cancel-in-progress: false

jobs:
  download-20-in-queue:
    name: Download 20 repos sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Execute deterministic download chain
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          GIT_LFS_SKIP_PUSH: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config --global filter.lfs.smudge ''
          git config --global filter.lfs.clean ''
          git config --global filter.lfs.process ''
          git config --global filter.lfs.required false
          git config --global core.compression 0
          python3 scripts/research_download_kernel_batch_06.py 'Agente core kernel Yaiwes principal' '_work/kernel-batch-06'
