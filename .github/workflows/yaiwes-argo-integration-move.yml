name: YAIWES Argo Workflows Integration Move

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-argo-integration-move.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows/Argo-Workflows
            Agente Yaiwes principal/execution-orchestration/dag-executor
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Move Argo runtime source only
        shell: bash
        run: |
          set -euo pipefail
          SRC='Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows/Argo-Workflows'
          DST='Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows'
          test ! -e "$DST"
          mkdir -p "$DST"
          for d in workflow pkg util config errors persist; do
            test -d "$SRC/$d"
            mv "$SRC/$d" "$DST/$d"
          done
          for f in go.mod go.sum; do
            test -f "$SRC/$f"
            mv "$SRC/$f" "$DST/$f"
          done
          find "$SRC" -maxdepth 1 -type f -name '*.go' -print0 | while IFS= read -r -d '' f; do mv "$f" "$DST/"; done
          test -f "$DST/workflow/controller/controller.go"
          test -f "$DST/go.mod"
          test -f "$SRC/README.md"
          test ! -e "$SRC/workflow"
          git diff --check
      - name: Add Yaiwes integration contract
        shell: bash
        run: |
          set -euo pipefail
          DST='Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows'
          cat > "$DST/README.md" <<'EOF'
          # YAIWES Wordflow — Argo Workflows
          
          Clasificación: B — orquestador DAG/workflow.
          
          Capacidad integrada: controlador Kubernetes de workflows con reconciliación, workqueues, DAG/templates, sincronización, persistencia y ejecución mediante el código Go movido desde el componente recuperado.
          
          Flujo: `Workflow CRD ➡️ controller/workqueue ➡️ DAG/templates ➡️ executor/pods ➡️ reconcile ➡️ estado/evidencia`.
          
          La conexión con YAIWES es fail-closed mediante `WIRING.json`, `ficha.argo-workflows.v2.json` y `adapter.py`. El README upstream permanece en el origen y no se usa como README del Wordflow.
          EOF
          cat > "$DST/adapter.py" <<'EOF'
          from pathlib import Path
          
          ROOT = Path(__file__).resolve().parent
          
          def source_probe():
              required = [ROOT / 'go.mod', ROOT / 'workflow/controller/controller.go', ROOT / 'pkg/apis/workflow/v1alpha1']
              missing = [str(p) for p in required if not p.exists()]
              if missing:
                  raise RuntimeError({'missing': missing})
              return {'component': 'Argo-Workflows', 'classification': 'B', 'module': 'github.com/argoproj/argo-workflows/v4', 'controller': str((ROOT / 'workflow/controller/controller.go').resolve())}
          
          def runtime_command():
              source_probe()
              return ['go', 'test', './workflow/validate', '-run', '^$']
          EOF
          cat > "$DST/WIRING.json" <<'EOF'
          {
            "component":"Argo-Workflows",
            "classification":"B",
            "adapter":"adapter.py",
            "ficha":"ficha.argo-workflows.v2.json",
            "plugin_bus":"../../../kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py",
            "ficha_contract":"../../../kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py",
            "transport":"stdio",
            "runtime":"go",
            "fail_closed":true,
            "direct_kernel_import":false
          }
          EOF
          cat > "$DST/ficha.argo-workflows.v2.json" <<'EOF'
          {
            "artifact_id":"yaiwes.workflow.argo_workflows","version":"1.0.0","estado":"testing","contract_hash":"","tribunal_case_id":"YAIWES-ARGO-001",
            "contrato":{"rol":"dag_orchestrator","consume":{"datatype":{"family":"workflow","type":"dag_definition","version":1}},"expone":{"datatype":{"family":"workflow","type":"dag_runtime","version":1}},"input_map":{},"output_map":{}},
            "ejecucion":{"kind":"code","transport":"stdio","runtime_type":"compute","entry_point":"adapter:runtime_command","llm_ratio":0.0,"idempotente":true},
            "seguridad":{"sandbox":"process_container","permisos":[],"limites":{"timeout_ms":60000,"deadline_ms":90000}},
            "firma":{"gpg_key_id":"PENDIENTE"},"categoria":"pipeline","etapa":"E",
            "repeticion":{"max":3,"condicion":"si_falla_verificacion"},"repite_en":["VERIFY"],
            "activacion":{"eventos":["yaiwes.dag.requested"],"wake_words":[],"condicion":""},
            "presupuesto":{"n0":{"max_tokens":1,"max_ms":60000,"max_costo_usd":0.000001}},
            "telemetria":{"metricas":["tiempo","errores","workflow","reconcile"],"span_otel":true},
            "evidencia":{"produce":["L1_static","L2_build","L3_repeat"],"destino":"runtime/evidence/"},
            "failover":{"sustituible_por":[],"compensacion":"fail_closed"},"salud":{"metodo":"source_probe","heartbeat_interval_s":30},
            "trazas":{"task_id_requerido":true,"trace_id_requerido":true}
          }
          EOF
          cat > "$DST/verify_integration.py" <<'EOF'
          import json
          from pathlib import Path
          from adapter import source_probe
          
          root = Path(__file__).resolve().parent
          probe = source_probe()
          wiring = json.loads((root/'WIRING.json').read_text())
          ficha = json.loads((root/'ficha.argo-workflows.v2.json').read_text())
          assert wiring['fail_closed'] is True
          assert wiring['direct_kernel_import'] is False
          assert ficha['ejecucion']['llm_ratio'] == 0.0
          assert ficha['contrato']['rol'] == 'dag_orchestrator'
          assert probe['module'] == 'github.com/argoproj/argo-workflows/v4'
          print('ARGO_STATIC_VERIFY_PASS')
          EOF
          python "$DST/verify_integration.py"
      - name: Commit move
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows/Argo-Workflows' 'Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows'
          git diff --cached --check
          git commit -m 'feat(yaiwes): move Argo Workflows runtime into DAG executor'
          git pull --rebase origin main
          git push origin HEAD:main
