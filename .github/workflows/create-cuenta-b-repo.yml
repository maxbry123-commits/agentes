name: create-cuenta-b-repo
on:
  workflow_dispatch:
    inputs:
      owner:
        description: Cuenta B username
        required: true
        default: abc1tienda-web
        type: string
      repo_name:
        description: New repo name
        required: true
        default: memoria-wordflow-1
        type: string
      private:
        description: private repo
        required: true
        default: "true"
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create repo on Cuenta B
        env:
          EXTERNAL_GH_B_TOKEN: ${{ secrets.EXTERNAL_GH_B_TOKEN }}
        run: |
          set -e
          if [ -z "$EXTERNAL_GH_B_TOKEN" ]; then
            echo "FAIL: EXTERNAL_GH_B_TOKEN missing"
            exit 1
          fi
          OWNER="${{ inputs.owner }}"
          NAME="${{ inputs.repo_name }}"
          PRIV="${{ inputs.private }}"
          BODY=$(python3 -c "import json; print(json.dumps({\"name\": \"$NAME\", \"private\": True if \"$PRIV\"==\"true\" else False, \"description\": \"Wordflow Cuenta B software/memory store\", \"auto_init\": True}))")
          CODE=$(curl -sS -o /tmp/gh_out.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $EXTERNAL_GH_B_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            -d "$BODY")
          echo "HTTP $CODE"
          python3 -c "import json; d=json.load(open('/tmp/gh_out.json')); print('full_name', d.get('full_name')); print('html_url', d.get('html_url')); print('message', d.get('message','')); print('errors', d.get('errors',''))"
          if [ "$CODE" != "201" ] && [ "$CODE" != "422" ]; then
            exit 1
          fi
          # 422 = already exists is acceptable
          if [ "$CODE" = "422" ]; then
            echo "NOTE: may already exist — verifying access"
            curl -sS -o /tmp/gh_get.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $EXTERNAL_GH_B_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${OWNER}/${NAME}" | tee /tmp/http2.txt
            echo
            python3 -c "import json; d=json.load(open('/tmp/gh_get.json')); print('OK access', d.get('full_name'), d.get('private'))"
          fi
