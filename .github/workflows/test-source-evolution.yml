name: test-source-evolution
on:
  push:
    paths:
      - 'extensions/source_evolution/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Run source_evolution tests
        run: |
          cd extensions
          python -m unittest discover -s source_evolution/tests -v
