name: Limpieza historial YAIWES (unica vez - no es Wordflow)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  limpiar-historial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Instalar git-filter-repo
        run: |
          set -x
          { pip install --break-system-packages git-filter-repo || pip3 install --break-system-packages git-filter-repo ; } 2>&1 | tee -a /tmp/full_log.txt
          git filter-repo --version 2>&1 | tee -a /tmp/full_log.txt

      - name: Clonar mirror COMPLETO del repo agentes (sin blob:none - el repo real pesa ~47MB, no 16.4GB, no hace falta clon parcial)
        run: |
          set -x
          {
            git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-mirror
            echo "CLONE_EXIT=$?"
            du -sh repo-mirror
            cd repo-mirror && git count-objects -vH && cd ..
          } 2>&1 | tee -a /tmp/full_log.txt

      - name: Filtrar - dejar SOLO las carpetas protegidas
        working-directory: repo-mirror
        continue-on-error: true
        run: |
          set -x
          {
            git filter-repo --force \
              --path "➡️📂 wordflow loop code Yaiwes" \
              --path "Agente Yaiwes principal" \
              --path "Core kernel Yaiwes" \
              --path "Skills agente" \
              --path "Claude notas" \
              --path "Claude readme" \
              --path "Motores" \
              --path "➡️📂motores de descarga extracción copiado movimiento archivos agentes" \
              --path ".gitmodules"
            echo "FILTER_EXIT=$?"
            du -sh .
            git count-objects -vH
          } 2>&1 | tee -a /tmp/full_log.txt

      - name: Push al repo nuevo yaiwes-nucleo-limpio
        working-directory: repo-mirror
        continue-on-error: true
        run: |
          set -x
          {
            git remote add limpio "https://x-access-token:${{ secrets.MAXBRY_123_TOKENS }}@github.com/maxbry123-commits/yaiwes-nucleo-limpio.git"
            git push limpio --mirror
            echo "PUSH_EXIT=$?"
          } 2>&1 | tee -a /tmp/full_log.txt

      - name: Checkout agentes (sparse) para dejar evidencia
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Claude notas
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          path: agentes-evidencia

      - name: Commitear evidencia real (log completo, exito o fallo) de vuelta al repo agentes
        if: always()
        run: |
          mkdir -p "agentes-evidencia/Claude notas/evidencia_runs"
          if [ -f /tmp/full_log.txt ]; then
            cp /tmp/full_log.txt "agentes-evidencia/Claude notas/evidencia_runs/limpieza_historial_${{ github.run_id }}.txt"
          else
            echo "NO SE GENERO NINGUN LOG - fallo en el paso Set up job o antes" > "agentes-evidencia/Claude notas/evidencia_runs/limpieza_historial_${{ github.run_id }}.txt"
          fi
          cd agentes-evidencia
          git config user.name "yaiwes-cleanup-bot"
          git config user.email "ci@yaiwes.local"
          git add "Claude notas/evidencia_runs" || true
          git commit -m "ci: evidencia real (log completo) limpieza historial run ${{ github.run_id }}" || echo "nada que commitear"
          git push || echo "push evidencia fallo, queda en el artifact/log del run"
