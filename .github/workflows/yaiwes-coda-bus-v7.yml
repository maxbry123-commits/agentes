name: YAIWES CODA Bus V7 + V8 Durable + V9 Hybrid

on:
  push:
    branches:
      - main
      - yaiwes-coda-v7
      - yaiwes-coda-v7-research-adapter
      - yaiwes-hive-v9-close-step3
    paths:
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_bus_v7.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_bus_v7.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_research_gate_v71.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_research_gate_v71.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_persistence_v8.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_bus_v8.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_bus_v8.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_hybrid_v9.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_hybrid_v9.py'
      - '📂coda workflow persistencias/Fables enchufe universal/README-YAIWES-HIVE-GLOBAL.md'
      - '📂coda workflow persistencias/Fables enchufe universal/YAIWES-HANDOFF-V9.json'
      - '.github/workflows/yaiwes-coda-bus-v7.yml'
  pull_request:
    branches:
      - main
    paths:
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_bus_v7.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_bus_v7.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_research_gate_v71.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_research_gate_v71.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_persistence_v8.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_bus_v8.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_bus_v8.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_coda_hybrid_v9.py'
      - '📂coda workflow persistencias/Fables enchufe universal/test_yaiwes_coda_hybrid_v9.py'
      - '📂coda workflow persistencias/Fables enchufe universal/README-YAIWES-HIVE-GLOBAL.md'
      - '📂coda workflow persistencias/Fables enchufe universal/YAIWES-HANDOFF-V9.json'
      - '.github/workflows/yaiwes-coda-bus-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coda-bus-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            📂coda workflow persistencias/Fables enchufe universal
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile CODA bus, research gate, durable V8 and hybrid V9
        working-directory: '📂coda workflow persistencias/Fables enchufe universal'
        run: >-
          python -m py_compile
          yaiwes_coda_bus_v7.py
          test_yaiwes_coda_bus_v7.py
          yaiwes_coda_research_gate_v71.py
          test_yaiwes_coda_research_gate_v71.py
          yaiwes_coda_persistence_v8.py
          yaiwes_coda_bus_v8.py
          test_yaiwes_coda_bus_v8.py
          yaiwes_coda_hybrid_v9.py
          test_yaiwes_coda_hybrid_v9.py
      - name: Validate V9 activation handoff JSON
        working-directory: '📂coda workflow persistencias/Fables enchufe universal'
        run: python -m json.tool YAIWES-HANDOFF-V9.json >/dev/null
      - name: Run CODA bus, research gate, durable V8 and hybrid V9 unit tests
        working-directory: '📂coda workflow persistencias/Fables enchufe universal'
        run: >-
          python -m unittest -v
          test_yaiwes_coda_bus_v7.py
          test_yaiwes_coda_research_gate_v71.py
          test_yaiwes_coda_bus_v8.py
          test_yaiwes_coda_hybrid_v9.py
