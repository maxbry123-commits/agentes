name: Skill Remove Audit 02
run-name: Skill Remove Audit 02 • ${{ github.sha }}

on:
  push:
    paths:
      - '.github/workflows/skill-remove-audit-02.yml'

permissions:
  contents: write

concurrency:
  group: skill-github-action-remove-audit-02
  cancel-in-progress: false

jobs:
  remove-residual-audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove residual auditor/watchdog/sentinel references through Contents API
        shell: bash
        run: |
          set -euo pipefail
          API_PATH='repos/${{ github.repository }}/contents/skills/skills%20Github%20acci%C3%B3n/SKILL.md'
          gh api "$API_PATH" > /tmp/skill.json
          python3 - <<'PY'
          import base64, json, re
          from pathlib import Path
          d=json.loads(Path('/tmp/skill.json').read_text())
          text=base64.b64decode(d['content']).decode('utf-8')
          replacements={
            'No permitas que Repair Guardian, Watchdog verificador, Sentinel y Supervisor despachen reparaciones simultáneamente para el mismo `repository + branch + destination_root`.':'No permitas que múltiples autoridades despachen reparaciones simultáneamente para el mismo `repository + branch + destination_root`.',
            '5. No uses simultáneamente auto-dispatch del Repair Guardian y dispatch del Watchdog para la misma cadena.':'5. No uses simultáneamente múltiples fuentes de dispatch para la misma cadena.',
            '### Watchdog de runs >24 h':'### Control de runs >24 h',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'SKILL_STRUCTURE_GAP: missing {old[:60]}')
              text=text.replace(old,new)
          text=re.sub(r'(?im)^.*\b(?:auditor(?:ía)?|auditar|watchdog|sentinel)\b.*\n?', '', text)
          if re.search(r'(?i)auditor|auditoría|auditar|watchdog|sentinel', text):
              raise SystemExit('AUDIT_REMOVAL_GAP: residual token')
          Path('/tmp/SKILL.md').write_text(text, encoding='utf-8')
          Path('/tmp/sha').write_text(d['sha'])
          PY
          SHA=$(cat /tmp/sha)
          CONTENT=$(base64 -w0 /tmp/SKILL.md)
          gh api --method PUT "$API_PATH" \
            -f message='fix(skill): remove residual audit references' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main'
