name: YAIWES Materialize Remaining Components TEMP

on:
  push:
    paths:
      - '.github/workflows/_yaiwes-materialize-remaining-temp.yml'

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3
          lfs: false

      - name: Clone exact verified commits
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yaiwes-five"
          mkdir -p "$root"
          clone_pin() {
            name="$1"; url="$2"; sha="$3"
            dst="$root/$name"
            git init -q "$dst"
            git -C "$dst" remote add origin "$url"
            git -C "$dst" fetch --depth=1 --no-tags origin "$sha"
            git -C "$dst" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dst" rev-parse HEAD)" = "$sha"
            if git -C "$dst" ls-files -s | awk '$1==160000 {found=1} END{exit !found}'; then exit 71; fi
          }
          clone_pin omarchy https://github.com/omacom/omarchy.git 9c5482c58dbe4974de337450754885083c91eada
          clone_pin anydoc https://github.com/firecrawl/anydoc.git 261fc257d17c3eab0f673be31c408fd9fdc2171a
          clone_pin anthropic https://github.com/anthropics/skills.git 34040c9c568585f6929bedeaad110ad08f079624

      - name: Materialize exact trees and validate
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yaiwes-five"
          mkdir -p 'Core kernel Yaiwes/omarchy' 'Core kernel Yaiwes/anydoc' 'Skills agente/skill-design-anthropic'
          rsync -a --delete --exclude='/.git/' "$root/omarchy/" 'Core kernel Yaiwes/omarchy/'
          rsync -a --delete --exclude='/.git/' "$root/anydoc/" 'Core kernel Yaiwes/anydoc/'
          rsync -a --delete --exclude='/.git/' "$root/anthropic/" 'Skills agente/skill-design-anthropic/'
          test "$(git -C "$root/omarchy" rev-parse HEAD)" = '9c5482c58dbe4974de337450754885083c91eada'
          test "$(git -C "$root/anydoc" rev-parse HEAD)" = '261fc257d17c3eab0f673be31c408fd9fdc2171a'
          test "$(git -C "$root/anthropic" rev-parse HEAD)" = '34040c9c568585f6929bedeaad110ad08f079624'
          test -z "$(rsync -ani --delete --exclude='/.git/' "$root/omarchy/" 'Core kernel Yaiwes/omarchy/')"
          test -z "$(rsync -ani --delete --exclude='/.git/' "$root/anydoc/" 'Core kernel Yaiwes/anydoc/')"
          test -z "$(rsync -ani --delete --exclude='/.git/' "$root/anthropic/" 'Skills agente/skill-design-anthropic/')"
          grep -F '"slug": "Omarchy", "source": "https://github.com/omacom/omarchy.git", "source_commit": "9c5482c58dbe4974de337450754885083c91eada", "status": "COMPLETE"' 'Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          grep -F '"slug": "Anydoc", "source": "https://github.com/firecrawl/anydoc.git", "source_commit": "261fc257d17c3eab0f673be31c408fd9fdc2171a", "status": "COMPLETE"' 'Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          grep -F '"slug": "Skill Design de Anthropic", "source": "https://github.com/anthropics/skills.git", "source_commit": "34040c9c568585f6929bedeaad110ad08f079624", "status": "COMPLETE"' 'Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          test -f 'Skills agente/skill-design-anthropic/skills/skill-creator/SKILL.md'
          grep -F 'name: skill-creator' 'Skills agente/skill-design-anthropic/skills/skill-creator/SKILL.md'
          echo 'SOURCE_COMMIT_EQUALS_DOWNLOADED_COMMIT=PASS_3_OF_3'
          echo 'DESTINATION_TREE_EQUALS_VERIFIED_SOURCE=PASS_3_OF_3'

      - name: Publish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          self='.github/workflows/_yaiwes-materialize-remaining-temp.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'Core kernel Yaiwes/omarchy' 'Core kernel Yaiwes/anydoc' 'Skills agente/skill-design-anthropic'
          git rm -- "$self"
          git commit -m 'download(yaiwes): materialize verified Omarchy Anydoc Anthropic skills'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"

# trigger-existing-workflow
