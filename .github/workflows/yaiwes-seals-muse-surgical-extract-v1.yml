name: YAIWES Seals Muse Surgical Extract V1
on:
  push:
    paths:
      - '.github/workflows/yaiwes-seals-muse-surgical-extract-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yaiwes-seals-muse-surgical-extract-v1
  cancel-in-progress: false
jobs:
  extract-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Core kernel Yaiwes/Download code Yaiwes/Muse-Agent_0001.zip
            /Core kernel Yaiwes/Download code Yaiwes/MUSE-KnowledgeXLab_0001.zip
            /Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl
            /Seals team YAIWES/_fuentes_extraidas/
            /📂 Bitácora stated JSON Craxy wall.json

      - name: STEP2_EXTRACT five exact files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          BASE="$(git rev-parse HEAD)"
          export BASE
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          manifest={}
          mp=Path('Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl')
          for line in mp.read_text(encoding='utf-8').splitlines():
              if line.strip():
                  row=json.loads(line); manifest[row['slug']]=row

          specs={
            'Muse-Agent': {
              'slug':'Muse-Agent',
              'zip':'Core kernel Yaiwes/Download code Yaiwes/Muse-Agent_0001.zip',
              'url':'https://github.com/wlsdks/muse-agent.git',
              'commit':'c55ed22dd436a1a1d708905293bc3c06128fb6f3',
              'files':{
                'packages/agent-core/src/plan-execute-loop.ts':'e670d6dcc2ad6d158d9115160a3c2f2b2ea2e9fd',
                'packages/agent-core/src/checkpoint.ts':'60e6986831650039e5367fffb46ef0ff8c608722',
              },
            },
            'MUSE-KnowledgeXLab': {
              'slug':'MUSE-KnowledgeXLab',
              'zip':'Core kernel Yaiwes/Download code Yaiwes/MUSE-KnowledgeXLab_0001.zip',
              'url':'https://github.com/KnowledgeXLab/MUSE.git',
              'commit':'63f98aaa5cd12542431308753f016ec558b392c5',
              'files':{
                'agent.py':'7799282268700e0d11a2d01ca4aad29c458bcf45',
                'monitor.py':'6c1316c16920a4e623b886c1fcc03a6dcab7fc62',
                'memory_manager.py':'633bcf37c0b7abd17501028ad7df7b24f0c279c7',
              },
            },
          }
          def blob_sha(data):
              h=hashlib.sha1(); h.update(f'blob {len(data)}\0'.encode()); h.update(data); return h.hexdigest()

          root=Path('Seals team YAIWES/_fuentes_extraidas')
          evidence={'schema':'yaiwes.seals.surgical-extraction/v1','mode':'FAIL_CLOSED_STRICT_3_STEPS','repo_full_copy':False,'architecture_decision':False,'adaptation_performed':False,'sources':[]}
          for label,s in specs.items():
              row=manifest.get(s['slug'])
              if not row: raise SystemExit('MANIFEST_MISSING:'+s['slug'])
              if row.get('source')!=s['url'] or row.get('source_commit')!=s['commit']:
                  raise SystemExit('PROVENANCE_MISMATCH:'+s['slug'])
              zp=Path(s['zip'])
              if not zp.is_file(): raise SystemExit('ZIP_MISSING:'+str(zp))
              out=root/label; out.mkdir(parents=True,exist_ok=True)
              (out/'SOURCE_URL.txt').write_text(s['url']+'\n',encoding='utf-8')
              (out/'SOURCE_COMMIT.txt').write_text(s['commit']+'\n',encoding='utf-8')
              src={'label':label,'source_zip':str(zp),'source_zip_sha256':hashlib.sha256(zp.read_bytes()).hexdigest(),'source_url':s['url'],'source_commit':s['commit'],'files':[]}
              with zipfile.ZipFile(zp) as z:
                  names=[n for n in z.namelist() if not n.endswith('/')]
                  for rel,expected in s['files'].items():
                      matches=[n for n in names if n==rel or n.endswith('/'+rel)]
                      if len(matches)!=1: raise SystemExit(f'ZIP_ENTRY_GAP:{label}:{rel}:{len(matches)}')
                      data=z.read(matches[0]); actual=blob_sha(data)
                      if actual!=expected: raise SystemExit(f'BLOB_MISMATCH:{label}:{rel}:{actual}:{expected}')
                      dest=out/rel; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
                      src['files'].append({'source_relative_path':rel,'archive_entry':matches[0],'destination_path':str(dest),'git_blob_sha':actual,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              evidence['sources'].append(src)
          (root/'EXTRACTION_EVIDENCE_MUSE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          total=sum(len(s['files']) for s in evidence['sources'])
          if total!=5: raise SystemExit(f'EXACT_FIVE_REQUIRED:{total}')
          print('STEP2_CONTENT_PASS exact_files=5')
          PY
          git add --sparse -- 'Seals team YAIWES/_fuentes_extraidas'
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          bad=[p for p in paths if not p.startswith('Seals team YAIWES/_fuentes_extraidas/')]
          if bad: raise SystemExit('OUT_OF_SCOPE_STAGE:'+repr(bad))
          code=[p for p in paths if p.endswith(('.ts','.py'))]
          if len(code)!=5: raise SystemExit(f'EXACT_FIVE_CODE_FILES_STAGE_REQUIRED:{len(code)}:{code}')
          print('STEP2_SCOPE_PASS',len(paths),'staged')
          PY
          git commit -m 'seals: extract five Muse loop-state sources only'
          EXTRACT_COMMIT="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo STALE_LOCK_GAP_STEP2; exit 42; }
          git push origin HEAD:main
          echo "STEP2_EXTRACT_PASS commit=$EXTRACT_COMMIT"

      - name: STEP3_REPORT Crazy Wall fresh
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          BASE="$(git rev-parse HEAD)"
          export BASE
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          wp=Path('📂 Bitácora stated JSON Craxy wall.json')
          ep=Path('Seals team YAIWES/_fuentes_extraidas/EXTRACTION_EVIDENCE_MUSE.json')
          wall=json.loads(wp.read_text(encoding='utf-8')); ev=json.loads(ep.read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          summaries={
            'Muse-Agent':{
              'task_completion_to_next':'executePlanExecuteLoop executes the current planned task, records successful task IDs as completed, filters completedTaskIds from replans, and continues unresolved tasks until an explicit stop/cancel/completed/max-replan/no-work condition.',
              'state_between_tasks':'checkpoint.ts defines checkpoint snapshots and completedTasks; FileAgentCheckpointStore persists and reloads the checkpoint so completed task IDs/results survive between loop iterations or resume.',
            },
            'MUSE-KnowledgeXLab':{
              'task_completion_to_next':'MUSE._run loops while to_do_subtasks is non-empty, pops the next subtask, executes/reflection-retries it, records it done, updates memory, replans, then continues with the remaining/new tasks.',
              'state_between_tasks':'Monitor keeps done_subtasks plus per-subtask finish/try_times/trajectory/reflection; MemoryManager carries trajectory history and persists tool/procedural/strategic memory and overall state JSON.',
            },
          }
          report={'report_id':'SEALS-MUSE-SURGICAL-EXTRACTION-V1','at':now,'actor':'SOL GPT','mode':'FAIL_CLOSED_STRICT_3_STEPS','status':'STEP3_REPORT_COMPLETE','extraction_commit':os.environ['BASE'],'repo_full_copy':False,'architecture_decision':False,'adaptation_performed':False,'destination_root':'Seals team YAIWES/_fuentes_extraidas/','sources':[]}
          for s in ev['sources']:
              report['sources'].append({**s,'mechanism_summary':summaries[s['label']],'adaptation':'NONE'})
          reports=wall.setdefault('seals_team_yaiwes_extraction_reports',[])
          reports[:]=[r for r in reports if r.get('report_id')!=report['report_id']]
          reports.append(report); wall['updated_at']=now
          wp.write_text(json.dumps(wall,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('STEP3_REPORT_PREPARED sources=2 files=5')
          PY
          git add --sparse -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'crazy-wall: report Seals Muse surgical extraction'
          REPORT_COMMIT="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo STALE_LOCK_GAP_STEP3; exit 42; }
          git push origin HEAD:main
          echo "STEP3_REPORT_PASS commit=$REPORT_COMMIT"

      - name: Final readback evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('Seals team YAIWES/_fuentes_extraidas')
          ev=json.loads((root/'EXTRACTION_EVIDENCE_MUSE.json').read_text(encoding='utf-8'))
          def bsha(data):
              h=hashlib.sha1(); h.update(f'blob {len(data)}\0'.encode()); h.update(data); return h.hexdigest()
          n=0
          for s in ev['sources']:
              for f in s['files']:
                  data=Path(f['destination_path']).read_bytes()
                  assert bsha(data)==f['git_blob_sha']
                  assert hashlib.sha256(data).hexdigest()==f['sha256']
                  n+=1
          wall=json.loads(Path('📂 Bitácora stated JSON Craxy wall.json').read_text(encoding='utf-8'))
          r=[x for x in wall.get('seals_team_yaiwes_extraction_reports',[]) if x.get('report_id')=='SEALS-MUSE-SURGICAL-EXTRACTION-V1']
          assert n==5 and len(r)==1 and r[0]['status']=='STEP3_REPORT_COMPLETE'
          print('FINAL_READBACK_PASS files=5 report=1')
          print('FINAL_SHA',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
