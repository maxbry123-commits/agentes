name: YAIWES CODA V5 Fast Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-coda-v5-hotfix-fast.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-coda-v5-hotfix-fast
  cancel-in-progress: false

jobs:
  hotfix-fast:
    runs-on: ubuntu-24.04
    steps:
      - name: Sparse checkout repair scope
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/yaiwes_internal_surgical_transform_v5.py
            /.github/workflows/yaiwes-coda-v5-hotfix.yml
            /.github/workflows/yaiwes-coda-v5-hotfix-fast.yml

      - name: Patch and compile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/yaiwes_internal_surgical_transform_v5.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(lines) if line.strip() == 'if ext == ".sh":']
          if len(hits) != 1:
              raise SystemExit(f'EXPECTED_ONE_SH_BRANCH:{len(hits)}')
          i = hits[0]
          lines[i + 1] = "        return f'#!/usr/bin/env bash\\nset -euo pipefail\\nprintf \\'%s\\\\n\\' \\'{{\"schema\":\"yaiwes.internal.persistence/v5\",\"source_id\":\"{sid}\",\"status\":\"CHECKPOINTED\"}}\\' >> .yaiwes_internal_state.jsonl\\n'"
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/yaiwes_internal_surgical_transform_v5.py

      - name: Persist and clean temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/yaiwes_internal_surgical_transform_v5.py
          git rm -f .github/workflows/yaiwes-coda-v5-hotfix.yml .github/workflows/yaiwes-coda-v5-hotfix-fast.yml
          git commit -m 'fix(coda): repair v5 generator syntax'
          git push origin HEAD:main
