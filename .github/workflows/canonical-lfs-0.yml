    branches: [main]
    paths: ['.github/workflows/canonical-lfs-0.yml']
permissions: {contents: write, actions: write}
concurrency: {group: yaiwes-canonical-lfs-0, cancel-in-progress: false}
jobs:
  run:
    uses: ./.github/workflows/_canonical-worker.yml
    with: {mode: lfs, shard_index: 0, shard_count: 3}
    permissions: {contents: write, actions: write}
