name: YAIWES SOL2 Agno STEP1 STEP2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol2-agno-step1-step2.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol2-agno-step1-step2
  cancel-in-progress: false

jobs:
  integrate_agno:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      SRC: 'Core kernel Yaiwes/Componentes recuperados B/Agno'
      DST: 'Agente Yaiwes principal/agent-fleet-parallelism/agno'
      MOTOR: '➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py'
    steps:
      - name: Checkout Agno integration surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 4
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-sol2-agno-step1-step2.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Core kernel Yaiwes/Componentes recuperados B/Agno/
            /Agente Yaiwes principal/agent-fleet-parallelism/
            /➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py

      - name: Register SOL2 Agno STEP1 PASS and claim STEP2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          wall_path=os.environ['WALL']; inv_path=os.environ['INVENTORY']
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(wall_path,encoding='utf-8') as f: data=json.load(f)
          with open(inv_path,encoding='utf-8') as f: inv=json.load(f)
          comp=next((c for c in inv.get('components',[]) if c.get('name')=='Agno'),None)
          if comp is None: raise SystemExit('AGNO_NOT_IN_INVENTORY')
          existing=next((n for n in data.get('nodes',[]) if n.get('component')=='Agno'),None)
          if existing is not None:
              raise SystemExit(f"AGNO_ALREADY_REGISTERED:{existing.get('id')}:{existing.get('owner')}:{existing.get('lock')}:{existing.get('status')}")
          if comp.get('wall_node_id') is not None:
              raise SystemExit(f"AGNO_INVENTORY_ALREADY_BOUND:{comp.get('wall_node_id')}")
          regs=data.setdefault('registrations',[])
          if not any(r.get('name')=='SOL integración 2' and r.get('status')=='ACTIVE' for r in regs):
              regs.append({'name':'SOL integración 2','role':'integration_worker','status':'ACTIVE','scope':'physical_inventory_strict_3_steps','registered_at':now})
          next_id=max([int(n.get('id',0)) for n in data.get('nodes',[])] or [0])+1
          node={
            'id':next_id,'component':'Agno','source':'Core kernel Yaiwes/Componentes recuperados B/Agno/',
            'current_step':2,'status':'PENDING_STEP2','abc':'B',
            'target':'Agente Yaiwes principal/agent-fleet-parallelism/agno/',
            'owner':'SOL','lock':'CLAIMED',
            'checkpoint':{
              'before':f'{now} SOL integración 2 STEP2 claim after STEP1 PASS: immutable Motor4 9a21facfe11327cf60a2afca8f415ad52f0ecbe5; Agno source -> agent-fleet-parallelism/agno',
              'after':'STEP1 PASS: Agno README defines framework + AgentOS runtime for agent platforms, APIs, storage, scheduling/background jobs, observability and security; classified B motor de trabajo; target agent-fleet-parallelism/agno/'
            },
            'evidence':['worker:SOL integración 2','step1:readme_blob:2813f35fa7620ff7d95465d853d7b0a6ee2c00b4','step1:classification:B','step1:target:Agente Yaiwes principal/agent-fleet-parallelism/agno/','step1:reason:agent-platform framework/runtime + AgentOS + scheduling/background jobs'],
            'history':[
              {'at':now,'actor':'SOL','label':'SOL integración 2','event':'CLAIM_STEP1_USER_REACTIVATION'},
              {'at':now,'actor':'SOL','label':'SOL integración 2','event':'STEP1_PASS_RELEASE'},
              {'at':now,'actor':'SOL','label':'SOL integración 2','event':'CLAIM_STEP2'}
            ],
            'next_action':'STEP_2_MOVE_WITH_CANONICAL_MOTOR'
          }
          data.setdefault('nodes',[]).append(node)
          loop=data.setdefault('sol_loop_persistence',{}); workers=loop.setdefault('workers',[])
          if 'SOL_2' not in workers: workers.append('SOL_2')
          loop['updated_at']=now; data['updated_at']=now
          comp['wall_node_id']=next_id; comp['wall_status']='PENDING_STEP2'; comp['wall_current_step']=2; comp['wall_target']=node['target']
          with open(wall_path,'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          with open(inv_path,'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2); f.write('\n')
          print(f'AGNO_NODE_ID={next_id}')
          PY
            git add -- "$WALL" "$INVENTORY"
            git commit -m 'crazy-wall: SOL integración 2 Agno STEP1 PASS claim STEP2'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Verify immutable Motor4 SHA and claim read-back
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f "$MOTOR"
          test "$(git hash-object "$MOTOR")" = '9a21facfe11327cf60a2afca8f415ad52f0ecbe5'
          python3 - <<'PY'
          import json,os
          with open(os.environ['WALL'],encoding='utf-8') as f: d=json.load(f)
          n=next(x for x in d['nodes'] if x.get('component')=='Agno')
          assert n['owner']=='SOL' and n['lock']=='CLAIMED' and n['current_step']==2 and n['status']=='PENDING_STEP2',n
          print('AGNO_STEP2_CLAIM_READBACK=PASS')
          PY
          echo MOTOR4_SHA=PASS

      - name: Execute canonical Motor4 MOVE Agno
        id: motor
        shell: bash
        run: |
          set -u
          if [ ! -d "$SRC" ] && [ -d "$DST" ]; then
            echo 'motor_rc=0' >> "$GITHUB_OUTPUT"; echo 'motor_tail=MOVE_ALREADY_CANONICAL' >> "$GITHUB_OUTPUT"; exit 0
          fi
          test -d "$SRC" || { echo 'motor_rc=2' >> "$GITHUB_OUTPUT"; echo 'motor_tail=SOURCE_DIR_NOT_FOUND' >> "$GITHUB_OUTPUT"; exit 0; }
          mkdir -p "$DST"
          export SOURCE_DIR="$SRC" DEST_DIR="$DST" STATE_FILE='/tmp/yaiwes-sol2-agno-motor4.json' BATCH_SIZE=100 COLLISION_POLICY=fail
          set +e
          python3 "$MOTOR" >/tmp/motor4-agno.log 2>&1
          rc=$?
          set -e
          cat /tmp/motor4-agno.log
          tail_line="$(tail -n 1 /tmp/motor4-agno.log | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-500)"
          echo "motor_rc=$rc" >> "$GITHUB_OUTPUT"; echo "motor_tail=$tail_line" >> "$GITHUB_OUTPUT"

      - name: Publish Agno Motor4 MOVE
        id: publish
        if: steps.motor.outputs.motor_rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "$SRC" "$DST"
          if ! git diff --cached --quiet; then git commit -m 'move(yaiwes): Motor4 MOVE Agno to agent-fleet-parallelism/agno'; fi
          ok=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; sleep $((attempt*3))
          done
          test "$ok" -eq 1
          echo "move_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read-back Agno MOVE
        if: steps.motor.outputs.motor_rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git ls-tree -r --name-only origin/main -- "$SRC")"
          test -n "$(git ls-tree -r --name-only origin/main -- "$DST")"
          echo AGNO_MOVE_READBACK=PASS

      - name: Checkpoint Agno STEP2 PASS or GAP and release
        shell: bash
        env:
          MOTOR_RC: ${{ steps.motor.outputs.motor_rc }}
          MOTOR_TAIL: ${{ steps.motor.outputs.motor_tail }}
          MOVE_COMMIT: ${{ steps.publish.outputs.move_commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          wall_path=os.environ['WALL']; inv_path=os.environ['INVENTORY']; rc=int(os.environ.get('MOTOR_RC') or 99)
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(wall_path,encoding='utf-8') as f: d=json.load(f)
          n=next(x for x in d['nodes'] if x.get('component')=='Agno')
          if n.get('owner')!='SOL' or n.get('lock')!='CLAIMED' or n.get('current_step')!=2: raise SystemExit(f"LOCK_OR_STEP_CHANGED:{n}")
          if rc==0:
            n['current_step']=3; n['status']='PASS_STEP2'; n['checkpoint']['after']=f"STEP2 PASS: canonical Motor4 MOVE; source absent target populated; run={os.environ['GITHUB_RUN_ID']}; move_commit={os.environ.get('MOVE_COMMIT')}"
            for item in ['step2:motor4_blob:9a21facfe11327cf60a2afca8f415ad52f0ecbe5',f"step2:run:{os.environ['GITHUB_RUN_ID']}",f"step2:move_commit:{os.environ.get('MOVE_COMMIT')}",'step2:readback:origin/main source absent target populated']:
              if item not in n['evidence']: n['evidence'].append(item)
            n['history'].append({'at':now,'actor':'SOL','label':'SOL integración 2','event':'STEP2_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ.get('MOVE_COMMIT')}); n['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'
          else:
            tail=(os.environ.get('MOTOR_TAIL') or 'NO_OUTPUT')[:500]; n['status']='GAP_STEP2'; n['checkpoint']['after']=f'STEP2 GAP Motor4 rc={rc}: {tail}'; n['evidence'].append(f"step2:gap:run:{os.environ['GITHUB_RUN_ID']}:rc={rc}:{tail}"); n['history'].append({'at':now,'actor':'SOL','label':'SOL integración 2','event':'STEP2_GAP_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])}); n['next_action']='REPAIR_EXACT_STEP2_GAP_AND_RETRY'
          n['owner']=None; n['lock']='FREE'; d['updated_at']=now
          with open(inv_path,encoding='utf-8') as f: inv=json.load(f)
          c=next(x for x in inv['components'] if x.get('name')=='Agno'); c['wall_node_id']=n['id']; c['wall_status']=n['status']; c['wall_current_step']=n['current_step']; c['wall_target']=n['target']
          with open(wall_path,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          with open(inv_path,'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL" "$INVENTORY"; git commit -m "crazy-wall: SOL integración 2 Agno STEP2 checkpoint run $GITHUB_RUN_ID"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Fail closed on Motor4 GAP
        if: steps.motor.outputs.motor_rc != '0'
        run: exit 1
