name: YAIWES AWS Step Functions Verify

on:
  push:
    paths:
      - 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk/**'
      - 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/**'
      - '.github/workflows/yaiwes-aws-stepfunctions-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Agente Yaiwes principal/execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk
            Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Compile repaired core and integration surface
        run: |
          python -m py_compile \
            'Agente Yaiwes principal/execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk/stepfunctions/steps/states.py' \
            'Agente Yaiwes principal/execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk/stepfunctions/workflow/stepfunctions.py' \
            'Agente Yaiwes principal/execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk/adapter.py' \
            'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py' \
            'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      - name: Run X-Ray integration verification ten times
        run: |
          for i in $(seq 1 10); do
            echo "YAIWES AWS Step Functions verification pass $i/10"
            python -m pytest -q \
              'Agente Yaiwes principal/execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk/verification/test_yaiwes_integration.py'
          done
