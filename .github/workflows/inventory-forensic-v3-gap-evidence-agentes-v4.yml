name: inventory-forensic-v3-gap-evidence-agentes-v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-gap-evidence-agentes-v4.yml"

permissions:
  contents: read

jobs:
  collect_gap_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
      - name: Collect manifests and direct ZIP trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-v3-gap
          git show 'HEAD:Agente core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl' > audit-v3-gap/manifest-agente.jsonl
          git show 'HEAD:Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl' > audit-v3-gap/manifest-download-yaiwes.jsonl
          git show 'HEAD:Download code/archivos/RESEARCH_DOWNLOAD_MANIFEST.jsonl' > audit-v3-gap/manifest-download-archivos.jsonl
          git show 'HEAD:core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl' > audit-v3-gap/manifest-core.jsonl
          git ls-tree -l -z 'HEAD:Agente core kernel Yaiwes principal' | tr '\0' '\n' > audit-v3-gap/tree-agente.txt
          git ls-tree -l -z 'HEAD:Download code Yaiwes' | tr '\0' '\n' > audit-v3-gap/tree-download-yaiwes.txt
          git ls-tree -l -z 'HEAD:Download code/archivos' | tr '\0' '\n' > audit-v3-gap/tree-download-archivos.txt
          git ls-tree -l -z 'HEAD:core kernel Yaiwes principal' | tr '\0' '\n' > audit-v3-gap/tree-core.txt
          printf '{"schema":"YAIWES-INVENTORY-INDEXES-V3-GAP-EVIDENCE","repository":"%s","run_id":"%s","base_run":33699624351}\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > audit-v3-gap/evidence.json
          printf '# GAP evidence V3 — agentes\n\n- Base audit: 33699624351\n- Scope: non-PASS rows only\n- Manifests: 4\n- Direct directory trees: 4\n' > audit-v3-gap/evidence.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-gap-evidence-agentes-v4
          path: audit-v3-gap/
          if-no-files-found: error
          retention-days: 30
