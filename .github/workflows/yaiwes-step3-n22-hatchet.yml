name: YAIWES STEP3 N22 Hatchet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-step3-n22-hatchet.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-step3-n22-hatchet
  cancel-in-progress: false

jobs:
  wire_microtest_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      TARGET: 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet'
      ADAPTER: 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/yaiwes/hatchet_adapter.py'
      FICHA: 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/yaiwes/ficha.hatchet.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
      SDK: 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/sdks/python'
      HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: 'false'
    steps:
      - name: Checkout only N22 STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 4
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-step3-n22-hatchet.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py
            /Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/yaiwes/
            /Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/sdks/python/

      - name: Fail closed on lock or canonical bus drift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open(os.environ['WALL'], encoding='utf-8') as f:
              wall=json.load(f)
          node=next(n for n in wall['nodes'] if n['id']==22)
          assert node.get('owner')=='SOL', node
          assert node.get('lock')=='CLAIMED', node
          assert node.get('current_step')==3, node
          assert node.get('component')=='Hatchet', node
          print('N22_LOCK_STEP3_OK')
          PY
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          echo CANONICAL_FABLES_BUS_OK

      - name: Install Hatchet SDK from moved target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "$SDK"

      - name: Enchufe Universal plus real embedded DAG microtest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root=Path.cwd()
          adapter_path=root/os.environ['ADAPTER']
          ficha_path=root/os.environ['FICHA']
          bus_path=root/os.environ['BUS']
          bus_dir=bus_path.parent
          source=adapter_path.read_text(encoding='utf-8')
          manifest=json.loads(ficha_path.read_text(encoding='utf-8'))
          actual='sha256:'+hashlib.sha256(source.encode()).hexdigest()
          assert actual==manifest['contract_hash'], (actual, manifest['contract_hash'])

          sys.path.insert(0, str(bus_dir))
          import universal_plugin_bus_v2_integrated as bus_mod

          bus=bus_mod.UniversalPluginBus()
          bus.add_tribunal_approval(manifest['tribunal_case_id'])
          candidate=bus_mod.ComponentCandidate(source, 'python', [os.environ['ADAPTER']])
          conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest, candidate, conventions, registered_by='SOL integración 1')
          assert reg.status==bus_mod.PluginStatus.ACTIVE
          assert reg.plugin_id=='yaiwes.orchestration.hatchet'
          bus.health.heartbeat(reg.plugin_id)
          assert bus.check_plugin_health(reg.plugin_id)

          spec=importlib.util.spec_from_file_location('yaiwes_hatchet_n22', adapter_path)
          assert spec and spec.loader
          adapter=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(adapter)
          result=adapter.run_microtest(root)
          assert result['status']=='PASS', result
          assert result['result']['double']=={'value':40}, result
          assert result['result']['plus_one']=={'value':41}, result

          bus.evidence.collect(reg.plugin_id, bus_mod.EvidenceLevel.L3, {'microtest':result})
          bus.evidence.collect(reg.plugin_id, bus_mod.EvidenceLevel.L4, {'capability':'embedded_two_task_dag','verified':True})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]
          assert 'L2_build' in levels and 'L3_runtime' in levels and 'L4_feature' in levels, levels

          ev={
              'node':22,
              'worker':'SOL integración 1',
              'status':'PASS',
              'route':'UniversalPluginBus/FABLES -> Hatchet adapter -> embedded engine -> worker -> DAG(double -> plus_one)',
              'plugin_id':reg.plugin_id,
              'microtest':'embedded_two_task_dag',
              'input':20,
              'result':result['result'],
              'evidence_levels':levels,
              'run':int(os.environ['GITHUB_RUN_ID']),
              'runner_commit':os.environ['GITHUB_SHA'],
              'adapter_sha256':actual,
              'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f',
              'canonical_ficha_code_blob':'a72508027cc2458553ef6a2255a9aa33d9a77a21',
              'prune':'NOT_NEEDED'
          }
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('HATCHET_EMBEDDED_DAG_MICROTEST=PASS double=40 plus_one=41')
          print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY

      - name: Commit STEP3 evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$EVIDENCE"
          if ! git diff --cached --quiet; then
            git commit -m 'test(yaiwes): Hatchet N22 embedded DAG STEP3 PASS'
            ok=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            test "$ok" -eq 1
          fi
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "STEP3_EVIDENCE_COMMIT=$(git rev-parse HEAD)"

      - name: Read-back exact STEP3 wiring and evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git ls-tree -r --name-only origin/main -- 'Core kernel Yaiwes/Hatchet')"
          test -n "$(git ls-tree -r --name-only origin/main -- "$TARGET")"
          test "$(git show "origin/main:$ADAPTER" | sha256sum | awk '{print $1}')" = 'f4b0626be30fc6aa55dfab5214fa50c84c7fe4c93fa28d2185ae2efb49ae8c4c'
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.orchestration.hatchet'
          git show "origin/main:$EVIDENCE" | grep -Fq 'embedded_two_task_dag'
          git show "origin/main:$EVIDENCE" | grep -Fq '"value": 41'
          echo STEP3_READBACK_OK

      - name: Checkpoint PASS and release N22
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path=os.environ['WALL']
          with open(path,encoding='utf-8') as f:
              data=json.load(f)
          node=next(n for n in data['nodes'] if n['id']==22)
          if node.get('owner')!='SOL' or node.get('lock')!='CLAIMED' or node.get('current_step')!=3:
              raise SystemExit(f"LOCK_OR_STEP_CHANGED:{node.get('owner')}:{node.get('lock')}:{node.get('current_step')}")
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          node['status']='PASS'
          node['current_step']=3
          node.setdefault('checkpoint',{})['after']=(
              'STEP3 PASS: FABLES UniversalPluginBus wired yaiwes.orchestration.hatchet; '
              'real Hatchet embedded engine executed DAG double->plus_one with input 20 and outputs 40/41; '
              'read-back PASS; prune NOT_NEEDED'
          )
          evidence=node.setdefault('evidence',[])
          items=[
              'step3:adapter_commit:d55d9c8bc4d1445a59be090a27ebf57788c21952',
              'step3:ficha_commit:d6cf21f9d2edaf9ef164c15c30b6cca32aa5e49d',
              f"step3:runner_commit:{os.environ['GITHUB_SHA']}",
              f"step3:evidence_commit:{os.environ.get('EVIDENCE_COMMIT','unknown')}",
              f"step3:run:{os.environ['GITHUB_RUN_ID']}",
              'step3:route:FABLES->Hatchet adapter->embedded engine->worker->DAG',
              'step3:microtest:PASS input=20 double=40 plus_one=41',
              'step3:evidence:L2_build+L3_runtime+L4_feature',
              'step3:prune:NOT_NEEDED',
              'step3:readback:adapter+ficha+evidence PASS'
          ]
          for item in items:
              if item not in evidence:
                  evidence.append(item)
          node.setdefault('history',[]).append({
              'at':now,'actor':'SOL','label':'SOL integración 1','event':'STEP3_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])
          })
          node['next_action']='COMPLETE'
          node['lock']='FREE'
          node['owner']=None
          data['updated_at']=now
          with open(path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
            git add -- "$WALL"
            git commit -m 'crazy-wall: SOL integración 1 Hatchet STEP3 PASS release N22'
            if git push origin HEAD:main; then
              ok=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1
          echo N22_RELEASED_PASS
