name: check-external-token-secret
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret present?
        env:
          EXTERNAL_GH_B_TOKEN: ${{ secrets.EXTERNAL_GH_B_TOKEN }}
        run: |
          if [ -z "$EXTERNAL_GH_B_TOKEN" ]; then
            echo "FAIL: secret EXTERNAL_GH_B_TOKEN no esta configurado"
            exit 1
          fi
          python3 -c "import os; t=os.environ.get('EXTERNAL_GH_B_TOKEN',''); print('OK secret present length=', len(t))"
