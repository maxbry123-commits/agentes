name: check-external-token-secret
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets A umbrella + B + C presentes?
        env:
          Maxbry_123_tokens: ${{ secrets.Maxbry_123_tokens }}
          EXTERNAL_GH_B_TOKEN: ${{ secrets.EXTERNAL_GH_B_TOKEN }}
          EXTERNAL_GH_C_TOKEN: ${{ secrets.EXTERNAL_GH_C_TOKEN }}
        run: |
          ok=0
          if [ -z "$Maxbry_123_tokens" ]; then
            echo "WARN: secret Maxbry_123_tokens no esta configurado (Cuenta A umbrella pendiente)"
          else
            python3 -c "import os; t=os.environ.get('Maxbry_123_tokens',''); print('OK A umbrella present length=', len(t))"
          fi
          if [ -z "$EXTERNAL_GH_B_TOKEN" ]; then
            echo "FAIL: secret EXTERNAL_GH_B_TOKEN no esta configurado"
            ok=1
          else
            python3 -c "import os; t=os.environ.get('EXTERNAL_GH_B_TOKEN',''); print('OK B secret present length=', len(t))"
          fi
          if [ -z "$EXTERNAL_GH_C_TOKEN" ]; then
            echo "WARN: secret EXTERNAL_GH_C_TOKEN no esta configurado (Cuenta C pendiente)"
          else
            python3 -c "import os; t=os.environ.get('EXTERNAL_GH_C_TOKEN',''); print('OK C secret present length=', len(t))"
          fi
          exit $ok
