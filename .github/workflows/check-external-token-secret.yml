name: check-external-token-secret
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret present?
        env:
          GITHUB_EXTERNAL_B_TOKEN: ${{ secrets.GITHUB_EXTERNAL_B_TOKEN }}
        run: |
          if [ -z "$GITHUB_EXTERNAL_B_TOKEN" ]; then
            echo "FAIL: secret GITHUB_EXTERNAL_B_TOKEN no esta configurado"
            exit 1
          fi
          # never print token; only length
          python3 -c "import os; t=os.environ.get('GITHUB_EXTERNAL_B_TOKEN',''); print('OK secret present length=', len(t))"
