name: verify-openclaw-cable

on:
  push:
    paths:
      - 'extensions/wordflow_kernel/gateway/openclaw_http.py'
      - 'extensions/wordflow_kernel/tests/test_openclaw_http.py'
      - 'extensions/wordflow_kernel/engines/openclaw_stub.py'
      - 'agente-yaiwes/execution-engine-pool/adapter-layer/openclaw_http_gateway.py'
      - 'agente-yaiwes/execution-engine-pool/auxiliary-role-agents/openclaw_route.py'
      - 'Refactoria/G7/**'
      - 'extensions/wordflow/cables/openclaw_wordflow.json'
      - '.github/workflows/verify-openclaw-cable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run OpenClaw cable tests
        run: python -m unittest extensions/wordflow_kernel/tests/test_openclaw_http.py -v
      - name: Record verified evidence
        run: |
          set -e
          mkdir -p PIPELINE/checkpoints
          cat > PIPELINE/checkpoints/OPENCLAW_CABLE_CI_PASS.md <<EOF
          # OpenClaw → Wordflow cable CI evidence

          - workflow: verify-openclaw-cable
          - commit: $GITHUB_SHA
          - result: PASS
          - test: extensions/wordflow_kernel/tests/test_openclaw_http.py
          - execution: GitHub Actions runner
          - source: OpenClaw Gateway OpenAI-compatible /v1/chat/completions
          - security: fail-closed; token supplied only by runtime secret
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PIPELINE/checkpoints/OPENCLAW_CABLE_CI_PASS.md
          git diff --cached --quiet || git commit -m 'ci: record verified OpenClaw Wordflow cable'
          git push
