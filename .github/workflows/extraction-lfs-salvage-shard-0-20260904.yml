name: Extraction LFS Salvage Shard 0 2026-09-04
run-name: LFS salvage shard0 • ${{ github.run_id }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/extraction-lfs-salvage-shard-0-20260904.yml']
permissions:
  contents: write
concurrency:
  group: extraction-lfs-salvage-shard-0-main
  cancel-in-progress: false
jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Enforce NO-LFS
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local --unset-all filter.lfs.process || true
          git config --local filter.lfs.required false
      - name: Salvage real payload excluding pointer placeholders
        run: python3 scripts/extract_guardian_lfs_salvage_20260904.py --shard-index 0 --shard-count 4
      - name: Publish disjoint salvage shard
        run: |
          set -euo pipefail
          git add -A -- 'core kernel Yaiwes principal' 'Agente core kernel Yaiwes principal' forensics/extraction
          python3 -c 'import subprocess,sys,pathlib; m=b"version https://git-lfs.github.com/spec/v1\n"; ps=subprocess.check_output(["git","diff","--cached","--name-only","-z"]).split(b"\0"); bad=[p.decode("utf-8","surrogateescape") for p in ps if p and pathlib.Path(p.decode("utf-8","surrogateescape")).is_file() and pathlib.Path(p.decode("utf-8","surrogateescape")).read_bytes()[:1024].startswith(m)]; print("STAGED_LFS_POINTER_GAP",bad) if bad else None; sys.exit(73 if bad else 0)'
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(extraction): salvage LFS-blocked shard0 [run ${GITHUB_RUN_ID}]"
          for a in 1 2 3 4 5; do git fetch origin main && git rebase --autostash origin/main && git push --no-verify origin HEAD:main && exit 0; sleep $((a*10)); done
          exit 41
      - name: Independent read-back
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/extract_guardian_repair_20260903.py --audit-only > /tmp/audit.json
          python3 -c 'import json; d=json.load(open("/tmp/audit.json")); print(d["counts"], d["verdict"])'
