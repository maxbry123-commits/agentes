name: Download Extract X-Ray

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-extract-xray-main
  cancel-in-progress: false

jobs:
  download-extract-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize forensic workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit work/source

      - name: Validate runner
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          command -v unzip
          command -v sha256sum
          command -v python3

      - name: Validate download manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Download code/archivos"
          MANIFEST="$ROOT/RESEARCH_DOWNLOAD_MANIFEST.jsonl"
          test -d "$ROOT"
          test -s "$MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]); rows=[]
          for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if not line.strip(): continue
              try: row=json.loads(line)
              except Exception as e: raise SystemExit(f"Invalid JSONL line {n}: {e}")
              for k in ('slug','source','source_commit','parts'):
                  if not row.get(k): raise SystemExit(f"Missing {k} at line {n}")
              c=row['source_commit']
              if not isinstance(c,str) or len(c)!=40 or any(x not in '0123456789abcdefABCDEF' for x in c):
                  raise SystemExit(f"source_commit must be a full 40-hex SHA at line {n}")
              if not isinstance(row['parts'],int) or row['parts']<1:
                  raise SystemExit(f"parts must be a positive integer at line {n}")
              rows.append(row)
          if len(rows)!=20: raise SystemExit(f"Expected 20 repositories, found {len(rows)}")
          slugs=[r['slug'] for r in rows]
          if len(set(slugs))!=len(slugs): raise SystemExit('Duplicate slug in manifest')
          Path('audit/queue.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(f'PASS manifest: {len(rows)} repositories')
          PY

      - name: Validate ZIP parts and integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Download code/archivos"
          python3 - "$ROOT" <<'PY'
          import json,re,sys
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(sys.argv[1]); rows=json.loads(Path('audit/queue.json').read_text())
          for row in rows:
              slug=row['slug']; expected=row['parts']
              pattern=re.compile(r'^'+re.escape(slug)+r'_(\d{4})\.zip$')
              found=[]
              for p in root.iterdir():
                  if p.is_file():
                      m=pattern.match(p.name)
                      if m: found.append((int(m.group(1)),p))
              found.sort(); nums=[n for n,_ in found]
              if nums != list(range(1,expected+1)):
                  raise SystemExit(f'{slug}: expected parts 1..{expected}, found {nums}')
              for _,p in found:
                  if p.stat().st_size==0: raise SystemExit(f'{slug}: empty ZIP {p.name}')
                  with ZipFile(p) as z:
                      if z.testzip() is not None: raise SystemExit(f'{slug}: corrupt ZIP {p.name}')
                      seen=set()
                      for info in z.infolist():
                          name=info.filename; q=Path(name)
                          if q.is_absolute() or '..' in q.parts: raise SystemExit(f'{slug}: unsafe ZIP path {name}')
                          if name in seen: raise SystemExit(f'{slug}: duplicate ZIP entry {name}')
                          seen.add(name)
              print(f'PASS ZIP: {slug} parts={expected}')
          PY

      - name: Reconstruct repositories in Download code/archivos
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Download code/archivos"
          python3 - "$ROOT" <<'PY'
          import json,sys,shutil
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(sys.argv[1]); rows=json.loads(Path('audit/queue.json').read_text())
          for row in rows:
              slug=row['slug']; dest=root/slug
              if dest.exists(): shutil.rmtree(dest)
              dest.mkdir(parents=True)
              parts=sorted(root.glob(f'{slug}_[0-9][0-9][0-9][0-9].zip'),key=lambda p:int(p.stem.rsplit('_',1)[1]))
              for zpath in parts:
                  with ZipFile(zpath) as z:
                      for info in z.infolist():
                          name=info.filename
                          if not name or name.endswith('/'): continue
                          target=(dest/name).resolve()
                          if dest.resolve() not in target.parents: raise SystemExit(f'{slug}: extraction escapes destination: {name}')
                          target.parent.mkdir(parents=True,exist_ok=True)
                          with z.open(info) as src,target.open('wb') as dst: shutil.copyfileobj(src,dst)
              if not any(dest.rglob('*')): raise SystemExit(f'{slug}: extraction produced no files')
              print(f'PASS EXTRACT: {slug}')
          PY

      - name: Checkout exact source commits
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,subprocess,shutil
          from pathlib import Path
          rows=json.loads(Path('audit/queue.json').read_text()); base=Path('work/source')
          for row in rows:
              slug=row['slug']; url=row['source']; commit=row['source_commit']; dest=base/slug
              if dest.exists(): shutil.rmtree(dest)
              subprocess.run(['git','clone','--no-checkout','--filter=blob:none',url,str(dest)],check=True)
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',commit],cwd=dest,check=True)
              subprocess.run(['git','checkout','--detach','FETCH_HEAD'],cwd=dest,check=True)
              actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=dest,text=True).strip()
              if actual.lower()!=commit.lower(): raise SystemExit(f'{slug}: source SHA mismatch')
              print(f'PASS SOURCE: {slug} @ {actual}')
          PY

      - name: Forensic X-Ray cross-check
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('Download code/archivos'); srcroot=Path('work/source'); audit=Path('audit')
          rows=json.loads((audit/'queue.json').read_text()); global_fail=False; results=[]
          def inv(base):
              return {p.relative_to(base).as_posix():p for p in base.rglob('*') if p.is_file() and '.git' not in p.parts and '__MACOSX' not in p.parts and p.name!='.DS_Store'}
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          for row in rows:
              slug=row['slug']; expected=row['source_commit']; ext=inv(root/slug); src=inv(srcroot/slug)
              missing=sorted(set(src)-set(ext)); extra=sorted(set(ext)-set(src)); changed=[]; checks=[]
              for rel in sorted(set(src)&set(ext)):
                  ss=src[rel].stat().st_size; es=ext[rel].stat().st_size; sh=sha(src[rel]); eh=sha(ext[rel])
                  checks.append({'path':rel,'source_size':ss,'reconstructed_size':es,'source_sha256':sh,'reconstructed_sha256':eh})
                  if ss!=es or sh!=eh: changed.append(rel)
              actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=srcroot/slug,text=True).strip()
              status='PASS' if not missing and not extra and not changed and actual.lower()==expected.lower() else 'FAIL'
              if status=='FAIL': global_fail=True
              report={'slug':slug,'source_commit_expected':expected,'source_commit_checked':actual,'status':status,'source_files':len(src),'reconstructed_files':len(ext),'missing':missing,'extra':extra,'changed':changed,'checks':checks}
              (audit/f'{slug}.xray.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
              results.append({'slug':slug,'status':status,'missing':len(missing),'extra':len(extra),'changed':len(changed)})
              print(f'{status}: {slug} missing={len(missing)} extra={len(extra)} changed={len(changed)}')
          (audit/'GLOBAL.json').write_text(json.dumps({'audit_type':'FORENSIC_XRAY','deterministic':True,'repositories':results,'status':'FAIL' if global_fail else 'PASS'},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          if global_fail: raise SystemExit(1)
          PY

      - name: Hash forensic evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -d audit
          find audit -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > audit/evidence.sha256

      - name: Upload forensic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: forensic-xray-report
          path: ${{ github.workspace }}/audit/
          if-no-files-found: error
          retention-days: 30

      - name: Commit only after global PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Download code/archivos'
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
            exit 0
          fi
          git commit -m 'Reconstruct and verify downloaded repositories'
          git push
