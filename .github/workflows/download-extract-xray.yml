name: Download Extract X-Ray

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/download-extract-xray.yml'

permissions:
  contents: write

concurrency:
  group: download-extract-xray-main
  cancel-in-progress: false

jobs:
  download-extract-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate runner environment
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          command -v unzip
          command -v sha256sum
          command -v python3

      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="manifest/repos.txt"
          test -f "$MANIFEST"
          mkdir -p audit
          grep -vE '^[[:space:]]*(#|$)' "$MANIFEST" > audit/queue.txt
          COUNT="$(wc -l < audit/queue.txt)"
          test "$COUNT" -eq 20
          while IFS='|' read -r NAME URL COMMIT PARTS; do
            test -n "$NAME"; test -n "$URL"; test -n "$COMMIT"; test -n "$PARTS"
            [[ "$NAME" != */* && "$NAME" != *".."* ]]
            [[ "$PARTS" =~ ^[0-9]+$ ]] && test "$PARTS" -ge 1
            [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          done < audit/queue.txt

      - name: Validate repository ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Download code/archivos"
          test -d "$ROOT"
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            mapfile -t PARTS < <(find "$ROOT" -maxdepth 1 -type f -name "${NAME}_[0-9][0-9][0-9][0-9].zip" | LC_ALL=C sort -V)
            test "${#PARTS[@]}" -eq "$EXPECTED_PARTS"
            EXPECTED_NUMBER=1
            for ZIP in "${PARTS[@]}"; do
              NUMBER="$(basename "$ZIP" | sed -E 's/.*_([0-9]{4})\.zip/\1/')"
              EXPECTED_PADDED="$(printf '%04d' "$EXPECTED_NUMBER")"
              test "$NUMBER" = "$EXPECTED_PADDED"
              test -s "$ZIP"
              EXPECTED_NUMBER=$((EXPECTED_NUMBER + 1))
            done
          done < audit/queue.txt

      - name: Validate ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r ZIP; do unzip -tq "$ZIP"; done < <(find "Download code/archivos" -maxdepth 1 -type f -name '*.zip' | LC_ALL=C sort -V)

      - name: Preflight ZIP forensic validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          ROOT=Path("Download code/archivos")
          QUEUE=Path("audit/queue.txt")
          for line in QUEUE.read_text().splitlines():
              if not line.strip(): continue
              name, url, commit, expected_parts = line.split("|",3)
              parts=sorted(ROOT.glob(f"{name}_[0-9][0-9][0-9][0-9].zip"))
              seen=set()
              for z in parts:
                  with ZipFile(z) as f:
                      local=set()
                      for i in f.infolist():
                          p=Path(i.filename)
                          if p.is_absolute() or ".." in p.parts:
                              raise SystemExit(f"UNSAFE ZIP PATH: {z}: {i.filename}")
                          if i.is_dir(): continue
                          if i.filename in local: raise SystemExit(f"DUPLICATE ZIP ENTRY: {z}: {i.filename}")
                          if i.filename in seen: raise SystemExit(f"CROSS-PART COLLISION: {name}: {i.filename}")
                          local.add(i.filename); seen.add(i.filename)
          PY

      - name: Reconstruct repositories
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Download code/archivos"
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            DEST="$ROOT/$NAME"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            mapfile -t PARTS < <(find "$ROOT" -maxdepth 1 -type f -name "${NAME}_[0-9][0-9][0-9][0-9].zip" | LC_ALL=C sort -V)
            for ZIP in "${PARTS[@]}"; do unzip -oq "$ZIP" -d "$DEST"; done
            test "$(find "$DEST" -type f | wc -l)" -gt 0
          done < audit/queue.txt

      - name: Checkout source repositories at exact commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            SOURCE="work/source/$NAME"
            rm -rf "$SOURCE"
            git clone --no-checkout --filter=blob:none "$URL" "$SOURCE"
            git -C "$SOURCE" fetch --no-tags --depth=1 origin "$COMMIT"
            git -C "$SOURCE" checkout --detach FETCH_HEAD
            test "$(git -C "$SOURCE" rev-parse HEAD)" = "$COMMIT"
          done < audit/queue.txt

      - name: Build source inventories
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            git -C "work/source/$NAME" ls-files | LC_ALL=C sort > "audit/${NAME}.source.paths"
          done < audit/queue.txt

      - name: Build reconstructed inventories
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            find "Download code/archivos/$NAME" -type f -printf '%P\n' | LC_ALL=C sort > "audit/${NAME}.reconstructed.paths"
          done < audit/queue.txt

      - name: Cross-check repository paths and hashes
        shell: bash
        run: |
          set -euo pipefail
          GLOBAL_FAIL=0
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            mkdir -p "audit/$NAME"
            comm -23 "audit/${NAME}.source.paths" "audit/${NAME}.reconstructed.paths" > "audit/$NAME/missing.txt"
            comm -13 "audit/${NAME}.source.paths" "audit/${NAME}.reconstructed.paths" > "audit/$NAME/extra.txt"
            : > "audit/$NAME/changed.txt"
            while IFS= read -r FILE; do
              SOURCE="work/source/$NAME/$FILE"; RECON="Download code/archivos/$NAME/$FILE"
              if [ ! -f "$RECON" ] || [ "$(stat -c '%s' "$SOURCE")" != "$(stat -c '%s' "$RECON")" ] || [ "$(sha256sum "$SOURCE" | awk '{print $1}')" != "$(sha256sum "$RECON" | awk '{print $1}')" ]; then
                echo "$FILE" >> "audit/$NAME/changed.txt"
              fi
            done < "audit/${NAME}.source.paths"
            if [ -s "audit/$NAME/missing.txt" ] || [ -s "audit/$NAME/extra.txt" ] || [ -s "audit/$NAME/changed.txt" ]; then GLOBAL_FAIL=1; fi
          done < audit/queue.txt
          test "$GLOBAL_FAIL" -eq 0

      - name: Generate forensic JSON report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          q=Path('audit/queue.txt'); repos=[]
          for line in q.read_text().splitlines():
              if not line.strip(): continue
              name,url,commit,parts=line.split('|',3)
              def n(p): return len(p.read_text(errors='replace').splitlines()) if p.exists() else 0
              repos.append({'repository':name,'source_url':url,'source_commit':commit,'expected_parts':int(parts),'missing':n(Path('audit')/name/'missing.txt'),'extra':n(Path('audit')/name/'extra.txt'),'changed':n(Path('audit')/name/'changed.txt')})
          Path('audit/forensic-report.json').write_text(json.dumps({'audit_type':'FORENSIC_XRAY','deterministic':True,'repository_count':len(repos),'passed':all(x['missing']==x['extra']==x['changed']==0 for x in repos),'repositories':repos},indent=2,ensure_ascii=False))
          PY

      - name: Hash forensic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find audit -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > audit/evidence.sha256

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-xray-report
          path: audit/
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified reconstructed repositories
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Download code/archivos"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconstruct and verify downloaded repositories"
          git push
