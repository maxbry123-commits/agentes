name: Download Extract X-Ray

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-extract-xray.yml'

permissions:
  contents: write

concurrency:
  group: download-extract-xray-main
  cancel-in-progress: false

jobs:
  download-extract-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate runner environment
        run: |
          set -euo pipefail
          command -v git
          command -v unzip
          command -v sha256sum
          command -v python3
      - name: Validate manifest
        run: |
          set -euo pipefail
          test -f manifest/repos.txt
          mkdir -p audit
          grep -vE '^[[:space:]]*(#|$)' manifest/repos.txt > audit/queue.txt
          test "$(wc -l < audit/queue.txt)" -eq 20
          while IFS='|' read -r NAME URL COMMIT PARTS; do
            test -n "$NAME"; test -n "$URL"; test -n "$COMMIT"; test -n "$PARTS"
            [[ "$NAME" != */* && "$NAME" != *".."* ]]
            [[ "$PARTS" =~ ^[0-9]+$ ]] && test "$PARTS" -ge 1
            [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          done < audit/queue.txt
      - name: Validate repository ZIP parts
        run: |
          set -euo pipefail
          ROOT='Download code/archivos'
          test -d "$ROOT"
          while IFS='|' read -r NAME URL COMMIT EXPECTED_PARTS; do
            mapfile -t PARTS < <(find "$ROOT" -maxdepth 1 -type f -name "${NAME}_[0-9][0-9][0-9][0-9].zip" | LC_ALL=C sort -V)
            test "${#PARTS[@]}" -eq "$EXPECTED_PARTS"
            N=1
            for ZIP in "${PARTS[@]}"; do
              NUM="$(basename "$ZIP" | sed -E 's/.*_([0-9]{4})\.zip/\1/')"
              test "$NUM" = "$(printf '%04d' "$N")"
              test -s "$ZIP"
              N=$((N+1))
            done
          done < audit/queue.txt
      - name: Validate ZIP integrity
        run: |
          set -euo pipefail
          while IFS= read -r ZIP; do unzip -tq "$ZIP"; done < <(find 'Download code/archivos' -maxdepth 1 -type f -name '*.zip' | LC_ALL=C sort -V)
      - name: Preflight ZIP forensic validation
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('Download code/archivos')
          for line in Path('audit/queue.txt').read_text().splitlines():
              if not line.strip(): continue
              name,_,_,_=line.split('|',3)
              seen=set()
              for z in sorted(root.glob(f'{name}_[0-9][0-9][0-9][0-9].zip')):
                  with ZipFile(z) as f:
                      for i in f.infolist():
                          p=Path(i.filename)
                          if p.is_absolute() or '..' in p.parts: raise SystemExit(f'UNSAFE ZIP PATH: {z}: {i.filename}')
                          if i.is_dir(): continue
                          if i.filename in seen: raise SystemExit(f'CROSS-PART COLLISION: {name}: {i.filename}')
                          seen.add(i.filename)
          PY
      - name: Reconstruct repositories
        run: |
          set -euo pipefail
          root='Download code/archivos'
          while IFS='|' read -r NAME URL COMMIT PARTS; do
            dest="$root/$NAME"
            rm -rf "$dest"; mkdir -p "$dest"
            mapfile -t ZIPS < <(find "$root" -maxdepth 1 -type f -name "${NAME}_[0-9][0-9][0-9][0-9].zip" | LC_ALL=C sort -V)
            for z in "${ZIPS[@]}"; do unzip -oq "$z" -d "$dest"; done
            test "$(find "$dest" -type f | wc -l)" -gt 0
          done < audit/queue.txt
      - name: Checkout source repositories at exact commits
        run: |
          set -euo pipefail
          mkdir -p work/source
          while IFS='|' read -r NAME URL COMMIT PARTS; do
            src="work/source/$NAME"; rm -rf "$src"
            git clone --no-checkout --filter=blob:none "$URL" "$src"
            git -C "$src" fetch --no-tags --depth=1 origin "$COMMIT"
            git -C "$src" checkout --detach FETCH_HEAD
            test "$(git -C "$src" rev-parse HEAD)" = "$COMMIT"
          done < audit/queue.txt
      - name: Cross-check repository paths and SHA-256
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r NAME URL COMMIT PARTS; do
            mkdir -p "audit/$NAME"
            git -C "work/source/$NAME" ls-files | LC_ALL=C sort > "audit/${NAME}.source.paths"
            find "Download code/archivos/$NAME" -type f -printf '%P\n' | LC_ALL=C sort > "audit/${NAME}.reconstructed.paths"
            comm -23 "audit/${NAME}.source.paths" "audit/${NAME}.reconstructed.paths" > "audit/$NAME/missing.txt"
            comm -13 "audit/${NAME}.source.paths" "audit/${NAME}.reconstructed.paths" > "audit/$NAME/extra.txt"
            : > "audit/$NAME/changed.txt"
            while IFS= read -r FILE; do
              s="work/source/$NAME/$FILE"; r="Download code/archivos/$NAME/$FILE"
              if [ ! -f "$r" ] || [ "$(stat -c '%s' "$s")" != "$(stat -c '%s' "$r")" ] || [ "$(sha256sum "$s"|cut -d' ' -f1)" != "$(sha256sum "$r"|cut -d' ' -f1)" ]; then echo "$FILE" >> "audit/$NAME/changed.txt"; fi
            done < "audit/${NAME}.source.paths"
            if [ -s "audit/$NAME/missing.txt" ] || [ -s "audit/$NAME/extra.txt" ] || [ -s "audit/$NAME/changed.txt" ]; then fail=1; fi
          done < audit/queue.txt
          test "$fail" -eq 0
      - name: Generate forensic evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('audit/queue.txt'); rows=[]
          for line in q.read_text().splitlines():
              if not line.strip(): continue
              n,u,c,p=line.split('|',3)
              def cnt(x): return len(x.read_text(errors='replace').splitlines()) if x.exists() else 0
              rows.append({'repository':n,'source_url':u,'source_commit':c,'expected_parts':int(p),'missing':cnt(Path('audit')/n/'missing.txt'),'extra':cnt(Path('audit')/n/'extra.txt'),'changed':cnt(Path('audit')/n/'changed.txt')})
          Path('audit/forensic-report.json').write_text(json.dumps({'audit_type':'FORENSIC_XRAY','deterministic':True,'repository_count':len(rows),'passed':all(r['missing']==r['extra']==r['changed']==0 for r in rows),'repositories':rows},indent=2))
          PY
          find audit -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > audit/evidence.sha256
      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-xray-report
          path: audit/
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified reconstructed repositories
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Download code/archivos'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconstruct and verify downloaded repositories'
          git push
