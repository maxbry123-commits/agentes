name: codex-meta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: pin-and-commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=https://github.com/openai/codex
          REF=rust-v0.147.0
          COMMIT=be6e8eac029b183056b7e4402879f15d2c85f61b
          TAG=agent-Codex-rust-v0.147.0
          URL="$REPO/archive/$COMMIT.tar.gz"
          mkdir -p agents/Codex/source agents/Codex/distribution/official agents/Codex/hashes agents/_state
          curl -fsSL -o /tmp/codex-src.tar.gz "$URL"
          SHA=$(sha256sum /tmp/codex-src.tar.gz | awk '{print $1}')
          printf '%s\n' "$COMMIT" > agents/Codex/source/commit.txt
          printf '%s\n' "$REF" > agents/Codex/source/release.txt
          printf '%s\n' "$REPO" > agents/Codex/source/repo.txt
          printf '%s\n' "$URL" > agents/Codex/source/archive.url
          printf '%s\n' "$SHA" > agents/Codex/source/archive.sha256
          gh release upload "$TAG" /tmp/codex-src.tar.gz --clobber || true
          printf '%s\n' "{\"storage\":\"github_release\",\"release_tag\":\"$TAG\",\"asset\":\"codex-src.tar.gz\",\"sha256\":\"$SHA\",\"commit\":\"$COMMIT\",\"ref\":\"$REF\"}" > agents/Codex/source/SOURCE_PIN.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/openai/codex/releases/tags/$REF" -o /tmp/rel.json
          python3 -c '
import json
from pathlib import Path
tag="agent-Codex-rust-v0.147.0"
rel=json.load(open("/tmp/rel.json"))
off=Path("agents/Codex/distribution/official"); off.mkdir(parents=True, exist_ok=True)
assets=[]
for a in rel.get("assets") or []:
    name=a["name"]; url=a["browser_download_url"]; size=a.get("size")
    cons=f"https://github.com/maxbry123-commits/agentes/releases/download/{tag}/{name}"
    assets.append({"name":name,"url":url,"size":size,"conserved_url":cons,"status":"ON_AGENTES_RELEASE"})
    (off/f"{name}.PIN.json").write_text(json.dumps({"name":name,"url":url,"size":size,"conserved_url":cons,"release_tag":tag},indent=2)+"\n")
(off/"assets.json").write_text(json.dumps(assets,indent=2)+"\n")
(off/"SHA256SUMS").write_text(f"# binaries on Release {tag}\n")
sha=open("agents/Codex/source/archive.sha256").read().strip()
url=open("agents/Codex/source/archive.url").read().strip()
m={"protocol":"TEAM-SEALS-ACQUIRE-v2.1","agent":"Codex","identity":{"repository":"https://github.com/openai/codex","ref":"rust-v0.147.0","commit":"be6e8eac029b183056b7e4402879f15d2c85f61b"},"source":{"available":True,"storage":"github_release","release_tag":tag,"asset":"codex-src.tar.gz","upstream_url":url,"archive_sha256":sha,"conserved_url":f"https://github.com/maxbry123-commits/agentes/releases/download/{tag}/codex-src.tar.gz"},"distribution":{"official":assets,"release_tag":tag},"layers":{"source":"CAPTURED","distribution":"CAPTURED"}}
Path("agents/Codex/manifest.json").write_text(json.dumps(m,indent=2)+"\n")
Path("agents/Codex/hashes").mkdir(parents=True, exist_ok=True)
Path("agents/Codex/hashes/SHA256SUMS").write_text(f"{sha}  source/codex-src.tar.gz\n")
print("ok", len(assets), sha)
'
          cat > agents/_state/Codex.json <<EOF
{"agent":"Codex","task":"A5","status":"DONE","protocol":"TEAM-SEALS-ACQUIRE-v2.1","identity":{"repository":"https://github.com/openai/codex","ref":"$REF","commit":"$COMMIT"},"release_tag":"$TAG","layers":{"source":"CAPTURED","distribution_git":"META_PINS","distribution_release":"CAPTURED","finalize":"DONE"},"notes":"source tar+binaries on Release; git=pins+manifest"}
EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agents/Codex agents/_state/Codex.json
          git diff --cached --quiet || (git commit -m "A5 DONE: Codex meta pins; Release $TAG" && git push)
