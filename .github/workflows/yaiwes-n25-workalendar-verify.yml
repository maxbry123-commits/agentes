name: YAIWES Workalendar N25 Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Agente Yaiwes principal/execution-orchestration/classifier-scheduler/workalendar
            Agente Yaiwes principal/execution-orchestration/classifier-scheduler/classifier_hook.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workalendar deps
        working-directory: Agente Yaiwes principal/execution-orchestration/classifier-scheduler/workalendar
        run: |
          pip install python-dateutil lunardate convertdate pyluach
          pip install -e .
      - name: Microtest adapter + port + hook gate
        working-directory: Agente Yaiwes principal/execution-orchestration/classifier-scheduler
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path('workalendar')
          spec = importlib.util.spec_from_file_location('n25_port', root/'yaiwes_workalendar_port.py')
          port = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(port)
          thu = port.working_day_gate({'schedule_date':'2026-09-10'})
          sat = port.working_day_gate({'schedule_date':'2026-09-12'})
          assert thu['allowed'] is True, thu
          assert sat['allowed'] is False, sat
          src = Path('classifier_hook.py').read_text()
          assert 'working_day_gate' in src and 'yaiwes_workalendar_port' in src
          print('N25_HOOK_PATH_PASS', thu, sat)
          PY
