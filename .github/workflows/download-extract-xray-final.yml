name: Download Extract X-Ray FINAL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-extract-xray-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-extract-xray-final-main
  cancel-in-progress: false

jobs:
  extract-and-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout controller
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Initialize forensic workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/audit" "$GITHUB_WORKSPACE/work"
          mkdir -p "$GITHUB_WORKSPACE/audit/extracted" "$GITHUB_WORKSPACE/work/source"
          test -d "$GITHUB_WORKSPACE/Download code/archivos"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "ZIP ROOT=$GITHUB_WORKSPACE/Download code/archivos"

      - name: Validate manifest and every ZIP part
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("Download code/archivos")
          manifest = root / "RESEARCH_DOWNLOAD_MANIFEST.jsonl"
          if not manifest.is_file() or manifest.stat().st_size == 0:
              raise SystemExit(f"Missing/empty manifest: {manifest}")

          rows = []
          for line_no, line in enumerate(manifest.read_text(encoding="utf-8").splitlines(), 1):
              if not line.strip():
                  continue
              try:
                  row = json.loads(line)
              except Exception as exc:
                  raise SystemExit(f"Invalid JSONL line {line_no}: {exc}")
              for key in ("slug", "source", "source_commit", "parts"):
                  if key not in row or row[key] in (None, "", 0):
                      raise SystemExit(f"Missing {key} on line {line_no}")
              if not re.fullmatch(r"[0-9a-fA-F]{40}", row["source_commit"]):
                  raise SystemExit(f"Invalid source_commit for {row['slug']}")
              if not isinstance(row["parts"], int) or row["parts"] < 1:
                  raise SystemExit(f"Invalid parts for {row['slug']}")
              rows.append(row)

          if len(rows) != 20:
              raise SystemExit(f"Expected 20 repositories, found {len(rows)}")
          if len({r["slug"] for r in rows}) != len(rows):
              raise SystemExit("Duplicate repository slug in manifest")

          total_parts = 0
          for row in rows:
              slug = row["slug"]
              expected = row["parts"]
              parts = sorted(
                  root.glob(f"{slug}_[0-9][0-9][0-9][0-9].zip"),
                  key=lambda p: int(p.stem.rsplit("_", 1)[1]),
              )
              numbers = [int(p.stem.rsplit("_", 1)[1]) for p in parts]
              if numbers != list(range(1, expected + 1)):
                  raise SystemExit(f"{slug}: expected ZIP parts 1..{expected}, found {numbers}")

              for zip_path in parts:
                  if zip_path.stat().st_size == 0:
                      raise SystemExit(f"{slug}: empty ZIP {zip_path.name}")
                  with ZipFile(zip_path) as z:
                      if z.testzip() is not None:
                          raise SystemExit(f"{slug}: corrupt ZIP {zip_path.name}")
                      for info in z.infolist():
                          name = info.filename.replace("\\", "/")
                          p = Path(name)
                          if p.is_absolute() or ".." in p.parts:
                              raise SystemExit(f"{slug}: unsafe ZIP member {info.filename}")
              total_parts += expected

          Path("audit/queue.json").write_text(json.dumps(rows, indent=2) + "\n", encoding="utf-8")
          Path("audit/MANIFEST_PASS.txt").write_text(
              f"PASS: {len(rows)} repositories / {total_parts} ZIP parts\n",
              encoding="utf-8",
          )
          print(f"PASS MANIFEST: {len(rows)} repositories / {total_parts} ZIP parts")
          PY

      - name: Extract every ZIP part safely
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, shutil
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("Download code/archivos")
          out = Path("audit/extracted")
          rows = json.loads(Path("audit/queue.json").read_text(encoding="utf-8"))
          summary = []

          for row in rows:
              slug = row["slug"]
              dest = out / slug
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir(parents=True)
              seen = set()
              file_count = 0

              parts = sorted(
                  root.glob(f"{slug}_[0-9][0-9][0-9][0-9].zip"),
                  key=lambda p: int(p.stem.rsplit("_", 1)[1]),
              )

              for zip_path in parts:
                  with ZipFile(zip_path) as z:
                      for info in z.infolist():
                          name = info.filename.replace("\\", "/")
                          if not name or name.endswith("/"):
                              continue
                          if name in seen:
                              raise SystemExit(f"{slug}: duplicate member across ZIP parts: {name}")
                          seen.add(name)
                          target = (dest / name).resolve()
                          if dest.resolve() not in target.parents:
                              raise SystemExit(f"{slug}: extraction escape: {name}")
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with z.open(info) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst, length=1024 * 1024)
                          file_count += 1

              if file_count == 0:
                  raise SystemExit(f"{slug}: zero files extracted")
              summary.append({"slug": slug, "parts": len(parts), "files": file_count})
              print(f"PASS EXTRACT: {slug} parts={len(parts)} files={file_count}")

          Path("audit/EXTRACTION_SUMMARY.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          if len(summary) != 20:
              raise SystemExit(f"Expected 20 extracted repositories, found {len(summary)}")
          print(f"PASS EXTRACTION: {len(summary)} repositories")
          PY

      - name: Prove extracted files exist before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/audit/EXTRACTION_SUMMARY.json"
          test -n "$(find "$GITHUB_WORKSPACE/audit/extracted" -type f -print -quit)"
          find "$GITHUB_WORKSPACE/audit/extracted" -type f | sort > "$GITHUB_WORKSPACE/audit/FILES.txt"
          test -s "$GITHUB_WORKSPACE/audit/FILES.txt"
          echo "Extracted file count: $(wc -l < "$GITHUB_WORKSPACE/audit/FILES.txt")"

      - name: Verify each extracted tree against exact upstream commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          rows = json.loads(Path("audit/queue.json").read_text(encoding="utf-8"))
          extracted_root = Path("audit/extracted")
          source_root = Path("work/source")
          results = []
          failed = False

          def files(root):
              return {
                  p.relative_to(root).as_posix(): p
                  for p in root.rglob("*")
                  if p.is_file() and ".git" not in p.parts and "__MACOSX" not in p.parts and p.name != ".DS_Store"
              }

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          for row in rows:
              slug = row["slug"]
              expected = row["source_commit"].lower()
              dest = source_root / slug
              subprocess.run(
                  ["git", "-c", "protocol.version=2", "clone", "--filter=blob:none", "--no-checkout", row["source"], str(dest)],
                  check=True,
              )
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--filter=blob:none", "origin", expected],
                  cwd=dest,
                  check=True,
              )
              subprocess.run(["git", "checkout", "--detach", expected], cwd=dest, check=True)
              actual = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=dest, text=True).strip().lower()
              a = files(extracted_root / slug)
              b = files(dest)
              missing = sorted(set(b) - set(a))
              extra = sorted(set(a) - set(b))
              changed = [
                  rel for rel in sorted(set(a) & set(b))
                  if a[rel].stat().st_size != b[rel].stat().st_size or sha256(a[rel]) != sha256(b[rel])
              ]
              status = "PASS" if actual == expected and not missing and not extra and not changed else "FAIL"
              failed |= status == "FAIL"
              report = {
                  "slug": slug,
                  "status": status,
                  "expected_commit": expected,
                  "actual_commit": actual,
                  "extracted_files": len(a),
                  "source_files": len(b),
                  "missing": missing,
                  "extra": extra,
                  "changed": changed,
              }
              Path(f"audit/{slug}.xray.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              results.append({
                  "slug": slug,
                  "status": status,
                  "extracted_files": len(a),
                  "missing": len(missing),
                  "extra": len(extra),
                  "changed": len(changed),
              })
              print(f"{status} XRAY: {slug} extracted={len(a)} missing={len(missing)} extra={len(extra)} changed={len(changed)}")

          global_status = "FAIL" if failed else "PASS"
          Path("audit/GLOBAL.json").write_text(
              json.dumps({"audit_type": "FORENSIC_XRAY_FINAL", "repositories": results, "status": global_status}, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("audit/FINAL_STATUS.txt").write_text(global_status + "\n", encoding="utf-8")
          if failed:
              raise SystemExit(1)
          PY

      - name: Write GitHub job summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Download Extract X-Ray FINAL"
            if [ -f audit/FINAL_STATUS.txt ]; then
              echo "**Status:** $(cat audit/FINAL_STATUS.txt)"
            else
              echo "**Status:** NO FINAL STATUS"
            fi
            if [ -f audit/EXTRACTION_SUMMARY.json ]; then
              echo "**Extraction summary:** generated"
              python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('audit/EXTRACTION_SUMMARY.json').read_text())
          print(f"**Repositories extracted:** {len(rows)}")
          print(f"**Files extracted:** {sum(r['files'] for r in rows)}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload extraction and X-Ray evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: download-extract-xray-final-${{ github.run_id }}
          path: ${{ github.workspace }}/audit/
          if-no-files-found: error
          retention-days: 30

      - name: Final gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/audit/FINAL_STATUS.txt"
          echo "FINAL X-RAY STATUS: $(cat "$GITHUB_WORKSPACE/audit/FINAL_STATUS.txt")"
          test "$(cat "$GITHUB_WORKSPACE/audit/FINAL_STATUS.txt")" = PASS
