name: inventory-forensic-v3-recovery-fast-agentes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-recovery-fast-agentes.yml"

permissions:
  contents: read

jobs:
  forensic_fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always()
    steps:
      - name: Checkout main metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Build optimized evidence
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-v3-fast
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.parse
          from collections import Counter, defaultdict

          repo=os.environ["REPOSITORY"]; run_id=os.environ["RUN_ID"]; server=os.environ["SERVER_URL"]
          token=os.environ["GH_TOKEN"]; head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          raw=subprocess.check_output(["git","ls-tree","-r","--name-only","-z","HEAD"])
          paths=[p.decode("utf-8","replace") for p in raw.split(b"\x00") if p]
          research=[p for p in paths if p.endswith("RESEARCH_DOWNLOAD_MANIFEST.jsonl")]

          def show(p):
              return subprocess.check_output(["git","show","HEAD:"+p]).decode("utf-8","replace")
          def norm(x):
              return re.sub(r"[^a-z0-9]+","",str(x or "").lower())
          def source_name(u):
              if not isinstance(u,str): return ""
              x=u.rstrip("/")
              if x.lower().endswith(".git"): x=x[:-4]
              return x.rsplit("/",1)[-1]
          def canon(u):
              if not isinstance(u,str) or not u.strip(): return None
              x=u.strip().lower()
              if x.endswith(".git"): x=x[:-4]
              return x.rstrip("/")
          def contents(directory):
              qp=urllib.parse.quote(directory,safe="/")
              url=f"https://api.github.com/repos/{repo}/contents/{qp}?ref=main"
              req=urllib.request.Request(url,headers={
                "Authorization":"Bearer "+token,
                "Accept":"application/vnd.github+json",
                "X-GitHub-Api-Version":"2022-11-28"
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              if not isinstance(data,list): return []
              return data

          rows=[]; manifest_errors=[]
          for mf in research:
              for n,line in enumerate(show(mf).splitlines(),1):
                  if not line.strip(): continue
                  try: d=json.loads(line)
                  except Exception:
                      manifest_errors.append({"path":mf,"line":n,"error":"invalid_jsonl"}); continue
                  if not isinstance(d,dict): continue
                  rows.append({
                    "manifest_path":mf,"manifest_line":n,
                    "number":d.get("number"),"slug":d.get("slug") or d.get("name"),
                    "source":d.get("source") or d.get("source_url"),
                    "source_commit":d.get("source_commit") or d.get("commit") or d.get("sha"),
                    "parts":d.get("parts"),"manifest_status":str(d.get("status") or "").upper(),
                    "reason":d.get("reason"),"relocated_to":d.get("relocated_to")
                  })

          # If there are no standard research manifests, conservatively inspect manifest-ish JSONL
          # and accept only rows that carry GitHub source + 40-char SHA + integer parts.
          if not research:
              for mf in [p for p in paths if "manifest" in os.path.basename(p).lower() and p.lower().endswith(".jsonl")]:
                  try: txt=show(mf)
                  except Exception: continue
                  accepted=[]
                  for n,line in enumerate(txt.splitlines(),1):
                      if not line.strip(): continue
                      try: d=json.loads(line)
                      except Exception: continue
                      if not isinstance(d,dict): continue
                      u=d.get("source") or d.get("source_url")
                      s=d.get("source_commit") or d.get("commit") or d.get("sha")
                      pr=d.get("parts")
                      if isinstance(u,str) and "github.com/" in u and isinstance(s,str) and re.fullmatch(r"[0-9a-fA-F]{40}",s) and isinstance(pr,int):
                          accepted.append({
                            "manifest_path":mf,"manifest_line":n,"number":d.get("number"),
                            "slug":d.get("slug") or d.get("name"),"source":u,"source_commit":s,
                            "parts":pr,"manifest_status":str(d.get("status") or "").upper(),
                            "reason":d.get("reason"),"relocated_to":d.get("relocated_to")
                          })
                  rows.extend(accepted)

          dirs=set()
          for r in rows:
              dirs.add(os.path.dirname(r["manifest_path"]))
              if isinstance(r.get("relocated_to"),str) and r["relocated_to"].strip():
                  dirs.add(r["relocated_to"].strip().strip("/"))

          listings={}; listing_errors=[]
          for d in sorted(x for x in dirs if x):
              try:
                  arr=contents(d)
                  listings[d]=arr
                  if len(arr)>=1000:
                      listing_errors.append({"directory":d,"error":"possible_contents_api_truncation","items":len(arr)})
              except Exception as e:
                  listings[d]=[]; listing_errors.append({"directory":d,"error":type(e).__name__})

          zip_re=re.compile(r"(?i)^(.*)_([0-9]{4})\.zip$")
          groups=defaultdict(list)
          for d,arr in listings.items():
              for item in arr:
                  if item.get("type")!="file": continue
                  m=zip_re.match(item.get("name",""))
                  if not m: continue
                  groups[(d,norm(m.group(1)))].append({
                    "path":item.get("path"),"size":int(item.get("size") or 0),"part":int(m.group(2))
                  })

          exclusions=[]; row_evidence=[]
          for r in rows:
              status=r["manifest_status"]
              try: expected=int(r["parts"])
              except Exception: expected=None
              sha=r.get("source_commit")
              sha_ok=bool(isinstance(sha,str) and re.fullmatch(r"[0-9a-fA-F]{40}",sha))
              source_ok=bool(isinstance(r.get("source"),str) and "github.com/" in r["source"])
              wanted={norm(r.get("slug")),norm(source_name(r.get("source")))}-set([""])
              candidate_dirs={os.path.dirname(r["manifest_path"])}
              if isinstance(r.get("relocated_to"),str) and r["relocated_to"].strip():
                  candidate_dirs.add(r["relocated_to"].strip().strip("/"))
              exact=[]
              for d in candidate_dirs:
                  for w in wanted:
                      ps=sorted(groups.get((d,w),[]),key=lambda x:x["part"])
                      if expected is not None and len(ps)==expected and [x["part"] for x in ps]==list(range(1,expected+1)):
                          exact.append({"directory":d,"parts":ps})
              # exact unique by directory
              uniq={x["directory"]:x for x in exact}
              exact=list(uniq.values())
              if status=="SKIPPED" and not sha_ok and expected is None and not exact:
                  exclusions.append({
                    "manifest_path":r["manifest_path"],"manifest_line":r["manifest_line"],
                    "slug":r.get("slug"),"source":r.get("source"),"reason":r.get("reason"),
                    "status":"EXCLUDED_NON_DOWNLOADED"
                  })
                  continue
              row_evidence.append({**r,"canonical_id":canon(r.get("source")),
                                   "sha_ok":sha_ok,"source_ok":source_ok,"exact":exact})

          by_version=defaultdict(list)
          for r in row_evidence:
              key=(r.get("canonical_id"),r.get("source_commit"))
              by_version[key].append(r)

          versions=[]
          for (cid,sha),occ in by_version.items():
              locs={}
              for r in occ:
                  for x in r["exact"]: locs[x["directory"]]=x
              source_ok=all(r["source_ok"] for r in occ)
              sha_ok=all(r["sha_ok"] for r in occ)
              if any(r["manifest_status"]=="SKIPPED" for r in occ):
                  st="SKIPPED"
              elif not cid or not source_ok or not sha_ok:
                  st="INSUFFICIENT_EVIDENCE"
              elif not locs:
                  st="GAP"
              elif len(locs)>1:
                  st="DUPLICATE_RELOCATED"
              else:
                  st="COMPLETE"
              allparts=[p for x in locs.values() for p in x["parts"]]
              versions.append({
                "canonical_id":cid or "INSUFFICIENT_EVIDENCE",
                "canonical_name":next((r.get("slug") for r in occ if r.get("slug")),source_name(occ[0].get("source"))),
                "source_url":occ[0].get("source") or "INSUFFICIENT_EVIDENCE",
                "source_commit":sha if sha_ok else "INSUFFICIENT_EVIDENCE",
                "repository":repo,"branch":"main",
                "exact_path":"; ".join(sorted(locs)) if locs else "INSUFFICIENT_EVIDENCE",
                "manifest_paths":sorted(set(r["manifest_path"] for r in occ)),
                "zip_parts":max((len(x["parts"]) for x in locs.values()),default=0) if locs else "INSUFFICIENT_EVIDENCE",
                "maximum_part_size":max((p["size"] for p in allparts),default=0) if locs else "INSUFFICIENT_EVIDENCE",
                "workflow_run_url":f"{server}/{repo}/actions/runs/{run_id}",
                "status":st,
                "locations":[{"directory":d,"files":[p["path"] for p in x["parts"]]} for d,x in sorted(locs.items())],
                "evidence":{"tree_verified":True,"manifest_verified":True,"sha_verified":sha_ok,
                  "zip_verified":bool(locs),"destination_verified":bool(locs),"workflow_verified":True}
              })

          by_canon=defaultdict(list)
          for v in versions: by_canon[v["canonical_id"]].append(v)
          canonical=[{
            "canonical_id":cid,
            "versions":[{"source_commit":v["source_commit"],"status":v["status"],"locations":v["locations"]} for v in vals]
          } for cid,vals in sorted(by_canon.items())]

          counts=Counter(v["status"] for v in versions)
          # Count ZIP groups without a qualifying manifest mapping only as excluded archives, not invented components.
          mapped=set((x["directory"],norm(os.path.basename(p["path"]).rsplit("_",1)[0]))
                     for v in versions for x in v["locations"] for p in x["files"])
          unassociated=[]
          for (d,stem),ps in groups.items():
              if (d,stem) not in mapped:
                  unassociated.append({"directory":d,"stem":stem,"parts":len(ps),"maximum_part_size":max(p["size"] for p in ps)})

          result={
            "schema":"YAIWES-INVENTORY-INDEXES-V3-FAST",
            "repository":repo,"branch":"main","main_commit":head,
            "workflow_run_url":f"{server}/{repo}/actions/runs/{run_id}",
            "research_manifests":research,"manifest_errors":manifest_errors,
            "listing_errors":listing_errors,"versions":versions,"canonical_components":canonical,
            "excluded_non_downloaded":exclusions,"excluded_unassociated_archives":unassociated,
            "counts":{
              "manifest_rows":len(rows),"excluded_non_downloaded":len(exclusions),
              "unique_versions":len(versions),"unique_canonical":len(by_canon),
              "complete":counts["COMPLETE"],"duplicate_relocated":counts["DUPLICATE_RELOCATED"],
              "skipped":counts["SKIPPED"],"gaps":counts["GAP"],
              "insufficient_evidence":counts["INSUFFICIENT_EVIDENCE"],
              "listing_errors":len(listing_errors)
            }
          }
          with open("audit-v3-fast/inventory-fast-v3.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          with open("audit-v3-fast/inventory-fast-v3.md","w",encoding="utf-8") as f:
              f.write(f"# Auditoría forense optimizada V3 — {repo}\n\n")
              for k,v in result["counts"].items(): f.write(f"- {k}: {v}\n")
              f.write("\n## Versiones verificadas\n\n")
              for i,v in enumerate(versions,1):
                  f.write(f"{i}. {v['canonical_name']} — {v['status']} — {v['exact_path']}\n")
          PY

      - name: Validate evidence
        run: |
          test -s audit-v3-fast/inventory-fast-v3.json
          python3 -m json.tool audit-v3-fast/inventory-fast-v3.json >/dev/null

      - name: Upload optimized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-recovery-fast-agentes
          path: audit-v3-fast/
          if-no-files-found: error
          retention-days: 30
