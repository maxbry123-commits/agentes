name: Audit Extraction

on:
  workflow_run:
    workflows: ["Download Extract"]
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  ARTIFACT_ROOT: xray/input
  AUDIT_ROOT: xray/audit

jobs:
  audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository for manifest
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download extraction TAR artifact
        uses: actions/download-artifact@v8
        with:
          name: wordflow-extraction-${{ github.event.workflow_run.id }}.tar
          path: ${{ env.ARTIFACT_ROOT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract artifact TAR
        shell: bash
        run: |
          set -euo pipefail
          tar_file=$(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.tar' -print -quit)
          test -n "$tar_file"
          rm -rf "$ARTIFACT_ROOT/decoded"
          mkdir -p "$ARTIFACT_ROOT/decoded"
          tar -tf "$tar_file" > "$ARTIFACT_ROOT/tar-contents.txt"
          tar -xf "$tar_file" -C "$ARTIFACT_ROOT/decoded"
          test -s "$ARTIFACT_ROOT/decoded/evidence/EXTRACTION.json"
          test -n "$(find "$ARTIFACT_ROOT/decoded/extracted" -type f -print -quit)"

      - name: Forensic audit against exact source commits
        shell: python
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path

          root = Path(os.environ['ARTIFACT_ROOT']) / 'decoded'
          audit = Path(os.environ['AUDIT_ROOT'])
          audit.mkdir(parents=True, exist_ok=True)
          extraction = json.loads((root / 'evidence' / 'EXTRACTION.json').read_text(encoding='utf-8'))
          if extraction.get('status') != 'PASS':
              raise SystemExit('Extraction evidence is not PASS')
          rows = json.loads((root / 'evidence' / 'manifest.json').read_text(encoding='utf-8'))
          if len(rows) != 20:
              raise SystemExit(f'Expected 20 repositories, found {len(rows)}')

          def sha256_file(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def tree(directory):
              return {
                  p.relative_to(directory).as_posix(): sha256_file(p)
                  for p in directory.rglob('*') if p.is_file() and '.git' not in p.parts and '__MACOSX' not in p.parts and p.name != '.DS_Store'
              }

          results = []
          for row in rows:
              slug = row['slug']
              extracted = root / 'extracted' / slug
              if not extracted.is_dir():
                  raise SystemExit(f'{slug}: extracted directory missing')

              upstream = Path('.xray-upstream') / slug
              shutil.rmtree(upstream, ignore_errors=True)
              upstream.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'init', '-q', str(upstream)], check=True)
              subprocess.run(['git', '-C', str(upstream), 'remote', 'add', 'origin', row['source']], check=True)
              subprocess.run(['git', '-C', str(upstream), 'fetch', '--depth=1', 'origin', row['source_commit']], check=True)
              archive = upstream.parent / f'{slug}.source.tar'
              subprocess.run(['git', '-C', str(upstream), 'archive', '--format=tar', row['source_commit'], '-o', str(archive)], check=True)
              subprocess.run(['tar', '-xf', str(archive), '-C', str(upstream)], check=True)
              archive.unlink()

              ext_tree = tree(extracted)
              up_tree = tree(upstream)
              missing = sorted(set(up_tree) - set(ext_tree))
              extra = sorted(set(ext_tree) - set(up_tree))
              mismatched = sorted(k for k in set(up_tree) & set(ext_tree) if up_tree[k] != ext_tree[k])
              status = 'PASS' if not missing and not extra and not mismatched else 'FAIL'
              report = {
                  'slug': slug,
                  'status': status,
                  'source_commit': row['source_commit'],
                  'files_extracted': len(ext_tree),
                  'files_upstream': len(up_tree),
                  'missing': missing[:200],
                  'extra': extra[:200],
                  'content_mismatch': mismatched[:200]
              }
              (audit / f'{slug}.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              results.append(report)
              if status != 'PASS':
                  raise SystemExit(f'{slug}: forensic audit FAILED')

          (audit / 'GLOBAL.json').write_text(json.dumps({
              'audit_type': 'FORENSIC_XRAY',
              'source_extraction_run_id': os.environ.get('GITHUB_RUN_ID'),
              'repository_count': len(results),
              'status': 'PASS',
              'repositories': results
          }, indent=2) + '\n', encoding='utf-8')

      - name: Upload forensic audit
        uses: actions/upload-artifact@v7
        with:
          name: wordflow-audit-${{ github.run_id }}
          path: ${{ github.workspace }}/xray/audit/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: cat "$AUDIT_ROOT/GLOBAL.json" >> "$GITHUB_STEP_SUMMARY"
