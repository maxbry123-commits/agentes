name: research-download-chain-63-96

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/research-download-chain-63-96.yml']

permissions:
  contents: write

jobs:
  runner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner initialization probe
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER=$RUNNER_NAME"
          echo "OS=$RUNNER_OS"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "JOB=$GITHUB_JOB"
          test -n "$RUNNER_NAME"
          test -n "$GITHUB_RUN_ID"
          echo "RUNNER_INIT=PASS"
