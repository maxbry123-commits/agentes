name: YAIWES STEP 2 - WIRE PRUNE 1-20 NO TESTS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-step2-wire-prune-1-20.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaiwes-step2-wire-prune-1-20
  cancel-in-progress: false

jobs:
  wire-prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Claim nodes 1-20 for SOL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('📂 Bitácora stated JSON Craxy wall.json')
          d=json.loads(p.read_text())
          now=datetime.now(timezone.utc).isoformat()
          for node in d['nodes']:
              if 1 <= node['id'] <= 20:
                  if node.get('lock') not in ('FREE','CLAIMED'):
                      raise SystemExit(f"INVALID_LOCK:{node['id']}:{node.get('lock')}")
                  if node.get('lock') == 'CLAIMED' and node.get('owner') not in (None,'SOL'):
                      raise SystemExit(f"NODE_ALREADY_CLAIMED:{node['id']}:{node.get('owner')}")
                  node['owner']='SOL'; node['lock']='CLAIMED'
                  node.setdefault('checkpoint',{})['before']=node.get('checkpoint',{}).get('before') or f'{now} SOL START 1-20'
                  node.setdefault('history',[]).append({'at':now,'actor':'SOL','event':'CLAIM','step':node.get('current_step')})
          d['updated_at']=now
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'state(yaiwes): SOL claims nodes 1-20' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Materialize exact FABLES 1+2
        shell: bash
        run: |
          set -euo pipefail
          SRC='➡️📂 Wordflow LOOP Yaiwes/📂 archivos download/📂Archivo download 2'
          DST='Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus'
          mkdir -p "$DST"
          PART1="$SRC/🔌 enchufe universal parte 1 fusion fables Kimi k 3 universal_plugin_bus_v2_integrated.py"
          PART2="$SRC/🔌✅ enchufe universal parte 2 fusión de Kimi k 3 y fables ficha_contract_v2.py"
          test -f "$PART1" && test -f "$PART2"
          cp "$PART1" "$DST/universal_plugin_bus_v2_integrated.py"
          cp "$PART2" "$DST/ficha_contract_v2.py"
          cmp -s "$PART1" "$DST/universal_plugin_bus_v2_integrated.py"
          cmp -s "$PART2" "$DST/ficha_contract_v2.py"
          (cd "$DST" && sha256sum ficha_contract_v2.py universal_plugin_bus_v2_integrated.py > SOURCE_SHA256SUMS.txt)
          python3 "$DST/ficha_contract_v2.py"
          python3 "$DST/universal_plugin_bus_v2_integrated.py"

      - name: Audit existing wiring 1-20
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          R=Path('Agente Yaiwes principal')
          items=[
          (1,'APScheduler',R/'execution-orchestration/task-classifier-scheduler'),
          (2,'AWS-Step-Functions-DS-SDK',R/'execution-orchestration/state-machine-executor/aws-step-functions-ds-sdk'),
          (3,'Ajv',R/'definition-registry/schema-contracts/ajv'),
          (4,'Apache-APISIX',R/'mesh-routing-collaboration/apisix-api-gateway'),
          (5,'Apache-Airflow',R/'execution-orchestration/dag-executor/apache-airflow'),
          (6,'Argo-Workflows',R/'execution-orchestration/dag-executor/argo-workflows'),
          (7,'Azure-Durable-Functions',R/'execution-orchestration/state-machine-executor/azure-durable-functions'),
          (8,'BAML',R/'definition-registry/domain-specific-contracts/baml'),
          (9,'Burr',R/'execution-orchestration/state-machine-executor/burr'),
          (10,'Caddy',R/'mesh-routing-collaboration/caddy-gateway'),
          (11,'Camunda',R/'execution-orchestration/state-machine-executor/camunda'),
          (12,'Cedar',R/'definition-registry/authorization-model/cedar'),
          (13,'Celery',R/'execution-engine-pool/parallel-dispatch/celery'),
          (14,'Cerberus',R/'definition-registry/schema-contracts/cerberus'),
          (15,'Cerbos',R/'control-governance/policy-guardrails-permissions/cerbos'),
          (16,'Chroma',R/'tools-models-memory-knowledge/memory-microservices/chroma'),
          (17,'ClawHub',R/'kernel-principal/extension-kernel/capability-registry/clawhub'),
          (18,'Cloudflare-Workers-SDK',R/'execution-engine-pool/adapter-layer/cloudflare-workers-sdk'),
          (19,'Coconut',R/'kernel-principal/reasoning-kernel/decision-on-demand/coconut'),
          (20,'CodeUltraFeedback',R/'code-programming-engine/standards-forensic/code-ultrafeedback')]
          rows=[]
          for n,name,dest in items:
              row={'id':n,'component':name,'status':'OK','gaps':[]}
              if not dest.exists(): row['gaps'].append('DEST_MISSING')
              wp=dest/'WIRING.json'
              if not wp.exists(): row['gaps'].append('WIRING_MISSING'); rows.append(row); continue
              w=json.loads(wp.read_text())
              adapter=w.get('adapter') or 'adapter.py'
              ficha=w.get('manifest') or w.get('ficha')
              ap=dest/adapter; fp=dest/ficha if ficha else None
              if not ap.exists(): row['gaps'].append('ADAPTER_MISSING')
              if not fp or not fp.exists(): row['gaps'].append('FICHA_MISSING')
              if ap.exists():
                  code=ap.read_text(errors='ignore')
                  if ap.suffix=='.py': compile(code,str(ap),'exec')
                  generic=("if not ROOT.exists()" in code and "'exists': True" in code and 'runtime_command' not in code)
                  if generic: row['gaps'].append('GENERIC_SOURCE_PROBE')
              if fp and fp.exists():
                  f=json.loads(fp.read_text())
                  if not f.get('artifact_id'): row['gaps'].append('ARTIFACT_ID_MISSING')
              row['status']='GAP' if row['gaps'] else 'OK'
              rows.append(row)
              print(f"{n:02d} {name}: {row['status']} {','.join(row['gaps'])}")
          out=Path('Readme arquitectura Yaiwes/STEP2-AUDIT-1-20.json')
          out.write_text(json.dumps({'results':rows},ensure_ascii=False,indent=2)+'\n')
          print('OK',sum(r['status']=='OK' for r in rows),'GAP',sum(r['status']=='GAP' for r in rows))
          PY

      - name: Publish FABLES and audit
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus' 'Readme arquitectura Yaiwes/STEP2-AUDIT-1-20.json'
          git commit -m 'wire(yaiwes): materialize exact FABLES and audit nodes 1-20' || true
          git pull --rebase origin main
          git push origin HEAD:main
