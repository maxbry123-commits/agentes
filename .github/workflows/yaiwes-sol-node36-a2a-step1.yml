name: YAIWES SOL node36 A2A STEP1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-sol-node36-a2a-step1.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: yaiwes-sol-node36-a2a-step1
  cancel-in-progress: false
jobs:
  step1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/A2A-Protocol/code/README.md
            /Claude readme/FICHA-ADN-TECNICA-YAIWES.md
            /Claude readme/PLAN-ADQUISICION-COMPONENTES.md
            /Agente Yaiwes principal/mesh-routing-collaboration/
      - name: CLAIM node36 on fresh main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']
          with open(p,encoding='utf-8') as f: w=json.load(f)
          n=next((x for x in w['nodes'] if x.get('id')==36 and x.get('component')=='A2A-Protocol'),None)
          if not n: raise SystemExit('NODE36_NOT_FOUND')
          if n.get('owner')=='SOL GPT' and n.get('lock')=='CLAIMED':
              print('CLAIM_ALREADY_APPLIED'); raise SystemExit(0)
          if n.get('status')!='PENDING_STEP1' or n.get('owner') is not None or n.get('lock')!='FREE':
              raise SystemExit(f'CLAIM_BLOCKED status={n.get("status")} owner={n.get("owner")} lock={n.get("lock")}')
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          base=os.popen('git rev-parse HEAD').read().strip()
          n['owner']='SOL GPT'; n['lock']='CLAIMED'
          n.setdefault('checkpoint',{})['before']=f'{now} fresh main={base}; STEP1 claim; source=Core kernel Yaiwes/A2A-Protocol; exact target still unresolved'
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL GPT','event':'CLAIM_STEP1','base_sha':base})
          n.setdefault('evidence',[]).append(f'step1:claim:fresh_main:{base}')
          w['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(w,f,ensure_ascii=False,indent=2); f.write('\n')
          print('CLAIM_NODE36=PASS')
          PY
            git add -- "$WALL"
            if git diff --cached --quiet; then break; fi
            git commit -m 'crazy-wall: claim node36 A2A STEP1'
            if git push origin HEAD:main; then break; fi
            sleep $((attempt*2))
          done
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json, os
          w=json.load(open(os.environ['WALL'],encoding='utf-8'))
          n=next(x for x in w['nodes'] if x.get('id')==36)
          assert n.get('owner')=='SOL GPT' and n.get('lock')=='CLAIMED', n
          print('CLAIM_READBACK=PASS')
          PY
      - name: ANALYZE and fail-closed release when exact target is not authoritative
        shell: bash
        run: |
          set -euo pipefail
          test -f 'Core kernel Yaiwes/A2A-Protocol/code/README.md'
          grep -Eqi 'Agent2Agent|A2A' 'Core kernel Yaiwes/A2A-Protocol/code/README.md'
          grep -Eqi 'MCP|agent' 'Core kernel Yaiwes/A2A-Protocol/code/README.md'
          test -d 'Agente Yaiwes principal/mesh-routing-collaboration'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p=os.environ['WALL']; w=json.load(open(p,encoding='utf-8'))
          n=next((x for x in w['nodes'] if x.get('id')==36 and x.get('component')=='A2A-Protocol'),None)
          if not n: raise SystemExit('NODE36_NOT_FOUND')
          if n.get('owner')!='SOL GPT' or n.get('lock')!='CLAIMED': raise SystemExit('CLAIM_LOST')
          if n.get('target') is not None: raise SystemExit('TARGET_CHANGED_REVIEW_REQUIRED')
          readme=Path('Core kernel Yaiwes/A2A-Protocol/code/README.md').read_text(encoding='utf-8',errors='replace')
          ficha=Path('Claude readme/FICHA-ADN-TECNICA-YAIWES.md').read_text(encoding='utf-8',errors='replace')
          plan=Path('Claude readme/PLAN-ADQUISICION-COMPONENTES.md').read_text(encoding='utf-8',errors='replace')
          if 'Agent2Agent' not in readme and 'A2A' not in readme: raise SystemExit('README_FUNCTION_GAP')
          if 'CAPA 3' not in ficha or 'COORDINACIÓN' not in ficha: raise SystemExit('FICHA_COORDINATION_GAP')
          entries=sorted(x.name for x in Path('Agente Yaiwes principal/mesh-routing-collaboration').iterdir() if x.is_dir())
          # The authoritative node has target=null and neither FICHA nor acquisition plan supplies an exact A2A final subroute.
          # Therefore no destination is generated here; movement is forbidden by fail-closed policy.
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          n['status']='GAP'; n['current_step']=1; n['abc']=None; n['target']=None
          n['owner']=None; n['lock']='FREE'
          n.setdefault('checkpoint',{})['after']=f'{now} STEP1 GAP: A2A function/domain validated but exact authoritative final target absent; no move performed'
          ev=n.setdefault('evidence',[])
          ev.extend([
            'step1:readme:Core kernel Yaiwes/A2A-Protocol/code/README.md:PASS',
            'step1:function:A2A_agent_to_agent_interoperability_complements_MCP',
            'step1:ficha:CAPA_3_COORDINACION:PASS',
            'step1:domain_candidate:Agente Yaiwes principal/mesh-routing-collaboration/',
            'step1:physical_mesh_children:'+','.join(entries),
            'step1:GAP:wall_target_null_and_no_authoritative_exact_A2A_subroute_in_FICHA_or_PLAN',
            'step1:NO_MOVE_PERFORMED'
          ])
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP1_GAP_RELEASE','cause':'exact_authoritative_target_missing','no_move':True})
          n['next_action']='STEP1_ANALYZE_ABC_DESTINATION'
          w['updated_at']=now
          with open(p,'w',encoding='utf-8') as f: json.dump(w,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps({'node':36,'component':'A2A-Protocol','status':'GAP','target':None,'mesh_children':entries,'move_performed':False},ensure_ascii=False))
          PY
          for attempt in 1 2 3 4 5 6; do
            git add -- "$WALL"
            git diff --cached --quiet && break
            git commit -m 'crazy-wall: node36 A2A STEP1 gap no authoritative target'
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt*2))
          done
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json, os
          w=json.load(open(os.environ['WALL'],encoding='utf-8'))
          n=next(x for x in w['nodes'] if x.get('id')==36)
          assert n.get('status')=='GAP' and n.get('owner') is None and n.get('lock')=='FREE' and n.get('target') is None, n
          assert any(x=='step1:NO_MOVE_PERFORMED' for x in n.get('evidence',[])), n
          print('STEP1_GAP_READBACK=PASS')
          PY
      - name: Refresh generated inventory from updated Crazy Wall
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/yaiwes-core-complete-inventory-audit.yml/dispatches" -f ref=main
          echo 'INVENTORY_REFRESH_DISPATCHED=PASS'
