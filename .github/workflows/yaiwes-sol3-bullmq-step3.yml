name: YAIWES SOL3 BullMQ STEP3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol3-bullmq-step3.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol3-bullmq-step3
  cancel-in-progress: false

jobs:
  wire_microtest_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      TARGET: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq'
      ADAPTER: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yaiwes/bullmq_adapter.py'
      MICROTEST: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yaiwes/bullmq_microtest.cjs'
      FICHA: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yaiwes/ficha.bullmq.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
    steps:
      - name: Checkout BullMQ STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 8
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-sol3-bullmq-step3.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py

      - name: Claim BullMQ STEP3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('id')==33 and n.get('component')=='BullMQ')
          if node.get('current_step')!=3 or node.get('status') not in ('PASS_STEP2','GAP_STEP3','GAP'):
              raise SystemExit(f"BULLMQ_NOT_STEP3:{node.get('current_step')}:{node.get('status')}")
          if node.get('lock') not in ('FREE',None) or node.get('owner') not in (None,'SOL'):
              raise SystemExit(f"BULLMQ_LOCKED:{node.get('owner')}:{node.get('lock')}")
          node['owner']='SOL'; node['lock']='CLAIMED'; node['status']='PENDING_STEP3'
          node['checkpoint']['before']=(f"{now} SOL integración 3 STEP3 claim: canonical FABLES bus; build moved BullMQ, start real Redis, execute Queue->Worker job value 21->42, collect L2+L3+L4; no MOVE repeat")
          ev=node.setdefault('evidence',[])
          runner='step3:runner:.github/workflows/yaiwes-sol3-bullmq-step3.yml'
          if runner not in ev: ev.append(runner)
          node.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'CLAIM_STEP3'})
          node['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'
          data['updated_at']=now
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 3 claim BullMQ STEP3' || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Verify canonical FABLES bus
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          echo CANONICAL_FABLES_BUS_OK

      - name: Build BullMQ adapter microtest and ficha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ADAPTER")"
          cat > "$MICROTEST" <<'JS'
          const path = require('path');
          const target = path.resolve(__dirname, '..');
          const { Queue, Worker, QueueEvents } = require(path.join(target, 'dist/cjs/index.js'));
          const queueName = `yaiwes-bullmq-${Date.now()}-${process.pid}`;
          const connection = { host: '127.0.0.1', port: 6379, maxRetriesPerRequest: null };
          async function main() {
            const queue = new Queue(queueName, { connection });
            const events = new QueueEvents(queueName, { connection });
            const worker = new Worker(queueName, async job => ({ input: job.data.value, output: job.data.value * 2 }), { connection });
            try {
              await events.waitUntilReady(); await worker.waitUntilReady();
              const job = await queue.add('double', { value: 21 }, { removeOnComplete: true, removeOnFail: true });
              const result = await job.waitUntilFinished(events, 20000);
              if (!result || result.input !== 21 || result.output !== 42) throw new Error(`BAD_RESULT:${JSON.stringify(result)}`);
              console.log('YAIWES_BULLMQ_RESULT=' + JSON.stringify({status:'PASS', queue:queueName, job:'double', input:21, output:42}));
            } finally {
              await worker.close(); await events.close(); await queue.close();
            }
          }
          main().catch(err => { console.error(err && err.stack || err); process.exit(1); });
          JS
          cat > "$ADAPTER" <<'PY'
          """YAIWES BullMQ STEP3 adapter: FABLES to real BullMQ + Redis runtime microtest."""
          from __future__ import annotations
          import json, subprocess
          from pathlib import Path
          from typing import Any
          PLUGIN_ID='yaiwes.parallel_dispatch.bullmq'
          ROLE='redis_distributed_queue_worker'
          TARGET_RELATIVE='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq'
          def descriptor() -> dict[str,str]:
              return {'plugin_id':PLUGIN_ID,'role':ROLE,'microtest':'real_queue_worker_redis_21_to_42'}
          def run_microtest(repo_root: str | Path) -> dict[str,Any]:
              root=Path(repo_root).resolve(); target=root/TARGET_RELATIVE; script=target/'yaiwes'/'bullmq_microtest.cjs'
              if not (target/'dist'/'cjs'/'index.js').is_file(): raise RuntimeError('BULLMQ_DIST_CJS_MISSING')
              proc=subprocess.run(['node',str(script)],cwd=target,text=True,capture_output=True,timeout=30)
              if proc.returncode: raise RuntimeError(f'BULLMQ_RUNTIME_FAIL:{proc.returncode}:{proc.stderr[-1500:]}')
              line=next((x for x in proc.stdout.splitlines() if x.startswith('YAIWES_BULLMQ_RESULT=')),None)
              if not line: raise RuntimeError('BULLMQ_RESULT_MARKER_MISSING')
              result=json.loads(line.split('=',1)[1])
              if result.get('status')!='PASS' or result.get('input')!=21 or result.get('output')!=42: raise RuntimeError(f'BULLMQ_BAD_RESULT:{result}')
              return result
          PY
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          adapter=Path(os.environ['ADAPTER']); digest='sha256:'+hashlib.sha256(adapter.read_bytes()).hexdigest()
          manifest={
            'artifact_id':'yaiwes.parallel_dispatch.bullmq','version':'1.0.0','estado':'active','contract_hash':digest,'tribunal_case_id':'YAIWES-N33-BULLMQ-STEP3',
            'contrato':{'rol':'transform','consume':{'datatype':{'family':'json','type':'object','version':1}},'expone':{'datatype':{'family':'json','type':'object','version':1}}},
            'ejecucion':{'kind':'code','transport':'sdk','runtime_type':'compute','entry_point':os.environ['ADAPTER']+':run_microtest','idempotente':True},
            'seguridad':{'sandbox':'process','limites':{'timeout_ms':300000,'deadline_ms':300000}},'firma':{'gpg_key_id':'YAIWES-N33'},'categoria':'pipeline','etapa':'P',
            'perfiles':{'n0':{'habilitada':True,'iteraciones':1,'simulaciones':0,'criticas':0,'muestras_k':1}},'repeticion':{'max':1,'condicion':'nunca'},'repite_en':[],
            'activacion':{'eventos':['kernel.v2.plugin.enchufed'],'wake_words':[],'condicion':''},'presupuesto':{'n0':{'max_tokens':1,'max_ms':300000,'max_costo_usd':0.0}},
            'telemetria':{'metricas':['tiempo','errores','health'],'span_otel':True},'evidencia':{'produce':['L2_build','L3_runtime','L4_feature'],'destino':str(Path(os.environ['EVIDENCE']).parent)+'/'},
            'failover':{'sustituible_por':[],'compensacion':'fail_closed'},'salud':{'metodo':'exec','heartbeat_interval_s':30}
          }
          Path(os.environ['FICHA']).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('BULLMQ_ADAPTER_SHA256='+digest)
          PY

      - name: Setup Node and Redis
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yarn.lock'

      - name: Install and build moved BullMQ
        id: build
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y redis-server >/tmp/apt.log 2>&1
          cd "$TARGET"
          npm install -g yarn@1.22.22 >/tmp/yarn-global.log 2>&1
          yarn install --frozen-lockfile --ignore-scripts >/tmp/bullmq-install.log 2>&1
          rc1=$?
          if [ "$rc1" -eq 0 ]; then yarn build >/tmp/bullmq-build.log 2>&1; rc2=$?; else rc2=99; fi
          rc=$rc1; if [ "$rc" -eq 0 ]; then rc=$rc2; fi
          cat /tmp/bullmq-install.log; cat /tmp/bullmq-build.log 2>/dev/null || true
          tail_line="$(cat /tmp/bullmq-install.log /tmp/bullmq-build.log 2>/dev/null | tail -n 15 | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-1800)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "tail=$tail_line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: FABLES enchufe plus real BullMQ Redis microtest
        id: test
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          redis-server --daemonize yes >/tmp/redis-start.log 2>&1
          for i in $(seq 1 20); do redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          redis-cli ping > /tmp/redis-ping.log 2>&1
          python3 - <<'PY' > /tmp/bullmq-step3.log 2>&1
          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          root=Path.cwd(); adapter_path=root/os.environ['ADAPTER']; ficha_path=root/os.environ['FICHA']; bus_path=root/os.environ['BUS']
          source=adapter_path.read_text(encoding='utf-8'); manifest=json.loads(ficha_path.read_text(encoding='utf-8'))
          actual='sha256:'+hashlib.sha256(source.encode()).hexdigest(); assert actual==manifest['contract_hash']
          sys.path.insert(0,str(bus_path.parent)); import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus(); bus.add_tribunal_approval(manifest['tribunal_case_id'])
          candidate=bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']]); conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest,candidate,conventions,registered_by='SOL integración 3')
          assert reg.status==bus_mod.PluginStatus.ACTIVE and reg.plugin_id=='yaiwes.parallel_dispatch.bullmq'
          bus.health.heartbeat(reg.plugin_id); assert bus.check_plugin_health(reg.plugin_id)
          spec=importlib.util.spec_from_file_location('yaiwes_bullmq_adapter',adapter_path); mod=importlib.util.module_from_spec(spec); assert spec and spec.loader; spec.loader.exec_module(mod)
          result=mod.run_microtest(root); assert result['status']=='PASS' and result['input']==21 and result['output']==42,result
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result}); bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'redis_distributed_queue_worker','verified':True})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]; assert 'L2_build' in levels and 'L3_runtime' in levels and 'L4_feature' in levels,levels
          ev={'node':'BullMQ','worker':'SOL integración 3','status':'PASS','route':'FABLES -> BullMQ adapter -> built moved BullMQ -> real Redis -> Queue -> Worker -> job result','plugin_id':reg.plugin_id,'microtest':'real_queue_worker_redis_21_to_42','result':result,'evidence_levels':levels,'run':int(os.environ['GITHUB_RUN_ID']),'runner_commit':os.environ['GITHUB_SHA'],'adapter_sha256':actual,'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f','canonical_ficha_code_blob':'a72508027cc2458553ef6a2255a9aa33d9a77a21','prune':'NOT_NEEDED'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('BULLMQ_REAL_REDIS_MICROTEST=PASS input=21 output=42'); print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY
          rc=$?
          cat /tmp/redis-ping.log; cat /tmp/bullmq-step3.log
          tail_line="$(tail -n 15 /tmp/bullmq-step3.log | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-1800)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "tail=$tail_line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish BullMQ STEP3 evidence
        id: publish
        if: steps.build.outputs.rc == '0' && steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$MICROTEST" "$FICHA" "$EVIDENCE"; git commit -m 'test(yaiwes): SOL3 BullMQ FABLES Redis STEP3 PASS'
          git reset --hard HEAD
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; git reset --hard HEAD; sleep $((attempt*2))
          done
          test "$ok" -eq 1
          echo "evidence_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read-back BullMQ STEP3 evidence
        if: steps.build.outputs.rc == '0' && steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.parallel_dispatch.bullmq'
          git show "origin/main:$EVIDENCE" | grep -Fq '"output": 42'
          git show "origin/main:$EVIDENCE" | grep -Fq 'L4_feature'
          git show "origin/main:$EVIDENCE" | grep -Fq 'NOT_NEEDED'
          echo BULLMQ_STEP3_READBACK_OK

      - name: Checkpoint BullMQ STEP3 PASS or GAP and release
        shell: bash
        env:
          BUILD_RC: ${{ steps.build.outputs.rc }}
          BUILD_TAIL: ${{ steps.build.outputs.tail }}
          TEST_RC: ${{ steps.test.outputs.rc }}
          TEST_TAIL: ${{ steps.test.outputs.tail }}
          EVIDENCE_COMMIT: ${{ steps.publish.outputs.evidence_commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          build_rc=int(os.environ.get('BUILD_RC') or 99); raw=os.environ.get('TEST_RC'); test_rc=int(raw) if raw not in (None,'') else 99
          detail=(os.environ.get('BUILD_TAIL') if build_rc else os.environ.get('TEST_TAIL')) or 'NO_OUTPUT'; detail=detail[:1800]
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('id')==33 and n.get('component')=='BullMQ')
          if node.get('owner')!='SOL' or node.get('lock')!='CLAIMED' or node.get('current_step')!=3: raise SystemExit(f"LOCK_OR_STEP_CHANGED:{node.get('owner')}:{node.get('lock')}:{node.get('current_step')}")
          ev=node.setdefault('evidence',[])
          if build_rc==0 and test_rc==0:
              node['status']='PASS'; node['checkpoint']['after']='STEP3 PASS: canonical FABLES ACTIVE yaiwes.parallel_dispatch.bullmq; moved BullMQ built; real Redis Queue/Worker job input 21 returned 42; L2+L3+L4; prune NOT_NEEDED; origin/main evidence read-back PASS.'
              for item in [f"step3:run:{os.environ['GITHUB_RUN_ID']}",f"step3:evidence_commit:{os.environ.get('EVIDENCE_COMMIT') or 'unknown'}",'step3:canonical_bus_blob:470f9c91650bc6c59e2900f7e71090b84363da9f','step3:route:FABLES->BullMQ adapter->built moved BullMQ->real Redis->Queue->Worker','step3:microtest:PASS input=21 output=42','step3:evidence:L2_build+L3_runtime+L4_feature','step3:prune:NOT_NEEDED','step3:readback:adapter+ficha+evidence PASS']:
                  if item not in ev: ev.append(item)
              node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ.get('EVIDENCE_COMMIT')}); node['next_action']='COMPLETE'
          else:
              stage='BUILD' if build_rc else 'MICROTEST'; rc=build_rc if build_rc else test_rc
              node['status']='GAP_STEP3'; node['checkpoint']['after']=f"STEP3 GAP {stage} run={os.environ['GITHUB_RUN_ID']} rc={rc}: {detail}"; ev.append(f"step3:gap:{stage}:run:{os.environ['GITHUB_RUN_ID']}:rc={rc}:{detail}"); node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':f'STEP3_GAP_{stage}_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])}); node['next_action']='REPAIR_EXACT_STEP3_GAP_AND_RETRY'
          node['owner']=None; node['lock']='FREE'; data['updated_at']=now; data.setdefault('counts',{})['closed_current_contract']=sum(1 for n in data['nodes'] if n.get('next_action')=='COMPLETE')
          with open(os.environ['INVENTORY'],encoding='utf-8') as f: inv=json.load(f)
          comp=next(c for c in inv['components'] if c.get('name')=='BullMQ'); comp['wall_node_id']=node['id']; comp['wall_status']=node['status']; comp['wall_current_step']=node['current_step']; comp['wall_target']=node['target']
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          with open(os.environ['INVENTORY'],'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL" "$INVENTORY"; git commit -m "crazy-wall: SOL integración 3 BullMQ STEP3 checkpoint run $GITHUB_RUN_ID" || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Fail closed on BullMQ STEP3 GAP
        if: steps.build.outputs.rc != '0' || steps.test.outputs.rc != '0'
        shell: bash
        run: |
          echo 'BullMQ STEP3 GAP registered in Crazy Wall'
          exit 1
