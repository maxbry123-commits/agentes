name: Core Kernel YAIWES 10 Canonical Producer
run-name: Core Kernel YAIWES 10 Canonical Producer • ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-kernel-yaiwes-10-canonical-skill-20260908.yml'

permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: "0"
  SKILL_REF: c789e5fe635e220230ffc759d86dc3bbb8e261d4
  QUEUE_PATH: scripts/core-kernel-yaiwes-10-download-extract-20260908/QUEUE.json
  ARCHIVE_ROOT: Core kernel Yaiwes/_canonical_download_10
  EXPECTED: "10"

concurrency:
  group: agentes-core-kernel-yaiwes-10-producer
  cancel-in-progress: false

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout destination main
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, lfs: false}
      - name: Checkout pinned skill
        uses: actions/checkout@v4
        with:
          repository: maxbry123-commits/agentes
          ref: c789e5fe635e220230ffc759d86dc3bbb8e261d4
          path: _skill_source
          fetch-depth: 1
          lfs: false
      - name: Copy exact skill runtime and edit only task fields/ref
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _work "$ARCHIVE_ROOT"
          cp '_skill_source/skills/skills Github acción/assets/FORENSIC-PASS-research_download_chain.py' _work/task_chain.py
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          q=json.loads(Path(os.environ['QUEUE_PATH']).read_text()); comps=[]; gaps=[]
          for i,c in enumerate(q['components'],1):
              url=c['source_url'].rstrip('/'); requested=str(c.get('source_commit') or c.get('source_ref') or c.get('source_branch') or c.get('branch') or 'HEAD')
              try:
                  if not (url.startswith('https://') or url.startswith('git@')): raise RuntimeError('unsupported source')
                  if re.fullmatch(r'[0-9a-fA-F]{40}',requested): sha=requested.lower()
                  else:
                      sha=None
                      for query in (['HEAD'] if requested in {'HEAD','PROVIDER_NON_GITHUB'} else [f'refs/heads/{requested}',f'refs/tags/{requested}^{{}}',f'refs/tags/{requested}']):
                          r=subprocess.run(['git','ls-remote',url,query],text=True,capture_output=True,check=False); lines=r.stdout.strip().splitlines()
                          if lines: sha=lines[0].split()[0]; break
                      if not sha: raise RuntimeError('unresolved git ref/provider')
                  slug=c.get('slug') or c['name']; comps.append({'n':f'{i:02d}','slug':slug,'url':url+'.git' if url.startswith('https://github.com/') else url,'requested':url,'ref':sha})
              except Exception as e: gaps.append({'name':c.get('name'),'source_url':url,'source_ref':requested,'status':'SOURCE_PROVIDER_GAP','error':str(e)})
          if len(comps)+len(gaps)!=int(os.environ['EXPECTED']): raise SystemExit('INPUT_COUNT_GAP')
          p=Path('_work/task_chain.py'); s=p.read_text(); repos=[(x['n'],x['slug'],x['url'],x['ref']) for x in comps]
          s=re.sub(r'^REPOS=.*$', 'REPOS='+repr(repos), s, count=1, flags=re.M); s=s.replace('for number,slug,url in REPOS:', 'for number,slug,url,ref in REPOS:')
          old="sha=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip(); guard_source_tree(root); shutil.rmtree(root/'.git',ignore_errors=True)"
          new=("run(['git','fetch','--depth','1','origin',ref],cwd=root); run(['git','checkout','--detach',ref],cwd=root); sha=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip(); assert sha == ref, f'SOURCE_REF_MISMATCH expected={ref} actual={sha}'; guard_source_tree(root); shutil.rmtree(root/'.git',ignore_errors=True)")
          if old not in s: raise SystemExit('ASSET_GAP')
          s=s.replace(old,new); n=len(comps); s=s.replace('/20:',f'/{n}:').replace('20/20 repositories processed',f'{n}/{n} repositories processed'); p.write_text(s)
          Path(os.environ['ARCHIVE_ROOT'],'SOURCE_MAP.json').write_text(json.dumps({'expected':int(os.environ['EXPECTED']),'resolved':comps,'gaps':gaps},indent=2,ensure_ascii=False)+'\n')
          print('SKILL_ASSET_COPY_PASS resolved=',len(comps),'gaps=',len(gaps))
          PY
      - name: Execute exact copied skill producer
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local --unset-all filter.lfs.process || true
          git config --local filter.lfs.required false
          git config --local core.compression 0
          python3 _work/task_chain.py "$ARCHIVE_ROOT" _work/research-download
      - name: Producer read-back gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          test -s "$ARCHIVE_ROOT/RESEARCH_DOWNLOAD_MANIFEST.jsonl"; test -s "$ARCHIVE_ROOT/SOURCE_MAP.json"
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(os.environ['ARCHIVE_ROOT']); m=[json.loads(x) for x in (root/'RESEARCH_DOWNLOAD_MANIFEST.jsonl').read_text().splitlines() if x.strip()]; sm=json.loads((root/'SOURCE_MAP.json').read_text())
          complete={x.get('slug') for x in m if x.get('status')=='COMPLETE'}; missing=[x['slug'] for x in sm['resolved'] if x['slug'] not in complete]
          print('ARCHIVE_COMPLETE',len(complete),'RESOLVED',len(sm['resolved']),'SOURCE_GAPS',len(sm['gaps']))
          if missing: print('ARCHIVE_GAPS',missing); sys.exit(51)
          if sm['gaps']: print('SOURCE_GAPS',sm['gaps']); sys.exit(52)
          print('ARCHIVE_ONLY_PASS; EXTRACTED_TREE_REQUIRED')
          PY
