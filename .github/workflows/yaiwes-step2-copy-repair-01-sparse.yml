# Step2 COPY-only repair-01. Distinct from prepared full-checkout workflow.
name: YAIWES Step2 Copy Repair01 Sparse
run-name: YAIWES Step2 COPY Repair01 • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-step2-copy-repair-01-sparse.yml'

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: yaiwes-step2-copy-repair01-sparse-writer
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          lfs: false
          sparse-checkout: |
            ➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/donors/loop_engineer
            .github/workflows/yaiwes-step2-copy-repair-01-sparse.yml
          sparse-checkout-cone-mode: false
      - name: Sparse checkout source read-only fixed SHA
        uses: actions/checkout@v4
        with:
          repository: maxbry123-commits/Agentes-motores-Wordflow-YAIWES
          ref: 0ca97d7c7e8a2e20e986d18e273c6171a2684d30
          path: _src/agentes-motores
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            Loop Engineer/Loop-Engineer/loop
          sparse-checkout-cone-mode: false
      - name: COPY exact traced modules without move/rewrite
        shell: bash
        run: |
          set -euo pipefail
          SRC='_src/agentes-motores/Loop Engineer/Loop-Engineer/loop'
          DST='➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/donors/loop_engineer'
          files=(__init__.py runner.py runcontrol.py runtime.py reducer.py verifier.py plan.py events.py evidence.py fsm.py completion.py chain.py contract.py emit.py)
          mkdir -p "$DST"
          for f in "${files[@]}"; do
            test -f "$SRC/$f"
            if test -e "$DST/$f"; then
              cmp -s "$SRC/$f" "$DST/$f" || { echo "COLLISION_BLOCKED $DST/$f"; exit 31; }
            else
              cp -a "$SRC/$f" "$DST/$f"
            fi
          done
          printf '%s\n' 'https://github.com/maxbry123-commits/Agentes-motores-Wordflow-YAIWES' > "$DST/SOURCE_URL.txt"
          printf '%s\n' '0ca97d7c7e8a2e20e986d18e273c6171a2684d30' > "$DST/SOURCE_COMMIT.txt"
          printf '%s\n' 'Loop Engineer/Loop-Engineer/loop/{__init__,runner,runcontrol,runtime,reducer,verifier,plan,events,evidence,fsm,completion,chain,contract,emit}.py' > "$DST/SOURCE_PATHS.txt"
          (
            cd "$DST"
            find . -type f ! -name SOURCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS.txt
            sha256sum -c SOURCE_SHA256SUMS.txt
          )
          python3 -m py_compile "$DST"/*.py
          for f in "${files[@]}"; do cmp -s "$SRC/$f" "$DST/$f"; done
          echo 'STEP2_COPY_VERIFY=PASS 14/14'
      - name: Commit copy-only delta with concurrency guard
        shell: bash
        run: |
          set -euo pipefail
          DST='➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/donors/loop_engineer'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DST"
          if git diff --cached --quiet; then echo 'NO_CHANGE VERIFIED_EXISTING'; exit 0; fi
          git commit -m 'copy(yaiwes): preserve Loop Engineer donor modules for Wordflow LOOP'
          git fetch origin main
          remote=$(git rev-parse origin/main)
          parent=$(git rev-parse HEAD^)
          test "$remote" = "$parent" || { echo "CONCURRENT_WRITE_GAP remote=$remote parent=$parent"; exit 75; }
          git push --no-verify origin HEAD:main
