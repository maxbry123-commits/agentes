name: YAIWES Crazy Wall loop and kernel hold policy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-wall-loop-kernel-hold-policy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-wall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wall only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            .github/workflows/yaiwes-wall-loop-kernel-hold-policy.yml
            📂 Bitácora stated JSON Craxy wall.json
          sparse-checkout-cone-mode: false
      - name: Apply policy on fresh main and publish
        env:
          WALL: '📂 Bitácora stated JSON Craxy wall.json'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']
          with open(p,encoding='utf-8') as f: d=json.load(f)
          now=datetime.now(timezone.utc).isoformat()
          d['updated_at']=now
          d['kernel_hold_policy']={
            'approved': True,
            'rule': 'IF_KERNEL_MATERIAL_DETECTED_HOLD_ONLY_KERNEL_MATERIAL_AND_INTEGRATE_ALL_NON_KERNEL_REMAINDER',
            'kernel_material_status': 'HOLD_KERNEL_REVIEW',
            'non_kernel_remainder_status': 'CONTINUE_STRICT_3_STEPS',
            'preserve_single_yaiwes_head': True,
            'do_not_replace_yaiwes_kernel': True,
            'whole_component_hold_by_default': False,
            'minimum_unit_of_hold': 'kernel-specific file/module/subtree when separable',
            'inseparable_kernel_case': 'HOLD_COMPONENT_AND_RECORD_EXACT_REASON',
            'approved_at': now
          }
          d['temporal_pool_directive']={
            'component': 'Temporal',
            'mode': 'FULL_COMPONENT_INTEGRATION',
            'source': 'Core kernel Yaiwes/Componentes recuperados B/Temporal/',
            'target': 'Agente Yaiwes principal/execution-engine-pool/temporal/',
            'position': 'POOL_BELOW_YAIWES_AGENT',
            'kernel_hold_exemption_for_this_directive': True,
            'required_microtest': 'go test ./common/backoff -run ^$ -count=1',
            'status': 'SCHEDULED_BY_WORKFLOW',
            'workflow': '.github/workflows/yaiwes-temporal-full-pool-step3.yml'
          }
          d['sol_loop_persistence']={
            'workers': ['SOL_1','SOL_2','SOL_4'],
            'mode': 'ACTIVE_LOOP_CODA_PERSISTENCE_UNTIL_ALL_COMPONENTS_COMPLETE',
            'must_remain_active_while_pending_exists': True,
            'read_fresh_wall_each_iteration': True,
            'claim_free_component_only': True,
            'strict_steps': [
              'STEP_1_ANALYZE_ABC_DESTINATION',
              'STEP_2_MOVE_OR_COPY_WITH_AUTHORIZED_MOTOR',
              'STEP_3_WIRE_PRUNE_ONLY_IF_NEEDED_MICROTEST'
            ],
            'gap_rule': 'FIX_ONLY_MINIMUM_EXACT_GAP_INSIDE_CURRENT_STEP_RETEST_AND_CONTINUE',
            'blocked_rule': 'RELEASE_LOCK_CONTINUE_OTHER_FREE_COMPONENT_AND_RETRY_BLOCKED_COMPONENT_LATER',
            'forbidden': ['STOP_WITH_PENDING_COMPONENTS','CREATE_STEP_4','UNRELATED_REFACTOR','UNREQUESTED_ARCHITECTURE'],
            'stop_condition': 'ALL_COMPONENTS_COMPLETE_AND_PHYSICALLY_VERIFIED',
            'coda_persistence': True,
            'updated_at': now
          }
          hist=d.setdefault('directive_history',[])
          hist.append({'at':now,'actor':'ChatGPT/SOL','event':'APPROVE_KERNEL_HOLD_TEMPORAL_POOL_SOL_1_2_4_PERSISTENT_LOOP'})
          if len(hist)>100: d['directive_history']=hist[-100:]
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"
            if git diff --cached --quiet; then
              echo 'NO_CHANGE_WALL_ALREADY_UPDATED'
              exit 0
            fi
            git commit -m 'state(yaiwes): kernel hold policy and persistent SOL 1 2 4 loop'
            if git push origin HEAD:main; then exit 0; fi
            echo "push race attempt=$attempt; rebuilding from fresh main"
          done
          exit 1
