name: YAIWES real internal workflows V6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-real-internal-workflows-v6.yml'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v6.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v61.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaiwes-real-internal-workflows-v6
  cancel-in-progress: false

jobs:
  real-workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout active YAIWES source only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-real-internal-workflows-v6.yml
            /📂coda workflow persistencias/*/INTERNAL-SURGICAL-MANIFEST-V5.json
            /📂coda workflow persistencias/*/code/**/*.py
            /📂coda workflow persistencias/*/code/**/*.go
            /📂coda workflow persistencias/*/code/**/*.ts
            /📂coda workflow persistencias/*/code/**/*.js
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v6.py
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v61.py
            /📂coda workflow persistencias/🏈 cancha deportiva de fútbol/*

      - name: Validate V6.1 runner syntax
        run: |
          set -euo pipefail
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v6.py'
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v61.py'

      - name: Execute real internal workflows and FABLES handoffs
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v61.py'

      - name: Verify 23 real workflow executions plus closure node
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('📂coda workflow persistencias/🏈 cancha deportiva de fútbol/YAIWES-REAL-INTERNAL-WORKFLOW-REPORT-V6.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['components']==24
          assert d['real_internal_workflows_executed']==23, d
          assert d['source_unavailable_closures']==1, d
          assert d['status']=='CLOSED'
          assert all(x['real_internal_workflow'] for x in d['evidence'][:23])
          assert all(x['source'] and x['symbol'] and x['sha256'] for x in d['evidence'][:23])
          assert d['evidence'][23]['workflow_status']=='SOURCE_UNAVAILABLE_CLOSURE'
          assert d['evidence'][23]['handoff']=='CLOSE'
          print('REAL_INTERNAL_WORKFLOW_PASS=23/23 SOURCE_AVAILABLE')
          PY

      - name: Verify no quarantined source is wired
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('yaiwes_real_workflow_chain_v6.py','yaiwes_real_workflow_chain_v61.py'):
              t=(Path('📂coda workflow persistencias/Fables enchufe universal')/name).read_text(encoding='utf-8')
              for line in t.splitlines():
                  if '_yaiwes_upstream_quarantine' in line and 'never' not in line.lower() and 'quarantine' not in line.lower():
                      raise AssertionError(line)
          print('QUARANTINE_WIRING=DENIED')
          PY

      - name: Persist V6 evidence only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- '📂coda workflow persistencias/🏈 cancha deportiva de fútbol/YAIWES-REAL-INTERNAL-WORKFLOW-REPORT-V6.json'
          git add --sparse -- '📂coda workflow persistencias/🏈 cancha deportiva de fútbol/.yaiwes_v6_runtime'
          if git diff --cached --quiet; then
            echo NO_CHANGES
          else
            git commit -m 'test(coda): prove real internal YAIWES workflows v6.1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Final readback
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git rev-parse HEAD
          git rev-parse origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
