name: YAIWES Node37 Agent-xpu strict 3-step
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yaiwes-node37-agent-xpu-3step.yml']
permissions:
  contents: write
concurrency:
  group: yaiwes-node37-agent-xpu
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/yaiwes-node37-agent-xpu-3step.yml
            📂 Bitácora stated JSON Craxy wall.json
            Core kernel Yaiwes/Agent-xpu-LLM-xpu/
            Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/
            ➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py
            Readme arquitectura Yaiwes/README.md
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: STEP1 claim fresh
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json,datetime
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8'))
          n=next(x for x in d['nodes'] if x.get('id')==37 and x.get('component')=='Agent-xpu-LLM-xpu')
          assert n['status']=='PENDING_STEP1' and n['lock']=='FREE' and n['owner'] is None, n
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          n['owner']='SOL GPT'; n['lock']='CLAIMED'; n['status']='IN_PROGRESS_STEP1'
          n['checkpoint']['before']=f'{now} fresh main claim node37; source=Core kernel Yaiwes/Agent-xpu-LLM-xpu; target pending validated analysis'
          n['evidence'].append('step1:claim:fresh_main:'+__import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip())
          n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'CLAIM_STEP1'})
          d['updated_at']=now
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'crazy-wall: claim node37 Agent-xpu STEP1'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: STEP1 analyze B and exact canonical subdomain
        shell: bash
        run: |
          set -euo pipefail
          SRC='Core kernel Yaiwes/Agent-xpu-LLM-xpu'
          TARGET='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu'
          test -f "$SRC/code/README.md"
          test -f "$SRC/DOWNLOAD_EXTRACT_MANIFEST.json"
          test ! -e "$TARGET"
          grep -q 'on-device LLM inference engine' "$SRC/code/README.md"
          grep -q 'Continuous batching' "$SRC/code/README.md"
          grep -q 'parallel-dispatch/' 'Readme arquitectura Yaiwes/README.md'
          python3 - <<'PY'
          import json,datetime
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==37)
          assert n['owner']=='SOL GPT' and n['lock']=='CLAIMED' and n['status']=='IN_PROGRESS_STEP1'
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          n['abc']='B'; n['target']='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu/'
          n['current_step']=2; n['status']='PASS_STEP1'; n['owner']=None; n['lock']='FREE'
          n['checkpoint']['after']=f'{now} STEP1 PASS: B workflow/pool; local LLM inference runtime with concurrency+batching+scheduling -> canonical execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu'
          n['evidence'] += ['step1:readme:code/README.md:PASS','step1:classification:B','step1:reason:on-device LLM inference engine + concurrent agentic calls + continuous batching + priority scheduling','step1:architecture:execution-engine-pool/parallel-dispatch','step1:target:Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu/']
          n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP1_PASS_RELEASE'})
          n['next_action']='STEP2_MOVE_WITH_CANONICAL_MOTOR'; d['updated_at']=now
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'crazy-wall: node37 Agent-xpu STEP1 pass B parallel-dispatch'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: STEP2 claim fresh
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json,datetime
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==37)
          assert n['status']=='PASS_STEP1' and n['current_step']==2 and n['owner'] is None and n['lock']=='FREE', n
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          n['owner']='SOL GPT'; n['lock']='CLAIMED'; n['status']='IN_PROGRESS_STEP2'
          n['checkpoint']['before']=f'{now} STEP2 claim; Motor4 canonical blob locked by repo; target={n["target"]}'
          n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'CLAIM_STEP2'})
          d['updated_at']=now; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'crazy-wall: claim node37 Agent-xpu STEP2'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: STEP2 move with canonical Motor4 and provenance
        id: move
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          SRC='Core kernel Yaiwes/Agent-xpu-LLM-xpu'
          TARGET='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu'
          MOTOR='➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py'
          test "$(git hash-object "$MOTOR")" = '9a21facfe11327cf60a2afca8f415ad52f0ecbe5'
          test -d "$SRC"; test ! -e "$TARGET"
          MANIFEST="$SRC/DOWNLOAD_EXTRACT_MANIFEST.json"
          python3 - <<'PY'
          import json
          d=json.load(open('Core kernel Yaiwes/Agent-xpu-LLM-xpu/DOWNLOAD_EXTRACT_MANIFEST.json'))
          assert d['extraction_verified'] is True and d['reconstruction_verified'] is True
          assert d['source_commit']=='689be270aa29bb88447e3867cd97d85a55f454d5'
          assert d['source_tree']['sha256']=='128904fa67d4ccc75ed7655054e90fda9a7c6a5b879974f5c0f07a4ab3178217'
          PY
          SOURCE_DIR="$SRC" DEST_DIR="$TARGET" STATE_FILE='/tmp/node37-motor4-state.json' BATCH_SIZE=100 COLLISION_POLICY=fail python3 "$MOTOR" | tee /tmp/node37-motor4.out
          grep -q '"verdict": "VERIFIED_CLOSED"' /tmp/node37-motor4.out
          mkdir -p "$TARGET"
          printf '%s\n' 'https://github.com/xinming-wei/LLM.xpu.git' > "$TARGET/SOURCE_URL.txt"
          printf '%s\n' '689be270aa29bb88447e3867cd97d85a55f454d5' > "$TARGET/SOURCE_COMMIT.txt"
          printf '%s\n' '128904fa67d4ccc75ed7655054e90fda9a7c6a5b879974f5c0f07a4ab3178217' > "$TARGET/SOURCE_SHA256.txt"
          python3 - <<'PY'
          import json
          t='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu/YAIWES_PROVENANCE.json'
          d={'schema':'yaiwes.provenance/v1','source_url':'https://github.com/xinming-wei/LLM.xpu.git','source_commit':'689be270aa29bb88447e3867cd97d85a55f454d5','source_sha256':'128904fa67d4ccc75ed7655054e90fda9a7c6a5b879974f5c0f07a4ab3178217','source_manifest':'DOWNLOAD_EXTRACT_MANIFEST.json','move_motor_blob':'9a21facfe11327cf60a2afca8f415ad52f0ecbe5'}
          open(t,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          test ! -f "$SRC/code/README.md"
          test -f "$TARGET/code/README.md"
          test "$(cat "$TARGET/SOURCE_COMMIT.txt")" = '689be270aa29bb88447e3867cd97d85a55f454d5'
          test "$(cat "$TARGET/SOURCE_SHA256.txt")" = '128904fa67d4ccc75ed7655054e90fda9a7c6a5b879974f5c0f07a4ab3178217'
          git add -A -- "$SRC" "$TARGET"
          git commit -m 'move(yaiwes): node37 Agent-xpu into parallel-dispatch with provenance'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "move_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: STEP2 pass release
        shell: bash
        env:
          MOVE_COMMIT: ${{ steps.move.outputs.move_commit }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json,datetime,os
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==37)
          assert n['owner']=='SOL GPT' and n['lock']=='CLAIMED' and n['status']=='IN_PROGRESS_STEP2'
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); mc=os.environ['MOVE_COMMIT']
          n['current_step']=3; n['status']='PASS_STEP2'; n['owner']=None; n['lock']='FREE'
          n['checkpoint']['after']=f'{now} STEP2 PASS Motor4 VERIFIED_CLOSED; source staged path moved; provenance persisted; move_commit={mc}'
          n['evidence'] += ['step2:motor4_blob:9a21facfe11327cf60a2afca8f415ad52f0ecbe5','step2:motor4:VERIFIED_CLOSED','step2:move_commit:'+mc,'step2:readback:source README absent + target README present','step2:provenance:SOURCE_URL+SOURCE_COMMIT+SOURCE_SHA256+YAIWES_PROVENANCE']
          n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP2_PASS_RELEASE','commit':mc})
          n['next_action']='STEP3_WIRE_PRUNE_IF_NEEDED_MICROTEST'; d['updated_at']=now
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'crazy-wall: node37 Agent-xpu STEP2 pass release'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: STEP3 claim fresh
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json,datetime
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==37)
          assert n['status']=='PASS_STEP2' and n['current_step']==3 and n['owner'] is None and n['lock']=='FREE', n
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          n['owner']='SOL GPT'; n['lock']='CLAIMED'; n['status']='IN_PROGRESS_STEP3'
          n['checkpoint']['before']=f'{now} STEP3 claim; target readback then build microtest; wiring only if concrete need'
          n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'CLAIM_STEP3'})
          d['updated_at']=now; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m 'crazy-wall: claim node37 Agent-xpu STEP3'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: STEP3 microtest and close
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin main
          TARGET='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/agent-xpu-llm-xpu'
          test -f "$TARGET/code/CMakeLists.txt" || TEST_RC=90
          TEST_RC=${TEST_RC:-0}
          if [ "$TEST_RC" -eq 0 ]; then
            rm -rf /tmp/node37-build
            cmake -S "$TARGET/code" -B /tmp/node37-build -DBUILD_INTEL=OFF -DBUILD_CPU=OFF -DBUILD_AMD=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF > /tmp/node37-cmake-configure.log 2>&1 || TEST_RC=$?
          fi
          if [ "$TEST_RC" -eq 0 ]; then
            cmake --build /tmp/node37-build --parallel 2 > /tmp/node37-cmake-build.log 2>&1 || TEST_RC=$?
          fi
          export TEST_RC
          python3 - <<'PY'
          import json,datetime,os
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==37)
          assert n['owner']=='SOL GPT' and n['lock']=='CLAIMED' and n['status']=='IN_PROGRESS_STEP3'
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); rc=int(os.environ['TEST_RC'])
          n['owner']=None; n['lock']='FREE'
          if rc==0:
            n['status']='VERIFIED_CLOSED'; n['checkpoint']['after']=f'{now} STEP3 PASS: cmake configure+build without Intel hardware backend; WIRE_NOT_NEEDED; no pruning needed'
            n['evidence'] += ['step3:wire:NOT_NEEDED_direct_execution_pool_runtime','step3:prune:NOT_NEEDED','step3:microtest:cmake_BUILD_INTEL_OFF_configure_PASS','step3:microtest:cmake_build_PASS','step3:provenance_readback:PASS']
            n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP3_PASS_RELEASE','microtest':'cmake configure+build BUILD_INTEL=OFF'})
            n['next_action']='COMPLETE'
          else:
            n['status']='GAP'; n['checkpoint']['after']=f'{now} STEP3 GAP: hardware-independent cmake configure/build failed rc={rc}; moved target retained; no false PASS'
            n['evidence'] += [f'step3:microtest:FAIL:rc={rc}','step3:wire:NOT_GENERATED_WITHOUT_CONCRETE_NEED','step3:GAP_RELEASE']
            n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP3_GAP_RELEASE','cause':f'cmake_rc_{rc}'})
            n['next_action']='STEP3_REPAIR_MICROTEST'
          d['updated_at']=now; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'
          git commit -m "crazy-wall: node37 Agent-xpu STEP3 result rc=$TEST_RC"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "TEST_RC=$TEST_RC"
          if [ "$TEST_RC" -ne 0 ]; then
            echo '--- configure tail ---'; tail -80 /tmp/node37-cmake-configure.log 2>/dev/null || true
            echo '--- build tail ---'; tail -120 /tmp/node37-cmake-build.log 2>/dev/null || true
          fi
