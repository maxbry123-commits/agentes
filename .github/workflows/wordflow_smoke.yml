# T23 — smoke kernel + loop fake + deploy fake. No GH secrets. No vendor APIs.
name: wordflow-smoke
on:
  push:
    paths:
      - "extensions/wordflow_kernel/**"
      - "extensions/wordflow/engine/loop_bridge.py"
      - "extensions/github_deploy/**"
      - ".github/workflows/wordflow_smoke.yml"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kernel smokes
        env:
          PYTHONPATH: ${{ github.workspace }}/extensions
        run: |
          python -m wordflow_kernel.ficha_loader
          python -m wordflow_kernel.fail_closed
          python -m wordflow_kernel.handle_message
          python -m wordflow_kernel.preflight

  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Loop/bootstrap fake
        env:
          PYTHONPATH: ${{ github.workspace }}/extensions
        run: python -m wordflow_kernel.bootstrap_fake

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deploy FakePort only
        env:
          PYTHONPATH: ${{ github.workspace }}/extensions
        run: |
          python - <<'PY'
          from github_deploy.git_data_port import FakeGitDataPort
          FakeGitDataPort()
          print("ok deploy_fake")
          PY
