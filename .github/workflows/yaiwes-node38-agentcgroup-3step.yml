name: YAIWES Node38 AgentCgroup resume STEP2-3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yaiwes-node38-agentcgroup-3step.yml']
permissions:
  contents: write
concurrency:
  group: yaiwes-node38-agentcgroup
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/yaiwes-node38-agentcgroup-3step.yml
            📂 Bitácora stated JSON Craxy wall.json
            Core kernel Yaiwes/AgentCgroup/
            Agente Yaiwes principal/execution-orchestration/container-pod-isolation/agentcgroup/
            ➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate STEP2 claimed state
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==38 and x.get('component')=='AgentCgroup')
          assert n['current_step']==2 and n['status']=='IN_PROGRESS_STEP2' and n['owner']=='SOL GPT' and n['lock']=='CLAIMED', n
          assert n['abc']=='C' and n['target']=='Agente Yaiwes principal/execution-orchestration/container-pod-isolation/agentcgroup/', n
          PY
      - name: STEP2 repair Motor4 move batch 100
        id: move
        shell: bash
        run: |
          set -uo pipefail
          SRC='Core kernel Yaiwes/AgentCgroup'
          TARGET='Agente Yaiwes principal/execution-orchestration/container-pod-isolation/agentcgroup'
          MOTOR='➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py'
          test "$(git hash-object "$MOTOR")" = '9a21facfe11327cf60a2afca8f415ad52f0ecbe5' || exit 91
          python3 - <<'PY' || exit 92
          import json
          d=json.load(open('Core kernel Yaiwes/AgentCgroup/DOWNLOAD_EXTRACT_MANIFEST.json'))
          assert d['extraction_verified'] is True and d['reconstruction_verified'] is True
          assert d['source_commit']=='551ca1689b7d2d30db6b8a8613414750103cc68b'
          assert d['source_tree']['sha256']=='a35a1e1984e46da68663e8b621dee4340495720c01be249bccfe481fd5905f14'
          PY
          rm -f /tmp/node38-state.json /tmp/node38-motor4.out
          SOURCE_DIR="$SRC" DEST_DIR="$TARGET" STATE_FILE='/tmp/node38-state.json' BATCH_SIZE=100 COLLISION_POLICY=fail python3 "$MOTOR" | tee /tmp/node38-motor4.out
          MOVE_RC=${PIPESTATUS[0]}
          if [ "$MOVE_RC" -ne 0 ] || ! grep -q '"verdict": "VERIFIED_CLOSED"' /tmp/node38-motor4.out; then
            export MOVE_RC
            python3 - <<'PY'
          import json,datetime,os
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==38)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); rc=os.environ.get('MOVE_RC','unknown')
          n['status']='GAP'; n['owner']=None; n['lock']='FREE'; n['checkpoint']['after']=f'{now} STEP2 GAP Motor4 repair failed rc={rc}; partial destination requires readback before retry'
          n['evidence'] += [f'step2:repair:BATCH_SIZE_100:FAIL:rc={rc}','step2:GAP_RELEASE']; n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP2_GAP_RELEASE','cause':f'motor4_rc_{rc}'}); n['next_action']='STEP2_REPAIR_READBACK'
          d['updated_at']=now; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
            git add -A -- '📂 Bitácora stated JSON Craxy wall.json' "$SRC" "$TARGET" 2>/dev/null || true
            git commit -m 'crazy-wall: node38 STEP2 Motor4 repair gap' || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
            cat /tmp/node38-motor4.out
            exit 1
          fi
          mkdir -p "$TARGET"
          printf '%s\n' 'https://github.com/eunomia-bpf/agentcgroup.git' > "$TARGET/SOURCE_URL.txt"
          printf '%s\n' '551ca1689b7d2d30db6b8a8613414750103cc68b' > "$TARGET/SOURCE_COMMIT.txt"
          printf '%s\n' 'a35a1e1984e46da68663e8b621dee4340495720c01be249bccfe481fd5905f14' > "$TARGET/SOURCE_SHA256.txt"
          python3 - <<'PY'
          import json
          t='Agente Yaiwes principal/execution-orchestration/container-pod-isolation/agentcgroup/YAIWES_PROVENANCE.json'
          d={'schema':'yaiwes.provenance/v1','source_url':'https://github.com/eunomia-bpf/agentcgroup.git','source_commit':'551ca1689b7d2d30db6b8a8613414750103cc68b','source_sha256':'a35a1e1984e46da68663e8b621dee4340495720c01be249bccfe481fd5905f14','source_manifest':'DOWNLOAD_EXTRACT_MANIFEST.json','move_motor_blob':'9a21facfe11327cf60a2afca8f415ad52f0ecbe5'}
          open(t,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          test ! -f "$SRC/code/README.md"
          test -f "$TARGET/code/README.md"
          test "$(cat "$TARGET/SOURCE_COMMIT.txt")" = '551ca1689b7d2d30db6b8a8613414750103cc68b'
          test "$(cat "$TARGET/SOURCE_SHA256.txt")" = 'a35a1e1984e46da68663e8b621dee4340495720c01be249bccfe481fd5905f14'
          git add -A -- "$SRC" "$TARGET"
          git commit -m 'move(yaiwes): node38 AgentCgroup into container-pod-isolation with provenance'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "move_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: STEP2 pass release
        env:
          MOVE_COMMIT: ${{ steps.move.outputs.move_commit }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json,datetime,os
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==38)
          assert n['status']=='IN_PROGRESS_STEP2' and n['owner']=='SOL GPT' and n['lock']=='CLAIMED', n
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); mc=os.environ['MOVE_COMMIT']
          n['current_step']=3; n['status']='PASS_STEP2'; n['owner']=None; n['lock']='FREE'; n['checkpoint']['after']=f'{now} STEP2 PASS Motor4 VERIFIED_CLOSED after BATCH_SIZE repair; provenance persisted; move_commit={mc}'
          n['evidence'] += ['step2:prior_gap:BATCH_SIZE_150_INVALID','step2:fix:BATCH_SIZE_100','step2:motor4:VERIFIED_CLOSED','step2:move_commit:'+mc,'step2:provenance:SOURCE_URL+SOURCE_COMMIT+SOURCE_SHA256+YAIWES_PROVENANCE']; n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP2_PASS_RELEASE','commit':mc,'repair':'BATCH_SIZE_100'}); n['next_action']='STEP3_WIRE_PRUNE_IF_NEEDED_MICROTEST'; d['updated_at']=now
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'; git commit -m 'crazy-wall: node38 AgentCgroup STEP2 pass after batch repair'; git pull --rebase origin main; git push origin HEAD:main
      - name: STEP3 claim fresh
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json,datetime
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==38)
          assert n['status']=='PASS_STEP2' and n['current_step']==3 and n['owner'] is None and n['lock']=='FREE', n
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); n['owner']='SOL GPT'; n['lock']='CLAIMED'; n['status']='IN_PROGRESS_STEP3'; n['checkpoint']['before']=f'{now} STEP3 claim; upstream no-root/no-eBPF unittest'; n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'CLAIM_STEP3'}); d['updated_at']=now
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'; git commit -m 'crazy-wall: claim node38 AgentCgroup STEP3'; git pull --rebase origin main; git push origin HEAD:main
      - name: STEP3 upstream unit microtest and close
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin main
          TARGET='Agente Yaiwes principal/execution-orchestration/container-pod-isolation/agentcgroup'
          TEST_RC=0
          (cd "$TARGET/code/agentcg" && python3 -m unittest -v test_agentcgroupd.py) > /tmp/node38-tests.log 2>&1 || TEST_RC=$?
          export TEST_RC
          python3 - <<'PY'
          import json,datetime,os
          p='📂 Bitácora stated JSON Craxy wall.json'; d=json.load(open(p,encoding='utf-8')); n=next(x for x in d['nodes'] if x.get('id')==38)
          assert n['status']=='IN_PROGRESS_STEP3' and n['owner']=='SOL GPT' and n['lock']=='CLAIMED', n
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); rc=int(os.environ['TEST_RC']); n['owner']=None; n['lock']='FREE'
          if rc==0:
            n['status']='VERIFIED_CLOSED'; n['checkpoint']['after']=f'{now} STEP3 PASS upstream test_agentcgroupd.py; no root/eBPF required; WIRE_NOT_NEEDED_DIRECT_BACKEND'; n['evidence'] += ['step3:wire:NOT_NEEDED_DIRECT_BACKEND','step3:prune:NOT_NEEDED','step3:microtest:python_unittest_test_agentcgroupd:PASS','step3:privileged_eBPF_runtime:NOT_CLAIMED','step3:provenance_readback:PASS']; n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP3_PASS_RELEASE','microtest':'python3 -m unittest -v test_agentcgroupd.py'}); n['next_action']='COMPLETE'
          else:
            n['status']='GAP'; n['checkpoint']['after']=f'{now} STEP3 GAP upstream unit suite rc={rc}; privileged runtime not claimed'; n['evidence'] += [f'step3:microtest:FAIL:rc={rc}','step3:GAP_RELEASE']; n['history'].append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP3_GAP_RELEASE','cause':f'unittest_rc_{rc}'}); n['next_action']='STEP3_REPAIR_MICROTEST'
          d['updated_at']=now; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add -- '📂 Bitácora stated JSON Craxy wall.json'; git commit -m "crazy-wall: node38 AgentCgroup STEP3 result rc=$TEST_RC"; git pull --rebase origin main; git push origin HEAD:main
          cat /tmp/node38-tests.log
