name: test-wordflow
on:
  push:
    paths:
      - "extensions/wordflow/**"
      - ".github/workflows/test-wordflow.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Run wordflow unit tests
        env:
          PYTHONPATH: ${
{ github.workspace }}
        run: |
          python -m unittest discover -s extensions/wordflow/tests -p "test_*.py" -v
