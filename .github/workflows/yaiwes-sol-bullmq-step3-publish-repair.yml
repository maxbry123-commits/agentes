name: YAIWES SOL BullMQ STEP3 clean publish repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol-bullmq-step3-publish-repair.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol-bullmq-step3-publish-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      TARGET: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq'
      SOURCE_PATH: 'Core kernel Yaiwes/Componentes recuperados B/BullMQ'
      YDIR: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yaiwes'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      SOURCE_URL: 'https://github.com/taskforcesh/bullmq.git'
      SOURCE_COMMIT: 'ad5b79c2a6d49275b760892382252f47f0bba1d7'
      SOURCE_VERSION: '6.3.4'
      SOURCE_PACKAGE_BLOB: '6c059cb46bd4b43f2462a3a5710b0408a5a4c280'
      MOVE_COMMIT: 'f8b8d9f48925827ab98df5fc216842586c6c54a9'
      MOVE_DEST_TREE: '604737cd870d5f9fa624fb0aa25c9db6f67c3ab3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /📂 Bitácora stated JSON Craxy wall.json
            /Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/

      - name: Guard N33 existing claim and capture BEFORE evidence
        id: before
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['WALL'],encoding='utf-8'))
          n=next(x for x in d['nodes'] if x.get('id')==33 and x.get('component')=='BullMQ')
          assert n.get('current_step')==3, n
          assert n.get('owner')=='SOL' and n.get('lock')=='CLAIMED' and n.get('status')=='PENDING_STEP3', n
          print('N33_RESUME_OK')
          PY
          test "$(git rev-parse "${MOVE_COMMIT}:${TARGET}")" = "$MOVE_DEST_TREE"
          test "$(git rev-parse "${MOVE_COMMIT}:${TARGET}/package.json")" = "$SOURCE_PACKAGE_BLOB"
          BEFORE_COMMIT="$(git rev-parse "${MOVE_COMMIT}^")"
          BEFORE_SOURCE_TREE="$(git rev-parse "${MOVE_COMMIT}^:${SOURCE_PATH}")"
          echo "before_commit=$BEFORE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "before_source_tree=$BEFORE_SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "BEFORE path=$SOURCE_PATH tree=$BEFORE_SOURCE_TREE commit=$BEFORE_COMMIT"
          echo "MOVE_AFTER path=$TARGET tree=$MOVE_DEST_TREE commit=$MOVE_COMMIT package_blob=$SOURCE_PACKAGE_BLOB"

      - name: STEP2 provenance read-back without MOVE repeat
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$TARGET/package.json")" = "$SOURCE_PACKAGE_BLOB"
          test "$(python3 - <<'PY'
          import json,os
          print(json.load(open(os.path.join(os.environ['TARGET'],'package.json'),encoding='utf-8'))['version'])
          PY
          )" = "$SOURCE_VERSION"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          target=Path(os.environ['TARGET'])
          excluded={'SOURCE_URL.txt','SOURCE_COMMIT.txt','SOURCE_SHA256.txt','YAIWES_PROVENANCE.json'}
          rows=[]
          for p in sorted(target.rglob('*'), key=lambda x:x.as_posix()):
              if not p.is_file(): continue
              rel=p.relative_to(target).as_posix()
              if rel.startswith('yaiwes/') or rel in excluded: continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          manifest='\n'.join(rows)+'\n'; snap=hashlib.sha256(manifest.encode()).hexdigest()
          (target/'SOURCE_URL.txt').write_text(os.environ['SOURCE_URL']+'\n')
          (target/'SOURCE_COMMIT.txt').write_text(os.environ['SOURCE_COMMIT']+'\n')
          (target/'SOURCE_SHA256.txt').write_text(snap+'\n')
          prov={
            'schema':'yaiwes.provenance/v1',
            'source_url':os.environ['SOURCE_URL'],
            'source_commit':os.environ['SOURCE_COMMIT'],
            'source_version':os.environ['SOURCE_VERSION'],
            'source_package_git_blob':os.environ['SOURCE_PACKAGE_BLOB'],
            'source_snapshot_sha256':snap,
            'source_before':{
              'path':os.environ['SOURCE_PATH'],
              'commit':os.environ['MOVE_COMMIT']+'^',
              'tree_sha':'${{ steps.before.outputs.before_source_tree }}'
            },
            'move_after':{
              'path':os.environ['TARGET'],
              'commit':os.environ['MOVE_COMMIT'],
              'tree_sha':os.environ['MOVE_DEST_TREE']
            },
            'sha256_scope':'destination canonical snapshot excluding yaiwes/ and provenance files',
            'move_repeated':False
          }
          (target/'YAIWES_PROVENANCE.json').write_text(json.dumps(prov,ensure_ascii=False,indent=2)+'\n')
          print('SOURCE_SHA256='+snap)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'yarn'
          cache-dependency-path: 'Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/yarn.lock'

      - name: STEP3 wire + microtest real
        id: test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y redis-server >/tmp/apt.log 2>&1
          cd "$TARGET"
          npm install -g yarn@1.22.22 >/tmp/yarn-global.log 2>&1
          yarn install --frozen-lockfile --ignore-scripts >/tmp/install.log 2>&1
          yarn build >/tmp/build.log 2>&1
          cd "$GITHUB_WORKSPACE"
          redis-server --daemonize yes >/tmp/redis.log 2>&1
          for i in $(seq 1 20); do redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          redis-cli ping | grep -q PONG
          mkdir -p "$YDIR"
          cat > "$YDIR/bullmq_microtest.cjs" <<'JS'
          const path=require('path');const t=path.resolve(__dirname,'..');const {Queue,Worker,QueueEvents}=require(path.join(t,'dist/cjs/index.js'));const qn=`yaiwes-${Date.now()}-${process.pid}`;const connection={host:'127.0.0.1',port:6379,maxRetriesPerRequest:null};(async()=>{const q=new Queue(qn,{connection}),e=new QueueEvents(qn,{connection}),w=new Worker(qn,async j=>({input:j.data.value,output:j.data.value*2}),{connection});try{await e.waitUntilReady();await w.waitUntilReady();const j=await q.add('double',{value:21},{removeOnComplete:true,removeOnFail:true});const r=await j.waitUntilFinished(e,20000);if(r.input!==21||r.output!==42)throw Error('BAD_RESULT:'+JSON.stringify(r));console.log('YAIWES_BULLMQ_RESULT='+JSON.stringify({status:'PASS',input:21,output:42}));}finally{await w.close();await e.close();await q.close();}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          cat > "$YDIR/bullmq_adapter.py" <<'PY'
          import json,subprocess
          from pathlib import Path
          PLUGIN_ID='yaiwes.parallel_dispatch.bullmq'
          TARGET='Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq'
          def run_microtest(root):
              t=Path(root)/TARGET
              p=subprocess.run(['node',str(t/'yaiwes'/'bullmq_microtest.cjs')],cwd=t,text=True,capture_output=True,timeout=30)
              if p.returncode: raise RuntimeError(p.stderr[-1500:])
              line=next(x for x in p.stdout.splitlines() if x.startswith('YAIWES_BULLMQ_RESULT='))
              r=json.loads(line.split('=',1)[1])
              if r.get('input')!=21 or r.get('output')!=42: raise RuntimeError(str(r))
              return r
          PY
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          root=Path.cwd(); y=root/os.environ['YDIR']; a=y/'bullmq_adapter.py'; busp=root/os.environ['BUS']
          digest='sha256:'+hashlib.sha256(a.read_bytes()).hexdigest()
          ficha={'artifact_id':'yaiwes.parallel_dispatch.bullmq','version':'1.0.0','estado':'active','contract_hash':digest,'tribunal_case_id':'YAIWES-N33-BULLMQ-STEP3','contrato':{'rol':'transform','consume':{'datatype':{'family':'json','type':'object','version':1}},'expone':{'datatype':{'family':'json','type':'object','version':1}}},'ejecucion':{'kind':'code','transport':'sdk','runtime_type':'compute','entry_point':str(a)+':run_microtest','idempotente':True},'seguridad':{'sandbox':'process','limites':{'timeout_ms':300000,'deadline_ms':300000}},'firma':{'gpg_key_id':'YAIWES-N33'},'categoria':'pipeline','etapa':'P','perfiles':{'n0':{'habilitada':True,'iteraciones':1,'simulaciones':0,'criticas':0,'muestras_k':1}},'repeticion':{'max':1,'condicion':'nunca'},'repite_en':[],'activacion':{'eventos':['kernel.v2.plugin.enchufed'],'wake_words':[],'condicion':''},'presupuesto':{'n0':{'max_tokens':1,'max_ms':300000,'max_costo_usd':0.0}},'telemetria':{'metricas':['tiempo','errores','health'],'span_otel':True},'evidencia':{'produce':['L2_build','L3_runtime','L4_feature'],'destino':str(y)+'/'},'failover':{'sustituible_por':[],'compensacion':'fail_closed'},'salud':{'metodo':'exec','heartbeat_interval_s':30}}
          (y/'ficha.bullmq.v2.json').write_text(json.dumps(ficha,ensure_ascii=False,indent=2)+'\n')
          sys.path.insert(0,str(busp.parent)); import universal_plugin_bus_v2_integrated as b
          bus=b.UniversalPluginBus(); bus.add_tribunal_approval(ficha['tribunal_case_id'])
          reg=bus.enchufar(ficha,b.ComponentCandidate(a.read_text(),'python',[str(a)]),b.TargetConventions('python','snake_case','sync','gradual'),registered_by='SOL GPT')
          assert reg.status==b.PluginStatus.ACTIVE
          bus.health.heartbeat(reg.plugin_id); assert bus.check_plugin_health(reg.plugin_id)
          sp=importlib.util.spec_from_file_location('ba',a); m=importlib.util.module_from_spec(sp); sp.loader.exec_module(m)
          result=m.run_microtest(root); assert result=={'status':'PASS','input':21,'output':42}
          bus.evidence.collect(reg.plugin_id,b.EvidenceLevel.L3,{'microtest':result}); bus.evidence.collect(reg.plugin_id,b.EvidenceLevel.L4,{'capability':'redis_distributed_queue_worker','verified':True})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]; assert all(x in levels for x in ('L2_build','L3_runtime','L4_feature'))
          prov=json.load(open(root/os.environ['TARGET']/'YAIWES_PROVENANCE.json'))
          evidence={'node_id':33,'component':'BullMQ','status':'PASS','run_id':int(os.environ['GITHUB_RUN_ID']),'runtime':'node-22.22.2','plugin_id':reg.plugin_id,'route':'FABLES->BullMQ->Redis->Queue->Worker','result':result,'evidence_levels':levels,'adapter_sha256':digest,'source_snapshot_sha256':prov['source_snapshot_sha256'],'prune':['__pycache__'],'move_repeated':False}
          (y/'STEP3_EVIDENCE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print('BULLMQ_REAL_PASS',result,levels,digest)
          PY

      - name: Prune build dirt and publish only final evidence
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmp="$(mktemp -d)"
          cp -a "$YDIR" "$tmp/yaiwes"
          cp "$TARGET/SOURCE_URL.txt" "$TARGET/SOURCE_COMMIT.txt" "$TARGET/SOURCE_SHA256.txt" "$TARGET/YAIWES_PROVENANCE.json" "$tmp/"
          rm -rf "$tmp/yaiwes/__pycache__"
          git restore --worktree --staged -- "$TARGET"
          git clean -fd -- "$TARGET"
          mkdir -p "$TARGET"
          cp -a "$tmp/yaiwes" "$YDIR"
          cp "$tmp/SOURCE_URL.txt" "$tmp/SOURCE_COMMIT.txt" "$tmp/SOURCE_SHA256.txt" "$tmp/YAIWES_PROVENANCE.json" "$TARGET/"
          git add -- "$YDIR" "$TARGET/SOURCE_URL.txt" "$TARGET/SOURCE_COMMIT.txt" "$TARGET/SOURCE_SHA256.txt" "$TARGET/YAIWES_PROVENANCE.json"
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^A  (Agente Yaiwes principal/execution-engine-pool/parallel-dispatch/bullmq/(SOURCE_|YAIWES_PROVENANCE|yaiwes/))' || true)"
          git commit -m 'test(yaiwes): BullMQ STEP3 PASS provenance clean publish'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "after_tree=$(git rev-parse HEAD:\"$TARGET\")" >> "$GITHUB_OUTPUT"
              echo "url_blob=$(git rev-parse HEAD:\"$TARGET/SOURCE_URL.txt\")" >> "$GITHUB_OUTPUT"
              echo "commit_blob=$(git rev-parse HEAD:\"$TARGET/SOURCE_COMMIT.txt\")" >> "$GITHUB_OUTPUT"
              echo "sha256_blob=$(git rev-parse HEAD:\"$TARGET/SOURCE_SHA256.txt\")" >> "$GITHUB_OUTPUT"
              echo "prov_blob=$(git rev-parse HEAD:\"$TARGET/YAIWES_PROVENANCE.json\")" >> "$GITHUB_OUTPUT"
              echo "evidence_blob=$(git rev-parse HEAD:\"$YDIR/STEP3_EVIDENCE.json\")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 41

      - name: Register PASS and release N33 in Crazy Wall
        shell: bash
        env:
          ECOMMIT: ${{ steps.publish.outputs.commit }}
          AFTER_TREE: ${{ steps.publish.outputs.after_tree }}
          URL_BLOB: ${{ steps.publish.outputs.url_blob }}
          COMMIT_BLOB: ${{ steps.publish.outputs.commit_blob }}
          SHA256_BLOB: ${{ steps.publish.outputs.sha256_blob }}
          PROV_BLOB: ${{ steps.publish.outputs.prov_blob }}
          EVIDENCE_BLOB: ${{ steps.publish.outputs.evidence_blob }}
          BEFORE_SOURCE_TREE: ${{ steps.before.outputs.before_source_tree }}
          BEFORE_COMMIT: ${{ steps.before.outputs.before_commit }}
        run: |
          set -euo pipefail
          test -n "$ECOMMIT"; test -n "$AFTER_TREE"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p=os.environ['WALL']; d=json.load(open(p,encoding='utf-8'))
          n=next(x for x in d['nodes'] if x.get('id')==33 and x.get('component')=='BullMQ')
          assert n.get('owner')=='SOL' and n.get('lock')=='CLAIMED' and n.get('current_step')==3, n
          sha='0a38a940c39fc354caa19fbe093fc9b8c5572ed6a875e550dc1de12c825a5fa5'
          n['status']='PASS'
          n['next_action']='COMPLETE'
          n['checkpoint']['after']=f"STEP3 PASS run={os.environ['GITHUB_RUN_ID']} publish={os.environ['ECOMMIT']} Node22.22.2 FABLES ACTIVE Redis Queue/Worker input21->output42 L2+L3+L4; provenance SHA256={sha}; prune __pycache__; MOVE not repeated"
          ev=n.setdefault('evidence',[])
          facts=[
            f"before:path:{os.environ['SOURCE_PATH']}:commit:{os.environ['BEFORE_COMMIT']}:tree:{os.environ['BEFORE_SOURCE_TREE']}",
            f"move_after:path:{os.environ['TARGET']}:commit:{os.environ['MOVE_COMMIT']}:tree:{os.environ['MOVE_DEST_TREE']}:package_blob:{os.environ['SOURCE_PACKAGE_BLOB']}",
            f"final:path:{os.environ['TARGET']}:commit:{os.environ['ECOMMIT']}:tree:{os.environ['AFTER_TREE']}",
            f"provenance:SOURCE_URL.txt:blob:{os.environ['URL_BLOB']}",
            f"provenance:SOURCE_COMMIT.txt:blob:{os.environ['COMMIT_BLOB']}",
            f"provenance:SOURCE_SHA256.txt:blob:{os.environ['SHA256_BLOB']}:sha256:{sha}",
            f"provenance:YAIWES_PROVENANCE.json:blob:{os.environ['PROV_BLOB']}",
            f"step3:STEP3_EVIDENCE.json:blob:{os.environ['EVIDENCE_BLOB']}",
            f"step3:run:{os.environ['GITHUB_RUN_ID']}:PASS:Node22.22.2:L2+L3+L4:input21-output42",
            'step3:prune:__pycache__',
            'step2:move_repeated:false'
          ]
          for x in facts:
              if x not in ev: ev.append(x)
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL GPT','event':'STEP3_PASS_PROVENANCE_CLOSED_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ['ECOMMIT']})
          n['owner']=None; n['lock']='FREE'; d['updated_at']=now
          d.setdefault('counts',{})['closed_current_contract']=sum(1 for x in d['nodes'] if x.get('next_action')=='COMPLETE')
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2); open(p,'a',encoding='utf-8').write('\n')
          PY
            git add -- "$WALL"
            git commit -m "crazy-wall: close N33 BullMQ STEP3 run $GITHUB_RUN_ID"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 41
