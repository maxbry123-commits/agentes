name: YAIWES Airflow Bytecode Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-airflow-bytecode-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Remove generated bytecode only
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow'
          find "$ROOT" -type f -name '*.pyc' -print -delete
          find "$ROOT" -type d -name '__pycache__' -empty -print -delete || true
          if find "$ROOT" -type f -name '*.pyc' | grep -q .; then
            echo 'PYC_REMAINS' >&2
            exit 1
          fi
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u 'Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow'
          if git diff --cached --quiet; then
            echo 'NO_BYTECODE_CHANGES'
            exit 0
          fi
          git commit -m 'fix(yaiwes): remove generated Airflow bytecode artifacts'
          git push origin HEAD:main
