name: Deploy Claude MCP B to Hugging Face

on:
  push:
    branches: [claude-mcp-write-test]
    paths:
      - 'claude-mcp-b/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: claude-mcp-b-huggingface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish only the MCP bundle to the Space root
        env:
          HF_OIDC_RESOURCE: spaces/COMAND-CENTER-1/claude-github-mcp-backup
        run: |
          hf upload COMAND-CENTER-1/claude-github-mcp-backup ./claude-mcp-b . \
            --repo-type space \
            --commit-message "Deploy Claude MCP B from ${GITHUB_SHA::7}"
