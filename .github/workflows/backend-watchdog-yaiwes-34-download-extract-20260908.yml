name: Backend Watchdog YAIWES 34 Download Extract
run-name: Backend Watchdog YAIWES 34 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-watchdog-yaiwes-34-download-extract-20260908.yml'

permissions:
  contents: write

env:
  TASK_ID: backend-watchdog-yaiwes-34-download-extract-20260908
  QUEUE_FILE: scripts/backend-watchdog-yaiwes-34-download-extract-20260908/QUEUE.json
  SKILL_REF: c789e5fe635e220230ffc759d86dc3bbb8e261d4
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: maxbry123-commits-agentes-backend-watchdog-yaiwes-34
  cancel-in-progress: false

jobs:
  queue-34:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout destination main NO-LFS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Preflight immutable skill and exact queue
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json;print(json.load(open("'"$QUEUE_FILE"'"))["expected_components"])')" = "34"
          mkdir -p "$RUNNER_TEMP/skill-lock" "$RUNNER_TEMP/sources"
          curl -fL --retry 3 --retry-delay 3 \
            "https://raw.githubusercontent.com/maxbry123-commits/agentes/${SKILL_REF}/skills/skills%20Github%20acci%C3%B3n/SKILL.md" \
            -o "$RUNNER_TEMP/skill-lock/SKILL.md"
          grep -Fq 'version: "3.7.0"' "$RUNNER_TEMP/skill-lock/SKILL.md"
          grep -Fq 'EXTRACTED_TREE' "$RUNNER_TEMP/skill-lock/SKILL.md"
          grep -Fq 'Git LFS está prohibido' "$RUNNER_TEMP/skill-lock/SKILL.md"
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          git config --local core.autocrlf false

      - name: Process queue sequentially with pinned source SHA
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gaps.tsv"
          : > "$RUNNER_TEMP/verified.tsv"
          : > "$RUNNER_TEMP/deferred.tsv"
          python3 - "$QUEUE_FILE" > "$RUNNER_TEMP/queue.tsv" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1],encoding='utf-8'))
          for c in q['components']:
              print(f"{c['director_index']}\t{c['slug']}\t{c['mode']}\t{c['source_url']}\t{c['destination']}")
          PY
          while IFS=$'\t' read -r idx slug mode url dest; do
            echo "===== QUEUE ${idx}/34: ${slug} mode=${mode} ====="
            if [[ "$mode" = "REFERENCE_SELECT_ONLY" ]]; then
              printf '%s\t%s\tREFERENCE_SELECT_ONLY\t%s\n' "$idx" "$slug" "$dest" >> "$RUNNER_TEMP/deferred.tsv"
              continue
            fi
            if [[ "$mode" = "REUSE" ]]; then
              if [[ -d "$dest" ]] && find "$dest" -type f -print -quit | grep -q .; then
                printf '%s\t%s\tREUSE_EXISTING\t%s\n' "$idx" "$slug" "$dest" >> "$RUNNER_TEMP/verified.tsv"
              else
                printf '%s\t%s\tREUSE_DESTINATION_GAP:%s\n' "$idx" "$slug" "$dest" >> "$RUNNER_TEMP/gaps.tsv"
              fi
              continue
            fi
            pinned="$(git ls-remote "$url" HEAD | awk 'NR==1{print $1}')"
            if [[ ! "$pinned" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\t%s\tSOURCE_REF_GAP\n' "$idx" "$slug" >> "$RUNNER_TEMP/gaps.tsv"; continue
            fi
            src="$RUNNER_TEMP/sources/$slug"; rm -rf "$src"
            set +e
            git -c filter.lfs.smudge= -c filter.lfs.clean= -c filter.lfs.process= -c filter.lfs.required=false clone --depth 1 --single-branch --no-tags "$url" "$src"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then printf '%s\t%s\tCLONE_GAP\n' "$idx" "$slug" >> "$RUNNER_TEMP/gaps.tsv"; continue; fi
            actual="$(git -C "$src" rev-parse HEAD)"
            if [[ "$actual" != "$pinned" ]]; then printf '%s\t%s\tSOURCE_REF_MOVED_GAP\n' "$idx" "$slug" >> "$RUNNER_TEMP/gaps.tsv"; rm -rf "$src"; continue; fi
            rm -rf "$src/.git"
            set +e
            python3 - "$src" <<'PY'
          import pathlib,sys,os
          root=pathlib.Path(sys.argv[1]); lim=100*1024*1024; prefix=b'version https://git-lfs.github.com/spec/v1'
          for p in root.rglob('*'):
              if p.is_symlink():
                  target=(p.parent/os.readlink(p)).resolve()
                  if not target.is_relative_to(root.resolve()): raise SystemExit('UNSAFE_SOURCE_SYMLINK')
              elif p.is_file():
                  if p.stat().st_size>=lim: raise SystemExit('GIT_BLOB_LIMIT_GAP')
                  if p.stat().st_size<=1024 and p.read_bytes().startswith(prefix): raise SystemExit('SOURCE_LFS_POINTER_GAP')
          PY
            grc=$?; set -e
            if [[ $grc -ne 0 ]]; then printf '%s\t%s\tSOURCE_GUARD_GAP\n' "$idx" "$slug" >> "$RUNNER_TEMP/gaps.tsv"; rm -rf "$src"; continue; fi
            if [[ -e "$dest" ]]; then
              if [[ -f "$dest/SOURCE_URL.txt" && -f "$dest/SOURCE_COMMIT.txt" ]] && [[ "$(tr -d '\r\n' < "$dest/SOURCE_URL.txt")" = "$url" ]] && [[ "$(tr -d '\r\n' < "$dest/SOURCE_COMMIT.txt")" = "$pinned" ]]; then
                printf '%s\t%s\tVERIFIED_EXISTING\t%s\n' "$idx" "$slug" "$pinned" >> "$RUNNER_TEMP/verified.tsv"; rm -rf "$src"; continue
              fi
              printf '%s\t%s\tCOLLISION_BLOCKED:%s\n' "$idx" "$slug" "$dest" >> "$RUNNER_TEMP/gaps.tsv"; rm -rf "$src"; continue
            fi
            mkdir -p "$dest"; cp -a "$src/." "$dest/"
            printf '%s\n' "$url" > "$dest/SOURCE_URL.txt"; printf '%s\n' "$pinned" > "$dest/SOURCE_COMMIT.txt"; printf 'UNKNOWN\n' > "$dest/SOURCE_LICENSE.txt"
            python3 - "$dest" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='SOURCE_SHA256SUMS.txt'):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              rows.append(f"{h.hexdigest()}  {p.relative_to(root).as_posix()}\n")
          (root/'SOURCE_SHA256SUMS.txt').write_text(''.join(rows),encoding='utf-8')
          PY
            git add -- "$dest"; printf '%s\t%s\tEXTRACTED_TREE\t%s\n' "$idx" "$slug" "$pinned" >> "$RUNNER_TEMP/verified.tsv"; rm -rf "$src"
          done < "$RUNNER_TEMP/queue.tsv"
          python3 - "$RUNNER_TEMP/verified.tsv" "$RUNNER_TEMP/gaps.tsv" "$RUNNER_TEMP/deferred.tsv" > "$RUNNER_TEMP/summary.json" <<'PY'
          import json,pathlib,sys,os
          v=pathlib.Path(sys.argv[1]).read_text().splitlines(); g=pathlib.Path(sys.argv[2]).read_text().splitlines(); d=pathlib.Path(sys.argv[3]).read_text().splitlines()
          print(json.dumps({'task_id':os.getenv('TASK_ID'),'run_id':os.getenv('GITHUB_RUN_ID'),'verified_or_reused':len(v),'gaps':g,'deferred_reference_selection':d,'verdict':'ACTIVE_LOOP' if g else 'PRODUCER_PASS_WITH_REFERENCE_DEFERRED'},indent=2))
          PY
          cp "$RUNNER_TEMP/summary.json" "Core kernel Yaiwes/Backend watchdog workflow adaptativo/ACQUISITION_CHECKPOINT_20260908.json"
          git add -- "Core kernel Yaiwes/Backend watchdog workflow adaptativo/ACQUISITION_CHECKPOINT_20260908.json"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m 'build(backend-watchdog): acquire pinned component queue'
            for n in 1 2 3; do git fetch origin main; if git rebase --autostash origin/main && git -c core.hooksPath=/dev/null push origin HEAD:main; then break; fi; test "$n" -lt 3 || exit 41; sleep $((n*5)); done
          fi

      - name: Read-back and fail closed on actionable GAPs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          test -f "Core kernel Yaiwes/Backend watchdog workflow adaptativo/ACQUISITION_CHECKPOINT_20260908.json"
          if [[ -s "$RUNNER_TEMP/gaps.tsv" ]]; then cat "$RUNNER_TEMP/gaps.tsv"; exit 52; fi
          echo 'ACTIONABLE_QUEUE_PASS; reference-only candidates remain intentionally deferred for surgical selection.'

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-watchdog-yaiwes-34-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/verified.tsv
            ${{ runner.temp }}/gaps.tsv
            ${{ runner.temp }}/deferred.tsv
          if-no-files-found: warn
