name: YAIWES Wordflow Agent Source Canonical Copy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-wordflow-agent-source-copy.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-wordflow-agent-source-copy
  cancel-in-progress: false

jobs:
  canonical-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout target sparse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ➡️📂 Wordflow LOOP Yaiwes
            ➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de copiar archivos/motor_3_copy_batches.py
            Core kernel Yaiwes/Hermes-Agent
            Core kernel Yaiwes/OpenClaw
            Core kernel Yaiwes/Meta-Muse-Glimmer-Agent-2026

      - name: Checkout pinned external agent sources sparse
        uses: actions/checkout@v4
        with:
          repository: maxbry123-commits/Agentes-motores-Wordflow-YAIWES
          ref: 6c44c5c4d7fcc7b1e941c5e24dde59fd2ad40e3f
          path: source_external
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            OpenCode/OpenCode
            OpenHands/OpenHands
            Core kernel razonamiento repo para Yaiwes/Claude-Code/Claude-Code
            Core kernel razonamiento repo para Yaiwes/MiMo
            Core kernel razonamiento repo para Yaiwes/Codex/Codex
            Core kernel razonamiento repo para Yaiwes/SmolAgents
            Core kernel razonamiento repo para Yaiwes/Aider/Aider
            Core kernel razonamiento repo para Yaiwes/Kimi-K2.5/Kimi-K2.5
            Core kernel razonamiento repo para Yaiwes/Qwen-Agent/Qwen-Agent
            Core kernel razonamiento repo para Yaiwes/Cline/Cline
            Agent-Zero
            OpenDev
            Research Agent Lab
            MiroThinker

      - name: Validate runner syntax and locked motor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            '➡️📂 Wordflow LOOP Yaiwes/runtime/src/core/canonical_motor_gate.py' \
            '➡️📂 Wordflow LOOP Yaiwes/runtime/src/core/agent_source_copy_runner.py' \
            '➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de copiar archivos/motor_3_copy_batches.py'

      - name: Execute canonical copy 1x1 and capture verdict
        id: copy
        shell: bash
        run: |
          set +e
          python '➡️📂 Wordflow LOOP Yaiwes/runtime/src/core/agent_source_copy_runner.py' \
            --repo-root "$GITHUB_WORKSPACE" \
            --external-root "$GITHUB_WORKSPACE/source_external" \
            --plan "$GITHUB_WORKSPACE/➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/agent_sources/AGENT_SOURCE_COPY_PLAN_2026-09-15.json" \
            | tee /tmp/agent-source-copy.out
          rc=${PIPESTATUS[0]}
          echo "runner_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist exact Wordflow outputs no force
        shell: bash
        run: |
          set -euo pipefail
          find '➡️📂 Wordflow LOOP Yaiwes' -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            '➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/agent_sources' \
            '➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/evidence/AGENT_SOURCE_COPY_2026-09-15.json' \
            '➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/evidence/agent-source-copy-state'
          if git diff --cached --quiet; then
            echo 'NO_NEW_COPY_OUTPUTS'
          else
            git commit -m 'copy(wordflow): canonical agent sources with readback evidence'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fresh remote readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show 'origin/main:➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/evidence/AGENT_SOURCE_COPY_2026-09-15.json' > /tmp/remote-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/remote-evidence.json').read_text())
          print('REMOTE_VERDICT=' + p['verdict'])
          print('REMOTE_VERIFIED_TOTAL=' + str(p['verified_total']))
          print('REMOTE_UNRESOLVED_TOTAL=' + str(p['unresolved_total']))
          print('REMOTE_FAILURES=' + str(p['failures']))
          if p['failures']:
              raise SystemExit('REMOTE_READBACK_HAS_COPY_GAPS')
          if p['verified_total'] != 17 or p['unresolved_total'] != 1:
              raise SystemExit('REMOTE_READBACK_COUNT_GAP')
          PY

      - name: Final fail-closed verdict
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.copy.outputs.runner_rc }}' = '0'
          echo 'YAIWES_AGENT_SOURCE_COPY=PARTIAL_VERIFIED_17_OF_18'
