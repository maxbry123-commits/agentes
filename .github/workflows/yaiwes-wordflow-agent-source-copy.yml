name: YAIWES Wordflow Agent Source Canonical Copy

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Copy scope
        required: false
        default: meta4
        type: choice
        options:
          - meta4
          - legacy_full
  push:
    paths:
      - '.github/workflows/yaiwes-wordflow-agent-source-copy.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-wordflow-agent-source-copy
  cancel-in-progress: false

jobs:
  meta-four-copy:
    if: ${{ github.event_name == 'push' || inputs.scope == 'meta4' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact sources, destination and immutable motor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Motores/MOTOR-CODE-LOCK.json
            Motores/OPERATIONS-LEDGER.jsonl
            Motores/➡️📂motor de copiar archivos/motor_3_copy_batches.py
            Core kernel Yaiwes/Meta-Muse-Code-SDK-2026/code
            Core kernel Yaiwes/Meta-Muse-Glimmer-Agent-2026/code
            Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/13_macos_cua
            Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/11_github_repo_agent
            ➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources

      - name: Validate immutable Motor 3 against MOTOR-CODE-LOCK
        shell: bash
        run: |
          set -euo pipefail
          MOTOR='Motores/➡️📂motor de copiar archivos/motor_3_copy_batches.py'
          EXPECTED="$(python - <<'PY'
          import json
          p=json.load(open('Motores/MOTOR-CODE-LOCK.json',encoding='utf-8'))
          print(next(x['canonical_blob_sha'] for x in p['motors'] if x['id']=='motor_3_copy_batches'))
          PY
          )"
          ACTUAL="$(git hash-object "$MOTOR")"
          echo "MOTOR3_EXPECTED=$EXPECTED"
          echo "MOTOR3_ACTUAL=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Execute immutable Motor 3 for the four Meta agents
        shell: bash
        run: |
          set -euo pipefail
          MOTOR="$GITHUB_WORKSPACE/Motores/➡️📂motor de copiar archivos/motor_3_copy_batches.py"
          DEST="$GITHUB_WORKSPACE/➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources"
          STATE="$GITHUB_WORKSPACE/Motores/meta4-copy-state"
          mkdir -p "$STATE"

          run_copy() {
            id="$1"; src="$2"; dst="$3"
            out="$(SOURCE_DIR="$GITHUB_WORKSPACE/$src"               DEST_DIR="$DEST/$dst"               STATE_FILE="$STATE/$id.json"               BATCH_SIZE=100 COLLISION_POLICY=fail MAX_BATCHES=0               python "$MOTOR")"
            echo "$id $out"
            python - "$out" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j['verdict']=='VERIFIED_CLOSED', j
          assert j['failed']==0 and j['pending']==0, j
          PY
          }

          run_copy meta_muse_code_sdk             'Core kernel Yaiwes/Meta-Muse-Code-SDK-2026/code'             'meta_muse_code_sdk/code'

          run_copy muse_glimmer             'Core kernel Yaiwes/Meta-Muse-Glimmer-Agent-2026/code'             'muse_glimmer/code'

          run_copy metacua             'Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/13_macos_cua'             'metacua'

          run_copy github_repo_agent             'Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/11_github_repo_agent'             'github_repo_agent'

      - name: Record required operations ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          motor='Motores/➡️📂motor de copiar archivos/motor_3_copy_batches.py'
          blob=subprocess.check_output(['git','hash-object',motor],text=True).strip()
          dest='➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources'
          rows=[
            ('meta_muse_code_sdk','Core kernel Yaiwes/Meta-Muse-Code-SDK-2026/code',f'{dest}/meta_muse_code_sdk/code'),
            ('muse_glimmer','Core kernel Yaiwes/Meta-Muse-Glimmer-Agent-2026/code',f'{dest}/muse_glimmer/code'),
            ('metacua','Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/13_macos_cua',f'{dest}/metacua'),
            ('github_repo_agent','Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/11_github_repo_agent',f'{dest}/github_repo_agent'),
          ]
          ledger=Path('Motores/OPERATIONS-LEDGER.jsonl')
          ts=datetime.now(timezone.utc).isoformat()
          with ledger.open('a',encoding='utf-8') as f:
            for ident,src,dst in rows:
              f.write(json.dumps({
                'timestamp':ts,'repository':'maxbry123-commits/agentes',
                'motor':'motor_3_copy_batches','action':'copy',
                'source':src,'destination':dst,'batch_size':100,
                'code_blob_sha':blob,'result':'VERIFIED_CLOSED_LOCAL',
                'commit':'PENDING_PUSH','readback':'PENDING_REMOTE'
              },ensure_ascii=False)+'\n')
          PY

      - name: Commit exact Motor 3 outputs no force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/meta_muse_code_sdk'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/muse_glimmer'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/metacua'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/github_repo_agent'             'Motores/meta4-copy-state'             'Motores/OPERATIONS-LEDGER.jsonl'
          if git diff --cached --quiet; then
            echo 'NO_NEW_COPY_OUTPUTS'
          else
            git commit -m 'copy(wordflow): verify four Meta agents with immutable Motor 3'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Fresh remote readback exact tree equality
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          check_tree() {
            src="$1"; dst="$2"
            s="$(git rev-parse "origin/main:$src")"
            d="$(git rev-parse "origin/main:$dst")"
            echo "$src -> $dst :: $s :: $d"
            test "$s" = "$d"
          }
          check_tree             'Core kernel Yaiwes/Meta-Muse-Code-SDK-2026/code'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/meta_muse_code_sdk/code'
          check_tree             'Core kernel Yaiwes/Meta-Muse-Glimmer-Agent-2026/code'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/muse_glimmer/code'
          check_tree             'Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/13_macos_cua'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/metacua'
          check_tree             'Core kernel Yaiwes/Meta-Agent-Cookbook-2026/code/03_use_cases/11_github_repo_agent'             '➡️📂 wordflow loop code Yaiwes/wordflow_loop/agent_sources/github_repo_agent'
          echo 'META4_COPY=VERIFIED_4_OF_4'

  legacy-full-copy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'legacy_full' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Legacy full source-copy scope preserved
        run: |
          echo 'Legacy full scope intentionally preserved as manual-only; no mutation executed in Meta4 operation.'
