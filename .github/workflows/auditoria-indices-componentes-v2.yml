name: Auditoria indices componentes
# revision: 3-api-tree

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "auditoria-trigger-v2.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/auditoria-indices-componentes-v2.yml"

permissions:
  contents: write

concurrency:
  group: auditoria-indices-componentes
  cancel-in-progress: true

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      - name: Inventariar repositorios y raices por API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p auditoria-output
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from collections import Counter, defaultdict
          from pathlib import PurePosixPath, Path

          owner = "maxbry123-commits"
          repos = [
              "agentes",
              "nct-core",
              "frontend",
              "router-universal-router-inteligente-",
              "osquestador-auditor",
              "Agentes-motores-Wordflow-YAIWES",
              "Orquestador-Maxbry-",
          ]
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "yaiwes-index-auditor"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)

          records = []
          for repo in repos:
              root_items = get(f"https://api.github.com/repos/{owner}/{repo}/contents/?ref=main")
              tree_data = get(f"https://api.github.com/repos/{owner}/{repo}/git/trees/main?recursive=1")
              tree = tree_data.get("tree", [])
              by_root = defaultdict(list)
              for item in tree:
                  path = item.get("path", "")
                  if not path or path.startswith(".git/"):
                      continue
                  root = path.split("/", 1)[0]
                  by_root[root].append(item)

              roots = []
              for item in sorted(root_items, key=lambda x: x["name"].lower()):
                  name = item["name"]
                  entries = by_root.get(name, [])
                  blobs = [e for e in entries if e.get("type") == "blob"]
                  extensions = Counter()
                  markers = []
                  samples = []
                  for e in blobs:
                      p = e["path"]
                      suffix = PurePosixPath(p).suffix.lower() or "[none]"
                      extensions[suffix] += 1
                      upper = PurePosixPath(p).name.upper()
                      if upper in {"PLACEHOLDER.MD", ".KEEP", ".GITKEEP"} or "STUB" in upper:
                          markers.append(p)
                      if len(samples) < 25:
                          samples.append(p)
                  if item["type"] == "file" and not blobs:
                      suffix = PurePosixPath(name).suffix.lower() or "[none]"
                      extensions[suffix] += 1
                  roots.append({
                      "name": name,
                      "path": item["path"],
                      "type": "directory" if item["type"] == "dir" else "file",
                      "files_observed": len(blobs) if item["type"] == "dir" else 1,
                      "bytes_observed": sum(int(e.get("size", 0) or 0) for e in blobs) if item["type"] == "dir" else int(item.get("size", 0) or 0),
                      "git_sha": item.get("sha"),
                      "html_url": item.get("html_url"),
                      "extensions": dict(sorted(extensions.items())),
                      "markers": sorted(markers),
                      "sample_files": samples,
                  })
              records.append({
                  "repository": repo,
                  "repository_url": f"https://github.com/{owner}/{repo}",
                  "default_branch": "main",
                  "tree_sha": tree_data.get("sha"),
                  "tree_truncated": bool(tree_data.get("truncated")),
                  "tree_entries_observed": len(tree),
                  "root_count": len(roots),
                  "roots": roots,
              })

          payload = {
              "schema": "yaiwes.repository-inventory.v2",
              "generated_by": "GitHub Actions",
              "method": "GitHub Contents API + recursive Git Trees API; no repository blobs downloaded",
              "repositories": records,
          }
          Path("auditoria-output/inventario-repositorios.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Validar inventario
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("auditoria-output/inventario-repositorios.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["schema"] == "yaiwes.repository-inventory.v2"
          assert len(data["repositories"]) == 7
          assert all(r["root_count"] > 0 for r in data["repositories"])
          print("PASS repositories=7")
          print("PASS roots=", sum(r["root_count"] for r in data["repositories"]))
          print("TRUNCATED=", [r["repository"] for r in data["repositories"] if r["tree_truncated"]])
          PY

      - name: Publicar evidencia
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-output/inventario-repositorios.json
          if git diff --cached --quiet; then
            echo "Sin cambios de inventario"
          else
            git commit -m "audit: actualizar inventario de repositorios"
            git push
          fi

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-indices-componentes
          path: auditoria-output/inventario-repositorios.json
          retention-days: 14
