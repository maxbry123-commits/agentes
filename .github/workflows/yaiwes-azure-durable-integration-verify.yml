name: YAIWES Azure Durable Functions Integration Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions/**'
      - '.github/workflows/yaiwes-azure-durable-integration-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
            Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Static contract and source gate
        working-directory: Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
        shell: bash
        run: |
          set -euo pipefail
          python verify_integration.py
          python -m py_compile adapter.py verify_integration.py
          test -f '../../../kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
          test -f '../../../kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
          test -f src/WebJobs.Extensions.DurableTask/DurableTaskExtension.cs
          test -f src/WebJobs.Extensions.DurableTask/Grpc/Protos/orchestrator_service.proto
          test -z "$(find . -type d \( -name bin -o -name obj -o -name test -o -name samples \) -print -quit)"
          dotnet --version | grep -F '10.0.302'

      - name: Restore moved runtime
        working-directory: Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
        run: dotnet restore src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj -p:SignAssembly=false -p:GeneratePackageOnBuild=false

      - name: Build moved runtime
        working-directory: Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
        run: dotnet build src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj -c Debug -f net10.0 --no-restore -p:SignAssembly=false -p:GeneratePackageOnBuild=false

      - name: Moved source runtime 10x
        working-directory: Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            dotnet build src/WebJobs.Extensions.DurableTask/WebJobs.Extensions.DurableTask.csproj -c Debug -f net10.0 --no-restore -p:SignAssembly=false -p:GeneratePackageOnBuild=false >/tmp/azure-durable-build.log
            python -c "from adapter import source_probe; p=source_probe(); assert p['sdk']=='10.0.302'; assert p['classification']=='B'"
            echo "AZURE_DURABLE_RUNTIME_PASS_${i}/10"
          done
