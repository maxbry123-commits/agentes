name: purge-agents
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove agent trees (keep control-layer / Wordflow)
        run: |
          set -euo pipefail
          # Never touch control-layer
          test -d control-layer

          # Delete all agent checkouts under agents/
          if [ -d agents ]; then
            find agents -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
          mkdir -p agents
          printf '%s\n' '# agents root — deterministic snapshots only' > agents/.gitkeep

          # Clean pipeline scaffolding from previous meta-only work (optional)
          rm -f scripts/pull_source.py || true
          rm -f manifests/AGENTS_SOURCE_MANIFEST.yaml || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to purge"
          else
            git commit -m "purge: remove non-deterministic agent trees (protocol reset)\n\n- keeps control-layer and Wordflow intact\n- agents/ left empty with .gitkeep"
            git push
          fi
