name: purge-agents

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove only agents root contents
        shell: bash
        run: |
          set -euo pipefail

          # Never touch anything outside agents/
          if [ -d agents ]; then
            find agents -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

          # Keep the agents/ root itself present.
          mkdir -p agents
          printf '%s\n' '# agents root — deterministic snapshots only' > agents/.gitkeep

          # Verify the only remaining item under agents/ is .gitkeep.
          test -d agents
          test -f agents/.gitkeep
          if find agents -mindepth 1 -maxdepth 1 ! -name .gitkeep -print -quit | grep -q .; then
            echo 'ERROR: agents/ still contains entries other than .gitkeep.'
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- agents
          if git diff --cached --quiet; then
            echo "Nothing to purge"
          else
            git commit -m "purge: remove obsolete agents root contents"
            git push
          fi
