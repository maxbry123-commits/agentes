name: YAIWES Docs Surgical Architecture Update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-docs-surgical-architecture-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Readme arquitectura Yaiwes/README.md
            .github/scripts/yaiwes_append_component_architecture.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Surgical append
        run: |
          python .github/scripts/yaiwes_append_component_architecture.py
          git diff --check
          git diff --numstat -- 'Readme arquitectura Yaiwes/README.md'

      - name: Commit architecture delta
        run: |
          if git diff --quiet -- 'Readme arquitectura Yaiwes/README.md'; then
            echo 'No architecture delta required'
            exit 0
          fi
          git config user.name 'yaiwes-docs-bot'
          git config user.email 'yaiwes-docs-bot@users.noreply.github.com'
          git add -- 'Readme arquitectura Yaiwes/README.md'
          git commit -m 'docs(yaiwes): append verified component integration ledger'
          git push
