name: T1 move Desplegar Yaiwes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t1-move-desplegar-yaiwes
  cancel-in-progress: false
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: git mv docs y code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DOC='Documentos proyectos Yaiwes/documentos proyecto Yaiwes 1'
          CODE='Download code Yaiwes'
          mkdir -p "$DOC" "$CODE"
          shopt -s nullglob
          for d in Desplegar/Desplegar\ 1 Desplegar/Desplegar\ 2 Desplegar/Desplegar\ 3 Desplegar/Desplegar\ 4 Desplegar/Desplegar\ 5; do
            [ -d "$d" ] || continue
            base=$(basename "$d")
            mkdir -p "$DOC/$base" "$CODE/$base"
            for f in "$d"/*; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              [ "$name" = README.md ] && git mv -k "$f" "$DOC/$base/$name" && continue
              case "$name" in
                *.md|*.html|*.json|*.yml|*.yaml) git mv -k "$f" "$DOC/$base/$name" ;;
                *.zip|*.py|*.sh|*.skill) git mv -k "$f" "$CODE/$base/$name" ;;
                *)
                  if [ -d "$f" ]; then
                    if echo "$name" | grep -qiE 'wordflow|code|router|arquitectura'; then
                      git mv -k "$f" "$CODE/$base/$name"
                    else
                      git mv -k "$f" "$DOC/$base/$name"
                    fi
                  else
                    git mv -k "$f" "$DOC/$base/$name"
                  fi
                  ;;
              esac
            done
          done
          for extra in Desplegar/wordflow-code-deploy-router Desplegar/wordflow-paso-control; do
            [ -e "$extra" ] && git mv -k "$extra" "$CODE/$(basename "$extra")" || true
          done
          git add -A -- ':!.github'
          git diff --cached --quiet && echo NOOP && exit 0
          git commit -m 'move: Desplegar docs->Documentos Yaiwes 1 code->Download code Yaiwes'
          git pull --rebase origin main
          git push --no-verify origin main
