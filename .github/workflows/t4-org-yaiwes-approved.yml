name: T4 org Yaiwes approved
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t4-org-yaiwes-approved
  cancel-in-progress: false
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: git mv aprobados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DOC='Documentos proyectos Yaiwes/documentos proyecto Yaiwes 1'
          DL='Download code Yaiwes'
          mkdir -p "$DOC" "$DL" agente-yaiwes/deploy-publish
          if [ -d 'docs' ]; then git mv docs "$DOC/docs"; fi
          if [ -d 'Yaiwes wordflow' ]; then git mv 'Yaiwes wordflow' "$DOC/Yaiwes wordflow"; fi
          if [ -d 'Agente Yaiwes/Agente core kernel Yaiwes' ]; then
            git mv 'Agente Yaiwes/Agente core kernel Yaiwes'/* "$DL/" || true
          fi
          if [ -d despliegue ]; then
            mkdir -p "$DOC/despliegue"
            shopt -s nullglob
            for f in despliegue/*.py despliegue/*.yaml despliegue/*.yml; do
              [ -e "$f" ] && git mv "$f" agente-yaiwes/deploy-publish/
            done
            for d in despliegue/schemas despliegue/validators despliegue/manifests; do
              [ -d "$d" ] && git mv "$d" agente-yaiwes/deploy-publish/
            done
            for d in despliegue/github despliegue/auditoria despliegue/refactoria; do
              [ -d "$d" ] && git mv "$d" "$DOC/despliegue/"
            done
            for f in despliegue/*.md; do
              [ -e "$f" ] && git mv "$f" "$DOC/despliegue/"
            done
          fi
          git add -A -- ':!.github'
          git diff --cached --quiet && echo NOOP && exit 0
          git commit -m 'move: docs+zips+despliegue segun T4 aprobado'
          git pull --rebase origin main
          git push --no-verify origin main
