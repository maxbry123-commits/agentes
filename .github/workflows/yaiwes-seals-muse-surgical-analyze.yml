name: YAIWES Seals Muse Surgical Analyze
on:
  push:
    paths:
      - '.github/workflows/yaiwes-seals-muse-surgical-analyze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Core kernel Yaiwes/Download code Yaiwes/Muse-Agent_0001.zip
            Core kernel Yaiwes/Download code Yaiwes/MUSE-KnowledgeXLab_0001.zip
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Analyze exact candidates only
        shell: bash
        run: |
          set -euo pipefail
          echo 'SEALS_BRANCH_ANALYSIS_V3'
          for z in 'Core kernel Yaiwes/Download code Yaiwes/Muse-Agent_0001.zip' 'Core kernel Yaiwes/Download code Yaiwes/MUSE-KnowledgeXLab_0001.zip'; do
            echo "=== ZIP:$z ==="
            test -f "$z"
            echo "ZIP_SHA256=$(sha256sum "$z"|cut -d' ' -f1)"
            d=$(mktemp -d)
            unzip -q "$z" -d "$d"
            grep -RIlE 'while .*to_do_subtasks|executePlanExecuteLoop|streamPlanExecute|checkpoint|done_subtasks' "$d" --include='*.py' --include='*.ts' 2>/dev/null | head -30
            rm -rf "$d"
          done