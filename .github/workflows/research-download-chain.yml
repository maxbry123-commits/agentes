name: Research Download Chain
run-name: Research Download Chain • ${{ github.event_name }} • ${{ github.sha }}

# One canonical writer. The generated ZIPs are binary files, so parallel writers
# to main are unsafe; all recovery/continuation is driven by the manifest.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-download-chain.yml'
      - 'scripts/research_download_chain.py'

permissions:
  contents: write

# Shared with the legacy V2 workflow so the two workflows can never write main
# concurrently. queue:max preserves sequential progress instead of dropping runs.
concurrency:
  group: research-download-chain-writer
  queue: max
  cancel-in-progress: false

jobs:
  download-20-in-queue:
    name: Download 20 repos sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Execute deterministic download chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_download_chain.py 'Download code/archivos' '_work/research-download'

      - name: Final safety audit
        shell: bash
        run: |
          set -euo pipefail
          test -f 'Download code/archivos/RESEARCH_DOWNLOAD_MANIFEST.jsonl'
          count=$(grep -c '"status": "COMPLETE"' 'Download code/archivos/RESEARCH_DOWNLOAD_MANIFEST.jsonl' || true)
          test "$count" -eq 20
          find 'Download code/archivos' -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            size=$(stat -c '%s' "$f")
            test "$size" -le $((17*1000*1000))
            unzip -tq "$f"
          done
          echo 'AUDIT PASS: 20/20 repositories; all ZIP files valid and within safety limit.'
