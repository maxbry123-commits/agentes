name: YAIWES Component Ops Download 5 TEMP

on:
  push:
    paths:
      - '.github/workflows/_yaiwes-component-ops-download-5-temp.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-component-ops-download-5-temp
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  download-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact target surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/_yaiwes-component-ops-download-5-temp.yml
            /Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl
            /Core kernel Yaiwes/omniroute/
            /Core kernel Yaiwes/orca/
            /Core kernel Yaiwes/omarchy/
            /Core kernel Yaiwes/anydoc/
            /Skills agente/skill-design-anthropic/

      - name: Fail closed if a requested destination already exists
        shell: bash
        run: |
          set -euo pipefail
          for d in \
            'Core kernel Yaiwes/omniroute' \
            'Core kernel Yaiwes/orca' \
            'Core kernel Yaiwes/omarchy' \
            'Core kernel Yaiwes/anydoc' \
            'Skills agente/skill-design-anthropic'; do
            if [ -e "$d" ]; then
              echo "TARGET_ALREADY_EXISTS=$d" >&2
              exit 70
            fi
          done

      - name: Clone verified sources at pinned commits
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yaiwes-component-ops-5"
          mkdir -p "$root"
          clone_pinned() {
            name="$1" url="$2" sha="$3"
            dst="$root/$name"
            git init -q "$dst"
            git -C "$dst" remote add origin "$url"
            git -C "$dst" -c protocol.version=2 fetch --depth=1 --no-tags origin "$sha"
            git -C "$dst" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
            got="$(git -C "$dst" rev-parse HEAD)"
            test "$got" = "$sha"
            if git -C "$dst" ls-files -s | awk '$1==160000 {found=1} END{exit !found}'; then
              echo "UNSUPPORTED_GITLINK_IN_SOURCE=$name" >&2
              exit 71
            fi
            printf '%s=%s\n' "$name" "$got"
          }
          clone_pinned omniroute 'https://github.com/diegosouzapw/OmniRoute.git' '9688032451fc52017df537fd6f7b86baa49503fc'
          clone_pinned orca 'https://github.com/stablyai/orca.git' '8e8a9b38ea2b9a2a621bc891304efa072826e7d5'
          clone_pinned omarchy 'https://github.com/omacom/omarchy.git' '9c5482c58dbe4974de337450754885083c91eada'
          clone_pinned anydoc 'https://github.com/firecrawl/anydoc.git' '261fc257d17c3eab0f673be31c408fd9fdc2171a'
          clone_pinned anthropic_skills 'https://github.com/anthropics/skills.git' '34040c9c568585f6929bedeaad110ad08f079624'
          test -f "$root/anthropic_skills/skills/skill-creator/SKILL.md"
          grep -Eq '^name:[[:space:]]*skill-creator[[:space:]]*$' "$root/anthropic_skills/skills/skill-creator/SKILL.md"

      - name: Materialize only requested destinations without source rewrites
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yaiwes-component-ops-5"
          mkdir -p 'Core kernel Yaiwes/omniroute' 'Core kernel Yaiwes/orca' 'Core kernel Yaiwes/omarchy' 'Core kernel Yaiwes/anydoc' 'Skills agente/skill-design-anthropic'
          rsync -a --delete --exclude='/.git/' "$root/omniroute/" 'Core kernel Yaiwes/omniroute/'
          rsync -a --delete --exclude='/.git/' "$root/orca/" 'Core kernel Yaiwes/orca/'
          rsync -a --delete --exclude='/.git/' "$root/omarchy/" 'Core kernel Yaiwes/omarchy/'
          rsync -a --delete --exclude='/.git/' "$root/anydoc/" 'Core kernel Yaiwes/anydoc/'
          rsync -a --delete "$root/anthropic_skills/skills/skill-creator/" 'Skills agente/skill-design-anthropic/'

      - name: Validate exact materialized trees and pinned downloaded commits
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yaiwes-component-ops-5"
          verify_tree() {
            src="$1" dst="$2"
            test -d "$dst"
            test -n "$(find "$dst" -mindepth 1 -print -quit)"
            delta="$(rsync -ani --delete --exclude='/.git/' "$src/" "$dst/")"
            if [ -n "$delta" ]; then
              echo "TREE_MISMATCH=$dst" >&2
              printf '%s\n' "$delta" >&2
              exit 72
            fi
          }
          test "$(git -C "$root/omniroute" rev-parse HEAD)" = '9688032451fc52017df537fd6f7b86baa49503fc'
          test "$(git -C "$root/orca" rev-parse HEAD)" = '8e8a9b38ea2b9a2a621bc891304efa072826e7d5'
          test "$(git -C "$root/omarchy" rev-parse HEAD)" = '9c5482c58dbe4974de337450754885083c91eada'
          test "$(git -C "$root/anydoc" rev-parse HEAD)" = '261fc257d17c3eab0f673be31c408fd9fdc2171a'
          test "$(git -C "$root/anthropic_skills" rev-parse HEAD)" = '34040c9c568585f6929bedeaad110ad08f079624'
          verify_tree "$root/omniroute" 'Core kernel Yaiwes/omniroute'
          verify_tree "$root/orca" 'Core kernel Yaiwes/orca'
          verify_tree "$root/omarchy" 'Core kernel Yaiwes/omarchy'
          verify_tree "$root/anydoc" 'Core kernel Yaiwes/anydoc'
          verify_tree "$root/anthropic_skills/skills/skill-creator" 'Skills agente/skill-design-anthropic'
          echo 'SOURCE_COMMIT_EQUALS_DOWNLOADED_COMMIT=PASS_5_OF_5'
          echo 'DESTINATION_TREE_EQUALS_VERIFIED_SOURCE=PASS_5_OF_5'

      - name: Update canonical manifest only after validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl')
          entries=[
            {"number":1,"parts":1,"slug":"Omniroute","source":"https://github.com/diegosouzapw/OmniRoute.git","source_commit":"9688032451fc52017df537fd6f7b86baa49503fc","status":"COMPLETE"},
            {"number":2,"parts":1,"slug":"Orca","source":"https://github.com/stablyai/orca.git","source_commit":"8e8a9b38ea2b9a2a621bc891304efa072826e7d5","status":"COMPLETE"},
            {"number":3,"parts":1,"slug":"Omarchy","source":"https://github.com/omacom/omarchy.git","source_commit":"9c5482c58dbe4974de337450754885083c91eada","status":"COMPLETE"},
            {"number":4,"parts":1,"slug":"Anydoc","source":"https://github.com/firecrawl/anydoc.git","source_commit":"261fc257d17c3eab0f673be31c408fd9fdc2171a","status":"COMPLETE"},
            {"number":5,"parts":1,"slug":"Skill Design de Anthropic","source":"https://github.com/anthropics/skills.git","source_commit":"34040c9c568585f6929bedeaad110ad08f079624","status":"COMPLETE"},
          ]
          mission={x['slug'] for x in entries}
          old=[]
          for line in p.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              obj=json.loads(line)
              if obj.get('slug') not in mission:
                  old.append(obj)
          all_entries=old+entries
          p.write_text('\n'.join(json.dumps(x,ensure_ascii=False) for x in all_entries)+'\n',encoding='utf-8')
          for e in entries:
              assert e['status']=='COMPLETE' and len(e['source_commit'])==40 and e['source'].endswith('.git')
          print('MANIFEST_ENTRIES_VALIDATED=5')
          PY

      - name: Commit requested outputs and self-remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          self='.github/workflows/_yaiwes-component-ops-download-5-temp.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'Core kernel Yaiwes/Download code Yaiwes/RESEARCH_DOWNLOAD_MANIFEST.jsonl' \
            'Core kernel Yaiwes/omniroute' \
            'Core kernel Yaiwes/orca' \
            'Core kernel Yaiwes/omarchy' \
            'Core kernel Yaiwes/anydoc' \
            'Skills agente/skill-design-anthropic'
          git rm -- "$self"
          git commit -m 'download(yaiwes): pin and materialize 5 verified components'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
