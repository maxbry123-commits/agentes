name: purge-openclaw-only
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete OpenClaw only
        run: |
          set -euo pipefail
          test -d control-layer

          rm -rf agents/OpenClaw
          rm -rf agents/OpenClaw-headless
          rm -f agents/_state/OpenClaw.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "OpenClaw already absent"
          else
            git commit -m "purge: remove OpenClaw incomplete snapshot (protocol reset)\n\n- deletes agents/OpenClaw and OpenClaw-headless\n- deletes agents/_state/OpenClaw.json\n- control-layer and other agents untouched"
            git push
          fi
