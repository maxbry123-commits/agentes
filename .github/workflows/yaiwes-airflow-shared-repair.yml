name: YAIWES Airflow Shared Runtime Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-airflow-shared-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Core kernel Yaiwes/Componentes recuperados A/Apache-Airflow/shared
            Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Move exact Airflow shared runtime sources
        shell: bash
        run: |
          set -euo pipefail
          SRCROOT='Core kernel Yaiwes/Componentes recuperados A/Apache-Airflow/shared'
          DSTROOT='Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow/src/airflow/_shared'
          names=(configuration dagnode logging module_loading observability secrets_backend secrets_masker serialization state timezones listeners plugins_manager providers_discovery template_rendering)
          for name in "${names[@]}"; do
            src="$SRCROOT/$name/src/airflow_shared/$name"
            dst="$DSTROOT/$name"
            test -d "$src"
            test ! -e "$dst"
            mkdir -p "$DSTROOT"
            mv "$src" "$dst"
            test -d "$dst"
            test ! -e "$src"
            echo "AIRFLOW_SHARED_MOVED $name"
          done
          git diff --check

      - name: Verify repair matches Airflow force-include contract
        shell: bash
        run: |
          set -euo pipefail
          DST='Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow'
          grep -F '"../shared/configuration/src/airflow_shared/configuration" = "src/airflow/_shared/configuration"' "$DST/pyproject.toml"
          test -f "$DST/src/airflow/_shared/configuration/parser.py"
          python -m compileall -q "$DST/src/airflow/_shared"
          git status --short

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Core kernel Yaiwes/Componentes recuperados A/Apache-Airflow/shared' 'Agente Yaiwes principal/execution-orchestration/dag-executor/apache-airflow/src/airflow/_shared'
          git diff --cached --quiet && exit 0
          git commit -m 'fix(yaiwes): move Airflow shared runtime dependencies'
          git push origin HEAD:main
