name: YAIWES Motor4 MOVE N22 Hatchet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-motor4-move-n22-hatchet.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-motor4-n22-hatchet
  cancel-in-progress: false

jobs:
  move_n22:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Motor4 + Hatchet surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-motor4-move-n22-hatchet.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py
            /Core kernel Yaiwes/Hatchet/
            /Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet/

      - name: Verify Motor4 immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          MOTOR='➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py'
          test -f "$MOTOR"
          test "$(git hash-object "$MOTOR")" = '9a21facfe11327cf60a2afca8f415ad52f0ecbe5'
          echo MOTOR4_SHA_VERIFIED

      - name: Execute Motor4 MOVE N22 Hatchet
        shell: bash
        run: |
          set -euo pipefail
          MOTOR='➡️📂motores de descarga extracción copiado movimiento archivos agentes/➡️📂motor de moves archivos/motor_4_move_batches.py'
          SRC='Core kernel Yaiwes/Hatchet'
          DST='Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet'
          if [ ! -d "$SRC" ] && [ -d "$DST" ]; then
            echo MOVE_ALREADY_CANONICAL
            exit 0
          fi
          test -d "$SRC"
          mkdir -p "$DST"
          export SOURCE_DIR="$SRC"
          export DEST_DIR="$DST"
          export STATE_FILE="/tmp/yaiwes-motor4-n22.json"
          export BATCH_SIZE=100
          export COLLISION_POLICY=fail
          python3 "$MOTOR"

      - name: Publish N22 MOVE to main
        shell: bash
        run: |
          set -euo pipefail
          SRC='Core kernel Yaiwes/Hatchet'
          DST='Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          SRC_TRACKED="$(git ls-files -- "$SRC")"
          DST_TRACKED="$(git ls-files -- "$DST")"
          if [ -z "$SRC_TRACKED" ] && [ -n "$DST_TRACKED" ]; then
            echo MOVE_ALREADY_CANONICAL_NO_DELTA
          else
            git add -A -- "$SRC" "$DST"
            if git diff --cached --quiet; then
              echo MOVE_ALREADY_CANONICAL_NO_DELTA
            else
              git commit -m 'move(yaiwes): Motor4 MOVE N22 Hatchet to state-machine-executor/hatchet'
              ok=0
              for attempt in 1 2 3 4; do
                git fetch origin main
                if git rebase origin/main && git push origin HEAD:main; then
                  ok=1
                  break
                fi
                git rebase --abort || true
                sleep $((attempt * 3))
              done
              test "$ok" -eq 1
              echo "MOVE_COMMIT=$(git rev-parse HEAD)"
            fi
          fi

      - name: Read-back dest N22
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          SRC='Core kernel Yaiwes/Hatchet'
          DST='Agente Yaiwes principal/execution-orchestration/state-machine-executor/hatchet'
          SRC_REMOTE="$(git ls-tree -r --name-only origin/main -- "$SRC")"
          DST_REMOTE="$(git ls-tree -r --name-only origin/main -- "$DST")"
          test -z "$SRC_REMOTE"
          test -n "$DST_REMOTE"
          echo READBACK_OK "$DST"

      - name: Checkpoint Crazy Wall STEP2
        shell: bash
        env:
          WALL: '📂 Bitácora stated JSON Craxy wall.json'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = os.environ['WALL']
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          node = next(n for n in data['nodes'] if n['id'] == 22)
          if node.get('owner') != 'SOL' or node.get('lock') != 'CLAIMED' or node.get('current_step') != 2:
              raise SystemExit(f"LOCK_OR_STEP_CHANGED:{node.get('owner')}:{node.get('lock')}:{node.get('current_step')}")
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          node['current_step'] = 3
          node['status'] = 'PASS'
          node.setdefault('checkpoint', {})['after'] = (
              'STEP2 PASS: canonical Motor4 MOVE commit 7559b7b79f93a3104cf17ad632b790ab497d6d42; '
              'origin/main source absent; target populated; idempotent runner read-back PASS'
          )
          evidence = node.setdefault('evidence', [])
          for item in [
              'step2:motor4_blob:9a21facfe11327cf60a2afca8f415ad52f0ecbe5',
              'step2:move_commit:7559b7b79f93a3104cf17ad632b790ab497d6d42',
              'step2:runner_fix_commit:78d54b14d3e75654d5378abacdcd72c6096c25a5',
              f"step2:readback_run:{os.environ['GITHUB_RUN_ID']}",
              'step2:readback:origin/main source absent destination populated'
          ]:
              if item not in evidence:
                  evidence.append(item)
          node.setdefault('history', []).append({
              'at': now,
              'actor': 'SOL',
              'label': 'SOL integración 1',
              'event': 'STEP2_PASS',
              'run': int(os.environ['GITHUB_RUN_ID'])
          })
          node['next_action'] = 'STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'
          data['updated_at'] = now
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
            git add -- "$WALL"
            if git diff --cached --quiet; then
              echo WALL_ALREADY_CHECKPOINTED
              ok=1
              break
            fi
            git commit -m 'crazy-wall: SOL integración 1 Hatchet STEP2 PASS'
            if git push origin HEAD:main; then
              ok=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1
