name: Repair Soul Spec location only

on:
  pull_request_target:
    paths:
      - repair-soul-spec-trigger.txt

permissions:
  contents: write

concurrency:
  group: repair-soul-spec-location-only
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Agente core kernel Yaiwes principal/Soul-Spec-Antonio_0001.zip
            core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl
          sparse-checkout-cone-mode: false

      - name: Copiar ZIP existente sin borrar ni descargar fuente externa
        run: |
          set -euo pipefail
          SRC="Agente core kernel Yaiwes principal/Soul-Spec-Antonio_0001.zip"
          DST="core kernel Yaiwes principal/Soul-Spec_0001.zip"
          test -f "$SRC"
          test ! -e "$DST"
          unzip -t "$SRC"
          cp --preserve=mode,timestamps "$SRC" "$DST"
          cmp "$SRC" "$DST"
          printf '%s\n' '{"number":162,"parts":1,"slug":"Soul-Spec","source":"https://github.com/AntonioTF5/soul-spec.git","source_commit":"8d862030baaf9b02c24ad3b0cd1b327832e00586","status":"COMPLETE","repair":"copied_from_legacy_root_without_external_download","relocated_from":"Agente core kernel Yaiwes principal/Soul-Spec-Antonio_0001.zip","relocated_to":"core kernel Yaiwes principal/Soul-Spec_0001.zip"}' >> "core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl"

      - name: Commit reparación aislada
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "core kernel Yaiwes principal/Soul-Spec_0001.zip" "core kernel Yaiwes principal/RESEARCH_DOWNLOAD_MANIFEST.jsonl"
          git commit -m "fix: ubicar Soul Spec Antonio en core kernel Yaiwes"
          git pull --rebase origin main
          git push origin HEAD:main
