name: purge-agents-root

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/purge-agents-root.yml'

permissions:
  contents: write

concurrency:
  group: purge-agents-root
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove only agents contents
        shell: bash
        run: |
          set -euo pipefail

          test -d agents
          find agents -mindepth 1 -maxdepth 1 ! -name .gitkeep -exec rm -rf {} +
          printf '%s\n' '# agents root — deterministic snapshots only' > agents/.gitkeep

          test -d agents
          test -f agents/.gitkeep
          if find agents -mindepth 1 -maxdepth 1 ! -name .gitkeep -print -quit | grep -q .; then
            echo 'ERROR: agents/ still contains entries other than .gitkeep'
            exit 1
          fi

      - name: Commit and push only agents cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- agents

          if git diff --cached --quiet; then
            echo 'agents/ already clean'
            exit 0
          fi

          git commit -m 'purge: clean agents contents only'
          git push origin HEAD:main

      - name: Final forensic verification
        shell: bash
        run: |
          set -euo pipefail

          test -d agents
          test -f agents/.gitkeep
          remaining="$(find agents -mindepth 1 -maxdepth 1 ! -name .gitkeep -print -quit)"
          if [ -n "$remaining" ]; then
            echo "ERROR: unexpected entry remains: $remaining"
            exit 1
          fi

          echo 'VERIFIED: agents/ preserved; only agents/.gitkeep remains.'
