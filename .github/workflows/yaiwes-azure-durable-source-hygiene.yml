name: YAIWES Azure Durable Source Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-azure-durable-source-hygiene.yml'

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Core kernel Yaiwes/Componentes recuperados A/Azure-Durable-Functions
            Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Return auxiliary docs/refresh files and remove generated bytecode
        shell: bash
        run: |
          set -euo pipefail
          SRC='Core kernel Yaiwes/Componentes recuperados A/Azure-Durable-Functions'
          DST='Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions'
          CORE="$DST/src/WebJobs.Extensions.DurableTask"
          while IFS= read -r -d '' f; do
            rel="${f#$DST/}"
            [ "$rel" = 'README.md' ] && continue
            mkdir -p "$SRC/$(dirname "$rel")"
            mv "$f" "$SRC/$rel"
          done < <(find "$CORE" -type f \( -name '*.md' -o -name '*.ps1' \) -print0)
          if [ -f "$CORE/Grpc/Protos/versions.txt" ]; then
            rel='src/WebJobs.Extensions.DurableTask/Grpc/Protos/versions.txt'
            mkdir -p "$SRC/$(dirname "$rel")"
            mv "$CORE/Grpc/Protos/versions.txt" "$SRC/$rel"
          fi
          find "$DST" -type f -name '*.pyc' -delete
          find "$DST" -depth -type d -name '__pycache__' -empty -delete || true
          test -z "$(find "$CORE" -type f \( -name '*.md' -o -name '*.ps1' \) -print -quit)"
          test -z "$(find "$DST" -type f -name '*.pyc' -print -quit)"
          test -f "$CORE/Grpc/Protos/orchestrator_service.proto"
          git diff --check
      - name: Commit hygiene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Core kernel Yaiwes/Componentes recuperados A/Azure-Durable-Functions' 'Agente Yaiwes principal/execution-orchestration/state-machine-executor/azure-durable-functions'
          git diff --cached --check
          git commit -m 'fix(yaiwes): keep Azure Durable runtime source only'
          git pull --rebase origin main
          git push origin HEAD:main
