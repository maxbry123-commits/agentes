name: YAIWES Architecture README Delta

on:
  push:
    paths:
      - '.github/workflows/yaiwes-architecture-readme-delta.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DELTA_B64: 

jobs:
  append-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Append surgical architecture delta
        shell: bash
        run: |
          set -euo pipefail
          FILE='Readme arquitectura Yaiwes/README.md'
          MARKER='## 26. Integraciones VERIFIED_CLOSED — componentes 1–5 · 2026-09-07'
          if grep -Fq "$MARKER" "$FILE"; then
            echo 'ARCHITECTURE_DELTA_ALREADY_PRESENT'
          else
            printf '\n' >> "$FILE"
            printf '%s' "$DELTA_B64" | base64 -d >> "$FILE"
          fi
      - name: Commit surgical README update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'YAIWES Integration Loop'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Readme arquitectura Yaiwes/README.md'
          if git diff --cached --quiet; then
            echo 'NO_ARCHITECTURE_DELTA_TO_COMMIT'
            exit 0
          fi
          git commit -m 'docs(yaiwes): record verified integration of components 1-5'
          git push origin HEAD:main
