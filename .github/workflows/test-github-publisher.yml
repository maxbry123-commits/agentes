name: test-github-publisher
on:
  push:
    paths:
      - 'extensions/github_publisher/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run github_publisher tests
        run: |
          cd extensions
          python -m unittest discover -s github_publisher/tests -v
