name: test-project-bootstrap
on:
  push:
    paths:
      - 'extensions/project_bootstrap/**'
      - '.github/workflows/test-project-bootstrap.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Run tests
        run: |
          cd extensions
          python -m project_bootstrap.tests.test_core
