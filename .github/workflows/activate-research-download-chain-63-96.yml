name: activate-research-download-chain-63-96

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-research-download-chain-63-96.yml

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch research-download-chain-63-96 on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-download-chain-63-96.yml --repo maxbry123-commits/agentes --ref main
