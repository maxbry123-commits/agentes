name: YAIWES SOL3 AI-Scientist-v2 STEP3 Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol3-ai-scientist-v2-step3-repair.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol3-ai-scientist-v2-step3
  cancel-in-progress: false

jobs:
  repair_same_microtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      TARGET: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist-v2'
      ADAPTER: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist-v2/yaiwes/ai_scientist_v2_adapter.py'
      FICHA: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist-v2/yaiwes/ficha.ai-scientist-v2.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist-v2/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-sol3-ai-scientist-v2-step3-repair.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist-v2/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py

      - name: Record exact GAP and retain SOL3 claim
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p=os.environ['WALL']; now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(p,encoding='utf-8') as f:d=json.load(f)
          n=next(x for x in d['nodes'] if x.get('id')==35)
          if n.get('owner')!='SOL' or n.get('lock')!='CLAIMED' or n.get('current_step')!=3: raise SystemExit(f"CLAIM_LOST:{n.get('owner')}:{n.get('lock')}:{n.get('current_step')}")
          n['status']='GAP_STEP3'
          n.setdefault('evidence',[]).append('step3:run:34721566891:FAIL:canonical_bus_importlib_dataclass_module_not_in_sys_modules')
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_GAP_REPAIR','cause':'importlib exec_module did not register yaiwes_bus in sys.modules; dataclasses lookup failed'})
          n['next_action']='STEP_3_RETRY_SAME_MICROTEST_AFTER_IMPORTLIB_SYS_MODULES_PATCH'; d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f:json.dump(d,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          git add -- "$WALL"; git commit -m 'crazy-wall: SOL3 AI-Scientist-v2 STEP3 GAP importlib cause'; git push origin HEAD:main

      - name: Rebuild minimal adapter and ficha
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          mkdir -p "$(dirname "$ADAPTER")"
          cat > "$ADAPTER" <<'PY'
          from __future__ import annotations
          import importlib.util, json, tempfile
          from pathlib import Path
          from typing import Any
          PLUGIN_ID='yaiwes.agent_fleet.ai_scientist_v2'
          TARGET_RELATIVE='Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist-v2'
          def descriptor()->dict[str,str]: return {'plugin_id':PLUGIN_ID,'role':'autonomous_scientific_research_agent','target_path':TARGET_RELATIVE,'microtest':'upstream_bfts_idea_pipeline'}
          def _load(path:Path):
              spec=importlib.util.spec_from_file_location('yaiwes_ai_scientist_bfts_utils',path)
              if spec is None or spec.loader is None: raise RuntimeError(f'BFTS_UTILS_LOAD_FAILED:{path}')
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          def run_microtest(repo_root:str|Path)->dict[str,Any]:
              root=Path(repo_root).resolve(); target=root/TARGET_RELATIVE
              if not (target/'launch_scientist_bfts.py').is_file(): raise RuntimeError('AI_SCIENTIST_ENTRYPOINT_MISSING')
              if not (target/'bfts_config.yaml').is_file(): raise RuntimeError('AI_SCIENTIST_BFTS_CONFIG_MISSING')
              mod=_load(target/'ai_scientist'/'treesearch'/'bfts_utils.py')
              idea={'Name':'yaiwes_microtest','Title':'Deterministic YAIWES integration test','Experiment':'Verify real upstream BFTS idea/config preparation'}
              with tempfile.TemporaryDirectory(prefix='yaiwes_ai_scientist_') as td:
                  work=Path(td); idea_md=work/'idea.md'; mod.idea_to_markdown(idea,str(idea_md),None)
                  config=Path(mod.edit_bfts_config_file(str(target/'bfts_config.yaml'),str(work),str(idea_md)))
                  text=config.read_text(encoding='utf-8')
                  if 'YAIWES integration test' not in idea_md.read_text(encoding='utf-8'): raise RuntimeError('IDEA_TO_MARKDOWN_FEATURE_FAILED')
                  if str(idea_md) not in text or str(work) not in text: raise RuntimeError('BFTS_CONFIG_FEATURE_FAILED')
                  if not (work/'data').is_dir() or not (work/'logs').is_dir(): raise RuntimeError('BFTS_WORKSPACE_FEATURE_FAILED')
                  return {'status':'PASS','capability':'ai_scientist_v2_bfts_idea_pipeline','idea_md':idea_md.name,'config':config.name,'data_dir':True,'logs_dir':True}
          def main()->int:
              import sys
              print('YAIWES_AI_SCIENTIST_V2_RESULT='+json.dumps(run_microtest(sys.argv[1]),separators=(',',':')));return 0
          if __name__=='__main__': raise SystemExit(main())
          PY
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          ADAPTER_SHA="$(sha256sum "$ADAPTER"|awk '{print $1}')"
          cat > "$FICHA" <<EOF
          {"artifact_id":"yaiwes.agent_fleet.ai_scientist_v2","version":"1.0.0","estado":"active","contract_hash":"sha256:${ADAPTER_SHA}","tribunal_case_id":"YAIWES-N35-AI-SCIENTIST-V2-STEP3","contrato":{"rol":"transform","consume":{"datatype":{"family":"json","type":"object","version":1}},"expone":{"datatype":{"family":"json","type":"object","version":1}}},"ejecucion":{"kind":"code","transport":"sdk","runtime_type":"compute","entry_point":"${ADAPTER}:run_microtest","idempotente":true},"seguridad":{"sandbox":"process","limites":{"timeout_ms":180000,"deadline_ms":180000}},"firma":{"gpg_key_id":"YAIWES-N35"},"categoria":"pipeline","etapa":"P","perfiles":{"n0":{"habilitada":true,"iteraciones":1,"simulaciones":0,"criticas":0,"muestras_k":1}},"repeticion":{"max":1,"condicion":"nunca"},"repite_en":[],"activacion":{"eventos":["kernel.v2.plugin.enchufed"],"wake_words":[],"condicion":""},"presupuesto":{"n0":{"max_tokens":1,"max_ms":180000,"max_costo_usd":0.0}},"telemetria":{"metricas":["tiempo","errores","health"],"span_otel":true},"evidencia":{"produce":["L2_build","L3_runtime","L4_feature"],"destino":"${TARGET}/yaiwes/"},"failover":{"sustituible_por":[],"compensacion":"fail_closed"},"salud":{"metodo":"exec","heartbeat_interval_s":30}}
          EOF

      - name: Retry exact FABLES plus upstream microtest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os,sys
          from pathlib import Path
          root=Path.cwd(); bp=root/os.environ['BUS']; ap=root/os.environ['ADAPTER']; fp=root/os.environ['FICHA']
          sys.path.insert(0,str(bp.parent))
          spec=importlib.util.spec_from_file_location('yaiwes_bus',bp); busmod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=busmod; spec.loader.exec_module(busmod)
          aspec=importlib.util.spec_from_file_location('yaiwes_ai_scientist_v2_adapter',ap); adapter=importlib.util.module_from_spec(aspec); sys.modules[aspec.name]=adapter; aspec.loader.exec_module(adapter)
          manifest=json.loads(fp.read_text(encoding='utf-8')); bus=busmod.UniversalPluginBus(); bus.add_tribunal_approval(manifest['tribunal_case_id'])
          cand=busmod.ComponentCandidate(source_code=ap.read_text(encoding='utf-8'),language='python',file_paths=[str(ap)])
          conv=busmod.TargetConventions(language='python',naming_style='snake_case',async_style='sync',type_system='dynamic')
          reg=bus.enchufar(manifest,cand,conv,registered_by='SOL integración 3')
          if reg.status.value!='ACTIVE' or not bus.trigger_plugin(manifest['artifact_id'],'kernel.v2.plugin.enchufed',{}): raise SystemExit('FABLES_RUNTIME_FAIL')
          result=adapter.run_microtest(root)
          if result.get('status')!='PASS': raise SystemExit(f'MICROTEST_FAIL:{result}')
          bus.health.heartbeat(manifest['artifact_id'])
          if not bus.check_plugin_health(manifest['artifact_id']): raise SystemExit('FABLES_HEALTH_FAIL')
          out={'node':'AI-Scientist-v2','worker':'SOL integración 3','status':'PASS','route':'FABLES -> adapter -> real upstream bfts_utils.idea_to_markdown + edit_bfts_config_file','plugin_id':manifest['artifact_id'],'microtest':'upstream_bfts_idea_pipeline','result':result,'evidence_levels':['L2_build','L3_runtime','L4_feature'],'prune':'NOT_NEEDED','repair':'sys.modules registration before exec_module'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('YAIWES_AI_SCIENTIST_V2_STEP3_PASS='+json.dumps(result,separators=(',',':')))
          PY

      - name: Commit artifacts and release node 35
        shell: bash
        run: |
          set -euo pipefail
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE"; git commit -m 'test(yaiwes): SOL3 AI-Scientist-v2 STEP3 repaired PASS'
          git fetch origin main; git rebase origin/main; git push origin HEAD:main
          git fetch origin main; git reset --hard origin/main
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); p=os.environ['WALL']; ip=os.environ['INVENTORY']
          with open(p,encoding='utf-8') as f:d=json.load(f)
          n=next(x for x in d['nodes'] if x.get('id')==35)
          if n.get('owner')!='SOL' or n.get('lock')!='CLAIMED': raise SystemExit('NODE35_CLAIM_LOST')
          def sha(x):return hashlib.sha256(open(x,'rb').read()).hexdigest()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); n['status']='PASS';n['owner']=None;n['lock']='FREE';n['current_step']=3;n['next_action']='COMPLETE'
          n['checkpoint']['after']=f'{now} STEP3 PASS after surgical importlib sys.modules repair; canonical FABLES ACTIVE/trigger/health + identical upstream BFTS microtest PASS; prune NOT_NEEDED'
          n.setdefault('evidence',[]).extend([f'step3:repair_commit:{head}',f'step3:adapter_sha256:{sha(os.environ["ADAPTER"])}',f'step3:ficha_sha256:{sha(os.environ["FICHA"])}',f'step3:evidence_sha256:{sha(os.environ["EVIDENCE"])}','step3:microtest:ai_scientist_v2_bfts_idea_pipeline:PASS','step3:prune:NOT_NEEDED'])
          n.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_PASS_RELEASE','commit':head,'repair':'register dynamic modules in sys.modules before exec_module'})
          d['updated_at']=now
          with open(p,'w',encoding='utf-8') as f:json.dump(d,f,ensure_ascii=False,indent=2);f.write('\n')
          with open(ip,encoding='utf-8') as f:inv=json.load(f)
          c=next(x for x in inv['components'] if x.get('wall_node_id')==35);c['wall_status']='PASS';c['wall_current_step']=3
          with open(ip,'w',encoding='utf-8') as f:json.dump(inv,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          git add -- "$WALL" "$INVENTORY"; git commit -m 'crazy-wall: SOL3 AI-Scientist-v2 STEP3 PASS release'; git push origin HEAD:main
