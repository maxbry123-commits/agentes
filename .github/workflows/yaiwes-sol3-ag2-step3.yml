name: YAIWES SOL3 AG2 STEP3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol3-ag2-step3.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol3-ag2-step3
  cancel-in-progress: false

jobs:
  wire_microtest_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      TARGET: 'Agente Yaiwes principal/agent-fleet-parallelism/ag2'
      ADAPTER: 'Agente Yaiwes principal/agent-fleet-parallelism/ag2/yaiwes/ag2_adapter.py'
      FICHA: 'Agente Yaiwes principal/agent-fleet-parallelism/ag2/yaiwes/ficha.ag2.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/agent-fleet-parallelism/ag2/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
    steps:
      - name: Checkout AG2 STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 8
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-sol3-ag2-step3.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Agente Yaiwes principal/agent-fleet-parallelism/ag2/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py

      - name: Claim AG2 STEP3 in Crazy Wall
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path=os.environ['WALL']
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(path,encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('component')=='AG2')
          if node.get('current_step') != 3 or node.get('status') not in ('PASS_STEP2','GAP_STEP3','GAP'):
              raise SystemExit(f"AG2_NOT_STEP3:{node.get('current_step')}:{node.get('status')}")
          if node.get('lock') not in ('FREE',None) or node.get('owner') not in (None,'SOL'):
              raise SystemExit(f"AG2_LOCKED:{node.get('owner')}:{node.get('lock')}")
          node['owner']='SOL'; node['lock']='CLAIMED'; node['status']='PENDING_STEP3'
          node.setdefault('checkpoint',{})['before']=(
              f"{now} SOL integración 3 STEP3 claim: canonical FABLES bus blob 470f9c91650bc6c59e2900f7e71090b84363da9f; "
              "wire AG2 adapter then run real upstream bridge workflow Hub alice->bob->alice without LLM/API keys"
          )
          node.setdefault('history',[]).append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'CLAIM_STEP3'})
          node['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'
          data['updated_at']=now
          with open(path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"
            git commit -m 'crazy-wall: SOL integración 3 claim AG2 STEP3' || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Verify canonical FABLES bus
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          echo CANONICAL_FABLES_BUS_OK

      - name: Build minimal AG2 YAIWES adapter and ficha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ADAPTER")"
          cat > "$ADAPTER" <<'PY'
          """YAIWES AG2 STEP3 adapter: real AG2 Network workflow through canonical FABLES bus."""
          from __future__ import annotations

          import asyncio
          import json
          import sys
          from pathlib import Path
          from typing import Any

          PLUGIN_ID = "yaiwes.agent_fleet.ag2"
          ROLE = "multi_agent_workflow_orchestration"
          TARGET_RELATIVE = "Agente Yaiwes principal/agent-fleet-parallelism/ag2"


          def descriptor() -> dict[str, str]:
              return {
                  "plugin_id": PLUGIN_ID,
                  "role": ROLE,
                  "target_path": TARGET_RELATIVE,
                  "microtest": "bridge_drives_workflow_alice_bob_alice",
              }


          async def _scenario() -> dict[str, Any]:
              from ag2.knowledge import MemoryKnowledgeStore
              from ag2.network import (
                  AgentTarget,
                  FromSpeaker,
                  Handoff,
                  Hub,
                  HubClient,
                  LocalLink,
                  Passport,
                  Resume,
                  RevertToInitiatorTarget,
                  TerminateTarget,
                  Transition,
                  TransitionGraph,
                  WorkflowState,
              )
              from ag2.network.adapters.workflow import WORKFLOW_TYPE
              from ag2.network.channel import ChannelState

              store = MemoryKnowledgeStore()
              hub = await Hub.open(store, ttl_sweep_interval=0)
              link = LocalLink(hub)
              alice_hc = HubClient(link, hub=hub)
              bob_hc = HubClient(link, hub=hub)
              try:
                  alice = await alice_hc.register_human(Passport(name="alice"), resume=Resume())
                  bob = await bob_hc.register_human(Passport(name="bob"), resume=Resume())
                  graph = TransitionGraph(
                      initial_speaker=alice.agent_id,
                      transitions=[
                          Transition(when=FromSpeaker(alice.agent_id), then=AgentTarget(bob.agent_id)),
                          Transition(when=FromSpeaker(bob.agent_id), then=RevertToInitiatorTarget()),
                      ],
                      default_target=TerminateTarget(reason="yaiwes_ag2_bridge_done"),
                      max_turns=8,
                  )
                  channel = await alice.open(
                      type=WORKFLOW_TYPE,
                      target=[bob.agent_id],
                      knobs={"graph": graph.to_dict()},
                  )
                  if channel.state != ChannelState.ACTIVE:
                      raise RuntimeError(f"AG2_CHANNEL_NOT_ACTIVE:{channel.state}")
                  adapter = hub.adapter_for(channel.channel_id)
                  env_alice = adapter.build_packet_envelope(
                      channel_id=channel.channel_id,
                      sender_id=alice.agent_id,
                      body="alice opens the discussion",
                  )
                  await hub.post_envelope(env_alice)
                  state1 = hub.adapter_state(channel.channel_id)
                  if not isinstance(state1, WorkflowState) or state1.expected_next_speaker != bob.agent_id:
                      raise RuntimeError(f"AG2_ALICE_TO_BOB_FAILED:{state1}")
                  env_bob = adapter.build_packet_envelope(
                      channel_id=channel.channel_id,
                      sender_id=bob.agent_id,
                      body="bob replies",
                      handoff=Handoff(target=alice.agent_id, reason="back to you"),
                  )
                  await hub.post_envelope(env_bob)
                  state2 = hub.adapter_state(channel.channel_id)
                  if state2.expected_next_speaker != alice.agent_id:
                      raise RuntimeError(f"AG2_BOB_TO_ALICE_FAILED:{state2}")
                  return {
                      "status": "PASS",
                      "capability": "ag2_network_workflow_handoff",
                      "route": ["alice", "bob", "alice"],
                      "channel_state": str(channel.state.value),
                      "last_speaker": "bob",
                  }
              finally:
                  await alice_hc.close()
                  await bob_hc.close()
                  await hub.close()


          def run_microtest(repo_root: str | Path) -> dict[str, Any]:
              root = Path(repo_root).resolve()
              target = root / TARGET_RELATIVE
              if not (target / "ag2" / "network").is_dir():
                  raise RuntimeError(f"AG2_NETWORK_MISSING:{target}")
              if str(target) not in sys.path:
                  sys.path.insert(0, str(target))
              return asyncio.run(_scenario())


          def main() -> int:
              if len(sys.argv) != 2:
                  raise SystemExit("usage: ag2_adapter.py <repo_root>")
              result = run_microtest(sys.argv[1])
              print("YAIWES_AG2_RESULT=" + json.dumps(result, separators=(",", ":")), flush=True)
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          adapter=Path(os.environ['ADAPTER'])
          digest='sha256:'+hashlib.sha256(adapter.read_bytes()).hexdigest()
          manifest={
            "artifact_id":"yaiwes.agent_fleet.ag2",
            "version":"1.0.0",
            "estado":"active",
            "contract_hash":digest,
            "tribunal_case_id":"YAIWES-N28-AG2-STEP3",
            "contrato":{
              "rol":"transform",
              "consume":{"datatype":{"family":"json","type":"object","version":1}},
              "expone":{"datatype":{"family":"json","type":"object","version":1}}
            },
            "ejecucion":{
              "kind":"code","transport":"sdk","runtime_type":"compute",
              "entry_point":os.environ['ADAPTER']+":run_microtest","idempotente":True
            },
            "seguridad":{"sandbox":"process","limites":{"timeout_ms":180000,"deadline_ms":180000}},
            "firma":{"gpg_key_id":"YAIWES-N28"},
            "categoria":"pipeline","etapa":"P",
            "perfiles":{"n0":{"habilitada":True,"iteraciones":1,"simulaciones":0,"criticas":0,"muestras_k":1}},
            "repeticion":{"max":1,"condicion":"nunca"},"repite_en":[],
            "activacion":{"eventos":["kernel.v2.plugin.enchufed"],"wake_words":[],"condicion":""},
            "presupuesto":{"n0":{"max_tokens":1,"max_ms":180000,"max_costo_usd":0.0}},
            "telemetria":{"metricas":["tiempo","errores","health"],"span_otel":True},
            "evidencia":{"produce":["L2_build","L3_runtime","L4_feature"],"destino":str(Path(os.environ['EVIDENCE']).parent)+"/"},
            "failover":{"sustituible_por":[],"compensacion":"fail_closed"},
            "salud":{"metodo":"exec","heartbeat_interval_s":30}
          }
          Path(os.environ['FICHA']).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AG2_ADAPTER_SHA256='+digest)
          PY

      - name: Install AG2 moved target dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "$TARGET"

      - name: FABLES enchufe plus real AG2 workflow microtest
        id: test
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/ag2-step3.log 2>&1
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          root=Path.cwd()
          adapter_path=root/os.environ['ADAPTER']
          ficha_path=root/os.environ['FICHA']
          bus_path=root/os.environ['BUS']
          source=adapter_path.read_text(encoding='utf-8')
          manifest=json.loads(ficha_path.read_text(encoding='utf-8'))
          actual='sha256:'+hashlib.sha256(source.encode()).hexdigest()
          assert actual==manifest['contract_hash'], (actual,manifest['contract_hash'])
          sys.path.insert(0,str(bus_path.parent))
          import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus()
          bus.add_tribunal_approval(manifest['tribunal_case_id'])
          candidate=bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']])
          conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest,candidate,conventions,registered_by='SOL integración 3')
          assert reg.status==bus_mod.PluginStatus.ACTIVE
          assert reg.plugin_id=='yaiwes.agent_fleet.ag2'
          bus.health.heartbeat(reg.plugin_id)
          assert bus.check_plugin_health(reg.plugin_id)
          spec=importlib.util.spec_from_file_location('yaiwes_ag2_adapter',adapter_path)
          mod=importlib.util.module_from_spec(spec); assert spec and spec.loader; spec.loader.exec_module(mod)
          result=mod.run_microtest(root)
          assert result['status']=='PASS',result
          assert result['route']==['alice','bob','alice'],result
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result})
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'ag2_network_workflow_handoff','verified':True})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]
          assert 'L2_build' in levels and 'L3_runtime' in levels and 'L4_feature' in levels,levels
          ev={
            'node':'AG2','worker':'SOL integración 3','status':'PASS',
            'route':'FABLES -> AG2 adapter -> real AG2 Hub -> TransitionGraph -> alice -> bob -> alice',
            'plugin_id':reg.plugin_id,
            'microtest':'bridge_drives_workflow_alice_bob_alice',
            'result':result,'evidence_levels':levels,
            'run':int(os.environ['GITHUB_RUN_ID']),'runner_commit':os.environ['GITHUB_SHA'],
            'adapter_sha256':actual,
            'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f',
            'canonical_ficha_code_blob':'a72508027cc2458553ef6a2255a9aa33d9a77a21',
            'prune':'NOT_NEEDED'
          }
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AG2_NETWORK_WORKFLOW_MICROTEST=PASS route=alice,bob,alice')
          print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY
          rc=$?
          cat /tmp/ag2-step3.log
          tail_line="$(tail -n 8 /tmp/ag2-step3.log | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-1500)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "tail=$tail_line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish STEP3 adapter ficha evidence
        id: publish
        if: steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE"
          git commit -m 'test(yaiwes): SOL3 AG2 FABLES workflow STEP3 PASS'
          git reset --hard HEAD
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true
            git reset --hard HEAD
            sleep $((attempt*2))
          done
          test "$ok" -eq 1
          echo "evidence_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read-back STEP3 evidence
        if: steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -n "$(git ls-tree -r --name-only origin/main -- "$TARGET")"
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.agent_fleet.ag2'
          git show "origin/main:$EVIDENCE" | grep -Fq 'alice'
          git show "origin/main:$EVIDENCE" | grep -Fq 'L4_feature'
          git show "origin/main:$EVIDENCE" | grep -Fq 'NOT_NEEDED'
          echo AG2_STEP3_READBACK_OK

      - name: Checkpoint AG2 STEP3 PASS or GAP and release
        shell: bash
        env:
          TEST_RC: ${{ steps.test.outputs.rc }}
          TEST_TAIL: ${{ steps.test.outputs.tail }}
          EVIDENCE_COMMIT: ${{ steps.publish.outputs.evidence_commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          rc=int(os.environ.get('TEST_RC') or 99)
          tail=(os.environ.get('TEST_TAIL') or 'NO_TEST_OUTPUT')[:1500]
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('component')=='AG2')
          if node.get('owner')!='SOL' or node.get('lock')!='CLAIMED' or node.get('current_step')!=3:
              raise SystemExit(f"LOCK_OR_STEP_CHANGED:{node.get('owner')}:{node.get('lock')}:{node.get('current_step')}")
          ev=node.setdefault('evidence',[])
          if rc==0:
              node['status']='PASS'
              node['checkpoint']['after']=(
                  'STEP3 PASS: canonical FABLES UniversalPluginBus ACTIVE for yaiwes.agent_fleet.ag2; '
                  'real moved AG2 Hub/TransitionGraph workflow routed alice->bob->alice without LLM/API keys; '
                  'L2+L3+L4 evidence; prune NOT_NEEDED; origin/main adapter/ficha/evidence read-back PASS.'
              )
              items=[
                  f"step3:run:{os.environ['GITHUB_RUN_ID']}",
                  f"step3:evidence_commit:{os.environ.get('EVIDENCE_COMMIT') or 'unknown'}",
                  'step3:canonical_bus_blob:470f9c91650bc6c59e2900f7e71090b84363da9f',
                  'step3:route:FABLES->AG2 adapter->Hub->TransitionGraph->alice->bob->alice',
                  'step3:microtest:PASS route=alice,bob,alice no-LLM no-API-key',
                  'step3:evidence:L2_build+L3_runtime+L4_feature',
                  'step3:prune:NOT_NEEDED',
                  'step3:readback:adapter+ficha+evidence PASS'
              ]
              for item in items:
                  if item not in ev: ev.append(item)
              node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ.get('EVIDENCE_COMMIT')})
              node['next_action']='COMPLETE'
          else:
              node['status']='GAP_STEP3'
              node['checkpoint']['after']=f"STEP3 GAP run={os.environ['GITHUB_RUN_ID']}: {tail}"
              ev.append(f"step3:gap:run:{os.environ['GITHUB_RUN_ID']}:{tail}")
              node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_GAP_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])})
              node['next_action']='REPAIR_EXACT_STEP3_GAP_AND_RETRY'
          node['owner']=None; node['lock']='FREE'
          data['updated_at']=now
          data.setdefault('counts',{})['closed_current_contract']=sum(1 for n in data['nodes'] if n.get('next_action')=='COMPLETE')
          with open(os.environ['INVENTORY'],encoding='utf-8') as f: inv=json.load(f)
          comp=next(c for c in inv['components'] if c.get('name')=='AG2')
          comp['wall_node_id']=node['id']; comp['wall_status']=node['status']; comp['wall_current_step']=node['current_step']; comp['wall_target']=node['target']
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          with open(os.environ['INVENTORY'],'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL" "$INVENTORY"
            git commit -m "crazy-wall: SOL integración 3 AG2 STEP3 checkpoint run $GITHUB_RUN_ID" || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Fail closed on AG2 STEP3 GAP
        if: steps.test.outputs.rc != '0'
        shell: bash
        run: |
          echo "AG2 STEP3 GAP: ${{ steps.test.outputs.tail }}"
          exit 1
