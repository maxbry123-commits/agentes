name: Organize Yaiwes NOW

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extraction-single-writer-main
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Organize, verify and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/organize_yaiwes_3step_20260903.py apply
          python3 scripts/organize_yaiwes_3step_20260903.py index
          python3 scripts/organize_yaiwes_3step_20260903.py verify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'ORGANIZATION_NO_CHANGE'; exit 0; fi
          git commit -m 'organize: canonical Yaiwes repository layout'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push --no-verify origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            test "$attempt" -lt 3 || exit 41
            sleep $((attempt * 10))
          done
