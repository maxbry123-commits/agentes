name: YAIWES SOL3 Agenta STEP3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol3-agenta-step3.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol3-agenta-step3
  cancel-in-progress: false

jobs:
  wire_microtest_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      TARGET: 'Agente Yaiwes principal/agent-fleet-parallelism/agenta'
      ADAPTER: 'Agente Yaiwes principal/agent-fleet-parallelism/agenta/yaiwes/agenta_adapter.py'
      FICHA: 'Agente Yaiwes principal/agent-fleet-parallelism/agenta/yaiwes/ficha.agenta.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/agent-fleet-parallelism/agenta/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
    steps:
      - name: Checkout Agenta STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 8
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-sol3-agenta-step3.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Agente Yaiwes principal/agent-fleet-parallelism/agenta/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py

      - name: Claim Agenta STEP3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('component')=='Agenta')
          if node.get('current_step')!=3 or node.get('status') not in ('PASS_STEP2','GAP_STEP3','GAP'):
              raise SystemExit(f"AGENTA_NOT_STEP3:{node.get('current_step')}:{node.get('status')}")
          if node.get('lock') not in ('FREE',None) or node.get('owner') not in (None,'SOL'):
              raise SystemExit(f"AGENTA_LOCKED:{node.get('owner')}:{node.get('lock')}")
          node['owner']='SOL'; node['lock']='CLAIMED'; node['status']='PENDING_STEP3'
          node['checkpoint']['before']=(
              f"{now} SOL integración 3 STEP3 claim: canonical FABLES bus 470f9c91650bc6c59e2900f7e71090b84363da9f; "
              "execute real Agenta build_agent_template_overlay and verify scheduling/subscription/run/tracing ops and sandbox permissions"
          )
          node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'CLAIM_STEP3'})
          node['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'
          data['updated_at']=now
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 3 claim Agenta STEP3' || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Verify canonical FABLES bus
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          echo CANONICAL_FABLES_BUS_OK

      - name: Build minimal Agenta adapter and ficha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ADAPTER")"
          cat > "$ADAPTER" <<'PY'
          """YAIWES Agenta STEP3 adapter: validate the real platform build-kit through FABLES."""
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path
          from typing import Any

          PLUGIN_ID = "yaiwes.agent_fleet.agenta"
          ROLE = "agent_workspace_background_runtime"
          TARGET_RELATIVE = "Agente Yaiwes principal/agent-fleet-parallelism/agenta"

          REQUIRED_PLATFORM_OPS = {
              "commit_revision",
              "query_spans",
              "test_run",
              "discover_triggers",
              "create_schedule",
              "create_subscription",
              "list_schedules",
              "list_deliveries",
              "test_subscription",
              "remove_schedule",
              "remove_subscription",
          }

          def descriptor() -> dict[str, str]:
              return {
                  "plugin_id": PLUGIN_ID,
                  "role": ROLE,
                  "microtest": "real_build_kit_background_agent_ops",
              }

          def run_microtest(repo_root: str | Path) -> dict[str, Any]:
              root = Path(repo_root).resolve()
              target = root / TARGET_RELATIVE
              api = target / "api"
              sdk = target / "sdks" / "python"
              client = target / "clients" / "python"
              for path in (client, sdk, api):
                  if not path.is_dir():
                      raise RuntimeError(f"AGENTA_RUNTIME_PATH_MISSING:{path}")
                  if str(path) not in sys.path:
                      sys.path.insert(0, str(path))

              from oss.src.core.workflows.build_kit import build_agent_template_overlay

              overlay = build_agent_template_overlay()
              tools = overlay.get("tools") or []
              platform_tools = [t for t in tools if isinstance(t, dict) and t.get("type") == "platform"]
              op_names = [t.get("op") for t in platform_tools]
              missing = sorted(REQUIRED_PLATFORM_OPS.difference(op_names))
              if missing:
                  raise RuntimeError(f"AGENTA_BUILD_KIT_OPS_MISSING:{missing}")
              allowed = [t.get("op") for t in platform_tools if t.get("permission") == "allow"]
              if allowed != ["rename_session", "rename_agent"]:
                  raise RuntimeError(f"AGENTA_AUTO_PERMISSION_DRIFT:{allowed}")
              sandbox = overlay.get("sandbox") or {}
              permissions = sandbox.get("permissions") or {}
              if permissions.get("write_files") != "allow" or permissions.get("execute_code") != "allow":
                  raise RuntimeError(f"AGENTA_SANDBOX_PERMISSION_DRIFT:{permissions}")
              skills = overlay.get("skills") or []
              if not skills:
                  raise RuntimeError("AGENTA_BUILD_KIT_SKILL_MISSING")
              return {
                  "status": "PASS",
                  "capability": "agent_build_kit_background_runtime",
                  "required_ops_verified": sorted(REQUIRED_PLATFORM_OPS),
                  "platform_op_count": len(platform_tools),
                  "auto_allowed_ops": allowed,
                  "sandbox_permissions": permissions,
                  "skill_count": len(skills),
              }

          def main() -> int:
              if len(sys.argv) != 2:
                  raise SystemExit("usage: agenta_adapter.py <repo_root>")
              result = run_microtest(sys.argv[1])
              print("YAIWES_AGENTA_RESULT=" + json.dumps(result,separators=(",",":")), flush=True)
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          adapter=Path(os.environ['ADAPTER'])
          digest='sha256:'+hashlib.sha256(adapter.read_bytes()).hexdigest()
          manifest={
            "artifact_id":"yaiwes.agent_fleet.agenta","version":"1.0.0","estado":"active",
            "contract_hash":digest,"tribunal_case_id":"YAIWES-N29-AGENTA-STEP3",
            "contrato":{"rol":"transform","consume":{"datatype":{"family":"json","type":"object","version":1}},"expone":{"datatype":{"family":"json","type":"object","version":1}}},
            "ejecucion":{"kind":"code","transport":"sdk","runtime_type":"compute","entry_point":os.environ['ADAPTER']+":run_microtest","idempotente":True},
            "seguridad":{"sandbox":"process","limites":{"timeout_ms":300000,"deadline_ms":300000}},
            "firma":{"gpg_key_id":"YAIWES-N29"},"categoria":"pipeline","etapa":"P",
            "perfiles":{"n0":{"habilitada":True,"iteraciones":1,"simulaciones":0,"criticas":0,"muestras_k":1}},
            "repeticion":{"max":1,"condicion":"nunca"},"repite_en":[],
            "activacion":{"eventos":["kernel.v2.plugin.enchufed"],"wake_words":[],"condicion":""},
            "presupuesto":{"n0":{"max_tokens":1,"max_ms":300000,"max_costo_usd":0.0}},
            "telemetria":{"metricas":["tiempo","errores","health"],"span_otel":True},
            "evidencia":{"produce":["L2_build","L3_runtime","L4_feature"],"destino":str(Path(os.environ['EVIDENCE']).parent)+"/"},
            "failover":{"sustituible_por":[],"compensacion":"fail_closed"},
            "salud":{"metodo":"exec","heartbeat_interval_s":30}
          }
          Path(os.environ['FICHA']).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AGENTA_ADAPTER_SHA256='+digest)
          PY

      - name: Install Agenta local Python client and SDK
        id: install
        shell: bash
        run: |
          set +e
          python3 -m pip install --disable-pip-version-check --no-input "$TARGET/clients/python" > /tmp/agenta-install.log 2>&1
          rc1=$?
          if [ "$rc1" -eq 0 ]; then
            python3 -m pip install --disable-pip-version-check --no-input "$TARGET/sdks/python" >> /tmp/agenta-install.log 2>&1
            rc2=$?
          else
            rc2=99
          fi
          rc=$rc1
          if [ "$rc" -eq 0 ]; then rc=$rc2; fi
          cat /tmp/agenta-install.log
          tail_line="$(tail -n 12 /tmp/agenta-install.log | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-1800)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "tail=$tail_line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: FABLES enchufe plus real Agenta build-kit microtest
        id: test
        if: steps.install.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/agenta-step3.log 2>&1
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path
          root=Path.cwd(); adapter_path=root/os.environ['ADAPTER']; ficha_path=root/os.environ['FICHA']; bus_path=root/os.environ['BUS']
          source=adapter_path.read_text(encoding='utf-8'); manifest=json.loads(ficha_path.read_text(encoding='utf-8'))
          actual='sha256:'+hashlib.sha256(source.encode()).hexdigest(); assert actual==manifest['contract_hash']
          sys.path.insert(0,str(bus_path.parent))
          import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus(); bus.add_tribunal_approval(manifest['tribunal_case_id'])
          candidate=bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']]); conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest,candidate,conventions,registered_by='SOL integración 3')
          assert reg.status==bus_mod.PluginStatus.ACTIVE and reg.plugin_id=='yaiwes.agent_fleet.agenta'
          bus.health.heartbeat(reg.plugin_id); assert bus.check_plugin_health(reg.plugin_id)
          spec=importlib.util.spec_from_file_location('yaiwes_agenta_adapter',adapter_path); mod=importlib.util.module_from_spec(spec); assert spec and spec.loader; spec.loader.exec_module(mod)
          result=mod.run_microtest(root); assert result['status']=='PASS',result
          assert 'create_schedule' in result['required_ops_verified'] and 'create_subscription' in result['required_ops_verified']
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result})
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'agent_build_kit_background_runtime','verified':True})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]; assert 'L2_build' in levels and 'L3_runtime' in levels and 'L4_feature' in levels,levels
          ev={'node':'Agenta','worker':'SOL integración 3','status':'PASS','route':'FABLES -> Agenta adapter -> real build_agent_template_overlay -> platform ops + sandbox permissions','plugin_id':reg.plugin_id,'microtest':'real_build_kit_background_agent_ops','result':result,'evidence_levels':levels,'run':int(os.environ['GITHUB_RUN_ID']),'runner_commit':os.environ['GITHUB_SHA'],'adapter_sha256':actual,'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f','canonical_ficha_code_blob':'a72508027cc2458553ef6a2255a9aa33d9a77a21','prune':'NOT_NEEDED'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AGENTA_BUILD_KIT_MICROTEST=PASS')
          print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY
          rc=$?
          cat /tmp/agenta-step3.log
          tail_line="$(tail -n 12 /tmp/agenta-step3.log | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-1800)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "tail=$tail_line" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish Agenta STEP3 evidence
        id: publish
        if: steps.install.outputs.rc == '0' && steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE"; git commit -m 'test(yaiwes): SOL3 Agenta FABLES build-kit STEP3 PASS'
          git reset --hard HEAD
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; git reset --hard HEAD; sleep $((attempt*2))
          done
          test "$ok" -eq 1
          echo "evidence_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read-back Agenta STEP3 evidence
        if: steps.install.outputs.rc == '0' && steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.agent_fleet.agenta'
          git show "origin/main:$EVIDENCE" | grep -Fq 'create_schedule'
          git show "origin/main:$EVIDENCE" | grep -Fq 'create_subscription'
          git show "origin/main:$EVIDENCE" | grep -Fq 'L4_feature'
          git show "origin/main:$EVIDENCE" | grep -Fq 'NOT_NEEDED'
          echo AGENTA_STEP3_READBACK_OK

      - name: Checkpoint Agenta STEP3 PASS or GAP and release
        shell: bash
        env:
          INSTALL_RC: ${{ steps.install.outputs.rc }}
          INSTALL_TAIL: ${{ steps.install.outputs.tail }}
          TEST_RC: ${{ steps.test.outputs.rc }}
          TEST_TAIL: ${{ steps.test.outputs.tail }}
          EVIDENCE_COMMIT: ${{ steps.publish.outputs.evidence_commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          install_rc=int(os.environ.get('INSTALL_RC') or 99); test_raw=os.environ.get('TEST_RC'); test_rc=int(test_raw) if test_raw not in (None,'') else 99
          detail=(os.environ.get('INSTALL_TAIL') if install_rc else os.environ.get('TEST_TAIL')) or 'NO_OUTPUT'; detail=detail[:1800]
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('component')=='Agenta')
          if node.get('owner')!='SOL' or node.get('lock')!='CLAIMED' or node.get('current_step')!=3:
              raise SystemExit(f"LOCK_OR_STEP_CHANGED:{node.get('owner')}:{node.get('lock')}:{node.get('current_step')}")
          ev=node.setdefault('evidence',[])
          if install_rc==0 and test_rc==0:
              node['status']='PASS'; node['checkpoint']['after']='STEP3 PASS: canonical FABLES ACTIVE for yaiwes.agent_fleet.agenta; real moved Agenta build_agent_template_overlay verified commit/test_run/tracing/schedule/subscription ops and sandbox permissions; L2+L3+L4; prune NOT_NEEDED; origin/main evidence read-back PASS.'
              for item in [f"step3:run:{os.environ['GITHUB_RUN_ID']}",f"step3:evidence_commit:{os.environ.get('EVIDENCE_COMMIT') or 'unknown'}",'step3:canonical_bus_blob:470f9c91650bc6c59e2900f7e71090b84363da9f','step3:route:FABLES->Agenta adapter->build_agent_template_overlay->platform ops','step3:microtest:PASS commit_revision+test_run+query_spans+create_schedule+create_subscription','step3:evidence:L2_build+L3_runtime+L4_feature','step3:prune:NOT_NEEDED','step3:readback:adapter+ficha+evidence PASS']:
                  if item not in ev: ev.append(item)
              node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ.get('EVIDENCE_COMMIT')}); node['next_action']='COMPLETE'
          else:
              stage='INSTALL' if install_rc else 'MICROTEST'; rc=install_rc if install_rc else test_rc
              node['status']='GAP_STEP3'; node['checkpoint']['after']=f"STEP3 GAP {stage} run={os.environ['GITHUB_RUN_ID']} rc={rc}: {detail}"; ev.append(f"step3:gap:{stage}:run:{os.environ['GITHUB_RUN_ID']}:rc={rc}:{detail}"); node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':f'STEP3_GAP_{stage}_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])}); node['next_action']='REPAIR_EXACT_STEP3_GAP_AND_RETRY'
          node['owner']=None; node['lock']='FREE'; data['updated_at']=now; data.setdefault('counts',{})['closed_current_contract']=sum(1 for n in data['nodes'] if n.get('next_action')=='COMPLETE')
          with open(os.environ['INVENTORY'],encoding='utf-8') as f: inv=json.load(f)
          comp=next(c for c in inv['components'] if c.get('name')=='Agenta'); comp['wall_node_id']=node['id']; comp['wall_status']=node['status']; comp['wall_current_step']=node['current_step']; comp['wall_target']=node['target']
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          with open(os.environ['INVENTORY'],'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL" "$INVENTORY"; git commit -m "crazy-wall: SOL integración 3 Agenta STEP3 checkpoint run $GITHUB_RUN_ID" || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Fail closed on Agenta STEP3 GAP
        if: steps.install.outputs.rc != '0' || steps.test.outputs.rc != '0'
        shell: bash
        run: |
          echo "Agenta STEP3 GAP registered in Crazy Wall"
          exit 1
