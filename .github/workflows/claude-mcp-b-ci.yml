name: Claude MCP B CI

on:
  push:
    branches: [claude-mcp-write-test]
    paths:
      - 'coneccion huggueface Github/**'
      - '.github/workflows/claude-mcp-b-ci.yml'

permissions:
  contents: read

concurrency:
  group: claude-mcp-b-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            coneccion huggueface Github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'coneccion huggueface Github/requirements.txt'
      - name: Install pinned runtime
        run: python -m pip install -r 'coneccion huggueface Github/requirements.txt'
      - name: Compile source
        run: python -m py_compile 'coneccion huggueface Github/app.py'
      - name: Import public MCP server
        working-directory: 'coneccion huggueface Github'
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ci-placeholder
        run: |
          python - <<'PY'
          import app
          assert app.DEFAULT_OWNER == 'maxbry123-commits'
          assert app.mcp.name == 'Maxbry GitHub Backup'
          print('IMPORT_PASS')
          PY
      - name: HTTP MCP no-auth smoke test
        working-directory: 'coneccion huggueface Github'
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ci-placeholder
          PORT: '7860'
        run: |
          set -eu
          python app.py > /tmp/claude-mcp-b.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 3
          HTTP_CODE=$(curl -sS -o /tmp/mcp-response -w '%{http_code}' -H 'Accept: application/json, text/event-stream' http://127.0.0.1:7860/mcp || true)
          test "$HTTP_CODE" = "400" || test "$HTTP_CODE" = "405"
          ! grep -qi 'www-authenticate' /tmp/mcp-response || false
          echo "HTTP_MCP_NO_AUTH_PASS=$HTTP_CODE"
      - name: Build Docker image
        run: docker build -t claude-mcp-b:ci 'coneccion huggueface Github'
      - name: Check no PAT is committed
        run: |
          if grep -R -E 'github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' 'coneccion huggueface Github' --exclude='*.md'; then
            echo 'Possible GitHub token found in source' >&2
            exit 1
          fi
          echo 'SECRET_SCAN_PASS'
