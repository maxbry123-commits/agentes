name: Claude MCP B CI

on:
  push:
    branches: [claude-mcp-write-test]
    paths:
      - 'claude-mcp-b/**'
      - '.github/workflows/claude-mcp-b-ci.yml'

permissions:
  contents: read

concurrency:
  group: claude-mcp-b-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            claude-mcp-b
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: claude-mcp-b/requirements.txt
      - name: Install pinned runtime
        run: python -m pip install -r claude-mcp-b/requirements.txt
      - name: Compile source
        run: python -m py_compile claude-mcp-b/app.py
      - name: Import server with non-secret test configuration
        working-directory: claude-mcp-b
        env:
          OAUTH_CLIENT_ID: ci-placeholder
          OAUTH_CLIENT_SECRET: ci-placeholder
          MCP_PUBLIC_BASE_URL: https://example.invalid
        run: |
          python - <<'PY'
          import app
          assert app.DEFAULT_OWNER == 'maxbry123-commits'
          assert 'COMAND-CENTER-1' in app.ALLOWED_HF_USERS
          assert app.mcp.name == 'Maxbry GitHub Backup'
          print('IMPORT_PASS')
          PY
      - name: HTTP OAuth discovery smoke test
        working-directory: claude-mcp-b
        env:
          OAUTH_CLIENT_ID: ci-placeholder
          OAUTH_CLIENT_SECRET: ci-placeholder
          MCP_PUBLIC_BASE_URL: http://127.0.0.1:7860
          PORT: '7860'
        run: |
          python app.py > /tmp/claude-mcp-b.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/.well-known/oauth-protected-resource >/tmp/protected.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/protected.json
          grep -q 'authorization_servers' /tmp/protected.json
          HTTP_CODE=$(curl -sS -o /tmp/mcp-response -w '%{http_code}' http://127.0.0.1:7860/mcp || true)
          test "$HTTP_CODE" = "401" || test "$HTTP_CODE" = "405"
          echo "HTTP_MCP_AUTH_GATE_PASS=$HTTP_CODE"
      - name: Build Docker image
        run: docker build -t claude-mcp-b:ci ./claude-mcp-b
      - name: Check no PAT is committed
        run: |
          if grep -R -E 'github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' claude-mcp-b --exclude='*.md'; then
            echo 'Possible GitHub token found in source' >&2
            exit 1
          fi
          echo 'SECRET_SCAN_PASS'
