name: Pack YAIWES 25 segments

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pack-yaiwes-25.yml"
      - "scripts/pack_yaiwes_25.py"

permissions:
  contents: read
  actions: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pack 25 + micros (copy only)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/pack_yaiwes_25.py
          ls -la dist/YAIWES-WORDFLOW-25/*.zip
          wc -l dist/YAIWES-WORDFLOW-25/INVENTARIO-MAESTRO.csv
          cat dist/YAIWES-WORDFLOW-25/SOURCE-LOCK.md

      - name: Upload segment ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: yaiwes-25-${{ github.sha }}
          path: |
            dist/YAIWES-WORDFLOW-25/*.zip
            dist/YAIWES-WORDFLOW-25/SOURCE-LOCK.md
            dist/YAIWES-WORDFLOW-25/INVENTARIO-MAESTRO.csv
          if-no-files-found: error
          retention-days: 30
