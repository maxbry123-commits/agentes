name: verify-g5-wordflow

on:
  push:
    paths:
      - 'Refactoria/G5/**'
      - 'agente-yaiwes/code-programming-engine/code-path-execution/p*.py'
      - '.github/workflows/verify-g5-wordflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-g5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify protected hot path blob
        run: |
          test "$(git hash-object extensions/wordflow/engine/code_path_runner.py)" = "f1c3e519e317d06352945b230ad4a03b02422ad5"
      - name: Run G5 p01-p12 tests
        run: PYTHONPATH=. pytest -q Refactoria/G5/new/test_p01_p12.py
      - name: Verify all twelve cable nodes
        run: |
          for p in p01_context p02_pre_gate p03_quality_bar p04_goal_lock p05_policy_snapshot p06_cognitive p07_path_gateway p08_evidence p09_quality_dag p10_core_fc p11_forensic p12_closure; do
            test -s "agente-yaiwes/code-programming-engine/code-path-execution/${p}.py"
          done
      - name: Emit G5 evidence
        run: |
          mkdir -p agente-yaiwes/observability/trace-history PIPELINE/checkpoints
          cat > agente-yaiwes/observability/trace-history/G5_P01_P12_CI_TRACE.md <<EOF
          # G5 p01→p12 CI trace
          - workflow: verify-g5-wordflow
          - run_id: $GITHUB_RUN_ID
          - sha: $GITHUB_SHA
          - tests: PASS
          - cable: p01→p02→p03→p04→p05→p06→p07→p08→p09→p10→p11→p12
          - implementation: derived orchestration over canonical runner
          - protected hot path: hash verified against f1c3e519e317d06352945b230ad4a03b02422ad5
          - evidence: real GitHub Actions execution
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: g5-p01-p12-evidence-${{ github.run_id }}
          path: agente-yaiwes/observability/trace-history/G5_P01_P12_CI_TRACE.md
          if-no-files-found: error
