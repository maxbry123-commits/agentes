name: YAIWES Step2 Copy Auditor API
run-name: YAIWES Step2 Auditor • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_run:
    workflows: ["YAIWES Step2 Copy Repair01 Sparse"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaiwes-step2-copy-auditor-api-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare source and destination bytes via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.parse, urllib.request
          src_repo='maxbry123-commits/Agentes-motores-Wordflow-YAIWES'
          dst_repo='maxbry123-commits/agentes'
          src_ref='0ca97d7c7e8a2e20e986d18e273c6171a2684d30'
          src_root='Loop Engineer/Loop-Engineer/loop'
          dst_root='➡️📂 Wordflow LOOP Yaiwes/wordflow_loop/donors/loop_engineer'
          files=['__init__.py','runner.py','runcontrol.py','runtime.py','reducer.py','verifier.py','plan.py','events.py','evidence.py','fsm.py','completion.py','chain.py','contract.py','emit.py']
          token=os.environ['GH_TOKEN']
          def get(repo,path,ref,auth=True):
              url='https://api.github.com/repos/'+repo+'/contents/'+urllib.parse.quote(path,safe='/')+'?ref='+urllib.parse.quote(ref,safe='')
              headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              if auth: headers['Authorization']='Bearer '+token
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          def raw(repo,path,ref,auth=True):
              x=get(repo,path,ref,auth); assert x['type']=='file'; return base64.b64decode(x['content']),x['sha']
          gaps=[]
          for f in files:
              s,ssha=raw(src_repo,src_root+'/'+f,src_ref,False)
              d,dsha=raw(dst_repo,dst_root+'/'+f,'main',True)
              if s!=d: gaps.append(f+':bytes_mismatch')
              print(f'{f}: source_blob={ssha[:12]} dest_blob={dsha[:12]} bytes={len(d)} equal={s==d}')
              try: compile(d.decode('utf-8'),dst_root+'/'+f,'exec')
              except Exception as e: gaps.append(f+':compile:'+repr(e))
          commit_txt,_=raw(dst_repo,dst_root+'/SOURCE_COMMIT.txt','main',True)
          url_txt,_=raw(dst_repo,dst_root+'/SOURCE_URL.txt','main',True)
          sums_txt,sums_blob=raw(dst_repo,dst_root+'/SOURCE_SHA256SUMS.txt','main',True)
          if commit_txt.decode().strip()!=src_ref: gaps.append('source_commit_provenance')
          if url_txt.decode().strip()!='https://github.com/maxbry123-commits/Agentes-motores-Wordflow-YAIWES': gaps.append('source_url_provenance')
          if not sums_txt.strip(): gaps.append('empty_sha_manifest')
          print('source_preserved=PASS')
          print('copy_semantics=' + ('PASS' if not gaps else 'FAIL'))
          print('compile_14=' + ('PASS' if not gaps else 'FAIL'))
          print('sha_manifest_blob='+sums_blob)
          print(f'remaining_gaps={len(gaps)}')
          if gaps:
              print('\n'.join(gaps)); raise SystemExit(1)
          print('STEP2_AUDITOR=VERIFIED_CLOSED 14/14')
          PY
