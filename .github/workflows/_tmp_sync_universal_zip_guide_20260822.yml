name: tmp-sync-universal-zip-guide
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy canonical guide
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/maxbry123-commits/Agentes-motores-Wordflow-YAIWES/main/GUIA-DESPLIEGUE-ZIP-UNIVERSAL.md' -o GUIA-DESPLIEGUE-ZIP-UNIVERSAL.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GUIA-DESPLIEGUE-ZIP-UNIVERSAL.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: sync universal zip deployment guide'
          git push
