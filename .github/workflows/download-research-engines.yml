name: Download and package research engines

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-research-engines.yml'

permissions:
  contents: write

concurrency:
  group: download-research-engines
  cancel-in-progress: false

env:
  MAX_ZIP_BYTES: '16777216'
  OUTPUT_DIR: 'Download code/archivos'

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout YAIWES repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Download, package and verify repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _download_work
          mkdir -p _download_work "$OUTPUT_DIR"
          cat > _download_work/repos.tsv <<'EOF'
          SearchOS|antins-labs/SearchOS|main
          OpenDeepResearch|langchain-ai/open_deep_research|main
          GPT-Researcher|assafelovic/gpt-researcher|main
          Vane|ItzCrazyKns/Vane|master
          Shandu|jolovicdev/shandu|main
          EOF

          python3 <<'PY'
          import csv, hashlib, json, os, shutil, subprocess
          from pathlib import Path

          MAX_ZIP = int(os.environ['MAX_ZIP_BYTES'])
          OUT = Path(os.environ['OUTPUT_DIR'])
          WORK = Path('_download_work')
          TARGET = MAX_ZIP - 512 * 1024

          def run(args, cwd=None):
              subprocess.run(args, check=True, cwd=cwd)

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for b in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(b)
              return h.hexdigest()

          repos = []
          with open(WORK/'repos.tsv', newline='') as f:
              repos = [row for row in csv.reader(f, delimiter='|') if row and row[0]]

          overall = []
          for name, repo, branch in repos:
              print(f'=== {name}: {repo}@{branch} ===')
              repo_dir = WORK / name
              if repo_dir.exists(): shutil.rmtree(repo_dir)
              run(['git', 'clone', '--depth', '1', '--branch', branch,
                   f'https://github.com/{repo}.git', str(repo_dir)])
              commit = subprocess.check_output(
                  ['git', '-C', str(repo_dir), 'rev-parse', 'HEAD'], text=True).strip()

              files = []
              for p in repo_dir.rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      files.append((p.relative_to(repo_dir), p))
              files.sort(key=lambda x: (-x[1].stat().st_size, str(x[0])))

              groups = []
              for rel, path in files:
                  size = path.stat().st_size
                  if size > TARGET:
                      raise RuntimeError(
                          f'{name}: source file {rel} is {size} bytes; refusing to alter/split source files.'
                      )
                  for g in groups:
                      if g['bytes'] + size <= TARGET:
                          g['files'].append((rel, path)); g['bytes'] += size; break
                  else:
                      groups.append({'files': [(rel, path)], 'bytes': size})

              part_records = []
              for idx, g in enumerate(groups, 1):
                  staging = WORK / f'{name}_stage_{idx:03d}'
                  if staging.exists(): shutil.rmtree(staging)
                  staging.mkdir(parents=True)
                  for rel, src in g['files']:
                      dst = staging / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                  zip_path = OUT / f'{name}_{idx:02d}.zip'
                  if zip_path.exists(): zip_path.unlink()
                  run(['zip', '-q', '-r', '-9', str(zip_path), '.'], cwd=staging)
                  actual = zip_path.stat().st_size
                  if actual > MAX_ZIP:
                      raise RuntimeError(f'{zip_path} is {actual} bytes (>17 MB)')
                  part_records.append((idx, g['files'], zip_path, actual))
                  shutil.rmtree(staging)

              manifest = [
                  f'# {name}', f'repository={repo}', f'branch={branch}',
                  f'commit={commit}', f'parts={len(part_records)}',
                  f'limit_bytes={MAX_ZIP}', ''
              ]
              for idx, items, zp, actual in part_records:
                  manifest.append(f'part={zp.name}|bytes={actual}|sha256={sha256(zp)}')
                  for rel, src in items:
                      manifest.append(
                          f'file={idx:02d}|{rel}|bytes={src.stat().st_size}|sha256={sha256(src)}'
                      )
              (OUT / f'{name}_MANIFEST.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
              overall.append({
                  'name': name, 'repository': repo, 'branch': branch,
                  'commit': commit, 'parts': len(part_records),
                  'zip_sizes': {zp.name: actual for _, _, zp, actual in part_records}
              })

          (OUT/'DOWNLOAD_MANIFEST.json').write_text(json.dumps(overall, indent=2), encoding='utf-8')
          print(json.dumps(overall, indent=2))
          PY

      - name: Verify every generated ZIP
        shell: bash
        run: |
          set -euo pipefail
          max=16777216
          count=0
          while IFS= read -r -d '' f; do
            size=$(stat -c '%s' "$f")
            echo "$f: $size bytes"
            test "$size" -le "$max"
            unzip -tq "$f"
            count=$((count+1))
          done < <(find "$OUTPUT_DIR" -type f -name '*.zip' -print0)
          test "$count" -gt 0

      - name: Commit generated packages into Download code/archivos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Download code/archivos'
          if git diff --cached --quiet; then
            echo 'No package changes.'
            exit 0
          fi
          git commit -m 'chore(download): package research repositories into <=17MB ZIP parts'
          git push
