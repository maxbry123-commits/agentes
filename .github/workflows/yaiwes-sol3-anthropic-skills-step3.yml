name: YAIWES SOL3 Anthropic-Skills STEP3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol3-anthropic-skills-step3.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol3-anthropic-skills-step3
  cancel-in-progress: false

jobs:
  wire_validate_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      TARGET: 'Agente Yaiwes principal/kernel-principal/extension-kernel/capability-registry/anthropic-skills'
      ADAPTER: 'Agente Yaiwes principal/kernel-principal/extension-kernel/capability-registry/anthropic-skills/yaiwes/anthropic_skills_adapter.py'
      FICHA: 'Agente Yaiwes principal/kernel-principal/extension-kernel/capability-registry/anthropic-skills/yaiwes/ficha.anthropic-skills.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/capability-registry/anthropic-skills/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
    steps:
      - name: Checkout STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 8
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-sol3-anthropic-skills-step3.yml
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Agente Yaiwes principal/kernel-principal/extension-kernel/capability-registry/anthropic-skills/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py

      - name: Claim Anthropic-Skills STEP3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(os.environ['WALL'],encoding='utf-8') as f:data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('component')=='Anthropic-Skills')
          if node.get('current_step')!=3 or node.get('status') not in ('PASS_STEP2','GAP_STEP3','GAP'):
              raise SystemExit(f"NOT_STEP3:{node.get('current_step')}:{node.get('status')}")
          if node.get('lock') not in ('FREE',None) or node.get('owner') not in (None,'SOL'):
              raise SystemExit(f"LOCKED:{node.get('owner')}:{node.get('lock')}")
          node['owner']='SOL';node['lock']='CLAIMED';node['status']='PENDING_STEP3'
          node['checkpoint']['before']=(f"{now} SOL integración 3 STEP3 claim: canonical FABLES bus; execute moved upstream quick_validate.py against real mcp-builder and skill-creator SKILL.md; validate discovery/frontmatter; no MOVE repeat")
          node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'CLAIM_STEP3'})
          node['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST';data['updated_at']=now
          with open(os.environ['WALL'],'w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL3 claim Anthropic-Skills STEP3' || true
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1;break;fi
            git rebase --abort || true;sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Verify canonical FABLES
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main;git reset --hard origin/main
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'

      - name: Build minimal adapter and ficha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ADAPTER")"
          cat > "$ADAPTER" <<'PY'
          """YAIWES Anthropic-Skills adapter: real Agent Skills discovery and upstream validation."""
          from __future__ import annotations
          import importlib.util, json
          from pathlib import Path
          from typing import Any

          PLUGIN_ID='yaiwes.capability.anthropic_skills'
          TARGET_RELATIVE='Agente Yaiwes principal/kernel-principal/extension-kernel/capability-registry/anthropic-skills'

          def _load_validator(target: Path):
              p=target/'skills'/'skill-creator'/'scripts'/'quick_validate.py'
              spec=importlib.util.spec_from_file_location('anthropic_quick_validate',p)
              if not spec or not spec.loader: raise RuntimeError('VALIDATOR_LOAD_FAILED')
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              return mod.validate_skill

          def run_microtest(repo_root: str|Path)->dict[str,Any]:
              target=Path(repo_root).resolve()/TARGET_RELATIVE
              skills_root=target/'skills'
              validator=_load_validator(target)
              skill_dirs=sorted({p.parent for p in skills_root.glob('*/SKILL.md')})
              if len(skill_dirs)<2: raise RuntimeError(f'SKILL_DISCOVERY_TOO_SMALL:{len(skill_dirs)}')
              chosen=['mcp-builder','skill-creator']
              results={}
              for name in chosen:
                  ok,msg=validator(skills_root/name)
                  if not ok: raise RuntimeError(f'SKILL_VALIDATION_FAILED:{name}:{msg}')
                  results[name]=msg
              sample=(skills_root/'mcp-builder'/'SKILL.md').read_text(encoding='utf-8')
              if 'name: mcp-builder' not in sample or 'description:' not in sample:
                  raise RuntimeError('MCP_BUILDER_FRONTMATTER_MISSING')
              return {'status':'PASS','capability':'dynamic_agent_skill_registry','discovered_top_level_skills':len(skill_dirs),'validated':chosen,'validator_results':results}

          if __name__=='__main__':
              import sys
              print('YAIWES_ANTHROPIC_SKILLS_RESULT='+json.dumps(run_microtest(sys.argv[1]),separators=(',',':')))
          PY
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          a=Path(os.environ['ADAPTER']);digest='sha256:'+hashlib.sha256(a.read_bytes()).hexdigest()
          m={"artifact_id":"yaiwes.capability.anthropic_skills","version":"1.0.0","estado":"active","contract_hash":digest,"tribunal_case_id":"YAIWES-N31-ANTHROPIC-SKILLS-STEP3","contrato":{"rol":"transform","consume":{"datatype":{"family":"json","type":"object","version":1}},"expone":{"datatype":{"family":"json","type":"object","version":1}}},"ejecucion":{"kind":"code","transport":"sdk","runtime_type":"compute","entry_point":os.environ['ADAPTER']+":run_microtest","idempotente":True},"seguridad":{"sandbox":"process","limites":{"timeout_ms":120000,"deadline_ms":120000}},"firma":{"gpg_key_id":"YAIWES-N31"},"categoria":"pipeline","etapa":"P","perfiles":{"n0":{"habilitada":True,"iteraciones":1,"simulaciones":0,"criticas":0,"muestras_k":1}},"repeticion":{"max":1,"condicion":"nunca"},"repite_en":[],"activacion":{"eventos":["kernel.v2.plugin.enchufed"],"wake_words":[],"condicion":""},"presupuesto":{"n0":{"max_tokens":1,"max_ms":120000,"max_costo_usd":0.0}},"telemetria":{"metricas":["tiempo","errores","health"],"span_otel":True},"evidencia":{"produce":["L2_build","L3_runtime","L4_feature"],"destino":str(Path(os.environ['EVIDENCE']).parent)+"/"},"failover":{"sustituible_por":[],"compensacion":"fail_closed"},"salud":{"metodo":"exec","heartbeat_interval_s":30}}
          Path(os.environ['FICHA']).write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML

      - name: FABLES plus real upstream skill validation
        id: test
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/step3.log 2>&1
          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          root=Path.cwd();a=root/os.environ['ADAPTER'];f=root/os.environ['FICHA'];b=root/os.environ['BUS']
          source=a.read_text();manifest=json.loads(f.read_text());actual='sha256:'+hashlib.sha256(source.encode()).hexdigest();assert actual==manifest['contract_hash']
          sys.path.insert(0,str(b.parent));import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus();bus.add_tribunal_approval(manifest['tribunal_case_id']);reg=bus.enchufar(manifest,bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']]),bus_mod.TargetConventions('python','snake_case','sync','gradual'),registered_by='SOL integración 3')
          assert reg.status==bus_mod.PluginStatus.ACTIVE;bus.health.heartbeat(reg.plugin_id);assert bus.check_plugin_health(reg.plugin_id)
          spec=importlib.util.spec_from_file_location('yaiwes_anthropic_skills',a);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);result=mod.run_microtest(root);assert result['status']=='PASS' and set(result['validated'])=={'mcp-builder','skill-creator'}
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result});bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'dynamic_agent_skill_registry','verified':True});levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)];assert {'L2_build','L3_runtime','L4_feature'}.issubset(levels)
          ev={'node':'Anthropic-Skills','worker':'SOL integración 3','status':'PASS','route':'FABLES -> Anthropic-Skills adapter -> upstream quick_validate.py -> real SKILL.md frontmatter','plugin_id':reg.plugin_id,'microtest':'validate mcp-builder + skill-creator with upstream validator','result':result,'evidence_levels':levels,'run':int(os.environ['GITHUB_RUN_ID']),'adapter_sha256':actual,'canonical_bus_blob':'470f9c91650bc6c59e2900f7e71090b84363da9f','prune':'NOT_NEEDED'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n')
          print('ANTHROPIC_SKILLS_MICROTEST=PASS',json.dumps(result,separators=(',',':')))
          print('FABLES=ACTIVE L2+L3+L4')
          PY
          rc=$?;cat /tmp/step3.log;tail_line="$(tail -n 10 /tmp/step3.log|tr '\n\r' ' '|sed 's/=/ /g'|cut -c1-1800)";echo "rc=$rc" >> "$GITHUB_OUTPUT";echo "tail=$tail_line" >> "$GITHUB_OUTPUT";exit 0

      - name: Publish adapter ficha evidence
        id: publish
        if: steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE";git commit -m 'test(yaiwes): SOL3 Anthropic-Skills FABLES STEP3 PASS';git reset --hard HEAD
          ok=0;for attempt in 1 2 3 4 5;do git fetch origin main;if git rebase origin/main && git push origin HEAD:main;then ok=1;break;fi;git rebase --abort||true;git reset --hard HEAD;sleep $((attempt*2));done;test "$ok" -eq 1;echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read-back STEP3 evidence
        if: steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main;git show "origin/main:$FICHA" | grep -Fq 'yaiwes.capability.anthropic_skills';git show "origin/main:$EVIDENCE" > /tmp/e.json;grep -Fq 'mcp-builder' /tmp/e.json;grep -Fq 'skill-creator' /tmp/e.json;grep -Fq 'L4_feature' /tmp/e.json

      - name: Checkpoint PASS or GAP and release
        shell: bash
        env:
          TEST_RC: ${{ steps.test.outputs.rc }}
          TEST_TAIL: ${{ steps.test.outputs.tail }}
          EVIDENCE_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';ok=0
          for attempt in 1 2 3 4 5;do git fetch origin main;git reset --hard origin/main
            python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z');rc=int(os.environ.get('TEST_RC') or 99);detail=(os.environ.get('TEST_TAIL') or 'NO_OUTPUT')[:1800]
          with open(os.environ['WALL'],encoding='utf-8') as f:data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('component')=='Anthropic-Skills')
          if node.get('owner')!='SOL' or node.get('lock')!='CLAIMED' or node.get('current_step')!=3:raise SystemExit(f"STATE_CHANGED:{node.get('owner')}:{node.get('lock')}:{node.get('current_step')}")
          ev=node.setdefault('evidence',[])
          if rc==0:
              node['status']='PASS';node['checkpoint']['after']='STEP3 PASS: canonical FABLES ACTIVE; moved upstream quick_validate.py executed against real mcp-builder and skill-creator SKILL.md; discovery/frontmatter validation PASS; L2+L3+L4; prune NOT_NEEDED; read-back PASS.'
              for x in [f"step3:run:{os.environ['GITHUB_RUN_ID']}",f"step3:evidence_commit:{os.environ.get('EVIDENCE_COMMIT')}",'step3:canonical_bus_blob:470f9c91650bc6c59e2900f7e71090b84363da9f','step3:route:FABLES->Anthropic-Skills adapter->upstream quick_validate.py->SKILL.md','step3:microtest:PASS mcp-builder+skill-creator real validation','step3:evidence:L2_build+L3_runtime+L4_feature','step3:prune:NOT_NEEDED','step3:readback:adapter+ficha+evidence PASS']:
                  if x not in ev:ev.append(x)
              node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ.get('EVIDENCE_COMMIT')});node['next_action']='COMPLETE'
          else:
              node['status']='GAP_STEP3';node['checkpoint']['after']=f"STEP3 GAP run={os.environ['GITHUB_RUN_ID']}: {detail}";ev.append(f"step3:gap:run:{os.environ['GITHUB_RUN_ID']}:{detail}");node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_GAP_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])});node['next_action']='REPAIR_EXACT_STEP3_GAP_AND_RETRY'
          node['owner']=None;node['lock']='FREE';data['updated_at']=now;data.setdefault('counts',{})['closed_current_contract']=sum(1 for n in data['nodes'] if n.get('next_action')=='COMPLETE')
          with open(os.environ['INVENTORY'],encoding='utf-8') as f:inv=json.load(f)
          comp=next(c for c in inv['components'] if c.get('name')=='Anthropic-Skills');comp['wall_node_id']=node['id'];comp['wall_status']=node['status'];comp['wall_current_step']=node['current_step'];comp['wall_target']=node['target']
          with open(os.environ['WALL'],'w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,indent=2);f.write('\n')
          with open(os.environ['INVENTORY'],'w',encoding='utf-8') as f:json.dump(inv,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
            git add -- "$WALL" "$INVENTORY";git commit -m "crazy-wall: SOL3 Anthropic-Skills STEP3 checkpoint run $GITHUB_RUN_ID"||true;if git pull --rebase origin main && git push origin HEAD:main;then ok=1;break;fi;git rebase --abort||true;sleep $((attempt*2));done;test "$ok" -eq 1

      - name: Fail closed on GAP
        if: steps.test.outputs.rc != '0'
        run: exit 1
