name: YAIWES Argo Missing Server Packages Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-argo-missing-server-packages.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows/Argo-Workflows/server
            Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Move only server auth and utils runtime packages
        shell: bash
        run: |
          set -euo pipefail
          SRC='Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows/Argo-Workflows'
          DST='Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows'
          for d in auth utils; do
            test -d "$SRC/server/$d"
            test ! -e "$DST/server/$d"
            mkdir -p "$DST/server"
            mv "$SRC/server/$d" "$DST/server/$d"
          done
          for d in "$DST/server/auth" "$DST/server/utils"; do
            while IFS= read -r -d '' f; do
              rel="${f#$DST/}"
              mkdir -p "$SRC/$(dirname "$rel")"
              mv "$f" "$SRC/$rel"
            done < <(find "$d" -type f -name '*_test.go' -print0)
            while IFS= read -r -d '' td; do
              rel="${td#$DST/}"
              mkdir -p "$SRC/$(dirname "$rel")"
              mv "$td" "$SRC/$rel"
            done < <(find "$d" -depth -type d -name testdata -print0)
            while IFS= read -r -d '' f; do
              rel="${f#$DST/}"
              mkdir -p "$SRC/$(dirname "$rel")"
              mv "$f" "$SRC/$rel"
            done < <(find "$d" -type f \( -name '*.md' -o -name 'AGENTS.md' \) -print0)
          done
          test -z "$(find "$DST/server" -type f -name '*_test.go' -print -quit)"
          test -z "$(find "$DST/server" -type d -name testdata -print -quit)"
          git diff --check
      - name: Commit surgical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Core kernel Yaiwes/Componentes recuperados A/Argo-Workflows/Argo-Workflows/server' 'Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows/server'
          git diff --cached --check
          git commit -m 'fix(yaiwes): move required Argo server runtime packages'
          git pull --rebase origin main
          git push origin HEAD:main
