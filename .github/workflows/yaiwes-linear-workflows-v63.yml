name: YAIWES canonical linear internal workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-linear-workflows-v63.yml'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63.py'
      - '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63_core.py'
      - '📂coda workflow persistencias/🏈 YAIWES **'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaiwes-canonical-linear-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-linear-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical internal workflow sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yaiwes-linear-workflows-v63.yml
            /📂coda workflow persistencias/*/INTERNAL-SURGICAL-MANIFEST-V5.json
            /📂coda workflow persistencias/*/code/**/*.py
            /📂coda workflow persistencias/*/code/**/*.go
            /📂coda workflow persistencias/*/code/**/*.ts
            /📂coda workflow persistencias/*/code/**/*.js
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v6.py
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v61.py
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v62.py
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63.py
            /📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63_core.py
            /📂coda workflow persistencias/🏈 cancha deportiva de fútbol/*

      - name: Compile canonical chain
        run: |
          set -euo pipefail
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v6.py'
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v61.py'
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v62.py'
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63_core.py'
          python3 -m py_compile '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63.py'

      - name: Execute strict 24-link canonical chain
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 '📂coda workflow persistencias/Fables enchufe universal/yaiwes_real_workflow_chain_v63.py'

      - name: Verify 24 real workflows and handoff continuity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('📂coda workflow persistencias/🏈 cancha deportiva de fútbol/YAIWES-LINEAR-WORKFLOW-REPORT-V63.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['components'] == 24, d
          assert d['real_internal_workflows_executed'] == 24, d
          assert d['completed_internal_workflows'] == 24, d
          assert d['handoff_continuity'] is True, d
          assert d['universal_plug_after_component_24'] is True, d
          assert d['status'] == 'CLOSED_24_OF_24', d
          ev=d['evidence']
          assert len(ev) == 24
          assert [x['component'] for x in ev] == [f'YAIWES {i:02d}' for i in range(1,25)]
          assert all(x['status'] == 'RELEASED' for x in ev)
          assert all(x['real_internal_workflow'] is True for x in ev)
          assert all(x['workflow_status'] == 'COMPLETED' for x in ev)
          assert not any(x.get('checkpoint') == 'CLOSURE_ONLY' for x in ev)
          for i in range(1,24):
              assert ev[i]['input_hash'] == ev[i-1]['output_hash']
          assert ev[-1]['handoff'] == 'UNIVERSAL_PLUG'
          print('YAIWES_CANONICAL_LINEAR_PASS=24/24')
          PY
