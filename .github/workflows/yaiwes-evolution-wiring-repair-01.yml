name: YAIWES evolution wiring repair 01
on:
  push:
    paths:
      - '.github/workflows/yaiwes-evolution-wiring-repair-01.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agentes-yaiwes-evolution-wiring-repair-01
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Repair provenance key and wire supplied connectors
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="agente-yaiwes/extensions/source-evolution-module/evolution_engine.py"
          SRC="skills/research-download-chain/assets/plugin-bus"
          DST="agente-yaiwes/kernel-principal/extension-kernel/plugin-bus"
          WF="agente-yaiwes/multi-workflow-engine/instances/source-evolution-workflow"
          python - <<'PY'
          from pathlib import Path
          p=Path("agente-yaiwes/extensions/source-evolution-module/evolution_engine.py")
          s=p.read_text(encoding="utf-8")
          old='facts.get("source_provenance")'
          new='facts.get("source-provenance")'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding="utf-8")
          elif new not in s:
              raise SystemExit("PROVENANCE_KEY_GAP")
          PY
          mkdir -p "$DST"
          for f in ficha_contract_v2.py universal_plugin_bus_v2_integrated.py; do
            test -f "$SRC/$f"
            if test -e "$DST/$f"; then
              cmp -s "$SRC/$f" "$DST/$f" || test "$f" = universal_plugin_bus_v2_integrated.py || { echo "COLLISION $DST/$f"; exit 31; }
            else
              cp -a "$SRC/$f" "$DST/$f"
            fi
          done
          python - <<'PY'
          from pathlib import Path
          p=Path("agente-yaiwes/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace("from datetime import datetime","from datetime import UTC, datetime")
          s=s.replace("datetime.utcnow()","datetime.now(UTC)")
          marker='        "presupuesto": {"n0": {"max_tokens": 10000, "max_ms": 5000, "max_costo_usd": 0.1}},'
          activation='        "activacion": {"eventos": ["kernel.v2.plugin.enchufed"], "wake_words": ["evolucionar"]},\n'
          if activation.strip() not in s:
              if marker not in s: raise SystemExit("ACTIVATION_PATCH_GAP")
              s=s.replace(marker,activation+marker,1)
          p.write_text(s,encoding="utf-8")
          PY
          printf '%s\n' '{"workflow":"../../../multi-workflow-engine/instances/source-evolution-workflow","planner":"../../../extensions/source-evolution-module/evolution_engine.py","dag":"../../../extensions/source-evolution-module/evolution_dag.yaml","download_skill":"../../../../skills/research-download-chain/SKILL.md","contract":"ficha_contract_v2.py","bus":"universal_plugin_bus_v2_integrated.py","director_gate":"required","deterministic_percent":95,"llm_maximum_percent":5}' > "$DST/WIRING.json"
          cp "$DST/WIRING.json" "$WF/EXTENSION_KERNEL_WIRING.json"

      - name: Individual and integration tests
        shell: bash
        run: |
          set -euo pipefail
          DST="agente-yaiwes/kernel-principal/extension-kernel/plugin-bus"
          MOD="agente-yaiwes/extensions/source-evolution-module"
          python -m py_compile "$DST/ficha_contract_v2.py" "$DST/universal_plugin_bus_v2_integrated.py" "$MOD/evolution_engine.py"
          (cd "$DST" && python ficha_contract_v2.py)
          (cd "$DST" && python universal_plugin_bus_v2_integrated.py)
          python "$MOD/evolution_engine.py" "evolucionar capacidad de prueba" <(printf '%s' '{"identity":"test","requested-capability":"test","current-capability":"absent","source-provenance":"https://example.invalid/source","license":"MIT","security-history":"none","network-behavior":"deny","public-contract":"tool()","dependencies":[],"reproducibility":true,"observability":true,"rollback-plan":"unmount"}') --out /tmp/proposal.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/proposal.json").read_text())
          assert p["state"]=="AWAITING_DIRECTOR"
          assert p["deterministic_score"]==95 and p["llm_budget"]==5
          assert p["director_authorization_required"] is True
          w=json.loads(Path("agente-yaiwes/kernel-principal/extension-kernel/plugin-bus/WIRING.json").read_text())
          assert w["director_gate"]=="required"
          PY

      - name: Hash and commit through one writer
        shell: bash
        run: |
          set -euo pipefail
          DST="agente-yaiwes/kernel-principal/extension-kernel/plugin-bus"
          (cd "$DST" && sha256sum ficha_contract_v2.py universal_plugin_bus_v2_integrated.py WIRING.json > SOURCE_SHA256SUMS.txt)
          (cd "$DST" && sha256sum -c SOURCE_SHA256SUMS.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agente-yaiwes/extensions/source-evolution-module/evolution_engine.py "$DST" agente-yaiwes/multi-workflow-engine/instances/source-evolution-workflow/EXTENSION_KERNEL_WIRING.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(yaiwes): repair provenance gate and wire plugin bus'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt*5))
          done
          exit 1
