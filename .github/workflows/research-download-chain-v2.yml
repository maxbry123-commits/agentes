name: Research Download Chain V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-download-chain-v2.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Runner sanity
        shell: bash
        run: |
          set -euo pipefail
          echo "RESEARCH_DOWNLOAD_CHAIN_V2_OK"
          echo "sha=$GITHUB_SHA"
          echo "workspace=$GITHUB_WORKSPACE"
          test -d "$GITHUB_WORKSPACE"
