name: Extraction Repair Guardian 2026-09-03
run-name: Extraction repair • ${{ github.run_id }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [extraction-repair-needed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/extraction-repair-guardian-20260903.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: extraction-single-writer-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Enforce NO-LFS runner policy
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local --unset-all filter.lfs.process || true
          git config --local filter.lfs.required false

      - name: Extract next bounded batch safely
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/extract_guardian_repair_20260903.py --limit 10 | tee extraction-result.json

      - name: Commit extracted trees and immutable evidence
        id: publish
        if: ${{ steps.extract.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- .             ':(exclude).github/workflows'             ':(exclude)extraction-result.json'             ':(exclude)audit-result.json'

          python3 - <<'PY'
          import subprocess,sys
          marker=b"version https://git-lfs.github.com/spec/v1\n"
          paths=subprocess.check_output(["git","diff","--cached","--name-only","-z"]).split(b"\0")
          bad=[]
          for raw in paths:
              if not raw: continue
              p=raw.decode("utf-8","surrogateescape")
              try:
                  data=open(p,"rb").read(1024)
              except (OSError,IsADirectoryError):
                  continue
              if data.startswith(marker):
                  bad.append(p)
          if bad:
              print("SOURCE_LFS_POINTER_GAP",*bad,sep="\n")
              sys.exit(73)
          PY

          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git diff --cached --check
            git commit -m "fix(extraction): publish verified NO-LFS batch [run ${GITHUB_RUN_ID}]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push --no-verify origin HEAD:main; then
                exit 0
              fi
              test "$attempt" -lt 3 || exit 41
              sleep $((attempt*10))
            done
          fi

      - name: Read-back and continue only while retryable gaps remain
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "EXTRACT_OUTCOME=${{ steps.extract.outcome }}"
          echo "PUBLISH_OUTCOME=${{ steps.publish.outcome }}"

          test "${{ steps.extract.outcome }}" = "success" || exit 42
          test "${{ steps.publish.outcome }}" = "success" || exit 41

          git fetch origin main
          git reset --hard origin/main
          python3 scripts/extract_guardian_repair_20260903.py --audit-only | tee audit-result.json

          read -r GAPS RETRYABLE BLOCKED VERDICT <<EOF
          $(python3 - <<'PY'
          import json
          d=json.load(open("audit-result.json"))
          c=d.get("counts",{})
          print(c.get("remaining",len(d.get("remaining_gaps",[]))),
                c.get("retryable",len(d.get("retryable_gaps",[]))),
                c.get("blocked",len(d.get("blocked_gaps",[]))),
                d.get("verdict","GAPS_PENDING"))
          PY
          )
          EOF

          echo "REMAINING_GAPS=$GAPS"
          echo "RETRYABLE_GAPS=$RETRYABLE"
          echo "BLOCKED_GAPS=$BLOCKED"
          echo "VERDICT=$VERDICT"

          if [ "$GAPS" -eq 0 ]; then
            echo "VERIFIED_CLOSED"
            exit 0
          fi

          if [ "$RETRYABLE" -gt 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches"               -f event_type=extraction-repair-needed
            echo "NEXT_REPAIR_DISPATCHED retryable=$RETRYABLE blocked=$BLOCKED"
            exit 0
          fi

          echo "GAPS_PENDING_NONRETRYABLE blocked=$BLOCKED"
          exit 73
