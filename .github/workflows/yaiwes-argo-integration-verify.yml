name: YAIWES Argo Workflows Integration Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows/**'
      - '.github/workflows/yaiwes-argo-integration-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
            Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Static contract and source hygiene gate
        working-directory: Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
        shell: bash
        run: |
          set -euo pipefail
          python verify_integration.py
          python -m py_compile adapter.py verify_integration.py
          test -f '../../../kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
          test -f '../../../kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
          test -z "$(find . -type f -name '*_test.go' -print -quit)"
          test -z "$(find . -type d -name testdata -print -quit)"
          test -f workflow/controller/controller.go
          grep -F 'module github.com/argoproj/argo-workflows/v4' go.mod
          go version

      - name: Resolve dependencies
        working-directory: Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
        run: go mod download

      - name: Compile moved controller and validator
        working-directory: Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
        shell: bash
        run: |
          set -euo pipefail
          go test ./workflow/controller -run '^$' -count=1
          go test ./workflow/validate -run '^$' -count=1

      - name: Moved source runtime 10x
        working-directory: Agente Yaiwes principal/execution-orchestration/dag-executor/argo-workflows
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            go test ./workflow/validate -run '^$' -count=1
            python -c "from adapter import source_probe; p=source_probe(); assert p['module']=='github.com/argoproj/argo-workflows/v4'"
            echo "ARGO_RUNTIME_PASS_${i}/10"
          done
# retrigger after server/auth + server/utils + server/cache + server/types repair
