name: YAIWES Watchdog Programming Architecture v2
run-name: YAIWES watchdog architecture v2 • ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/yaiwes-watchdog-architecture-plan-v2.yml'
      - 'scripts/yaiwes_watchdog_architecture_plan_v2.py'

permissions:
  contents: write

concurrency:
  group: yaiwes-watchdog-architecture-v2
  cancel-in-progress: false

jobs:
  persist-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Apply surgical architecture patch
        run: python3 scripts/yaiwes_watchdog_architecture_plan_v2.py

      - name: Validate changed files
        run: |
          set -euo pipefail
          python3 -m json.tool 'Core kernel Yaiwes/Crack wall bitácora stated JSON/STATE.json' >/dev/null
          python3 -m json.tool 'Core kernel Yaiwes/Crack wall bitácora stated JSON/PLAN-WATCHDOG-PROGRAMMING-V2.json' >/dev/null
          grep -F 'Sistema adaptativo Watchdog / programación, memoria y sandbox — PENDIENTE' 'Readme arquitectura Yaiwes/README.md'
          grep -F 'FAIL ≠ RESET' 'Core kernel Yaiwes/readme-memoria.md'

      - name: Commit documentation and state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Readme arquitectura Yaiwes/README.md' 'Core kernel Yaiwes/Crack wall bitácora stated JSON/STATE.json' 'Core kernel Yaiwes/Crack wall bitácora stated JSON/PLAN-WATCHDOG-PROGRAMMING-V2.json' 'Core kernel Yaiwes/readme-memoria.md'
          git diff --cached --check
          git commit -m 'docs(yaiwes): register watchdog programming stack as pending'
          git push origin HEAD:main

      - name: Read-back published state
        run: |
          set -euo pipefail
          git fetch origin main
          git show 'origin/main:Readme arquitectura Yaiwes/README.md' | grep -F 'Sistema adaptativo Watchdog / programación, memoria y sandbox — PENDIENTE'
          git show 'origin/main:Core kernel Yaiwes/Crack wall bitácora stated JSON/STATE.json' | grep -F 'watchdog_programming_system_v2'
          git show 'origin/main:Core kernel Yaiwes/Crack wall bitácora stated JSON/PLAN-WATCHDOG-PROGRAMMING-V2.json' | grep -F 'YAIWES-WATCHDOG-PROGRAMMING-V2'
          git show 'origin/main:Core kernel Yaiwes/readme-memoria.md' | grep -F 'FAIL ≠ RESET'
