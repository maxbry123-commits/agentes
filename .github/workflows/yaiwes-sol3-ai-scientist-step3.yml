name: YAIWES SOL3 AI-Scientist STEP3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yaiwes-sol3-ai-scientist-step3.yml'

permissions:
  contents: write

concurrency:
  group: yaiwes-sol3-ai-scientist-step3
  cancel-in-progress: false

jobs:
  wire_test_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WALL: '📂 Bitácora stated JSON Craxy wall.json'
      INVENTORY: 'Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json'
      TARGET: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist'
      UPSTREAM: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist/AI-Scientist'
      ADAPTER: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist/yaiwes/ai_scientist_adapter.py'
      FICHA: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist/yaiwes/ficha.ai-scientist.v2.json'
      EVIDENCE: 'Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist/yaiwes/STEP3_EVIDENCE.json'
      BUS: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      FICHA_CODE: 'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py'
    steps:
      - name: Checkout STEP3 surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 12
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /📂 Bitácora stated JSON Craxy wall.json
            /Core kernel Yaiwes/CORE-KERNEL-COMPONENT-INVENTORY.json
            /Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist/
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py
            /Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py

      - name: CLAIM AI-Scientist STEP3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ok=0
          for attempt in $(seq 1 10); do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('id')==34 and n.get('component')=='AI-Scientist')
          if node.get('current_step')!=3 or node.get('status') not in ('PASS_STEP2','GAP_STEP3','GAP'):
              raise SystemExit(f"N34_NOT_STEP3:{node.get('current_step')}:{node.get('status')}")
          if node.get('owner') is not None or node.get('lock')!='FREE':
              raise SystemExit(f"N34_LOCKED:{node.get('owner')}:{node.get('lock')}")
          node['owner']='SOL'; node['lock']='CLAIMED'; node['status']='PENDING_STEP3'
          node['checkpoint']['before']=f"{now} SOL integración 3 STEP3 claim: canonical FABLES; minimal adapter; execute moved upstream generate_next_idea on real grokking seed without external LLM call; require L2+L3+L4; prune only if concrete"
          for item in ['step3:runner:.github/workflows/yaiwes-sol3-ai-scientist-step3.yml','step3:canonical_bus_blob:470f9c91650bc6c59e2900f7e71090b84363da9f']:
              if item not in node['evidence']: node['evidence'].append(item)
          node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'CLAIM_STEP3'})
          node['next_action']='STEP_3_WIRE_PRUNE_IF_NEEDED_MICROTEST'; data['updated_at']=now
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL"; git commit -m 'crazy-wall: SOL integración 3 claim AI-Scientist STEP3'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Verify canonical FABLES and moved upstream
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git reset --hard origin/main
          test "$(git hash-object "$BUS")" = '470f9c91650bc6c59e2900f7e71090b84363da9f'
          test "$(git hash-object "$FICHA_CODE")" = 'a72508027cc2458553ef6a2255a9aa33d9a77a21'
          test -f "$UPSTREAM/ai_scientist/generate_ideas.py"
          test "$(git hash-object "$UPSTREAM/ai_scientist/generate_ideas.py")" = '7b53b81b1ed1d7f4144b8632727d2f57369463f4'
          test -f "$UPSTREAM/templates/grokking/seed_ideas.json"
          test "$(git hash-object "$UPSTREAM/templates/grokking/seed_ideas.json")" = '53d03b3ca578e24ac8ea16b2ebece7f1e9933c88'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal upstream import dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'anthropic>=0.34' 'openai>=1.40' 'backoff>=2.2' 'google-generativeai>=0.8' 'requests>=2.31'

      - name: Build minimal adapter and FABLES ficha
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ADAPTER")"
          cat > "$ADAPTER" <<'PY'
          """YAIWES adapter for moved SakanaAI AI-Scientist seed-idea capability."""
          from __future__ import annotations
          import importlib
          import sys
          from pathlib import Path
          from typing import Any

          PLUGIN_ID='yaiwes.agent.ai_scientist'
          ROLE='scientific_research_agent'
          UPSTREAM_RELATIVE=Path('Agente Yaiwes principal/agent-fleet-parallelism/ai-scientist/AI-Scientist')

          def run_seed_idea_microtest(repo_root: str | Path) -> dict[str, Any]:
              root=Path(repo_root).resolve()
              upstream=root/UPSTREAM_RELATIVE
              template=upstream/'templates'/'grokking'
              if not (template/'seed_ideas.json').is_file():
                  raise RuntimeError('AI_SCIENTIST_REAL_SEED_MISSING')
              sys.path.insert(0,str(upstream))
              mod=importlib.import_module('ai_scientist.generate_ideas')
              result=mod.generate_next_idea(str(template), client=None, model='gpt-4o-mini', prev_idea_archive=[], num_reflections=1, max_attempts=1)
              if not isinstance(result,list) or len(result)!=1:
                  raise RuntimeError(f'AI_SCIENTIST_BAD_ARCHIVE:{result!r}')
              idea=result[0]
              expected={'Name':'batch_size_grokking','Interestingness':6,'Feasibility':4,'Novelty':4}
              for k,v in expected.items():
                  if idea.get(k)!=v: raise RuntimeError(f'AI_SCIENTIST_SEED_MISMATCH:{k}:{idea.get(k)!r}')
              return {'status':'PASS','capability':'generate_next_idea_seed_path','idea_name':idea['Name'],'interestingness':idea['Interestingness'],'feasibility':idea['Feasibility'],'novelty':idea['Novelty']}
          PY
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['ADAPTER']); digest='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'artifact_id':'yaiwes.agent.ai_scientist','version':'1.0.0','estado':'active','contract_hash':digest,'tribunal_case_id':'YAIWES-N34-AI-SCIENTIST-STEP3',
            'contrato':{'rol':'transform','consume':{'datatype':{'family':'json','type':'object','version':1}},'expone':{'datatype':{'family':'json','type':'object','version':1}}},
            'ejecucion':{'kind':'code','transport':'sdk','runtime_type':'compute','entry_point':os.environ['ADAPTER']+':run_seed_idea_microtest','idempotente':True},
            'seguridad':{'sandbox':'process','limites':{'timeout_ms':300000,'deadline_ms':300000}},'firma':{'gpg_key_id':'YAIWES-N34'},'categoria':'pipeline','etapa':'P',
            'perfiles':{'n0':{'habilitada':True,'iteraciones':1,'simulaciones':0,'criticas':0,'muestras_k':1}},'repeticion':{'max':1,'condicion':'nunca'},'repite_en':[],
            'activacion':{'eventos':['kernel.v2.plugin.enchufed'],'wake_words':[],'condicion':''},'presupuesto':{'n0':{'max_tokens':1,'max_ms':300000,'max_costo_usd':0.0}},
            'telemetria':{'metricas':['tiempo','errores','health'],'span_otel':True},'evidencia':{'produce':['L2_build','L3_runtime','L4_feature'],'destino':str(Path(os.environ['EVIDENCE']).parent)+'/'},
            'failover':{'sustituible_por':[],'compensacion':'fail_closed'},'salud':{'metodo':'exec','heartbeat_interval_s':30}
          }
          Path(os.environ['FICHA']).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AI_SCIENTIST_ADAPTER_SHA256='+digest)
          PY

      - name: FABLES enchufe plus real AI-Scientist microtest
        id: test
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/ai-scientist-step3.log 2>&1
          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          root=Path.cwd(); adapter_path=root/os.environ['ADAPTER']; ficha_path=root/os.environ['FICHA']; bus_path=root/os.environ['BUS']
          source=adapter_path.read_text(encoding='utf-8'); manifest=json.loads(ficha_path.read_text(encoding='utf-8'))
          actual='sha256:'+hashlib.sha256(source.encode()).hexdigest(); assert actual==manifest['contract_hash']
          sys.path.insert(0,str(bus_path.parent)); import universal_plugin_bus_v2_integrated as bus_mod
          bus=bus_mod.UniversalPluginBus(); bus.add_tribunal_approval(manifest['tribunal_case_id'])
          candidate=bus_mod.ComponentCandidate(source,'python',[os.environ['ADAPTER']]); conventions=bus_mod.TargetConventions('python','snake_case','sync','gradual')
          reg=bus.enchufar(manifest,candidate,conventions,registered_by='SOL integración 3')
          assert reg.status==bus_mod.PluginStatus.ACTIVE and reg.plugin_id=='yaiwes.agent.ai_scientist'
          bus.health.heartbeat(reg.plugin_id); assert bus.check_plugin_health(reg.plugin_id)
          spec=importlib.util.spec_from_file_location('yaiwes_ai_scientist_adapter',adapter_path); mod=importlib.util.module_from_spec(spec); assert spec and spec.loader; spec.loader.exec_module(mod)
          result=mod.run_seed_idea_microtest(root); assert result['status']=='PASS' and result['idea_name']=='batch_size_grokking', result
          bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L3,{'microtest':result}); bus.evidence.collect(reg.plugin_id,bus_mod.EvidenceLevel.L4,{'capability':'scientific_research_seed_idea_path','verified':True})
          levels=[e['level'] for e in bus.evidence.get(reg.plugin_id)]; assert all(x in levels for x in ['L2_build','L3_runtime','L4_feature']),levels
          evidence={'node_id':34,'component':'AI-Scientist','worker':'SOL integración 3','status':'PASS','route':'FABLES -> AI-Scientist adapter -> moved upstream generate_next_idea -> real grokking seed_ideas.json','plugin_id':reg.plugin_id,'microtest':'generate_next_idea empty archive loads real first seed without external API','result':result,'evidence_levels':levels,'run':int(os.environ['GITHUB_RUN_ID']),'runner_commit':os.environ['GITHUB_SHA'],'adapter_sha256':actual,'upstream_generate_ideas_blob':'7b53b81b1ed1d7f4144b8632727d2f57369463f4','seed_blob':'53d03b3ca578e24ac8ea16b2ebece7f1e9933c88','prune':'NOT_NEEDED'}
          Path(os.environ['EVIDENCE']).write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('AI_SCIENTIST_REAL_MICROTEST=PASS idea=batch_size_grokking'); print('YAIWES_FABLES_ENCHUFE=PASS ACTIVE L2+L3+L4')
          PY
          rc=$?
          cat /tmp/ai-scientist-step3.log
          tail_line="$(tail -n 20 /tmp/ai-scientist-step3.log | tr '\n\r' ' ' | sed 's/=/ /g' | cut -c1-1800)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "tail=$tail_line" >> "$GITHUB_OUTPUT"; exit 0

      - name: Publish STEP3 evidence
        id: publish
        if: steps.test.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ADAPTER" "$FICHA" "$EVIDENCE"; git commit -m 'test(yaiwes): SOL3 AI-Scientist FABLES STEP3 PASS'
          base=$(git rev-parse HEAD); ok=0
          for attempt in $(seq 1 10); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort || true; git reset --hard "$base"; sleep $((attempt*2))
          done
          test "$ok" -eq 1
          echo "evidence_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Origin main read-back STEP3
        id: readback
        if: steps.test.outputs.rc == '0' && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set +e
          git fetch origin main
          git show "origin/main:$FICHA" | grep -Fq 'yaiwes.agent.ai_scientist'; r1=$?
          git show "origin/main:$EVIDENCE" | grep -Fq 'batch_size_grokking'; r2=$?
          git show "origin/main:$EVIDENCE" | grep -Fq 'L4_feature'; r3=$?
          git show "origin/main:$EVIDENCE" | grep -Fq 'NOT_NEEDED'; r4=$?
          test "$r1" -eq 0 -a "$r2" -eq 0 -a "$r3" -eq 0 -a "$r4" -eq 0; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; exit 0

      - name: STEP3 PASS or GAP checkpoint and release
        shell: bash
        env:
          TEST_RC: ${{ steps.test.outputs.rc }}
          TEST_TAIL: ${{ steps.test.outputs.tail }}
          READBACK_RC: ${{ steps.readback.outputs.rc }}
          EVIDENCE_COMMIT: ${{ steps.publish.outputs.evidence_commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; ok=0
          for attempt in $(seq 1 10); do
            git fetch origin main; git reset --hard origin/main
            python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); test_rc=int(os.environ.get('TEST_RC') or 99); raw=os.environ.get('READBACK_RC'); rb_rc=int(raw) if raw not in (None,'') else 99; detail=(os.environ.get('TEST_TAIL') or 'NO_OUTPUT')[:1800]
          with open(os.environ['WALL'],encoding='utf-8') as f: data=json.load(f)
          node=next(n for n in data['nodes'] if n.get('id')==34 and n.get('component')=='AI-Scientist')
          if node.get('owner')!='SOL' or node.get('lock')!='CLAIMED' or node.get('current_step')!=3: raise SystemExit('N34_LOCK_CHANGED')
          ev=node.setdefault('evidence',[])
          if test_rc==0 and rb_rc==0:
              node['status']='PASS'; node['checkpoint']['after']='STEP3 PASS: canonical FABLES ACTIVE yaiwes.agent.ai_scientist; moved upstream generate_next_idea executed real grokking seed path and returned batch_size_grokking; no external LLM simulation; L2+L3+L4; prune NOT_NEEDED; origin/main read-back PASS.'
              for item in [f"step3:run:{os.environ['GITHUB_RUN_ID']}",f"step3:evidence_commit:{os.environ.get('EVIDENCE_COMMIT') or 'unknown'}",'step3:route:FABLES->AI-Scientist adapter->moved generate_next_idea->real grokking seed_ideas.json','step3:microtest:PASS seed idea=batch_size_grokking','step3:evidence:L2_build+L3_runtime+L4_feature','step3:prune:NOT_NEEDED','step3:readback:adapter+ficha+evidence PASS']:
                  if item not in ev: ev.append(item)
              node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_PASS_RELEASE','run':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ.get('EVIDENCE_COMMIT')}); node['next_action']='COMPLETE'
          else:
              node['status']='GAP_STEP3'; node['checkpoint']['after']=f"STEP3 GAP run={os.environ['GITHUB_RUN_ID']} test_rc={test_rc} readback_rc={rb_rc}: {detail}"; ev.append(f"step3:gap:run:{os.environ['GITHUB_RUN_ID']}:test_rc={test_rc}:readback_rc={rb_rc}:{detail}"); node['history'].append({'at':now,'actor':'SOL','label':'SOL integración 3','event':'STEP3_GAP_RELEASE','run':int(os.environ['GITHUB_RUN_ID'])}); node['next_action']='REPAIR_EXACT_STEP3_GAP_AND_RETRY'
          node['owner']=None; node['lock']='FREE'; data['updated_at']=now; data.setdefault('counts',{})['closed_current_contract']=sum(1 for n in data['nodes'] if n.get('next_action')=='COMPLETE')
          with open(os.environ['INVENTORY'],encoding='utf-8') as f: inv=json.load(f)
          comp=next(c for c in inv['components'] if c.get('name')=='AI-Scientist'); comp['wall_node_id']=34; comp['wall_status']=node['status']; comp['wall_current_step']=node['current_step']; comp['wall_target']=node['target']
          with open(os.environ['WALL'],'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          with open(os.environ['INVENTORY'],'w',encoding='utf-8') as f: json.dump(inv,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
            git add -- "$WALL" "$INVENTORY"; git commit -m "crazy-wall: SOL integración 3 AI-Scientist STEP3 checkpoint run $GITHUB_RUN_ID" || true
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Fail closed on STEP3 GAP
        if: steps.test.outputs.rc != '0' || steps.readback.outputs.rc != '0'
        run: exit 1
