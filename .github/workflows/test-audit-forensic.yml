name: test-audit-forensic
on:
  push:
    paths:
      - 'extensions/audit_forensic/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Run audit_forensic tests
        run: |
          cd extensions
          python -m unittest discover -s audit_forensic/tests -v
