name: YAIWES APScheduler Verify

on:
  push:
    paths:
      - 'Agente Yaiwes principal/execution-orchestration/task-classifier-scheduler/**'
      - '.github/workflows/yaiwes-apscheduler-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Agente Yaiwes principal/execution-orchestration/task-classifier-scheduler
            Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 'Agente Yaiwes principal/execution-orchestration/task-classifier-scheduler/requirements.runtime.txt'
          python -m pip install pytest
      - name: Compile integration code
        run: |
          python -m py_compile \
            'Agente Yaiwes principal/execution-orchestration/task-classifier-scheduler/adapter.py' \
            'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/ficha_contract_v2.py' \
            'Agente Yaiwes principal/kernel-principal/extension-kernel/plugin-bus/universal_plugin_bus_v2_integrated.py'
      - name: Run YAIWES integration checks ten times
        run: |
          for i in $(seq 1 10); do
            echo "YAIWES APScheduler verification pass $i/10"
            python -m pytest -q \
              'Agente Yaiwes principal/execution-orchestration/task-classifier-scheduler/verification/test_yaiwes_integration.py'
          done
