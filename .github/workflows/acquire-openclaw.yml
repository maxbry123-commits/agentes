name: acquire-openclaw
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire OpenClaw snapshot
        run: |
          set -euo pipefail
          python scripts/acquire_agent.py \
            --id OpenClaw \
            --repo https://github.com/openclaw/openclaw \
            --ref v2026.7.1-2 \
            --commit 0790d9f593ad30c940ed93b5872a8cf6d6f3cf8c

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/OpenClaw
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "A2: deterministic snapshot OpenClaw v2026.7.1-2 (0790d9f5)"
            git push
          fi
