# Reubicacion por git mv; no descarga ni reescribe archivos.
name: Move files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/relocate-existing-kernel-components.yml']
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: research-download-chain-final
  cancel-in-progress: false
jobs:
  move-same-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: git mv componentes ya descargados
        shell: bash
        run: |
          set -euo pipefail
          DEST='Agente core kernel Yaiwes principal'
          mkdir -p "$DEST"
          move_parts() {
            src="$1"; prefix="$2"
            [ -d "$src" ] || return 0
            shopt -s nullglob
            parts=("$src"/"$prefix"_*.zip)
            for f in "${parts[@]}"; do
              name=$(basename "$f")
              if [ ! -e "$DEST/$name" ]; then
                git mv "$f" "$DEST/$name"
              fi
            done
          }
          move_parts 'Download code/archivos' Haystack
          move_parts 'Download code Yaiwes' autogen
          move_parts 'Download code Yaiwes' crewAI
          move_parts 'Download code/archivos' LangGraph
          move_parts 'Download code Yaiwes' Temporal
          move_parts 'Download code/archivos' Prefect
          move_parts 'Download code Yaiwes' dspy
          move_parts 'Download code Yaiwes' gVisor
          move_parts 'Download code Yaiwes' Dagster
          move_parts 'Download code Yaiwes' Kestra
          move_parts 'Download code/archivos' Argo-Workflows
          move_parts 'Download code/archivos' Hatchet
          move_parts 'Download code/archivos' Dagu
      - name: commit push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          git diff --cached --quiet && echo 'PASS NOOP: componentes ya ubicados' && exit 0
          git commit -m 'move: existing kernel components to principal destination'
          git pull --rebase origin main
          git push --no-verify origin HEAD:main
