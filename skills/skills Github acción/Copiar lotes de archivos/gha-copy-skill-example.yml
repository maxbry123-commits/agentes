# Fuente: actions/checkout README (un checkout del repo actual).
# https://github.com/actions/checkout
# cp -a = copia fiel lock → paths vivos.
name: Copy skill example lock
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  # Un único escritor para los workflows de extracción/copia sobre main.
  group: extraction-single-writer-main
  cancel-in-progress: false
jobs:
  copy-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: Enforce NO-LFS runner policy
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local --unset-all filter.lfs.process || true
          git config --local filter.lfs.required false
      - name: Copy lock YAML+PY to live paths
        run: |
          set -euo pipefail
          test -f skills/research-download-chain/assets/FORENSIC-PASS-research-download-chain-final.yml
          test -f skills/research-download-chain/assets/FORENSIC-PASS-research_download_chain.py
          mkdir -p .github/workflows scripts
          cp -a skills/research-download-chain/assets/FORENSIC-PASS-research-download-chain-final.yml \
            .github/workflows/research-download-chain-final.yml
          cp -a skills/research-download-chain/assets/FORENSIC-PASS-research_download_chain.py \
            scripts/research_download_chain.py
      - name: Validate copied payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/research_download_chain.py
          python3 - <<'PY'
          from pathlib import Path
          marker = b"version https://git-lfs.github.com/spec/v1\n"
          bad = []
          for p in (Path('.github/workflows/research-download-chain-final.yml'), Path('scripts/research_download_chain.py')):
              if p.read_bytes()[:1024].startswith(marker):
                  bad.append(str(p))
          if bad:
              print('SOURCE_LFS_POINTER_GAP')
              print('\n'.join(bad))
              raise SystemExit(73)
          PY
      - name: Commit copy
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/research-download-chain-final.yml scripts/research_download_chain.py
          git diff --cached --quiet && echo 'NO CHANGE' && exit 0
          git commit -m 'copy: skill lock YAML+PY to live paths'
          # Evita el GAP de rebase con temporales y tolera pushes concurrentes.
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase --autostash origin/main && git push --no-verify origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            test "$attempt" -lt 3 || exit 41
            sleep $((attempt * 10))
          done
