# Mover archivo/lote/raiz. Fuente: https://github.com/actions/checkout
name: Move files
on:
  workflow_dispatch:
    inputs:
      src_root:
        description: 'Origen'
        required: true
        default: 'SRC'
      dest_root:
        description: 'Destino bajo main'
        required: true
        default: 'DEST'
      dest_repo:
        description: 'owner/repo destino. Vacio = mismo repo'
        required: false
        default: ''
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: move-files
  cancel-in-progress: false
jobs:
  move-same-repo:
    if: ${{ inputs.dest_repo == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: move same repo
        run: |
          set -euo pipefail
          SRC="${{ inputs.src_root }}"
          DEST="${{ inputs.dest_root }}"
          test -e "$SRC"
          mkdir -p "$(dirname "$DEST")"
          if [ -d "$SRC" ]; then
            mkdir -p "$DEST"
            cp -a "$SRC"/. "$DEST"/
            rm -rf "$SRC"
          else
            git mv -f "$SRC" "$DEST"
          fi
      - name: commit push main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'NO CHANGE' && exit 0
          git commit -m "move: ${{ inputs.src_root }} -> ${{ inputs.dest_root }}"
          git push origin HEAD:main
  move-other-repo:
    if: ${{ inputs.dest_repo != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          path: src
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.dest_repo }}
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          path: dest
      - name: copy into dest
        run: |
          set -euo pipefail
          SRC="src/${{ inputs.src_root }}"
          DEST="dest/${{ inputs.dest_root }}"
          test -e "$SRC"
          mkdir -p "$DEST"
          if [ -d "$SRC" ]; then
            cp -a "$SRC"/. "$DEST"/
          else
            cp -a "$SRC" "$DEST"/
          fi
      - name: commit push dest main
        working-directory: dest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'NO CHANGE' && exit 0
          git commit -m "move: ${{ inputs.src_root }} -> ${{ inputs.dest_root }}"
          git push origin HEAD:main
