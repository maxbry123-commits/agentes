# Fuente: actions/checkout README (un checkout del repo actual).
# https://github.com/actions/checkout
# cp -a = copia fiel lock → paths vivos.
name: Copy skill example lock
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: copy-skill-example
  cancel-in-progress: false
jobs:
  copy-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: Copy lock YAML+PY to live paths
        run: |
          set -euo pipefail
          test -f skills/research-download-chain/assets/FORENSIC-PASS-research-download-chain-final.yml
          test -f skills/research-download-chain/assets/FORENSIC-PASS-research_download_chain.py
          mkdir -p .github/workflows scripts
          cp -a skills/research-download-chain/assets/FORENSIC-PASS-research-download-chain-final.yml \
            .github/workflows/research-download-chain-final.yml
          cp -a skills/research-download-chain/assets/FORENSIC-PASS-research_download_chain.py \
            scripts/research_download_chain.py
      - name: Commit copy
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/research-download-chain-final.yml scripts/research_download_chain.py
          git diff --cached --quiet && echo 'NO CHANGE' && exit 0
          git commit -m 'copy: skill lock YAML+PY to live paths'
          git push origin HEAD:main
