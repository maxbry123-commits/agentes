name: Download Extract X-Ray
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-extract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: S1-S2 Download queue lock
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_download_chain.py \
            'Download code/archivos' '_work/research-download'
      - name: S3-S4 ZIP integrity + reconstruct slug folder
        shell: bash
        run: |
          set -euo pipefail
          bash skills/wordflow-paso-control/scripts/extract_reconstruct.sh \
            "Download code/archivos"
      - name: S5-S12 X-Ray vs source_commit
        shell: bash
        run: |
          set -euo pipefail
          python3 skills/wordflow-paso-control/scripts/xray_crosscheck.py \
            "Download code/archivos" audit work/source
      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-xray-report
          path: audit/
