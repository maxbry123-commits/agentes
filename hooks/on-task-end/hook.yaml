name: on_task_end
version: 0.1.0
trigger: task.complete
description: "Persiste memoria + emite métricas al cerrar cada tarea."
input_schema:
  type: object
  required: [task_id, status]
  properties:
    task_id: { type: string }
    agent_id: { type: string }
    skill_id: { type: string }
    status: { type: string, enum: [ok, fail, partial, blocked] }
    duration_s: { type: number }
    cost_usd: { type: number }
    output: { type: object }
output_schema:
  type: object
  properties:
    memory_entries_added: { type: array, items: { type: string } }
    metrics_emitted: { type: array, items: { type: string } }
    warnings: { type: array, items: { type: string } }
handler: ./handler.py
timeout_ms: 1000
failure_mode: warn
