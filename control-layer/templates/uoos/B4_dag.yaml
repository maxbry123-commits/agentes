# D4 Workflow DAG — dag/<id>.yaml
# SOURCE: workflow.schema · D4 research
# DAG = QUÉ FLUJO (no quién). Router resuelve agent por required_capabilities.

dag:
  id: DAG-development
  version: "1.0.0"
  project_id: ""

nodes:
  - id: plan
    depends_on: []
    required_capabilities: [planning]
    timeout_seg: 600
    on_fail: recovery_default
  - id: implement
    depends_on: [plan]
    required_capabilities: [coding, debugging]
    timeout_seg: 3600
    on_fail: recovery_default
  - id: review
    depends_on: [implement]
    required_capabilities: [review]
    timeout_seg: 900
    on_fail: recovery_default

rules:
  no_cycles: true
  no_skip: true
  all_caps_must_resolve: true
  entry: plan
  exit: [review]
