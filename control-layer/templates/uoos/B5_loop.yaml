# Plantilla B5 — Loop (UOOS Parte 1)
# SOURCE: SALIDA_6 · 11 loops + regla del delta
# Un archivo por loop: loops/L01.yaml … L11.yaml
# Copiar y cambiar id/proposito. No inventar campos.

loop:
  id: L01                              # L01 … L11
  proposito: "Planificación"
  entrada: ""
  salida:
    criterio_convergencia: ""          # condición medible de fin
  max_iteraciones: 3
  presupuesto:
    tokens: 0
    tiempo_seg: 0
    adaptativo: false                  # umbrales fijos, no ML
  estrategias:
    pool: []
    activa: ""
    mutacion: "cambiar estrategia si delta < minimo"
  delta:
    definicion: "info nueva medible respecto a la iteración anterior"
    score_0_100: 0
    minimo_aceptable: 10
  checkpoint: ""
  rollback: ""
  detectores:
    - estancamiento                    # hash idéntico 2 veces = stop
    - repeticion
    - deriva_objetivo
    - tiempo_excesivo
    - tokens_excesivos
    - degradacion
  escalada:
    1: mutar_estrategia
    2: otra_skill
    3: replanificar_L01
    4: escalar_orquestador
    5: escalar_Director
  eventos: []
  metricas_salida: []

rules:
  same_attempt_twice: PROHIBIDO        # regla del delta
  hash_identical_twice: estancamiento
  L03_fail_to_L04_max_cycles: 3
