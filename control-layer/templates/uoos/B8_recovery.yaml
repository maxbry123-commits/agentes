# D8 Recovery — recovery/*.yaml v2.0
# SOURCE: B8 · loops RecoveryEngine 11 acciones · DESPLIEGUE/Witness
# Declarativo: política de recuperación del proyecto. Runtime = loops/recovery.py

schema_version: "2.0"
kind: RECOVERY_POLICY

id: default
version: "1.0.0"
project_id: ""

triggers:
  - tribunal.REJECT
  - tribunal.REPARAR
  - loop.stall
  - loop.oscillation
  - timeout
  - ley_violada
  - crash
  - lease_expired
  - budget_exhausted

# Mapeo a acciones del LoopEngine RecoveryEngine
action_map:
  RETRY: reintentar
  REFRAME: diagnosticar_y_replan
  CHANGE_STRATEGY: cambiar_loop_strategy
  CHANGE_MODEL: cambiar_modelo
  REDUCE_SCOPE: reducir_alcance
  ROLLBACK: restaurar_checkpoint
  ISOLATE: aislar_nodo
  CHECKPOINT: forzar_checkpoint
  ESCALATE: escalate_Director
  ABORT: abort
  HUMAN_GATE: human_gate

protocolo:
  - paso: 1
    accion: congelar
  - paso: 2
    accion: diagnosticar
  - paso: 3
    accion: clasificar
  - paso: 4
    accion: restaurar_checkpoint    # nunca arreglar sobre lo roto
  - paso: 5
    accion: reintentar_con_delta
  - paso: 6
    accion: validar_tribunal
  - paso: 7
    accion: documentar_evidence

rules:
  never_delete_failure_evidence: true
  max_recoveries_same_node: 2
  max_recoveries_same_run: 5
  after_max: escalate_Director
  prefer_rollback_before_retry: true

classify:
  auto_recuperable:
    - input_invalido_upstream
    - dependencia_instalable
    - timeout_con_checkpoint
    - estancamiento_con_pool
    - lease_expired_orphan
  requiere_Director:
    - ley_violada
    - contradiccion_documental
    - contrato_incumplible
    - segundo_recovery_mismo_nodo
    - presupuesto_agotado
    - rollback_config_fallido
    - secret_exposure
