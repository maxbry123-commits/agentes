# Budget — presupuestos completos v1
# SOURCE: Budget Governor · 4 levels + multi-resource

$schema: budget.schema/v1

levels:
  micro:
    tokens: 20000
    time_seg: 600
    max_iter: 5
    model_calls: 10
    tool_calls: 20
  tarea:
    tokens: 80000
    time_seg: 2700
    max_iter: 8
    model_calls: 40
    tool_calls: 80
  fase:
    tokens: 300000
    time_seg: 10800
    max_iter: 12
    model_calls: 120
    tool_calls: 200
  proyecto:
    tokens: 1500000
    time_seg: 86400
    max_iter: 20
    model_calls: 500
    tool_calls: 1000

fields:
  level: {type: enum, values: [micro, tarea, fase, proyecto]}
  token_budget: {type: integer, min: 0}
  time_budget_seg: {type: integer, min: 0}
  iteration_budget: {type: integer, min: 1}
  tool_call_budget: {type: integer, min: 0}
  model_call_budget: {type: integer, min: 0}
  parallelism_budget: {type: integer, min: 1, default: 1}
  cost_budget: {type: float, min: 0, default: 0}      # unidades moneda abstracta
  memory_budget_mb: {type: integer, min: 0, default: 0}
  retry_budget: {type: integer, min: 0, default: 2}

  # consumed (runtime)
  tokens_used: {type: integer, default: 0}
  time_used_seg: {type: float, default: 0}
  iterations_used: {type: integer, default: 0}
  tool_calls_used: {type: integer, default: 0}
  model_calls_used: {type: integer, default: 0}
  cost_used: {type: float, default: 0}
  retries_used: {type: integer, default: 0}

rules:
  - any used > budget → emit BUDGET_EXCEEDED + action_hint escalate|abort
  - warning at 80% → BUDGET_WARNING
  - Budget Governor may reallocate residual between sibling runs of same task
