<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YAIWES · Crazy Wall v4</title>
<style>
:root{

  --w:#fff;--fg:#e4e4e7;--sec:#a1a1aa;--dim:#71717a;--mut:#52525b;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif}
body{max-width:430px;margin:0 auto;padding-bottom:96px}
.hdr{background:var(--surf);border-bottom:1px solid var(--blue);padding:10px 12px 8px;position:sticky;top:0;z-index:8}
.hdr .k{font-size:10px;color:var(--dim);letter-spacing:.06em}
.hdr h1{font-size:15px;color:var(--w);font-weight:600}
.hilo{display:flex;gap:3px;overflow-x:auto;padding:6px 0 2px}
.hilo span{flex:0 0 auto;border:1px solid var(--blue);border-radius:7px;padding:3px 6px;font-size:10px;color:var(--w)}
.hilo i{color:var(--dim);align-self:center;font-style:normal;font-size:10px}
.modes{display:flex;gap:6px;margin-top:6px}
.modes button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--sec);border-radius:8px;padding:7px;font-size:11px}
.modes button.on{border-color:var(--blue);color:var(--w)}
.legend{display:flex;gap:8px;font-size:10px;color:var(--dim);margin-top:6px}
.legend b{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
.plane{padding:8px 8px 4px}
.plane>h2{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin:8px 4px 6px}
.tree{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.row{display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border-radius:6px;width:100%;border:0;background:transparent;color:var(--fg);text-align:left}
.row:active,.row.on{background:var(--hover);outline:1px solid var(--blue)}
.row.redband{background:#2a1214}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:4px}
.dot.verde{background:var(--verde)}
.dot.amarillo{background:var(--amarillo)}
.dot.naranja{background:var(--naranja)}
.dot.rojo{background:var(--rojo)}
.nm{color:var(--w);flex:1;word-break:break-all}
.nm .path{color:var(--sec)}
.meta{color:var(--dim);font-size:10px;white-space:nowrap}
.kids{padding-left:12px;border-left:1px solid var(--bd);margin-left:10px}
.add{margin:8px;border:1px dashed var(--bd);border-radius:10px;padding:8px}
.add .k{font-size:10px;color:var(--dim)}
.add select,.add input,.add textarea,select.fld,textarea.note{width:100%;background:var(--pure);color:var(--sec);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px system-ui;margin-top:6px}
.add button,.bar button,button.p{border:0;border-radius:8px;padding:10px;background:var(--w);color:var(--bg);font-size:13px;width:100%;margin-top:6px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surf);border-top:1px solid var(--bd);padding:8px;display:flex;gap:6px}
.bar button{margin:0;flex:1}
.bar button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.sheet{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:430px;max-height:90vh;overflow:auto;background:var(--surf);border-radius:20px 20px 0 0;padding:14px 12px 28px}
.sheet h3{color:var(--w);font-size:15px}
.micro{font-family:ui-monospace,monospace;font-size:11px;color:var(--sec);border-left:2px solid var(--blue);padding:6px 8px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.xray{font-size:13px;color:var(--fg);margin:8px 0}
.sts{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.sts button{border:1px solid var(--bd);background:var(--card);color:var(--sec);border-radius:8px;padding:7px 8px;font-size:11px}
.sts button.on{border-color:var(--blue);color:var(--w)}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--pure);color:var(--sec);padding:6px 10px;border-radius:8px;font-size:12px;display:none;z-index:30;border:1px solid var(--bd)}

.tabs{display:flex;gap:6px;margin-top:6px}
.tabs button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--sec);border-radius:8px;padding:8px;font-size:11px}
.tabs button.on{border-color:var(--blue);color:var(--w)}
.hdr .save{margin-top:6px;border:0;border-radius:8px;padding:9px;width:100%;background:var(--w);color:var(--bg);font-size:13px}
.hide{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd)}
.cell{background:var(--card);padding:8px;min-height:56px;text-align:left;border:0;color:var(--fg);width:100%}
.cell.red{background:#2a1214}
.cell.red .id{color:#ff6b6b}
.cell .id{font-size:10px;color:var(--blue);font-family:ui-monospace,monospace}
.cell .nm{font-size:12px;color:var(--w);display:block}
.cell .tag{font-size:9px;color:var(--dim)}
.rootbox{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card);overflow:hidden}
.rootbox .rh{display:flex;align-items:center;gap:8px;padding:8px 10px;width:100%;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--fg);text-align:left}
.rootbox .rh b{color:var(--w);font-size:13px}
.rootbox .rh small{color:var(--dim);font-size:10px;display:block}
.bulb{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.bulb.cerrado{background:var(--verde)}
.bulb.pendiente,.bulb.incompleto{background:var(--amarillo)}
.bulb.no_plugins{background:var(--naranja)}
.bulb.faltante,.bulb.no_existe{background:var(--rojo)}
.flist{padding:4px 8px 8px}
.fbtn{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;color:var(--fg);padding:5px 4px;text-align:left;font:11px ui-monospace,monospace}
.fbtn .nm{color:var(--w);flex:1;word-break:break-all}
.badge{display:inline-block;font-size:10px;border:1px solid var(--blue);border-radius:6px;padding:2px 6px;margin-bottom:6px;color:var(--w)}
.badge.file{border-color:var(--naranja)}

</style>
</head>

<header class="hdr">

    <button id="mblock" onclick="setMode('block')">Tap bloque</button>
  </div>
  <div class="legend">
    <span><b style="background:var(--verde)"></b>cerrado</span>
    <span><b style="background:var(--amarillo)"></b>pendiente</span>
    <span><b style="background:var(--naranja)"></b>mix/plugins</span>

    <button id="tT" onclick="tab('T')">Árbol</button>
    <button id="tA" onclick="tab('A')">Archivos</button>
  </div>
  <button class="save" onclick="saveVersion()">Guardar estado → vN.html</button>
</header>
<div class="plane" id="bloques"></div>
<div class="plane hide" id="archivos"></div>

</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="sheetbox"></div></div>
<div class="bar">

function tab(k){
  STATE.tab=k;
  document.getElementById("tB").className=k==="B"?"on":"";
  document.getElementById("tT").className=k==="T"?"on":"";
  document.getElementById("tA").className=k==="A"?"on":"";
  document.getElementById("bloques").className="plane"+(k==="B"?"":" hide");
  document.getElementById("arbol").className="plane"+(k==="T"?"":" hide");
  document.getElementById("archivos").className="plane"+(k==="A"?"":" hide");
}
function drawBloques(){
  const extra=(STATE.extra||[]).map((r,i)=>{
    const t=r.t||(r.node&&r.node.name)||"extra";
    const md=r.md||"";
    return `<div class="rootbox"><button class="rh" onclick="openExtraV3(${i})"><span class="bulb ${stOf("XR"+i)}"></span><div><b>+ ${esc(t)}</b><small>BLOQUE · ${esc(md).slice(0,80)}</small></div></button></div>`;
  }).join("");
  document.getElementById("bloques").innerHTML="<h2>6 raíces · 25 bloques</h2>"+ROOTS.map(r=>{
    const rs=rollB(r.ids);
    return `<div class="rootbox"><button class="rh" onclick="openRootV3('${r.id}')"><span class="bulb ${rs}"></span><div><b>${r.n} ${r.path}</b><small>${r.role} · ${SLB[rs]} · ${r.m}</small></div></button><div class="grid">${r.ids.map(id=>{const s=SEGS[id];return `<button class="cell ${REDB.has(id)?"red":""}" onclick="openSeg('${id}')"><span class="id">${id} · BLOQUE · ${SLB[stOf(id)]} · ${pctB(id)}%</span><span class="nm">${s.t}</span><span class="tag">${(FILES[id]||[]).length} archivos</span></button>`;}).join("")}</div></div>`;
  }).join("")+extra;
}
function drawArchivos(){
  let html="<h2>archivos individuales</h2>";
  ROOTS.forEach(r=>{
    html+=`<div class="rootbox"><div class="rh"><span class="dot ${CST[stOf(r.ids[0])]||"amarillo"}"></span><div><b>${r.path}</b></div></div>`;
    r.ids.forEach(id=>{
      const s=SEGS[id];
      html+=`<div class="flist"><button class="fbtn" onclick="openSeg('${id}')"><span class="dot ${CST[stOf(id)]||"amarillo"}"></span><span class="nm">BLOQUE ${id} ${s.t}</span><span>${pctB(id)}%</span></button>`;
      (FILES[id]||[]).forEach(f=>{
        const st=STATE.st[f.id]||f.st;
        html+=`<button class="fbtn" onclick="openFileV3('${id}','${f.id}')"><span class="dot ${CST[st]||"amarillo"}"></span><span class="nm">FILE ${esc(f.n)}</span><span>${pctB(f.id,f.pct)}%</span></button>`;
      });
      html+="</div>";
    });
    html+="</div>";
  });
  document.getElementById("archivos").innerHTML=html;
}
function palB(id,kind){
  const mk=stOf(id);
  return `<div class="k" style="font-size:11px;color:var(--dim)">ESTADO</div><div class="sts">${["pendiente","faltante","incompleto","no_plugins","no_existe","cerrado"].map(x=>`<button class="${mk===x?"on":""}" onclick="setStB('${id}','${x}','${kind}')">${SLB[x]}</button>`).join("")}</div><div class="k" style="font-size:11px;color:var(--dim)">% CODE</div><div class="sts">${[0,10,25,40,55,70,85,100].map(p=>`<button class="${pctB(id)===p?"on":""}" onclick="setPctB('${id}',${p},'${kind}')">${p}%</button>`).join("")}</div>`;
}
function openSeg(id){
  STATE.sel=id;STATE.selKind="block";STATE.selSeg=id;
  const s=SEGS[id];
  const fl=(FILES[id]||[]).map(f=>`<button class="fbtn" onclick="openFileV3('${id}','${f.id}')"><span class="dot ${CST[STATE.st[f.id]||f.st]||"amarillo"}"></span><span class="nm">FILE ${esc(f.n)}</span><span>${pctB(f.id,f.pct)}%</span></button>`).join("")||"<div class='xray'>sin files</div>";
  sheetBox(`<span class="badge">BLOQUE · no es archivo</span><div class="k" style="font-size:11px;color:${REDB.has(id)?"var(--rojo)":"var(--blue)"}">${s.z}${REDB.has(id)?" · ROJO":""}</div><h3>${s.t}</h3><div class="micro">${s.f} · dest ${s.dest}</div><div class="xray"><b>Qué hace el bloque.</b> ${s.d}</div><div class="xray"><b>Problema ahora.</b> ${s.x}</div>${palB(id,"seg")}<div class="k" style="font-size:11px;color:var(--dim)">ARCHIVOS DE ESTE BLOQUE</div>${fl}<textarea class="note" rows="4" placeholder="nota del bloque" oninput="STATE.notes['${id}']=this.value">${esc(STATE.notes[id]||"")}</textarea><button class="p" onclick="shareSeg('${id}')">Compartir BLOQUE</button><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`);
}
function openFileV3(seg,fid){
  const f=(FILES[seg]||[]).find(x=>x.id===fid);if(!f)return;
  STATE.sel=fid;STATE.selKind="file";STATE.selSeg=seg;
  if(!STATE.st[fid]) STATE.st[fid]=f.st;
  if(STATE.pct[fid]==null) STATE.pct[fid]=f.pct;
  sheetBox(`<span class="badge file">ARCHIVO · no es bloque</span><div class="k" style="font-size:11px;color:var(--blue)">padre ${SEGS[seg].z}</div><h3>${esc(f.n)}</h3><div class="micro">${esc(f.f)}</div><div class="xray"><b>Qué hace el archivo.</b> ${esc(f.d)}</div><div class="xray"><b>X-ray.</b> ${esc(f.x)}</div><div class="xray"><b>Destino ROOT MAP.</b> ${esc(f.dest)}</div>${palB(fid,"file")}<textarea class="note" rows="4" placeholder="nota del archivo" oninput="STATE.notes['${fid}']=this.value">${esc(STATE.notes[fid]||"")}</textarea><button class="p" onclick="openSeg('${seg}')">Volver al BLOQUE</button><button class="p" onclick="shareFileV3('${seg}','${fid}')">Compartir ARCHIVO</button><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`);
}
function openRootV3(id){
  const r=ROOTS.find(x=>x.id===id);if(!r)return;
  sheetBox(`<span class="badge">RAÍZ · contenedor de bloques</span><h3>${r.n} ${r.path}</h3><div class="micro">${r.m}</div><div class="xray">${r.role}</div><div class="sts">${r.ids.map(i=>`<button onclick="openSeg('${i}')">${i} ${SEGS[i].t}</button>`).join("")}</div><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`);
}
function openExtraV3(i){
  const r=STATE.extra[i];if(!r)return;
  const t=r.t||(r.node&&r.node.name)||"extra";
  const md=r.md||"";
  sheetBox(`<span class="badge">RAÍZ EXTRA · solo bloque</span><h3>${esc(t)}</h3><div class="xray" style="white-space:pre-wrap">${esc(md)}</div>${palB("XR"+i,"extra")}<textarea class="note" rows="4" oninput="STATE.notes['XR${i}']=this.value">${esc(STATE.notes["XR"+i]||"")}</textarea><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`);
}
function setStB(id,v,kind){STATE.st=STATE.st||{};STATE.pct=STATE.pct||{};STATE.st[id]=v;if(STATE.pct[id]==null)STATE.pct[id]=PCTB[v];persist();drawBloques();drawArchivos();if(kind==="file")openFileV3(STATE.selSeg,id);else if(kind==="seg"&&SEGS[id])openSeg(id);}
function setPctB(id,p,kind){STATE.pct=STATE.pct||{};STATE.pct[id]=p;persist();drawBloques();drawArchivos();if(kind==="file")openFileV3(STATE.selSeg,id);else if(kind==="seg"&&SEGS[id])openSeg(id);}
async function shareSeg(id){
  const s=SEGS[id];
  const tree=ROOTS.map(r=>"  "+r.path+" ["+SLB[rollB(r.ids)]+"]\n"+r.ids.map(i=>"    BLOQUE "+SEGS[i].z+" ["+SLB[stOf(i)]+" "+pctB(i)+"%]").join("\n")).join("\n");
  const text="# YAIWES BLOQUE "+s.z+"\n## RAÍZ\n```\nagentes/\n"+tree+"\n```\n## BLOQUE\n"+s.t+"\n"+s.d+"\nFlujo: "+s.f+"\nDestino: "+s.dest+"\nEstado: "+SLB[stOf(id)]+" "+pctB(id)+"%\n## PROBLEMA\n"+s.x+"\n## NOTA\n"+(STATE.notes[id]||"")+"\n## LEY\nEnchufe IN+OUT. Destino=ROOT MAP. A22.";
  try{if(navigator.share) await navigator.share({title:"YAIWES "+id,text});else await navigator.clipboard.writeText(text);toast("share bloque");}catch(e){try{await navigator.clipboard.writeText(text);toast("copiado");}catch(e2){toast("cancel");}}
}
async function shareFileV3(seg,fid){
  const f=(FILES[seg]||[]).find(x=>x.id===fid);if(!f)return;
  const text="# YAIWES ARCHIVO\n"+f.n+"\nPadre: "+SEGS[seg].z+"\nFlujo: "+f.f+"\n"+f.d+"\nX-ray: "+f.x+"\nDestino: "+f.dest+"\nEstado: "+SLB[stOf(fid)]+" "+pctB(fid,f.pct)+"%\nNota: "+(STATE.notes[fid]||"")+"\nLEY: enchufe IN+OUT.";
  try{if(navigator.share) await navigator.share({title:f.n,text});else await navigator.clipboard.writeText(text);toast("share archivo");}catch(e){try{await navigator.clipboard.writeText(text);toast("copiado");}catch(e2){toast("cancel");}}
}


function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1600);}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function ov(n){const o=STATE.ov[n.id]||{};return{
  st:o.st||n.st, col:o.col||CST[o.st||n.st]||n.st,
  pct:o.pct!=null?o.pct:(n.pct!=null?n.pct:PCT0[o.st||n.st]||0)
};}
function worst(nodes){
  const rank={rojo:0,naranja:1,amarillo:2,verde:3};
  let w="verde",i=9;
  (function walk(a){a.forEach(n=>{const c=ov(n).col;const r=rank[c];if(r<i){i=r;w=c;}if(n.kids)walk(n.kids);});})(nodes);
  return w;
}
function rowHTML(n,depth){
  const o=ov(n);
  const red=RED.has(n.seg)?"redband":"";
  return `<button class="row ${red}" data-id="${n.id}" onclick="tap('${n.id}')">
    <span class="dot ${o.col}"></span>
    <span class="nm">${"│ ".repeat(Math.max(0,depth-1))}${depth? "├─ ":""}<span class="path">${esc(n.name)}</span></span>
    <span class="meta">${o.pct}%</span>
  </button>`+(n.kids&&n.kids.length?`<div class="kids">${n.kids.map(k=>rowHTML(k,depth+1)).join("")}</div>`:"");
}
function find(id,arr){
  for(const n of arr){if(n.id===id)return n;const x=n.kids&&find(id,n.kids);if(x)return x;}
  return null;
}
function allTrees(){return SIX.concat(YAI,WF).concat(STATE.extra.map(e=>e.node));}
function findAny(id){return find(id,allTrees());}
function render(){
  document.getElementById("six").innerHTML=SIX.map(n=>rowHTML(n,0)).join("");
  document.getElementById("yaiwes").innerHTML=YAI.map(n=>rowHTML(n,0)).join("");
  document.getElementById("wf").innerHTML=WF.map(n=>rowHTML(n,0)).join("");
  document.getElementById("extra").innerHTML=STATE.extra.map(e=>rowHTML(e.node,0)).join("")||'<div class="k" style="color:var(--dim);padding:6px">ninguna</div>';
  document.getElementById("ver").textContent="v"+STATE.v;
  document.getElementById("mfile").className=STATE.mode==="file"?"on":"";
  document.getElementById("mblock").className=STATE.mode==="block"?"on":"";
  const a=document.getElementById("mask");if(a)a.className=STATE.mode==="ask"?"on":"";
  drawBloques();drawArchivos();tab(STATE.tab||"B");
}
function setMode(m){STATE.mode=m;render();
  const a=document.getElementById("mask");if(a)a.className=m==="ask"?"on":"";
}
function tap(id){
  const n=findAny(id);if(!n)return;
  STATE.sel=id;
  const hasKids=!!(n.kids&&n.kids.length);
  if(STATE.mode==="ask" && hasKids){
    sheetBox(`<span class="badge">ELEGIR</span><h3>${esc(n.name)}</h3><div class="xray">Este nodo es carpeta. ¿Archivo hoja o bloque?</div><button class="p" onclick="openFile(findAny('${n.id}'))">Abrir como ARCHIVO</button><button class="p" onclick="openBlock(findAny('${n.id}'))">Abrir como BLOQUE</button><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cancelar</button>`);
    return;
  }
  if(!hasKids){openFile(n);return;}
  if(STATE.mode==="block") openBlock(n); else openFile(n);
}
function sheetBox(html){document.getElementById("sheetbox").innerHTML=html;document.getElementById("sheet").classList.add("on");}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}
function pal(n){
  const o=ov(n);
  return `<div class="k" style="font-size:10px;color:var(--dim)">COLOR</div>
    <div class="sts">${COL.map(c=>`<button class="${o.col===c?"on":""}" onclick="setCol('${n.id}','${c}')">${c}</button>`).join("")}</div>
    <div class="k" style="font-size:10px;color:var(--dim)">STATUS</div>
    <div class="sts">${ST.map(s=>`<button class="${o.st===s?"on":""}" onclick="setSt('${n.id}','${s}')">${SL[s]}</button>`).join("")}</div>
    <div class="k" style="font-size:10px;color:var(--dim)">% CODE</div>
    <div class="sts">${[0,10,25,40,55,70,85,100].map(p=>`<button class="${o.pct===p?"on":""}" onclick="setPct('${n.id}',${p})">${p}%</button>`).join("")}</div>`;
}
function openFile(n){
  const o=ov(n);
  sheetBox(`
    <div class="k" style="font-size:10px;color:var(--blue)">ARCHIVO · ${esc(n.seg||"—")}</div>
    <h3>${esc(n.name)}</h3>
    <div class="micro">${esc(n.flow||"—")}</div>
    <div class="xray"><b>Qué hace.</b> ${esc(n.desc)}</div>
    <div class="xray"><b>X-ray.</b> ${esc(n.xray)}</div>
    <div class="xray"><b>Destino ROOT MAP.</b> ${esc(n.dest)}</div>
    <div class="xray"><b>Ahora.</b> ${SL[o.st]} · ${o.col} · ${o.pct}%</div>
    ${pal(n)}
    <textarea class="note" rows="4" placeholder="nota de este archivo" oninput="STATE.notes['${n.id}']=this.value">${esc(STATE.notes[n.id]||"")}</textarea>
    <button class="p" onclick="shareNode('${n.id}')">Compartir archivo</button>
    <button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`);
}
function openBlock(n){
  const o=ov(n);
  const files=(n.kids||[]).map(k=>{const x=ov(k);return `├─ [${x.col} ${x.pct}%] ${k.name}`;}).join("\n")||"(hoja)";
  sheetBox(`
    <div class="k" style="font-size:10px;color:${RED.has(n.seg)?"var(--rojo)":"var(--blue)"}">BLOQUE · seg ${esc(n.seg||"—")}${RED.has(n.seg)?" · ROJO":""}</div>
    <h3>${esc(n.name)}</h3>
    <div class="micro">${esc(n.flow||"—")}</div>
    <div class="xray"><b>Qué hace el bloque.</b> ${esc(n.desc)}</div>
    <div class="xray"><b>Problema X-ray.</b> ${esc(n.xray)}</div>
    <div class="xray"><b>Destino.</b> ${esc(n.dest)}</div>
    <div class="micro" style="white-space:pre">${esc(files)}</div>
    <div class="xray"><b>Rollup.</b> ${SL[o.st]} · ${o.col} · ${o.pct}%</div>
    ${pal(n)}
    <textarea class="note" rows="4" placeholder="nota del bloque" oninput="STATE.notes['${n.id}']=this.value">${esc(STATE.notes[n.id]||"")}</textarea>
    <button class="p" onclick="shareNode('${n.id}')">Compartir bloque</button>
    <button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`);
}
function setSt(id,s){
  STATE.ov[id]=Object.assign({},STATE.ov[id],{st:s,col:CST[s],pct:STATE.ov[id]&&STATE.ov[id].pct!=null?STATE.ov[id].pct:PCT0[s]});
  persist();render();const n=findAny(id);if(n) (STATE.mode==="file"&&!(n.kids&&n.kids.length)?openFile:openBlock)(n);
}
function setCol(id,c){STATE.ov[id]=Object.assign({},STATE.ov[id],{col:c});persist();render();const n=findAny(id);if(n)(STATE.mode==="file"&&!(n.kids&&n.kids.length)?openFile:openBlock)(n);}
function setPct(id,p){STATE.ov[id]=Object.assign({},STATE.ov[id],{pct:p});persist();render();const n=findAny(id);if(n)(STATE.mode==="file"&&!(n.kids&&n.kids.length)?openFile:openBlock)(n);}
function addRoot(){
  const title=document.getElementById("ntitle").value||document.getElementById("clone").selectedOptions[0].text;
  const md=document.getElementById("nmd").value||"";
  const id="XR"+Date.now();
  const node=N(id,title,"pendiente",0,"nueva raíz → bloque único → compartir",md||"Raíz añadida. Solo bloque, no árbol de archivos.","Usuario pegó markdown. Sin hojas de archivo.","extra/"+title,"00");
  STATE.extra.push({node,md});
  document.getElementById("ntitle").value="";document.getElementById("nmd").value="";
  persist();render();toast("raíz-bloque añadida");
}
function blockText(n){
  const o=ov(n);
  const six=SIX.map(r=>{const x=ov(r);return `  ${r.name} [${x.col} ${x.pct}%]`;}).join("\n");
  return `# YAIWES ${n.id}\n## RAÍZ\n\`\`\`\nagentes/\n${six}\n\`\`\`\n## NODO\n${n.name}\nFlujo: ${n.flow}\nDestino: ${n.dest}\nEstado: ${SL[o.st]} · ${o.col} · ${o.pct}%\n## DESC\n${n.desc}\n## XRAY\n${n.xray}\n## NOTA\n${STATE.notes[n.id]||""}\n## LEY\nEnchufe IN+OUT cada file nuevo. Destino=ROOT MAP. Formato A22. No from-scratch.`;
}
async function shareNode(id){
  const n=findAny(id);if(!n)return;
  const text=blockText(n);
  try{
    if(navigator.share) await navigator.share({title:"YAIWES "+n.name,text});
    else await navigator.clipboard.writeText(text);
    toast("share/copiado");
  }catch(e){try{await navigator.clipboard.writeText(text);toast("copiado");}catch(e2){toast("cancel");}}
}
function shareSel(){shareNode(STATE.sel||"WF.runner");}
function persist(){try{localStorage.setItem("yaiwes-wall-v4",JSON.stringify(STATE));}catch(e){}}
function saveVersion(){
  STATE.v=(STATE.v||2)+1;persist();
  const tag=document.getElementById("state");
  if(tag) tag.textContent=JSON.stringify(STATE);
  const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download="YAIWES-CRAZY-WALL-v"+STATE.v+".html";a.click();
  document.getElementById("ver").textContent="v"+STATE.v;
  toast("v"+STATE.v+" → Descargas");
}
(function(){
  const el=document.getElementById("state");
  try{if(el) Object.assign(STATE,JSON.parse(el.textContent));}catch(e){}
  try{const ls=localStorage.getItem("yaiwes-wall-v4");if(ls){const p=JSON.parse(ls);if((p.v||0)>=(STATE.v||0)) Object.assign(STATE,p);}}catch(e){}
  render();
})();
</script>
<script type="application/json" id="state">{"v":4,"tab":"B","mode":"ask","ov":{},"st":{},"pct":{},"notes":{},"extra":[],"sel":"20"}</script>
</body>
</html>
