*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
body{max-width:430px;margin:0 auto;padding-bottom:96px}
.hdr{background:var(--surf);border-bottom:1px solid var(--blue);padding:10px 12px 8px;position:sticky;top:0;z-index:8}
.hdr .k{font-size:10px;color:var(--dim);letter-spacing:.06em}

.hilo{display:flex;gap:4px;overflow-x:auto;padding:6px 0 4px}
.hilo span{flex:0 0 auto;border:1px solid var(--blue);border-radius:8px;padding:4px 7px;font-size:10px;color:var(--w)}
.hilo i{color:var(--dim);align-self:center;font-style:normal}
.tabs{display:flex;gap:6px;margin-top:6px}
.tabs button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:8px;padding:8px;font-size:12px}
.tabs button.on{border-color:var(--blue);color:var(--w)}
.hdr .save{margin-top:6px;border:0;border-radius:8px;padding:9px;width:100%;background:var(--w);color:var(--bg);font-size:13px}
.plane{padding:8px 10px 4px}
.plane h2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 6px}
.rootbox{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card);overflow:hidden}
.rootbox .rh{display:flex;align-items:center;gap:8px;padding:8px 10px;width:100%;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--fg);text-align:left}
.rootbox .rh b{color:var(--w);font-size:13px}
.rootbox .rh small{color:var(--dim);font-size:10px;display:block}
.bulb,.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.bulb.cerrado,.dot.verde{background:var(--verde)}
.bulb.pendiente,.dot.amarillo,.bulb.incompleto{background:var(--amarillo)}
.bulb.no_plugins,.dot.naranja{background:var(--naranja)}
.bulb.faltante,.bulb.no_existe,.dot.rojo{background:var(--rojo)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd)}
.cell{background:var(--card);padding:8px;min-height:56px;text-align:left;border:0;color:var(--fg);width:100%}
.cell.red{background:var(--red-bg)}
.cell.red .id{color:#ff6b6b}
.cell .id{font-size:10px;color:var(--blue);font-family:ui-monospace,monospace}
.cell .nm{font-size:12px;color:var(--w);display:block}
.cell .tag{font-size:9px;color:var(--dim)}
.flist{padding:4px 8px 8px}
.fbtn{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;color:var(--fg);padding:5px 4px;text-align:left;font:11px ui-monospace,monospace}
.fbtn .nm{color:var(--w);flex:1;word-break:break-all}
.add{margin:8px 10px;border:1px dashed var(--bd);border-radius:10px;padding:8px}
.add .k{font-size:11px;color:var(--dim)}
.add select,.add input,.add textarea,textarea.note{width:100%;background:#000;color:var(--mut);border:1px solid var(--bd);border-radius:8px;padding:8px;font:13px system-ui;margin-top:6px}
.add button,.bar button,button.p{border:0;border-radius:8px;padding:10px;background:var(--w);color:var(--bg);font-size:13px;width:100%;margin-top:6px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surf);border-top:1px solid var(--bd);padding:8px;display:flex;gap:6px;z-index:9}
.bar button{margin:0;flex:1}
.bar button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.sheet{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:430px;max-height:90vh;overflow:auto;background:var(--surf);border-radius:24px 24px 0 0;padding:14px 12px 24px}
.sheet h3{color:var(--w);font-size:15px}
.badge{display:inline-block;font-size:10px;border:1px solid var(--blue);border-radius:6px;padding:2px 6px;margin-bottom:6px;color:var(--w)}
.badge.file{border-color:var(--naranja)}
.xray{font-size:13px;color:var(--fg);margin:8px 0}
.micro{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);border-left:2px solid var(--blue);padding:6px 8px;margin:8px 0;overflow-x:auto;white-space:nowrap}

.sts button{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:8px;padding:8px;font-size:11px}
.sts button.on{border-color:var(--blue);color:var(--w)}

.hide{display:none}
</style>

function plane(){
  const extra=STATE.extra.map((r,i)=>`<div class="rootbox"><button class="rh" onclick="openExtra(${i})"><span class="bulb ${stOf("XR"+i)}"></span><div><b>+ ${esc(r.t)}</b><small>BLOQUE · ${esc(r.md).slice(0,80)}</small></div></button></div>`).join("");
  document.getElementById("bloques").innerHTML="<h2>6 raíces · 25 bloques</h2>"+ROOTS.map(r=>{
    const rs=roll(r.ids);
    return `<div class="rootbox"><button class="rh" onclick="openRoot('${r.id}')"><span class="bulb ${rs}"></span><div><b>${r.n} ${r.path}</b><small>${r.role} · ${SL[rs]} · ${r.m}</small></div></button><div class="grid">${r.ids.map(id=>{const s=SEGS[id];return `<button class="cell ${RED.has(id)?"red":""}" onclick="openSeg('${id}')"><span class="id">${id} · BLOQUE · ${SL[stOf(id)]} · ${pctOf(id)}%</span><span class="nm">${s.t}</span><span class="tag">${(FILES[id]||[]).length} archivos</span></button>`;}).join("")}</div></div>`;
  }).join("")+extra;
  let html="<h2>archivos individuales · tap FILE abre archivo</h2>";
  ROOTS.forEach(r=>{
    html+=`<div class="rootbox"><div class="rh"><span class="dot ${COL[roll(r.ids)]}"></span><div><b>${r.path}</b></div></div>`;
    r.ids.forEach(id=>{
      const s=SEGS[id];
      html+=`<div class="flist"><button class="fbtn" onclick="openSeg('${id}')"><span class="dot ${COL[stOf(id)]}"></span><span class="nm">BLOQUE ${id} ${s.t}</span><span>${pctOf(id)}%</span></button>`;
      (FILES[id]||[]).forEach(f=>{
        const st=STATE.st[f.id]||f.st;
        html+=`<button class="fbtn" onclick="openFile('${id}','${f.id}')"><span class="dot ${COL[st]}"></span><span class="nm">FILE ${esc(f.n)}</span><span>${pctOf(f.id,f.pct)}%</span></button>`;
      });
      html+="</div>";
    });
    html+="</div>";
  });
  document.getElementById("archivos").innerHTML=html;
  document.getElementById("ver").textContent="v"+STATE.v;
  tab(STATE.tab||"B");
}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}
function pal(id,kind){
  const mk=stOf(id);
  return `<div class="k" style="font-size:11px;color:var(--dim)">ESTADO</div><div class="sts">${ST.map(x=>`<button class="${mk===x?"on":""}" onclick="setSt('${id}','${x}','${kind}')">${SL[x]}</button>`).join("")}</div><div class="k" style="font-size:11px;color:var(--dim)">% CODE</div><div class="sts">${[0,10,25,40,55,70,85,100].map(p=>`<button class="${pctOf(id)===p?"on":""}" onclick="setPct('${id}',${p},'${kind}')">${p}%</button>`).join("")}</div>`;
}
function openSeg(id){
  STATE.sel=id;STATE.selKind="block";STATE.selSeg=id;
  const s=SEGS[id];
  const fl=(FILES[id]||[]).map(f=>`<button class="fbtn" onclick="openFile('${id}','${f.id}')"><span class="dot ${COL[STATE.st[f.id]||f.st]}"></span><span class="nm">FILE ${esc(f.n)}</span><span>${pctOf(f.id,f.pct)}%</span></button>`).join("")||"<div class='xray'>sin files</div>";
  document.getElementById("sheetbox").innerHTML=`<span class="badge">BLOQUE · no es archivo</span><div class="k" style="font-size:11px;color:${RED.has(id)?"#ff6b6b":"var(--blue)"}">${s.z}${RED.has(id)?" · ROJO":""}</div><h3>${s.t}</h3><div class="micro">${s.f} · dest ${s.dest}</div><div class="xray"><b>Qué hace el bloque.</b> ${s.d}</div><div class="xray"><b>Problema ahora.</b> ${s.x}</div>${pal(id,"seg")}<div class="k" style="font-size:11px;color:var(--dim)">ARCHIVOS DE ESTE BLOQUE</div>${fl}<textarea class="note" rows="4" placeholder="nota del bloque" oninput="STATE.notes['${id}']=this.value">${esc(STATE.notes[id]||"")}</textarea><button class="p" onclick="shareSel()">Compartir BLOQUE</button><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`;
  document.getElementById("sheet").classList.add("on");
}
function openFile(seg,fid){
  const f=(FILES[seg]||[]).find(x=>x.id===fid);if(!f)return;
  STATE.sel=fid;STATE.selKind="file";STATE.selSeg=seg;
  if(!STATE.st[fid]) STATE.st[fid]=f.st;
  if(STATE.pct[fid]==null) STATE.pct[fid]=f.pct;
  document.getElementById("sheetbox").innerHTML=`<span class="badge file">ARCHIVO · no es bloque</span><div class="k" style="font-size:11px;color:var(--blue)">padre ${SEGS[seg].z}</div><h3>${esc(f.n)}</h3><div class="micro">${esc(f.f)}</div><div class="xray"><b>Qué hace el archivo.</b> ${esc(f.d)}</div><div class="xray"><b>X-ray.</b> ${esc(f.x)}</div><div class="xray"><b>Destino ROOT MAP.</b> ${esc(f.dest)}</div>${pal(fid,"file")}<textarea class="note" rows="4" placeholder="nota del archivo" oninput="STATE.notes['${fid}']=this.value">${esc(STATE.notes[fid]||"")}</textarea><button class="p" onclick="openSeg('${seg}')">Volver al BLOQUE</button><button class="p" onclick="shareFile('${seg}','${fid}')">Compartir ARCHIVO</button><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`;
  document.getElementById("sheet").classList.add("on");
}
function openRoot(id){
  const r=ROOTS.find(x=>x.id===id);if(!r)return;
  STATE.sel=id;STATE.selKind="root";
  document.getElementById("sheetbox").innerHTML=`<span class="badge">RAÍZ · contenedor de bloques</span><h3>${r.n} ${r.path}</h3><div class="micro">${r.m}</div><div class="xray">${r.role}</div><div class="sts">${r.ids.map(i=>`<button onclick="openSeg('${i}')">${i} ${SEGS[i].t}</button>`).join("")}</div><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`;
  document.getElementById("sheet").classList.add("on");
}
function openExtra(i){
  const r=STATE.extra[i];if(!r)return;
  STATE.sel="XR"+i;STATE.selKind="block";
  document.getElementById("sheetbox").innerHTML=`<span class="badge">RAÍZ EXTRA · solo bloque</span><h3>${esc(r.t)}</h3><div class="xray" style="white-space:pre-wrap">${esc(r.md)}</div>${pal("XR"+i,"extra")}<textarea class="note" rows="4" oninput="STATE.notes['XR${i}']=this.value">${esc(STATE.notes["XR"+i]||"")}</textarea><button class="p" style="background:var(--card);color:var(--fg);border:1px solid var(--bd)" onclick="closeSheet()">Cerrar</button>`;
  document.getElementById("sheet").classList.add("on");
}
function setSt(id,v,kind){STATE.st[id]=v;if(STATE.pct[id]==null)STATE.pct[id]=PCT[v];persist();plane();reopen(kind,id);}
function setPct(id,p,kind){STATE.pct[id]=p;persist();plane();reopen(kind,id);}
function reopen(kind,id){if(kind==="file")openFile(STATE.selSeg,id);else if(kind==="seg"&&SEGS[id])openSeg(id);else if(kind==="extra"){}}
function addRoot(){
  const t=document.getElementById("ntitle").value||document.getElementById("clone").selectedOptions[0].text;
  const md=document.getElementById("nmd").value||"";
  STATE.extra.push({t,md});
  document.getElementById("ntitle").value="";document.getElementById("nmd").value="";
  persist();plane();toast("raíz-bloque añadida");
}
function blockText(id){
  const s=SEGS[id]||{z:id,t:id,d:"",x:"",f:"",dest:""};
  const tree=ROOTS.map(r=>"  "+r.path+" ["+SL[roll(r.ids)]+"]\n"+r.ids.map(i=>"    BLOQUE "+SEGS[i].z+" ["+SL[stOf(i)]+" "+pctOf(i)+"%]"+(FILES[i]||[]).map(f=>"\n      FILE "+f.n+" ["+SL[STATE.st[f.id]||f.st]+" "+pctOf(f.id,f.pct)+"%]").join("")).join("\n")).join("\n");
  return "# YAIWES BLOQUE "+s.z+"\n## RAÍZ\n```\nagentes/\n"+tree+"\n```\n## BLOQUE\n"+s.t+"\n"+s.d+"\nFlujo: "+s.f+"\nDestino: "+s.dest+"\nEstado: "+SL[stOf(id)]+" "+pctOf(id)+"%\n## PROBLEMA\n"+s.x+"\n## NOTA\n"+(STATE.notes[id]||"")+"\n## LEY\nEnchufe IN+OUT cada file. Destino=ROOT MAP. A22.";
}
async function shareSel(){
  if(STATE.selKind==="file"){shareFile(STATE.selSeg,STATE.sel);return;}
  const id=STATE.sel||"20";
  const text=SEGS[id]?blockText(id):String(id);
  try{if(navigator.share) await navigator.share({title:"YAIWES "+id,text});else await navigator.clipboard.writeText(text);toast("share bloque");}
  catch(e){try{await navigator.clipboard.writeText(text);toast("copiado");}catch(e2){toast("cancel");}}
}
async function shareFile(seg,fid){
  const f=(FILES[seg]||[]).find(x=>x.id===fid);if(!f)return;
  const text="# YAIWES ARCHIVO\n"+f.n+"\nPadre: "+SEGS[seg].z+"\nFlujo: "+f.f+"\n"+f.d+"\nX-ray: "+f.x+"\nDestino: "+f.dest+"\nEstado: "+SL[stOf(fid)]+" "+pctOf(fid,f.pct)+"%\nNota: "+(STATE.notes[fid]||"")+"\nLEY: enchufe IN+OUT. No from-scratch.";
  try{if(navigator.share) await navigator.share({title:f.n,text});else await navigator.clipboard.writeText(text);toast("share archivo");}
  catch(e){try{await navigator.clipboard.writeText(text);toast("copiado");}catch(e2){toast("cancel");}}
}
function persist(){try{localStorage.setItem("yaiwes-wall-v3",JSON.stringify(STATE));}catch(e){}}
function saveVersion(){
  STATE.v=(STATE.v||3)+1;persist();
  const tag=document.getElementById("state");
  if(tag) tag.textContent=JSON.stringify(STATE);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["<!DOCTYPE html>\n"+document.documentElement.outerHTML],{type:"text/html"}));
  a.download="YAIWES-CRAZY-WALL-v"+STATE.v+".html";a.click();
  document.getElementById("ver").textContent="v"+STATE.v;
  toast("v"+STATE.v+" → Descargas");
}
(function(){
  try{const el=document.getElementById("state");if(el) Object.assign(STATE,JSON.parse(el.textContent));}catch(e){}
  try{const ls=localStorage.getItem("yaiwes-wall-v3");if(ls){const p=JSON.parse(ls);if((p.v||0)>=(STATE.v||0)) Object.assign(STATE,p);}}catch(e){}
  plane();
})();
</script>
<script type="application/json" id="state">{"v":3,"tab":"B","st":{},"pct":{},"notes":{},"extra":[],"sel":"20","selKind":"block"}</script>
</body>
</html>
