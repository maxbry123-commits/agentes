id: url-reader
version: 0.1.0
entry: ./run.py
required_tools: [http, parse]
required_mcps: []
harness_default: cloudflare-sb
tags: [research, reader, parse]
source: core
description: "Lee URL y devuelve markdown limpio (trafilatura). Cap configurable."
inputs:
  type: object
  required: [url]
  properties:
    url: { type: string, format: uri }
    max_chars: { type: integer, default: 50000 }
    timeout_s: { type: integer, default: 20 }
outputs:
  type: object
  properties:
    ok: { type: boolean }
    status_code: { type: integer }
    final_url: { type: string }
    markdown: { type: string }
    length: { type: integer }
    truncated: { type: boolean }
    error: { type: string }
