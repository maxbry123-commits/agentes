id: web-search
version: 0.1.0
entry: ./run.py
required_tools: [http, parse]
required_mcps: []
harness_default: cloudflare-sb
tags: [research, search]
source: core
description: "Búsqueda web con fallback Serper -> DuckDuckGo -> Bing."
inputs:
  type: object
  required: [q]
  properties:
    q: { type: string }
    n: { type: integer, default: 10, minimum: 1, maximum: 50 }
    provider: { type: string, enum: [auto, serper, ddg, bing], default: auto }
outputs:
  type: object
  properties:
    ok: { type: boolean }
    provider_used: { type: string }
    results:
      type: array
      items:
        type: object
        properties:
          title: { type: string }
          url: { type: string }
          snippet: { type: string }
