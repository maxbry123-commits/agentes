id: terminal
version: 0.1.0
entry: ./run.py
required_tools: [bash]
required_mcps: []
harness_default: e2b
tags: [shell, exec, sandbox]
source: core
description: "Bash wrapper con timeout, output cap, y blacklist de comandos peligrosos."
inputs:
  type: object
  required: [cmd]
  properties:
    cmd: { type: string }
    cwd: { type: string, default: "." }
    timeout_s: { type: integer, default: 30 }
    max_output_bytes: { type: integer, default: 1048576 }
    env: { type: object, additionalProperties: { type: string } }
outputs:
  type: object
  properties:
    ok: { type: boolean }
    returncode: { type: integer }
    stdout: { type: string }
    stderr: { type: string }
    duration_s: { type: number }
    blocked_reason: { type: string }
