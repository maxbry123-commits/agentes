id: task-manager
version: 0.1.0
entry: ./run.py
required_tools: [bash, fs]
required_mcps: []
harness_default: e2b
tags: [workflow, todo, productivity]
source: core
description: "Gestiona TODOs persistentes del orquestador. Crear / listar / marcar / asignar."
inputs:
  type: object
  required: [action]
  properties:
    action: { type: string, enum: [add, list, done, blocked, assign, show] }
    id: { type: string }
    title: { type: string }
    owner: { type: string }
    status: { type: string, enum: [pending, in_progress, done, blocked] }
outputs:
  type: object
