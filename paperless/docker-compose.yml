services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: nct-paperless
    restart: unless-stopped
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: nct-paperless-secret-2026
      PAPERLESS_URL: https://maxbry1.duckdns.org:8443/paperless/
      PAPERLESS_ADMIN_USER: maxbry
      PAPERLESS_ADMIN_PASSWORD: nct2026
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_WEBSERVER_WORKERS: 1
      PAPERLESS_OCR_PAGES: 5
      PAPERLESS_DATA_DIR: /usr/src/paperless/data
    volumes:
      - /var/lib/paperless/data:/usr/src/paperless/data
      - /var/lib/paperless/media:/usr/src/paperless/media
      - /var/lib/paperless/consume:/usr/src/paperless/consume
    ports:
      - "8000:8000"
    depends_on:
      - db
      - broker
      - gotenberg
    networks: [paperless-net]
    mem_limit: 1.5g

  db:
    image: postgres:16-alpine
    container_name: nct-paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - paperless_db:/var/lib/postgresql/data
    networks: [paperless-net]
    mem_limit: 200m

  broker:
    image: redis:7-alpine
    container_name: nct-paperless-broker
    restart: unless-stopped
    networks: [paperless-net]
    mem_limit: 50m

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: nct-paperless-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-disable-routes=true"
    networks: [paperless-net]
    mem_limit: 200m

networks:
  paperless-net:
    driver: bridge

volumes:
  paperless_db:
