name: yaiwes-native-autoevolution
version: 1
determinism: 95
llm_maximum: 5
fail_closed: true
states:
  - RECEIVED
  - VALIDATED
  - RESEARCHED
  - CLASSIFIED
  - PROPOSED
  - AWAITING_DIRECTOR
  - AUTHORIZED
  - ACQUIRED
  - SANDBOXED
  - VERIFIED
  - MOUNTED
  - ROLLED_BACK
dag:
  - {id: watchdog, run: evolution_engine.awakened, next: validate}
  - {id: validate, run: schema+source+license+sheriff, next: reuse}
  - {id: reuse, run: reuse_12.py, next: research}
  - {id: research, run: authoritative-source+community-cross-check, next: consilio}
  - {id: consilio, run: 12-refutations, next: classify}
  - {id: classify, run: deterministic-placement, next: propose}
  - {id: propose, run: passport+abi+download-plan, next: director_gate}
  - {id: director_gate, run: explicit-human-authorization, next: acquire}
  - {id: acquire, run: skills/research-download-chain/SKILL.md, next: sandbox}
  - {id: sandbox, run: deny-egress+verify-sha+parts+limits, next: mount}
  - {id: mount, run: extension-kernel-abi-or-workflow-or-pool, next: verify}
  - {id: verify, run: tests+traceability+rollback-check, next: done}
guards:
  mutation_before_authorized: deny
  direct_external_import_into_kernel: deny
  llm_authorization: deny
  missing_evidence: await_director
