name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history to render the changelog
          # from previous tag → current tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — uncomment + add the matching secrets to enable
          # the brews / aurs blocks in .goreleaser.yaml:
          # HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # AUR_KEY: ${{ secrets.AUR_KEY }}

# Note: Docker image builds live in the dedicated `docker.yml` workflow (which
# builds the maintained root Dockerfile on release tags). The redundant docker
# job that used to sit here built the stale deploy/docker/Dockerfile and was
# removed so a release isn't marked failed by a duplicate image build.
