# Wordflow Sheriff policy — W5
# Runtime reads only. 0% LLM.
version: "1.0"
policy_id: wordflow.sheriff
fail_closed: true
llm_control: DENY

rules:
  max_repairs: 3
  max_loop_seconds: 120
  stuck_step_threshold: 3
  require_sentinel_pass: true
  require_council_approve: true
  allow_force_continue: false

states:
  allowed:
    - RUNNING
    - COMPLETED
    - FAILED
    - REJECTED
  terminal:
    - COMPLETED
    - FAILED
    - REJECTED

on_violation: stop
