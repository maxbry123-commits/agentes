# Token: GitHub Actions secret EXTERNAL_GH_B_TOKEN (never in this file)
# credential_ref maps to env var injected by workflow / runtime

accounts:
  - account_id: external_software_b
    provider: github
    credential_ref: env:EXTERNAL_GH_B_TOKEN
    owner: abc1tienda-web
    repo: osquestador-auditor-y-memoria-1
    branch: main
    allowed_repositories:
      - abc1tienda-web/osquestador-auditor-y-memoria-1
    policy:
      can_read: true
      can_write: false
      can_deploy: false
    role: software_store
  - account_id: github_b
    provider: github
    credential_ref: env:GITHUB_B_TOKEN
    allowed_repositories: []
    policy:
      can_read: true
      can_write: true
      can_deploy: true
    role: deploy_any_repo
  - account_id: hf_b
    provider: huggingface
    credential_ref: env:HF_TOKEN
    allowed_repositories: []
    policy:
      can_read: true
      can_write: true
      can_deploy: true
    role: hf_store
