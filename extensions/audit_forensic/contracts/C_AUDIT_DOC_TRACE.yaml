id: C_AUDIT_DOC_TRACE
name: Audit Document Traceability Contract
version: "1.0"
layer: audit
llm_control: DENY
required_fields:
  - doc_id
  - path_or_section
  - requirement_ids
rules:
  - every_claim_has_min_1_doc_anchor
  - doc_id_nonempty
  - requirement_ids_list
  - orphan_requirement_is_gap
  - superseded_docs_must_point_to_successor
silence_is_not_pass: true
links:
  packet: C_AUDIT_PACKET
  claim: C_AUDIT_CLAIM
