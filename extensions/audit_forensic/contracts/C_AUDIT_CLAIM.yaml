id: C_AUDIT_CLAIM
name: Audit Claim Contract
version: "1.0"
layer: audit
llm_control: DENY
required_fields:
  - claim_id
  - task_id
  - claim_status
  - final_commit
  - files_claimed
rules:
  - claim_status_in: [COMPLETED, PARTIAL, FAILED, REFUTADO]
  - final_commit_40_hex
  - files_claimed_paths_nonempty_if_completed
  - no_token_in_claim_body
silence_is_not_pass: true
links:
  packet: C_AUDIT_PACKET
  verdict: C_AUDIT_VERDICT
