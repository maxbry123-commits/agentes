name: Extract Downloaded ZIPs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct every slug beside the zips
        shell: bash
        run: |
          set -euo pipefail
          bash skills/wordflow-paso-control/scripts/extract_reconstruct.sh "Download code/archivos"
      - name: SHA manifest of reconstructed trees
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Download code/archivos"
          MANIFEST="$ROOT/EXTRACTION_MANIFEST.sha256"
          : > "$MANIFEST"
          find "$ROOT" -mindepth 2 -type f ! -name '*.zip' -print0 |
            sort -z | xargs -0 sha256sum > "$MANIFEST"
          wc -l "$MANIFEST"
      - name: Commit extracted trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Download code/archivos"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "extract downloaded repositories beside zips"
          git push
